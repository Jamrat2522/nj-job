/* mk(no, date, desc, sub, vatRate, whtRate, cash?)
   *** amount = "เงินสดที่รับจริง" (Backend RUN-03 ตัดด้วย Net = Gross − WHT) ***
   ไม่ส่ง cash -> รับเต็มใบ = Gross − WHT
   เอกสารต้องแสดงคอลัมน์ Amount เป็น GROSS (คำนวณกลับจาก ratio ใน renderer) */
const mk=(no,d,ds,sub,vr,wr,cash)=>{const vat=Math.round(sub*vr)/100,wht=Math.round(sub*wr)/100,
 total=Math.round((sub+vat)*100)/100;
 return {invoice_no:no,invoice_date:d,description:ds,charge_type:'SERVICE',
  subtotal:sub,vat_amount:vat,vat_rate:vr,wht_amount:wht,total_amount:total,
  /* wht_breakdown = โครงสร้างจริงที่ njacc_list_receipts ส่งมาหลังรัน 05_RUN-04
     (อ่านจาก njacc_invoice_items.wht_rate) · ไม่มี WHT -> [] */
  wht_breakdown: wht ? [{rate:wr, amount:wht}] : [],
  amount: cash!==undefined?cash:Math.round((total-wht)*100)/100};};
/* mkMulti = ใบแจ้งหนี้ใบเดียวที่มีหลายอัตรา WHT (ขนส่ง 1% + บริการ 3%) */
const mkMulti=(no,d,ds,lines,cash)=>{let sub=0,vat=0,wht=0;const by=new Map();
 for(const l of lines){sub+=l.sub;const v=Math.round(l.sub*l.vr)/100;vat=Math.round((vat+v)*100)/100;
  const w=Math.round(l.sub*l.wr)/100;wht=Math.round((wht+w)*100)/100;
  if(w) by.set(l.wr,Math.round(((by.get(l.wr)||0)+w)*100)/100);}
 const total=Math.round((sub+vat)*100)/100;
 return {invoice_no:no,invoice_date:d,description:ds,charge_type:'SERVICE',
  subtotal:sub,vat_amount:vat,vat_rate:lines[0].vr,wht_amount:wht,total_amount:total,
  wht_breakdown:[...by.entries()].sort((a,b)=>a[0]-b[0]).map(([rate,amount])=>({rate,amount})),
  amount: cash!==undefined?cash:Math.round((total-wht)*100)/100};};

const out=document.getElementById('out'), cases=document.getElementById('cases');
let doc='rc';
function paint(){
  const M = doc==='rc'?RC:(doc==='ap'?AP:(doc==='cn'?CN:IV));
  cases.innerHTML='<b>ชุดข้อมูล:</b>'+Object.keys(M).map((k,i)=>
    `<button data-k="${k}" class="${i===0?'on':''}">${k}</button>`).join('');
  const draw=(k)=>{const a=M[k]; out.innerHTML = doc==='rc' ? receiptDocHTML(a[0])
    : doc==='ap' ? advanceDocHTML(a[0],a[1])
    : doc==='cn' ? creditNoteDocHTML(a[0]) : invoiceDocHTML(a[0],a[1]);};
  cases.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
    cases.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); draw(b.dataset.k);});
  draw(Object.keys(M)[0]);
}
document.querySelectorAll('.bar button[data-doc]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.bar button[data-doc]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); doc=b.dataset.doc; paint();});
