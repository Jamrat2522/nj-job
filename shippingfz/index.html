<!DOCTYPE html>
<!--
  SHIPPING FZ  v.1.0  —  N.J. Logistics   (clone จาก SHIPPING AIR v.14)
  ============================================================
  ระบบใหม่ทั้งหมด · Single HTML File · แยกขาดจาก MASSERGER และ SHIPPING AIR
    • LOGIN : ใช้บัญชีเดิม (RPC login_plain · app_code='massenger') — ไม่สร้าง user ใหม่
    • WORK  : ฐานข้อมูลของตัวเอง (sfz_documents / sfz_document_logs) — เริ่มงานใหม่ทั้งหมด
    • STORAGE : bucket ของตัวเอง (shipping-fz-attachments)
    • REALTIME : channel ของตัวเอง (sfz_docs_rt)
  ไม่แตะ HTML/CSS/JS/Query/DB/Storage/Realtime ของระบบเดิมแม้แต่บรรทัดเดียว
  Flow: NEW → RECEIVED → CLEARED → COMPLETED  ·  RECEIVED ⇄ POSTPONED
  ============================================================
-->
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHIPPING FZ">
<meta name="theme-color" content="#10B981">
<meta name="mobile-web-app-capable" content="yes">
<title>SHIPPING FZ — N.J. Logistics</title>

<link rel="preconnect" href="https://sytgqjglcnsabcszbngg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" as="script">
<link rel="preload" href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" as="script">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============ DESIGN TOKENS (clone of NJ dark enterprise system) ============ */
:root{
  --bg:#0B1018; --bg2:#111827; --sidebar:#0F172A;
  --panel:#1E2430; --panel2:#262E3D;
  --border:#2D3545; --border-soft:#222a37;
  --text:#F3F4F6; --muted:#AAB3C2; --muted2:#7c8597;
  --brand:#0EA672; --brand-strong:#10B981; --brand-soft:rgba(14,166,114,.15);
  --wait:#F59E0B; --going:#3B82F6; --done:#10B981; --canceled:#EF4444;
  --purple:#A855F7; --orange:#F97316;
  --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-glow:0 0 24px rgba(14,166,114,.35);
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;background:var(--bg);color:var(--text);
  color-scheme:dark;
  font-family:'Sarabun','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-size:14px;line-height:1.5;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
}
body{min-height:100vh;overflow-x:hidden}
@supports (height:100dvh){ body{min-height:100dvh} .app{min-height:100dvh} }
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
a{color:var(--brand-strong);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3343;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4456}
button,.btn,.pill,.menu-item,.row-act,.m-tab,.pg-btn,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:768px),(pointer:coarse){ .row-act,.pg-btn,.btn-icon,.input-icon-btn{min-height:44px;min-width:44px} }
.hidden{display:none !important}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .1s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(180deg,#10B981,#0EA672);color:#fff;box-shadow:0 6px 16px rgba(14,166,114,.3)}
.btn-primary:hover{background:linear-gradient(180deg,#13c08c,#10B981)}
.btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--panel2)}
.btn-danger{background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff}
.btn-warn{background:linear-gradient(180deg,#F59E0B,#D97706);color:#fff}
.btn-going{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--panel);color:var(--text)}
.btn-block{width:100%}
.btn-lg{padding:16px 20px;font-size:15px;border-radius:14px}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:8px}
.btn-icon{width:36px;height:36px;padding:0}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* ============ ALERTS ============ */
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;border:1px solid}
.alert-error{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.alert-success{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#86efac}
.alert-info{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:#93c5fd}

/* ============ AUTH ============ */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,rgba(14,166,114,.07),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:440px;background:linear-gradient(180deg,#161D2A 0%,#121826 100%);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:var(--shadow)}
.auth-header{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.logo-box{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#10B981,#0EA672);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(16,185,129,.45);font-weight:800;color:#fff;font-size:20px}
.auth-title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
.auth-title p{margin:3px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.5px}
.register-note{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
.register-note b{color:#10B981}

/* ============ FORM ============ */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;color:#cdd3df;margin-bottom:8px;font-weight:500}
.field label .req{color:#EF4444;margin-left:3px;font-weight:700}
.input,.select,.textarea{width:100%;background:#0d1320;border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:14px;outline:none;transition:border .15s,box-shadow .15s;box-sizing:border-box;font-family:inherit;line-height:1.5}
input[type="date"],input[type="time"]{color-scheme:dark}
input[type="date"]{background-color:#0d1320;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2718%27%20height%3D%2718%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27%2310B981%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Crect%20x%3D%273%27%20y%3D%274%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%272%27%2F%3E%3Cline%20x1%3D%2716%27%20y1%3D%272%27%20x2%3D%2716%27%20y2%3D%276%27%2F%3E%3Cline%20x1%3D%278%27%20y1%3D%272%27%20x2%3D%278%27%20y2%3D%276%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2710%27%20x2%3D%2721%27%20y2%3D%2710%27%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:right 13px center;background-size:18px 18px;padding-right:42px}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:0;cursor:pointer}
#sa-date::-webkit-calendar-picker-indicator,#sa-edit-date::-webkit-calendar-picker-indicator{opacity:.9;cursor:pointer}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,166,114,.15)}
.input::placeholder,.textarea::placeholder{color:#5d6678}
.textarea{resize:vertical;min-height:78px;white-space:pre-wrap;word-break:break-word}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.input-wrap{position:relative}
.input-icon-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.input-icon-btn:hover{color:var(--text);background:#1a2230}
.input-icon-btn svg{width:18px;height:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:560px){ .grid-2,.grid-3{grid-template-columns:1fr} }

/* ============ APP LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:#071224;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;padding:8px 0 6px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:40}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:3px}
.sidebar .brand,.sidebar .user-card{padding-left:14px;padding-right:14px}
.sidebar .brand{padding-top:6px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#10B981,#0EA672);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;box-shadow:0 0 10px rgba(16,185,129,.4)}
.brand-text{font-size:15px;font-weight:800;letter-spacing:.6px;line-height:1.15}
.brand-text small{display:block;font-size:9px;color:var(--muted);font-weight:600;letter-spacing:1.4px;margin-top:1px}
.sidebar .user-card{padding-top:8px;padding-bottom:8px;margin-top:2px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:15px;background:linear-gradient(135deg,#10B981,#0EA672);box-shadow:0 0 10px rgba(16,185,129,.30)}
.user-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.user-name{font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;line-height:1.2}
.user-role{font-size:10px;color:#10B981;letter-spacing:.8px;font-weight:700;text-transform:uppercase}
.dot-online{width:8px;height:8px;background:#10B981;border-radius:50%;box-shadow:0 0 7px rgba(16,185,129,.7);flex-shrink:0}
.menu-section{padding:0 10px}
.menu-section .title{position:relative;display:flex;align-items:center;gap:10px;margin:9px 14px 4px;padding:0 0 0 10px;font-size:10px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:#A4B5D0;opacity:.75;user-select:none;pointer-events:none}
.menu-section .title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:12px;border-radius:999px;background:#2DD4BF;box-shadow:0 0 6px rgba(45,212,191,.5)}
.menu-section .title.system{color:#A8BEDF}
.menu-section .title.system::before{background:#3B82F6;box-shadow:0 0 6px rgba(59,130,246,.55)}
.menu-section .title.pending{color:#FCD9A8}
.menu-section .title.pending::before{background:#F59E0B;box-shadow:0 0 6px rgba(245,158,11,.55)}
.menu-item{position:relative;display:flex;align-items:center;justify-content:flex-start;min-height:37px;margin:0 0 1px;padding:0 12px;border-radius:12px;background:transparent;border:1px solid transparent;color:#D5DEEB;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:transform .18s,background .18s,border-color .18s;gap:10px;box-sizing:border-box}
.menu-item:hover{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.05);transform:translateX(2px)}
.menu-item.active{background:linear-gradient(90deg,rgba(0,255,180,.14),rgba(0,120,255,.08));border:1px solid rgba(0,255,200,.16);box-shadow:0 0 12px rgba(0,255,200,.08);color:#fff}
.menu-item .ic{width:18px;text-align:center;flex-shrink:0;font-size:15px;line-height:1}
.menu-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item .badge{margin-left:auto;min-width:24px;height:24px;padding:0 8px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#fff;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);line-height:1;box-sizing:border-box}
.menu-item.active .badge{background:rgba(255,255,255,.96);border-color:#fff;color:#0F172A;font-weight:900}
.menu-item .badge[data-zero="1"]{opacity:.55}
.menu-item.dim:not(.active) .badge[data-key="NEW"]{background:rgba(251,191,36,.22);border-color:rgba(251,191,36,.5);color:#FCD34D}
.menu-item.dim:not(.active) .badge[data-key="RECEIVED"]{background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.5);color:#93C5FD}
.menu-item.dim:not(.active) .badge[data-key="COMPLETED_TODAY"]{background:rgba(16,185,129,.22);border-color:rgba(16,185,129,.5);color:#6EE7B7}
.menu-item.dim:not(.active) .badge[data-key="POSTPONED"]{background:rgba(239,68,68,.22);border-color:rgba(239,68,68,.5);color:#FCA5A5}
.menu-item.dim:not(.active) .badge[data-key="all"]{background:rgba(45,212,191,.22);border-color:rgba(45,212,191,.5);color:#5EEAD4}
.menu-divider{height:1px;background:rgba(255,255,255,.06);margin:8px 18px}
.sidebar-ver{margin-top:auto;padding:8px 16px 4px;font-size:9.5px;color:#3d4a63;letter-spacing:.5px;font-family:'Inter',monospace;text-align:left}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mobile-topbar{display:none;position:sticky;top:0;background:var(--sidebar);padding:12px 14px;border-bottom:1px solid var(--border-soft);z-index:50;align-items:center;gap:12px}
.menu-toggle{width:38px;height:38px;border-radius:10px;background:#1a2230;display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid var(--border-soft)}
.menu-toggle svg{width:20px;height:20px}
.mobile-brand{display:flex;align-items:center;gap:10px;flex:1}
.mobile-brand .brand-text{font-size:13px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
.sidebar-overlay.show{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 28px 12px;flex-wrap:wrap;gap:12px}
.topbar h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.3px}
.topbar .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.content{padding:6px 16px 48px;flex:1;min-width:0}

/* ============ STAT CARDS ============ */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:16px;padding:18px}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stat-card .val{font-size:32px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.stat-card .foot{font-size:11px;color:var(--muted);margin-top:6px}
.stat-card.s-all .val{color:var(--text)}
.stat-card.s-wait{background:linear-gradient(180deg,rgba(245,158,11,.16),rgba(245,158,11,.03));border-color:rgba(245,158,11,.3)}
.stat-card.s-wait .val{color:#FCD34D}
.stat-card.s-going{background:linear-gradient(180deg,rgba(59,130,246,.16),rgba(59,130,246,.03));border-color:rgba(59,130,246,.3)}
.stat-card.s-going .val{color:#93C5FD}
.stat-card.s-done{background:linear-gradient(180deg,rgba(16,185,129,.16),rgba(16,185,129,.03));border-color:rgba(16,185,129,.3)}
.stat-card.s-done .val{color:#6EE7B7}
.stat-card.s-purple{background:linear-gradient(180deg,rgba(139,92,246,.16),rgba(139,92,246,.03));border-color:rgba(139,92,246,.3)}
.stat-card.s-purple .val{color:#C4B5FD}
@media (max-width:1100px){ .stats-grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:680px){ .stats-grid{grid-template-columns:repeat(2,1fr)} }

/* ============ FILTER PILLS ============ */
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pr-allm{display:none}
.pill-allm{border-color:rgba(16,185,129,.55);color:#6EE7B7}
.pill-allm.active{background:#10B981;border-color:#10B981;color:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#1a2231;border:1px solid var(--border-soft);font-size:13px;color:var(--muted);font-weight:500;transition:color .15s,background .15s,border-color .15s}
.pill:hover{color:var(--text);border-color:var(--border)}
.pill.active{background:linear-gradient(90deg,rgba(14,166,114,.2),rgba(14,166,114,.08));color:#fff;border-color:rgba(14,166,114,.4)}
.pill .count{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(45,212,191,.25),rgba(45,212,191,.15));border:1px solid rgba(45,212,191,.45);color:#5EEAD4;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;min-width:24px;line-height:1.3}
.pill.active .count{background:rgba(255,255,255,.96);border-color:#fff;color:#0F172A;font-weight:900}
.search-wrap-cat{margin-left:auto;width:330px;max-width:100%;display:flex;align-items:center}
.search-bar{position:relative;width:100%;display:flex;align-items:center}
.search-bar svg{position:absolute;left:13px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.search-bar .input{padding-left:40px}
@media (max-width:768px){ .search-wrap-cat{margin-left:0;width:100%;flex-basis:100%} }

/* ✚ ตัวกรอง Customer / CS / ช่วงวันที่ — หน้าตา (appearance) parent-agnostic ใช้ได้ทั้งแถวมือถือ .sa-filters และแถวรวม desktop .sa-toolbar · token เดียวกับ .select/.input เดิม */
.sa-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sa-fl-sel{width:auto;min-width:190px;max-width:100%;cursor:pointer;padding-top:6px;padding-bottom:6px}
.sa-fl-date{display:flex;align-items:center;gap:6px;background:#0d1320;border:1px solid var(--border);border-radius:12px;padding:0 10px;color:var(--text);font-size:14px;line-height:1.5;box-sizing:border-box;transition:border .15s,box-shadow .15s}
.sa-fl-date:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,166,114,.15)}
.sa-fl-cal{font-size:14px;line-height:1;pointer-events:none}
.sa-fl-arrow{color:var(--muted);font-size:13px;pointer-events:none}
.sa-fl-d{width:auto;min-width:132px;background:transparent;border:none;border-radius:0;padding:6px 2px;margin:0;color:var(--text);font-size:14px;font-family:inherit;line-height:1.5;outline:none;box-sizing:border-box;color-scheme:dark;cursor:pointer}
.sa-fl-d:focus{box-shadow:none;border:none}
.sa-fl-x{background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 7px;border-radius:8px;line-height:1;display:flex;align-items:center}
.sa-fl-x:hover{color:var(--text);background:#1a2230}
/* date filter: แสดงไอคอนปฏิทินของ native input (override opacity:0 ทั่วแอป) ให้คลิกเปิด picker ได้ */
.sa-fl-d::-webkit-calendar-picker-indicator{opacity:.65;cursor:pointer}
.sa-fl-d::-webkit-calendar-picker-indicator:hover{opacity:1}
/* ✚ Custom dropdown (Filter Customer / CS) — trigger + panel */

/* ✚ Desktop: รวมทุก Filter ในแถวเดียว — 🔍 ค้นหา · Customer · CS · ช่วงวันที่ · แสดง (สูงเท่ากัน · กึ่งกลางแนวตั้ง · gap 12) */

  .sa-toolbar .sa-tb-cust{flex:0 0 220px;width:220px;min-width:220px}

/* ============ TABLES ============ */
.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;overflow:hidden}
.tbl{width:100%;border-collapse:separate;border-spacing:0}

.tbl .company{font-weight:700;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* แนบรูปหลายใบ — preview grid ใน modal 📋 อัปเดตสถานะ (2 คอลัมน์มือถือ / 3-4 desktop) */

/* ---- ตรวจ error ระดับ schema (ตารางหาย / schema cache เก่า) ---- */
function _sfzSchemaError(err){
  if(!err) return false;
  const s2=[err.code,err.message,err.details,err.hint].map(x=>String(x==null?'':x)).join(' ');
  return /PGRST205|PGRST106|42P01|schema cache|does not exist/i.test(s2);
}
/* เจอ schema error → ปิด query ทั้งระบบทันที + แสดงหน้า Health ครั้งเดียว (ไม่ยิงซ้ำวนรัว) */
function _sfzHaltOnSchemaError(err, where){
  if(!_sfzSchemaError(err)) return false;
  SFZ_READY=false;
  console.error('[sfz schema]', where, err && err.message);
  _sfzShowHealth([{ ok:false, label:'ตาราง / Schema ของ SHIPPING FZ', detail:(err&&err.message)||'ไม่พบตาราง' }]);
  return true;
}

/* ---- Health Check ---- */
async function _sfzRunHealthCheck(){
  const rows=[];
  rows.push({ ok:true, label:'โหมดการเปิดไฟล์ ('+SFZ_ENV+')' });
  if(!sb){ rows.push({ ok:false, label:'เชื่อมต่อ Supabase', detail:'สร้าง client ไม่สำเร็จ' }); return rows; }
  let docOk=false, logOk=false;
  try{ const { error }=await sb.from(DOC_TABLE).select('id',{count:'exact',head:true});
       docOk=!error; rows.push({ ok:docOk, label:'ตาราง public.'+DOC_TABLE, detail:docOk?'':((error&&error.message)||'')+' · ยังไม่ได้รันไฟล์ SQL หรือยังไม่ได้ reload schema cache' });
  }catch(e){ rows.push({ ok:false, label:'ตาราง public.'+DOC_TABLE, detail:String((e&&e.message)||e) }); }
  try{ const { error }=await sb.from(LOG_TABLE).select('id',{count:'exact',head:true});
       logOk=!error; rows.push({ ok:logOk, label:'ตาราง public.'+LOG_TABLE, detail:logOk?'':((error&&error.message)||'') });
  }catch(e){ rows.push({ ok:false, label:'ตาราง public.'+LOG_TABLE, detail:String((e&&e.message)||e) }); }
  rows.push({ ok:(docOk&&logOk), label:'RLS · สิทธิ์ anon อ่านข้อมูลได้', detail:(docOk&&logOk)?'':'อ่านตารางไม่ผ่าน — ตรวจ policy และ grant ในไฟล์ SQL' });
  try{ const { error }=await sb.storage.from(STORAGE_BUCKET).list('',{limit:1});
       rows.push({ ok:!error, label:'Storage bucket '+STORAGE_BUCKET, detail:error?(((error&&error.message)||'')+' · ยังไม่ได้สร้าง bucket หรือ policy ไม่อนุญาต'):'' });
  }catch(e){ rows.push({ ok:false, label:'Storage bucket '+STORAGE_BUCKET, detail:String((e&&e.message)||e) }); }
  let rtOk=false, rtMsg='';
  try{
    rtOk = await new Promise(res=>{
      let done=false;
      const ch=sb.channel('sfz_health_'+Date.now());
      const fin=(v,m)=>{ if(done) return; done=true; rtMsg=m||''; clearTimeout(t); try{ sb.removeChannel(ch); }catch(_){ } res(v); };
      const t=setTimeout(()=>fin(false,'หมดเวลารอ 8 วินาที'),8000);
      ch.subscribe(st=>{
        if(st==='SUBSCRIBED') fin(true);
        else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT') fin(false,String(st));
      });
    });
  }catch(e){ rtMsg=String((e&&e.message)||e); }
  rows.push({ ok:rtOk, label:'Realtime', detail:rtOk?'':(rtMsg+' · ตรวจว่าเพิ่ม '+DOC_TABLE+' และ '+LOG_TABLE+' เข้า publication supabase_realtime แล้ว') });
  return rows;
}

/* ---- Signed URL (private bucket) ---- */
const _sfzUrlCache = new Map();                   // path → { url, exp }
function _sfzIsRef(u){ return typeof u==='string' && u.indexOf('sfz:')===0; }
function _sfzPathOf(ref){ return String(ref).slice(4); }
async function _sfzSignPaths(paths){
  const now=Date.now(), need=[];
  (paths||[]).forEach(p=>{ const c=_sfzUrlCache.get(p); if(!c || c.exp<=now+60000) need.push(p); });
  if(need.length){
    try{
      const { data, error } = await sb.storage.from(STORAGE_BUCKET).createSignedUrls(need, SIGNED_URL_TTL);
      if(error) console.warn('[signedUrl]', error.message);
      (data||[]).forEach(d=>{ if(d && d.signedUrl && !d.error) _sfzUrlCache.set(d.path, { url:d.signedUrl, exp:Date.now()+(SIGNED_URL_TTL-120)*1000 }); });
    }catch(e){ console.warn('[signedUrl]', e); }
  }
  const out={}; (paths||[]).forEach(p=>{ const c=_sfzUrlCache.get(p); if(c) out[p]=c.url; }); return out;
}
/* ref → attribute ของ <img> · sfz: = รอ hydrate · http = ใส่ src ตรง (ข้อมูลเก่า) */
function _sfzImgSrcAttr(ref){ return _sfzIsRef(ref) ? ('data-sfz="'+esc(_sfzPathOf(ref))+'"') : ('src="'+esc(ref)+'"'); }
/* เติม src ให้ <img data-sfz> ทุกตัวใน root — เรียกหลัง innerHTML */
async function _sfzHydrateImages(root){
  if(!root) return;
  const els=Array.prototype.slice.call(root.querySelectorAll('img[data-sfz]'));
  if(!els.length) return;
  const paths=[]; els.forEach(e=>{ const p=e.getAttribute('data-sfz'); if(p && paths.indexOf(p)<0) paths.push(p); });
  const map=await _sfzSignPaths(paths);
  els.forEach(e=>{ const u=map[e.getAttribute('data-sfz')]; if(u){ e.src=u; e.removeAttribute('data-sfz'); } });
}
async function _sfzOpenRef(ref){
  if(!_sfzIsRef(ref)){ openImagePreview(ref); return; }
  const p=_sfzPathOf(ref);
  const m=await _sfzSignPaths([p]);
  if(m[p]) openImagePreview(m[p]); else toast('เปิดรูปไม่สำเร็จ','error');
}

// เลขใบขน (การ์ดมือถือ) — ค่าเต็ม · แยกหลายเลข (ขึ้นบรรทัด/comma/เว้นวรรค) เป็นคนละบรรทัด · ไม่ตัด/ไม่ slice
function _bolLines(s){ s=String(s==null?'':s).trim(); if(!s) return '<span style="color:var(--muted)">—</span>'; return s.split(/[\s,]+/).filter(Boolean).map(p=>`<span class="bol-line">${esc(p)}</span>`).join(''); }
function isAdmin(){ const r=String(S.user&&S.user.role||'').toUpperCase(); return r==='ADMIN'||r==='ADMIN_MID'||r==='SUPER_ADMIN'; }
function isSuper(){ return String(S.user&&S.user.role||'').toUpperCase()==='SUPER_ADMIN'; }
function isShippingStaff(){ if(isAdmin()) return false; const u=S.user||{}; return [u.role,u.department,u.dept,u.position,u.team].some(x=>String(x||'').toUpperCase().includes('SHIPPING')); }
/* ---------------- permission matrix (role → views + own-only) ---------------- */
function _permRole(){
  const r = String(S.user&&S.user.role||'').toUpperCase().trim();
  const dept = String(S.user&&S.user.department||'').toUpperCase().trim();
  if(r==='SUPER_ADMIN') return 'SUPER_ADMIN';
  if(r==='ADMIN'||r==='ADMIN_MID') return 'ADMIN';
  if(r==='MESSENGER'||dept==='MESSENGER'||dept==='MASSERGER') return 'MESSENGER';
  if(r==='SHIPPING'||dept==='SHIPPING') return 'SHIPPING';
  return 'USER';   // STAFF/USER default
}
const PERM_VIEWS = {
  SUPER_ADMIN:'ALL', ADMIN:'ALL',
  USER:     ['NEW','RECEIVED','COMPLETED_TODAY','POSTPONED','EDIT'],
  SHIPPING: ['NEW','RECEIVED','COMPLETED_TODAY','POSTPONED','EDIT'],
  MESSENGER: []
};
// เมนู PENDING — แสดง/เข้าถึงได้ทุก role (การมองเห็นเมนู + route เท่านั้น) · ข้อมูลยังกรองตาม _visibleDocs()/VIEWS.test เดิม · สิทธิ์รับงาน/แก้ไข/ลบ/จบงาน/สถานะ/Export/Dashboard/Users ไม่เปลี่ยน
const MENU_ALWAYS_VIEW = ['TOMORROW','ADVANCE','EDIT'];
function canView(key){ if(MENU_ALWAYS_VIEW.includes(key)) return true; const v=PERM_VIEWS[_permRole()]; return v==='ALL' ? true : (v||[]).includes(key); }
function isOwnOnly(){ const r=_permRole(); return r!=='ADMIN' && r!=='SUPER_ADMIN'; }
function _firstAllowedView(){ const v=PERM_VIEWS[_permRole()]; if(v==='ALL') return 'all'; return (v&&v[0])||null; }
// เอกสารที่ "มองเห็นได้" ตามสิทธิ์ — own-only เห็นเฉพาะงานตนเอง (assigned/creator) + งานใหม่ที่ยังไม่มีผู้รับ (ไว้กดรับงาน)
let _visCache = { ref:null, val:null };
// #1 ล้าง cache แถวที่มองเห็น — เรียกทุกครั้งที่ S.docs ถูก mutate ในที่เดิม (splice/unshift/sort/[i]=)
//     เพราะ ref ไม่เปลี่ยน cache จะค้าง (เฉพาะ user isOwnOnly) → ต้อง invalidate ตรง ๆ
function _invalidateDocsCache(){ _visCache = { ref:null, val:null }; }
function _visibleDocs(){
  if(!isOwnOnly()) return S.docs;
  if(_visCache.ref===S.docs) return _visCache.val;   // cache ต่อ render (S.docs set ใหม่ทุก reload → ref เปลี่ยน → cache miss)
  const uid = String(S.user&&S.user.id||'');
  const val = S.docs.filter(d=>{
    if(d.doc_status==='NEW' && !d.assigned_user) return true;
    return String(d.assigned_user||'')===uid || String(d.creator_user||'')===uid;
  });
  _visCache = { ref:S.docs, val };
  return val;
}

// สิทธิ์ลบงาน (แยกตามเมนู):
//  • เมนู 🟡 รอรับงาน (NEW view) → USER / ADMIN / SUPER_ADMIN ลบได้
//  • เมนูอื่นทั้งหมด (งานทั้งหมด/ดำเนินตรวจปล่อย/ปล่อยเสร็จ/เลื่อน/งานแก้ไข) → เฉพาะ SUPER_ADMIN
//  • ADMIN_MID / SHIPPING / MESSENGER → ลบไม่ได้ทุกเมนู
function canDeleteDoc(d){
  if(!d) return false;
  // เมนู 🟡 รอรับงาน (NEW): USER ทุกคน + ADMIN(+ADMIN_MID) + SUPER_ADMIN ลบได้
  //   ใช้ _permRole() → user จริง role=STAFF จะถูก map เป็น 'USER' (เดิมเช็ค role ดิบ ==='USER' เลยไม่ตรง)

  if(S.view==='NEW'){ const pr=_permRole(); return pr==='USER' || pr==='ADMIN' || pr==='SUPER_ADMIN'; }
  // เมนูอื่นทั้งหมด → เฉพาะ SUPER_ADMIN (สิทธิ์เดิม)
  return _permRole()==='SUPER_ADMIN';
}

function authAlert(msg, type){
  const el = $('auth-alert'); if(!el) return;
  el.innerHTML = msg ? `<div class="alert alert-${type==='error'?'error':type==='success'?'success':'info'}">${esc(msg)}</div>` : '';

async function doLogin(){
  const u = $('lg-username').value.trim();
  const p = $('lg-password').value;
  if(!u || !p) return authAlert('กรอก Username และ Password','error');
  const btn = $('btn-login');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';
  try{
    if(SFZ_IS_FILE) throw new Error('เปิดไฟล์ผิดวิธี กรุณาปิดหน้านี้แล้วเปิด SHIPPING FZ.exe');
    const { data:result, error } = await sb.rpc('login_plain', { p_username:u, p_password:p, p_app_code:LOGIN_APP_CODE });
    const code = error?.code || '';
    if(error?.status===404 || code==='PGRST202' || code==='42883')
      throw new Error('ไม่พบ RPC login_plain บนเซิร์ฟเวอร์');
    if(error) throw new Error(error.message || 'เข้าสู่ระบบไม่สำเร็จ');
    if(!result || !result.success){
      const k = result?.error || 'unknown';
      throw new Error((k==='username_not_found'||k==='password_mismatch') ? 'Username หรือ Password ไม่ถูกต้อง' : 'เข้าสู่ระบบไม่สำเร็จ');
    }
    const info = result.user;
    if(info.status==='pending') throw new Error('บัญชีนี้รอ Admin อนุมัติ');
    if(info.status==='disabled') throw new Error('บัญชีนี้ถูกระงับการใช้งาน');
    S.user = info;
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify({
      id:info.id, username:info.username, full_name:info.full_name, role:info.role,
      department:info.department, email:info.email, app_code:info.app_code,
      expiresAt: Date.now()+30*24*60*60*1000
    })); }catch(_){}
    $('lg-username').value=''; $('lg-password').value='';
    authAlert('');
    await enterApp();
  }catch(e){
    authAlert(e.message||'เข้าสู่ระบบไม่สำเร็จ','error');
  }finally{
    btn.disabled=false; btn.innerHTML='เข้าสู่ระบบ';
  }
}

/* ============================================================
   PER-MODE DATA LAYER (#1-5,9,10,12,13,15) — โหลดแยกตามโหมด ≤200 · cache แยกโหมด · count query
   ด่านสิทธิ์ท้ายสุดยังเป็น _visibleDocs()/VIEWS[view].test (สิทธิ์รั่วไม่ได้แม้ query ผิด) + fallback เมื่อ error
   ============================================================ */
// ช่วงเวลา "วันนี้" ตามเวลาไทย (UTC+7) → ISO (สำหรับ COMPLETED_TODAY · ห้าม UTC ทำวันเลื่อน) (#12)
function _todayRangeTH(){
  const now=new Date(); const th=new Date(now.getTime()+7*3600*1000);      // เลื่อนเป็นเวลาไทย
  const y=th.getUTCFullYear(), m=th.getUTCMonth(), d=th.getUTCDate();
  const startUTC=new Date(Date.UTC(y,m,d,0,0,0)-7*3600*1000);              // 00:00 ไทย → UTC
  const endUTC  =new Date(Date.UTC(y,m,d+1,0,0,0)-7*3600*1000);           // 00:00 พรุ่งนี้ไทย → UTC
  return { start:startUTC.toISOString(), end:endUTC.toISOString() };
}
// own-only: บังคับสิทธิ์ที่ client (_visibleDocs) เป็นด่านหลัก — ไม่กรอง server เพื่อเลี่ยง .or() ซ้อน (400) และกันรั่วชัวร์
function _applyOwnOnly(q, view){ return q; }
// เงื่อนไข server ต่อโหมด (สถานะ/วันที่/shipping_date) — ตรงกับ VIEWS[view].test
function _applyViewFilter(q, view){
  const today=todayYMD(), tmr=tomorrowYMD();
  if(view==='NEW')             q=q.eq('doc_status','NEW').or(`shipping_date.is.null,shipping_date.lte.${today}`);
  else if(view==='RECEIVED')   q=q.eq('doc_status','RECEIVED');
  else if(view==='POSTPONED')  q=q.eq('doc_status','POSTPONED');
  else if(view==='TOMORROW')   q=q.eq('doc_status','NEW').eq('shipping_date',tmr);
  else if(view==='ADVANCE')    q=q.eq('doc_status','NEW').gt('shipping_date',tmr);
  else if(view==='EDIT')       q=q.eq('doc_status','EDIT_COMPLETED');
  else if(view==='COMPLETED_TODAY'){ const r=_todayRangeTH(); q=q.eq('doc_status','COMPLETED').gte('completed_at',r.start).lt('completed_at',r.end); }
  // view==='all' → ไม่ filter สถานะ
  return _applyOwnOnly(q, view);
}
// โหลดข้อมูลของโหมดเดียว ≤200 · lock กัน query ซ้ำ (#15) · token กัน response เก่าทับใหม่ · fallback freight_paid
async function loadView(view, opts={}){
  if(!SFZ_READY) return;                       // DB ยังไม่พร้อม → ไม่ยิง query (กัน error loop)
  if(!DOC_MODES.includes(view)) return;
  const c=_vc(view);
  if(S._viewLoadPromises[view] && !opts.force) return S._viewLoadPromises[view];   // #15 ใช้ promise เดิม
  const tok=(S._viewReqToken[view]=(S._viewReqToken[view]||0)+1);                    // #15 request token
  c.loading=true;
  const p=(async()=>{
    const _q0=performance.now();
    try{
      let q=sb.from(DOC_TABLE).select(_docCols()).eq('app_code',WORK_APP_CODE);
      q=_applyViewFilter(q, view).order('created_at',{ascending:false}).limit(VIEW_LIMIT);
      let { data, error }=await q;
      if(error && /freight_paid/i.test(error.message||'')){ _fpMissing=true;             // DB ไม่มี freight_paid → จำไว้ + fallback cols
        let q2=sb.from(DOC_TABLE).select(DOC_COLS_FALLBACK).eq('app_code',WORK_APP_CODE);
        q2=_applyViewFilter(q2, view).order('created_at',{ascending:false}).limit(VIEW_LIMIT);
        ({ data, error }=await q2);
      }
      if(error && _sfzHaltOnSchemaError(error,'loadView '+view)) return;   // ตารางหาย → หยุดทันที ไม่ fallback ซ้ำ
      if(error){
        // FALLBACK กัน 400 จาก server filter ที่ DB ไม่รองรับ → ดึงแบบ plain (เหมือน query เดิมที่ใช้ได้) แล้วกรอง client ด้วย VIEWS[view].test
        console.warn('[loadView '+view+'] filtered query failed → plain fallback:', error && error.message);
        let r=await sb.from(DOC_TABLE).select(_docCols()).eq('app_code',WORK_APP_CODE).order('created_at',{ascending:false}).limit(600);
        if(r.error && /freight_paid/i.test(r.error.message||'')){ _fpMissing=true; r=await sb.from(DOC_TABLE).select(DOC_COLS_FALLBACK).eq('app_code',WORK_APP_CODE).order('created_at',{ascending:false}).limit(600); }
        if(r.error){ console.error('[loadView plain]', r.error); if(!c.loaded) toast('โหลดข้อมูลไม่สำเร็จ: '+(r.error.message||''),'error'); return; }
        data=(r.data||[]).filter(d=>{ try{ return _docVisibleToUser(d) && VIEWS[view].test(d); }catch(_){ return false; } }); error=null;
      }
      if(S._viewReqToken[view]!==tok) return;                                          // #15 มี request ใหม่กว่าแล้ว → ทิ้งผลเก่า
      _perfMark('supabaseQuery·'+view, _q0);
      c.docs=(data||[]).slice(0,VIEW_LIMIT); c.loaded=true; c.lastLoadedAt=Date.now();
      if(view===S.view){ S.docs=c.docs; _invalidateDocsCache(); }
    }catch(e){ console.error('[loadView]', e); }
    finally{ c.loading=false; }
  })();
  S._viewLoadPromises[view]=p;
  try{ await p; } finally { if(S._viewLoadPromises[view]===p) delete S._viewLoadPromises[view]; }
  return p;
}
// backward-compat: โค้ดเดิมที่เรียก loadDocuments() → โหลด "โหมดปัจจุบัน" เท่านั้น (ไม่โหลดรวมทุกสถานะแล้ว)
async function loadDocuments(){ S.loaded=true; await loadView(S.view,{force:true}); _ensureCount(S.view); }
// count query ต่อโหมด (#9) — คืนเฉพาะจำนวน (head:true · ไม่โหลดข้อมูล) · ใช้ filter+own-only เดียวกัน
async function _ensureCount(view){
  if(!SFZ_READY) return;
  if(!DOC_MODES.includes(view) || !canView(view)) return;
  try{
    let q=sb.from(DOC_TABLE).select('id',{count:'exact',head:true}).eq('app_code',WORK_APP_CODE);
    q=_applyViewFilter(q, view);
    const { count, error }=await q;
    if(error && _sfzHaltOnSchemaError(error,'count '+view)) return;
    if(!error && typeof count==='number'){ S.counts[view]=count; _vc(view).count=count; }
  }catch(e){ console.warn('[count '+view+']', e); }
}
function _ensureCounts(){ const ps=DOC_MODES.filter(canView).map(v=>_ensureCount(v)); Promise.all(ps).then(()=>{ renderSidebar(); renderMobileTabbar(); }); }   // ทุกโหมด (badge sidebar) → re-render เมื่อ count มาครบ
let _recountTimer=null;
function _recountSoon(){ clearTimeout(_recountTimer); _recountTimer=setTimeout(()=>{ _ensureCounts(); renderSidebar(); renderMobileTabbar(); }, 1200); }   // #9 ตรวจ count ใหม่หลัง realtime burst
// ตรวจว่าเอกสารมองเห็นได้ตามสิทธิ์ (mirror _visibleDocs) — ใช้ตอน route realtime เข้า cache
function _docVisibleToUser(row){
  if(!isOwnOnly()) return true;
  const uid=String(S.user&&S.user.id||'');
  if(row.doc_status==='NEW' && !row.assigned_user) return true;
  return String(row.assigned_user||'')===uid || String(row.creator_user||'')===uid;
}
function _docInMode(row, mode){ const v=VIEWS[mode]; if(!v) return false; return _docVisibleToUser(row) && v.test(row); }
// cache ops — mutate array ในที่เดิม (ref เดียวกับ S.docs เมื่อเป็นโหมดปัจจุบัน) · cap 200
function _cacheUpsert(mode, row){
  const c=_vc(mode); const i=c.docs.findIndex(d=>d.id===row.id);
  if(i>=0) c.docs[i]=row; else c.docs.unshift(row);
  c.docs.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
  if(c.docs.length>VIEW_LIMIT) c.docs.length=VIEW_LIMIT;
}
function _cacheRemove(mode, id){ const c=_vc(mode); const i=c.docs.findIndex(d=>d.id===id); if(i>=0) c.docs.splice(i,1); }

// คืนค่าเอกสารที่เลื่อน (POSTPONED) ข้ามวันกลับเป็น NEW อัตโนมัติหลังเที่ยงคืน · query POSTPONED โดยตรง (ไม่พึ่ง S.docs โหมดปัจจุบัน)
async function resetExpiredPostponedDocuments(){
  if(!SFZ_READY) return false;
  try{
    const today = todayYMD();
    let { data:_pd } = await sb.from(DOC_TABLE).select('id,doc_status,postponed_at').eq('app_code',WORK_APP_CODE).eq('doc_status','POSTPONED').limit(VIEW_LIMIT);
    const expired = (_pd||[]).filter(d => d.postponed_at && ymd(d.postponed_at) < today);
    if(!expired.length) return false;
    for(const d of expired){
      const patch = { doc_status:'NEW', received_at:null, assigned_user:null, assigned_name:null, delivery_status:'READY_FOR_SHIPPING' };
      let { error } = await sb.from(DOC_TABLE).update(patch).eq('id', d.id).eq('app_code', WORK_APP_CODE);
      if(error && /delivery_status/i.test(error.message||'')){   // คอลัมน์ไม่มีในสคีมา → คืนค่าโดยไม่แตะ delivery_status
        const p={...patch}; delete p.delivery_status;
        ({ error } = await sb.from(DOC_TABLE).update(p).eq('id', d.id).eq('app_code', WORK_APP_CODE));
      }
      if(!error){
        // #4 patch local S.docs ทันที (mirror ค่าที่เขียน DB) — แทนการ refetch 1000 แถว
        //     ใช้เฉพาะฟิลด์ที่อยู่ใน DOC_COLS (delivery_status ไม่ได้ถูก select จึงไม่ตั้งใน local)
        const _li=(S.docs||[]).findIndex(x=>x.id===d.id);
        if(_li>=0){ S.docs[_li]={ ...S.docs[_li], doc_status:'NEW', received_at:null, assigned_user:null, assigned_name:null }; }
        // 🔄 Timeline อัตโนมัติ · บันทึกเป็น SYSTEM (ไม่ใช่ user ปัจจุบัน) · created_at = วันที่/เวลา
        try{
          await sb.from(LOG_TABLE).insert({
            app_code:WORK_APP_CODE, document_id:d.id, action:'postponed_reset', doc_status:'NEW',
            user_id:null, user_name:'SYSTEM',
            note:`🔄 ระบบย้ายงานจาก "เลื่อนตรวจปล่อย" กลับไป "รอรับงาน" เนื่องจากเข้าสู่วันใหม่`,
            created_at:new Date().toISOString()
          });
        }catch(_l){ console.warn('[postponed_reset log]', _l); }
      }
      else { console.warn('[postponed_reset]', error); }
    }
    // per-mode: POSTPONED/NEW cache + count เปลี่ยน → โหลดใหม่เฉพาะ 2 โหมดนี้ (ไม่โหลดรวม)
    try{ await loadView('POSTPONED',{force:true}); await loadView('NEW',{force:true}); _ensureCount('POSTPONED'); _ensureCount('NEW'); }catch(_){}
    return true;
  }catch(e){ console.warn('[resetExpiredPostponed]', e); return false; }
}
async function logDoc(documentId, action, doc_status, note){

}
/* #10 Performance mark (แสดงเฉพาะเมื่อ DEBUG_PERF=true · ไม่รบกวนผู้ใช้ปกติ) */
const DEBUG_PERF = false;
function _perf(name, fn){ if(!DEBUG_PERF){ return fn?fn():undefined; } const t=performance.now(); const r=fn?fn():undefined; console.log('%c⏱ '+name+' '+(performance.now()-t).toFixed(1)+'ms','color:#10B981'); return r; }
function _perfMark(name, sinceMs){ if(DEBUG_PERF) console.log('%c⏱ '+name+' '+(performance.now()-sinceMs).toFixed(1)+'ms','color:#38BDF8'); }

/* #2/#3 Realtime — ฟัง 2 ตาราง (sfz_documents + sfz_document_logs) พร้อม filter app_code
   · sfz_documents : INSERT/UPDATE/DELETE → patch S.docs เฉพาะแถว (ไม่ refetch 1000)
   · sfz_document_logs: status → S.jobStatus[doc] · doc_status/doc_completed/อื่น → S.sysStatus[doc] (โหลดล่าสุดเฉพาะ 1 doc)
   · .subscribe(status) : จับ SUBSCRIBED/CHANNEL_ERROR/TIMED_OUT/CLOSED → reconnect + delta sync
   · ป้องกัน channel ซ้ำ ด้วย _rtSubscribing + removeChannel เดิมก่อน */
let _rtSubscribing=false, _rtEpoch=0, _rtRetryDelay=1500;
function subscribeRealtime(){
  if(_rtSubscribing) return;                       // กันสร้างซ้ำระหว่างกำลัง subscribe
  _rtSubscribing=true;
  clearTimeout(S._rtRetry);
  // 🔑 epoch: ปิดเสียง callback ของ channel เก่า — sb.removeChannel() จะยิง status 'CLOSED' ของ channel เดิม
  //    ถ้าไม่กัน callback นั้นจะตั้ง retry ใหม่ → subscribeRealtime → removeChannel → 'CLOSED' → วนไม่รู้จบทุก 1.5 วิ
  //    (= ต้นเหตุจริงของอาการกระพริบ เพราะทุกรอบ SUBSCRIBED จะเรียก _saDeltaSync)
  const myEpoch = ++_rtEpoch;
  if(S._rt){ try{ sb.removeChannel(S._rt); }catch(_){} S._rt=null; }
  try{
    // หมายเหตุ: กรอง app_code ฝั่ง JS (ใน _saRealtimeApply/_saLogRealtimeApply) แทน server-side filter
    //   เพราะการใส่ filter ฝั่ง server ทำให้ event DELETE ส่งไม่ครบถ้าไม่ได้ตั้ง REPLICA IDENTITY FULL → คงพฤติกรรมเดิม 100%
    S._rt = sb.channel('sfz_docs_rt')
      .on('postgres_changes', { event:'*', schema:'public', table:DOC_TABLE }, (payload)=>{ _saRealtimeApply(payload); })
      .on('postgres_changes', { event:'*', schema:'public', table:LOG_TABLE }, (payload)=>{ _saLogRealtimeApply(payload); })
      .subscribe((status)=>{
        if(myEpoch!==_rtEpoch) return;             // callback ของ channel ที่ถูกแทนที่แล้ว → ทิ้ง (ตัดวงจร loop)
        S._rtStatus = status;
        if(DEBUG_PERF) console.log('%c⏱ realtime status: '+status,'color:#F59E0B');
        if(status==='SUBSCRIBED'){
          _rtSubscribing=false; _rtRetryDelay=1500;   // ต่อสำเร็จ → รีเซ็ต backoff
          if(S._rtWasDown){ S._rtWasDown=false; _saDeltaSync(); }   // เพิ่งกลับมา online → sync ส่วนที่ตกหล่น
        } else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
          _rtSubscribing=false; S._rtWasDown=true;
          clearTimeout(S._rtRetry);
          S._rtRetry=setTimeout(()=>{ subscribeRealtime(); }, _rtRetryDelay);  // ลอง subscribe ใหม่
          _rtRetryDelay=Math.min(_rtRetryDelay*2, 30000);   // backoff — กัน retry ถี่ซ้อนกัน
        }
      });
  }catch(e){ console.warn('[realtime]', e); _rtSubscribing=false; }
  _bindRtLifecycle();
}
// จับ visibility/pageshow/online (bind ครั้งเดียว) → กลับมาเปิดจอ/เน็ตกลับ → เช็ค channel · หลุด→subscribe ใหม่ · sync delta
let _rtLifecycleBound=false, _wakeTimer=null;
function _bindRtLifecycle(){
  if(_rtLifecycleBound) return; _rtLifecycleBound=true;
  const wake=()=>{
    if(document.visibilityState==='hidden') return;
    clearTimeout(_wakeTimer);
    _wakeTimer=setTimeout(()=>{                    // debounce: visibilitychange/pageshow/online ที่มาใกล้กัน → ทำครั้งเดียว
      const st=S._rt && S._rt.state;               // 'joined' = ยัง subscribed · 'joining' = กำลังต่อ (อย่าไปตัด)
      if(st==='joined'){ _saDeltaSync(); }         // ยังต่ออยู่ → แค่ sync ส่วนที่ตกหล่น
      else if(st!=='joining'){ S._rtWasDown=true; subscribeRealtime(); }   // หลุดจริง → subscribe ใหม่
    }, 300);
  };
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') wake(); });
  window.addEventListener('pageshow', wake);
  window.addEventListener('online', wake);
}
// Delta sync — ดึงเฉพาะเอกสารที่เปลี่ยนหลัง _lastSyncAt (ไม่โหลด 1000 ซ้ำ) แล้ว merge เฉพาะแถว
let _deltaBusy=false;
// ลายเซ็นสมาชิก+ลำดับแถวของหน้าปัจจุบัน — เปลี่ยน = แถวเข้า/ออก/สลับลำดับจริง (ต้อง rebuild tbody)
function _pageIdsSig(){ try{ return String(S.page)+'#'+(computeRows().rows||[]).map(r=>r.id).join('|'); }catch(_){ return ''; } }
// ลายเซ็นเนื้อหาแถวที่แสดงอยู่ — ครอบคลุมทุกฟิลด์ที่ docRow วาด (ไม่พึ่ง updated_at อย่างเดียว)
function _docsSig(){ try{ return (computeRows().rows||[]).map(r=>[r.id,r.doc_no,r.company,r.category,r.description,r.job_nj,r.quantity,r.priority,r.import_terminal,r.pickup_location,r.pickup_time,r.assigned_name,r.creator_name,r.doc_status,r.card_status,r.received_at,r.completed_at,r.updated_at].join('~')).join('|'); }catch(_){ return ''; } }
async function _saDeltaSync(){
  if(_deltaBusy) return; _deltaBusy=true;
  const t0=performance.now();
  try{
    const v=S.view;
    if(DOC_MODES.includes(v)){
      const sigBefore=_docsSig();
      await loadView(v,{force:true});                 // #16 sync เฉพาะโหมดที่เปิดอยู่ (≤200) · ไม่โหลดทุกโหมด
      _ensureCount(v);
      _invalidateDocsCache();
      if(_docsSig()!==sigBefore) _rtRun();             // เอกสารเปลี่ยนจริงเท่านั้นจึง re-render (ไม่งั้นคงตารางเดิมไว้)
      // สถานะ Timeline อาจเปลี่ยนช่วง offline → force refresh แบบ background
      //   ⚠️ ห้าม delete S.jobStatus/S.sysStatus ก่อน query (ค่าเดิมต้องค้างบนจอ) · เสร็จแล้ว patch เฉพาะเซลล์
      if(v==='RECEIVED'){ try{ _loadStatusForRows(computeRows().rows||[], {force:true}); }catch(_){} }
    }
    S._lastSyncAt = new Date().toISOString();
  }catch(e){ console.warn('[deltaSync]', e); }
  finally{ _deltaBusy=false; _perfMark('deltaSync', t0); }
}
// #4 ตัวรันกลาง — coalesce ด้วย 1 animation frame (แทน debounce 350ms) · render เฉพาะส่วน
//   view เอกสาร → _renderDocBody() (tbody-only: search คง focus, ไม่ scroll กระโดด, dropdown/modal ไม่ปิด) · view อื่น → routeRender()
let _rtRAF=0, _rtRefetch=false;
function _rtRun(){
  if(_rtRAF) return;
  _rtRAF = requestAnimationFrame(async ()=>{
    _rtRAF=0; const t0=performance.now();
    const refetch=_rtRefetch; _rtRefetch=false;
    try{
      if(refetch){ await loadDocuments(); _invalidateDocsCache(); }
      renderSidebar();
      if(typeof S.view==='string'){
        const root=$('view-root');
        const isDocList = root && root.querySelector('tbody') && S.view!=='graph' && S.view!=='users';
        if(isDocList) _renderDocBody(); else routeRender();   // patch tbody ถ้าเป็นหน้ารายการ · ไม่งั้น render ปกติ
      }
    }catch(e){ console.warn('[rt]', e); }
    _perfMark('realtime→DOM', t0);
  });
}
// fallback: โหลดใหม่ทั้งหมด + render (พฤติกรรมเดิม 100% · ใช้เฉพาะกรณีไม่ชัด/error)
function scheduleRefresh(){ _rtRefetch=true; _rtRun(); }
// #5/#2 sfz_documents incremental — patch S.docs เฉพาะแถวจาก payload (ไม่ refetch 1000)
function _saRealtimeApply(payload){
  try{
    const ev = String(payload && (payload.eventType||payload.event) || '').toUpperCase();
    const row    = (payload && payload.new && Object.keys(payload.new).length) ? payload.new : null;
    const oldRow = (payload && payload.old && Object.keys(payload.old).length) ? payload.old : null;
    if(row && row.app_code && row.app_code !== WORK_APP_CODE) return;   // เอกสารแอปอื่น → ไม่เกี่ยว
    const idsBefore=_pageIdsSig();                                      // ลายเซ็นแถวหน้าปัจจุบัน (id+ลำดับ+หน้า) ก่อนอัปเดต cache
    if(ev==='DELETE'){
      const id = oldRow && oldRow.id; if(!id){ _recountSoon(); return; }
      DOC_MODES.forEach(m=>_cacheRemove(m, id));                        // #6 ลบออกจากทุก cache ที่พบ
      delete S.jobStatus[id]; delete S.sysStatus[id];                   // ล้างสถานะของ doc นี้
    } else if(ev==='INSERT' || ev==='UPDATE'){
      if(!row || !row.id){ _recountSoon(); return; }
      DOC_MODES.forEach(m=>{ if(_docInMode(row, m)) _cacheUpsert(m, row); else _cacheRemove(m, row.id); });  // #6 อยู่โหมดไหน→อัปเดต · ไม่อยู่แล้ว→ลบออก (ย้ายสถานะ)
    } else { _recountSoon(); return; }
    if(S.view && _vc(S.view)) S.docs=_vc(S.view).docs;                  // sync ref โหมดปัจจุบัน
    _invalidateDocsCache();
    S._lastSyncAt = new Date().toISOString();
    _recountSoon();                                                     // #9 ปรับ count + sidebar/tabbar (debounced · ไม่แตะตาราง)
    // 🎯 render เฉพาะเมื่อ "หน้าปัจจุบัน" ได้รับผลจริง
    const idsAfter=_pageIdsSig();
    if(idsAfter!==idsBefore) _rtRun();                                  // แถวเข้า/ออก/ลำดับเปลี่ยนจริง → rebuild tbody หน้าปัจจุบัน
    else if(row && row.id && _rowEl(row.id)){                           // สมาชิก+ลำดับเดิม · แถวอยู่บนหน้า → patch แถวเดียว
      if(_patchDocumentRow(row.id)) _updateCurrentViewCounters(); else _rtRun();
    }
    else _updateCurrentViewCounters();                                  // งานนอกหน้าปัจจุบัน → อัปเดตแค่ตัวเลข/paginator · **ไม่แตะแถวเลย**
  }catch(e){ console.warn('[rt-inc]', e); _recountSoon(); _rtRun(); }
}
// #2 sfz_document_logs incremental — อัปเดตสถานะเฉพาะ document_id ที่ได้รับผลกระทบ (โหลดล่าสุดเฉพาะ 1 doc · ไม่ refetch เอกสาร)
//   action 'status' → สถานะลูกค้า (S.jobStatus) · action อื่น (doc_status/doc_completed/ระบบ) → สถานะชิปปิ้ง/เอกสาร (S.sysStatus)
function _saLogRealtimeApply(payload){
  try{
    const row    = (payload && payload.new && Object.keys(payload.new).length) ? payload.new : null;
    const oldRow = (payload && payload.old && Object.keys(payload.old).length) ? payload.old : null;
    const rec = row || oldRow; if(!rec) return;
    if(rec.app_code && rec.app_code !== WORK_APP_CODE) return;          // log แอปอื่น → ไม่เกี่ยว
    const did = rec.document_id; if(!did) return;
    const action = String(rec.action||'');
    // ⚠️ ห้าม delete cache ก่อน query (จะทำให้เซลล์ว่างชั่วขณะ = กระพริบ) → force refresh แล้ว patch เฉพาะเซลล์ตอนได้ข้อมูลจริง
    S._lastSyncAt = new Date().toISOString();
    const jobs=[];
    if(action==='status') jobs.push(_loadJobStatus([did],{force:true})); else jobs.push(_loadSysStatus([did],{force:true}));
    Promise.all(jobs).then(()=>{
      // ✅ แถวอยู่หน้าปัจจุบัน → patch เฉพาะเซลล์สถานะใน rAF เดียว
      //    งานนอกหน้าปัจจุบัน (คนละหน้า/ถูก filter/คนละโหมด) → อัปเดต cache อย่างเดียว **ห้าม _rtRun()/render ตาราง**
      if(_rowEl(did)) requestAnimationFrame(()=>{ _patchDocumentStatusCells(did); });
      // ถ้าหน้าต่าง Timeline ของงานนี้เปิดอยู่ → รีเฟรช Timeline ใน modal ทันที
      if(document.getElementById('sa-v2-detail') && _sa && _sa.docId===did){
        if(_sa.tlMode==='doc') _saLoadDocTimeline(did); else _saLoadTimeline(did);
      }
    });
  }catch(e){ console.warn('[rt-log]', e); }
}

async function nextDocNo(){
  const ymd = todayYMD().replace(/-/g,''); // YYYYMMDD
  const todayCount = S.docs.filter(d=> d.created_at && ymd && new Date(d.created_at).getFullYear()+pad(new Date(d.created_at).getMonth()+1)+pad(new Date(d.created_at).getDate())===ymd).length;
  return ymd + '-' + String(todayCount+1).padStart(5,'0');
}

// ⏰ จับเวลาเที่ยงคืน: เมื่อถึง 00:00 ของวันใหม่ → reload (จะรัน resetExpiredPostponedDocuments ใน loadDocuments) แล้วตั้งเวลารอบถัดไป
let _midnightTimer = null;
function _scheduleMidnightReset(){
  if(_midnightTimer){ clearTimeout(_midnightTimer); _midnightTimer=null; }
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5); // 00:00:05 พรุ่งนี้ (เผื่อ buffer)
  _midnightTimer = setTimeout(async ()=>{
    try{ await resetExpiredPostponedDocuments(); if(DOC_MODES.includes(S.view)) await loadView(S.view,{force:true}); _ensureCounts(); renderSidebar(); if(typeof S.view==='string') routeRender(); }catch(_e){ console.warn('[midnight]', _e); }
    _scheduleMidnightReset();   // ตั้งเวลารอบถัดไป
  }, Math.max(1000, next - now));
}
async function enterApp(){
  /* ตรวจ Module / Table ที่จำเป็น "หลัง" ผ่าน Login แล้วเท่านั้น */
  if(!SFZ_READY){
    const rows = await _sfzRunHealthCheck();
    if(rows.some(x=>!x.ok)){ _sfzShowHealth(rows); return; }
    SFZ_READY = true;
    _sfzHideHealth();
  }
  const _acc = await _sfzCheckAccess();
  if(!_acc){ toast('บัญชีนี้ถูกปิดสิทธิ์การใช้งาน SHIPPING FZ','error'); doLogout(); return; }
  showScreen('screen-app');
  // #3 pageSize ตามอุปกรณ์ — มือถือ 30 · คอม 100
  S.pageSize = _vpMobile() ? 30 : 100;
  // header user
  $('sb-avatar').textContent = avatarText(uname());
  $('sb-name').textContent = uname();
  $('sb-role').textContent = String(S.user.role||'STAFF');
  S.view = _firstAllowedView() || '__noaccess';   // กำหนดโหมดเริ่มต้นก่อนโหลด
  S.docs = _vc(S.view).docs;
  renderSidebar();
  renderMobileTabbar();
  refreshIcons();
  S._lastSyncAt = new Date().toISOString();   // #3 มาร์คเวลาก่อน subscribe → delta sync ครอบคลุมช่วงโหลดหน้าแรก
  subscribeRealtime();                         // subscribe ก่อน initial load (event ที่เปลี่ยนระหว่างโหลดไม่ตกหล่น)
  const _t0=performance.now();
  if(DOC_MODES.includes(S.view)) await loadView(S.view,{force:true});   // #1 โหลดเฉพาะโหมดปัจจุบัน (≤200) · ไม่โหลดรวมทุกสถานะ
  _perfMark('initialLoad', _t0);
  _ensureCounts();                             // #9 count query ทุกโหมด (badge) · background
  resetExpiredPostponedDocuments();            // คืน POSTPONED ข้ามวัน (self-query · background)
  _scheduleMidnightReset();   // ⏰ เข้าสู่วันใหม่ 00:00 → เช็ค POSTPONED ข้ามวันอัตโนมัติ (แม้แอปเปิดค้าง)
  S._lastSyncAt = new Date().toISOString();
  S.docs = _vc(S.view).docs; _invalidateDocsCache();
  renderSidebar(); renderMobileTabbar();
  routeRender();
}
function viewCount(key){
  if(S.counts[key]!=null) return S.counts[key];                  // #9 จำนวนจริงจาก count query
  const v = VIEWS[key]; if(!v) return 0;
  const c = S.viewCache[key];                                    // fallback: นับจาก cache โหมดนั้น (ก่อน count มา)
  if(c && Array.isArray(c.docs)) return c.docs.filter(v.test).length;
  return 0;
}
function renderSidebar(){
  const item = (key, icon, label, opts={}) => {
    if(!canView(key)) return '';
    const active = S.view===key;
    const cnt = opts.count!=null ? opts.count : null;
    const badge = cnt!=null ? `<span class="badge" data-key="${key}" data-zero="${cnt===0?'1':'0'}">${cnt}</span>` : '';
    return `<button class="menu-item dim ${active?'active':''}" data-view="${key}" onclick="setView('${key}')">
      <span class="ic">${icon}</span><span class="lbl">${esc(label)}</span>${badge}</button>`;
  };
  const docItems = item('all','📄','เอกสารทั้งหมด',{count:viewCount('all')})
    + item('NEW','🟡','รอรับงาน',{count:viewCount('NEW')})
    + item('RECEIVED','🔵','ดำเนินตรวจปล่อย',{count:viewCount('RECEIVED')})
    + item('COMPLETED_TODAY','🟢','ปล่อยเสร็จวันนี้',{count:viewCount('COMPLETED_TODAY')})
    + item('POSTPONED','🔴','เลื่อนตรวจปล่อย',{count:viewCount('POSTPONED')});

    + item('ADVANCE','🗓️','งานล่วงหน้า',{count:viewCount('ADVANCE')})
    + item('EDIT','🛠','งานแก้ไข',{count:viewCount('EDIT')});
  const sysItems = item('graph','📊','กราฟงานทั้งหมด') + item('users','👥','ผู้ใช้งาน');
  let html = '';

  if(pendItems.trim()) html += `<div class="menu-divider"></div><div class="menu-section"><div class="title pending">PENDING</div>${pendItems}</div>`;

  $('menu-root').innerHTML = html;
}

function setView(v){
  if(!canView(v)){ const fb=_firstAllowedView(); if(!fb){ v='__noaccess'; } else { v=fb; } }
  S.view = v; S.page = 1; S.filters = { search:'', terminal:'', category:'', priority:'', customer:'', cs:'', dateFrom:'', dateTo:'' };
  if(DOC_MODES.includes(v)){ S.docs = _vc(v).docs; } _invalidateDocsCache();   // #4 ชี้ cache โหมดใหม่
  closeSidebar();
  renderSidebar(); renderMobileTabbar();
  routeRender();                 // #5 แสดง cache ทันที (ถ้าเคยโหลด) · ไม่ล็อกทั้งหน้า
  window.scrollTo(0,0);
  if(DOC_MODES.includes(v)){     // #5 sync เบื้องหลัง แล้ว patch เฉพาะส่วน

  }
}

/* ---------------- document list view ---------------- */
function computeRows(){
  const def = VIEWS[S.view] || VIEWS.all;
  let list = _visibleDocs().filter(def.test);
  // status pills (only on 'all')
  const f = S.filters;
  if(S.view==='all' && f.statusF) list = list.filter(d=>d.doc_status===f.statusF);
  if(f.terminal) list = list.filter(d=>(d.import_terminal||'')===f.terminal);
  if(f.category) list = list.filter(d=>(d.category||'')===f.category);
  if(f.priority) list = list.filter(d=>(d.priority||'normal')===f.priority);
  if(f.customer) list = list.filter(d=>(d.company||'')===f.customer);        // ✚ Customer
  if(f.cs)       list = list.filter(d=>(d.creator_name||'')===f.cs);          // ✚ CS (ผู้เปิดงาน)
  if(f.dateFrom) list = list.filter(d=> d.created_at && ymd(d.created_at) >= f.dateFrom);  // ✚ ช่วงวันที่ (created_at)
  if(f.dateTo)   list = list.filter(d=> d.created_at && ymd(d.created_at) <= f.dateTo);
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(d=> [d.doc_no,d.company,d.import_terminal,d.assigned_name,d.creator_name,d.job_nj,d.description,d.category]
      .some(x=> String(x||'').toLowerCase().includes(q)) );
  }
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / S.pageSize));
  if(S.page>totalPages) S.page=totalPages;
  const start = (S.page-1)*S.pageSize;
  const rows = list.slice(start, start+S.pageSize);
  return { list, rows, total, totalPages };
}
function docActions(d){
  const id=d.id, st=d.doc_status;
  const acts=[];
  if(st==='NEW'){
    acts.push({label:'📥 รับงาน', cls:'ra-accept', fn:`docReceive('${id}')`});
    acts.push({label:'แก้ไข', cls:'ra-edit', fn:`openEdit('${id}')`, icon:'pencil'});
  } else if(st==='RECEIVED'){
    acts.push({label:'อัปเดตสถานะ', cls:'ra-going', fn:`openStatusPrompt('${id}')`});
    acts.push({label:'⏳ เลื่อน', cls:'ra-warn', fn:`openPostponePrompt('${id}')`});
    acts.push({label:'🛃 ตรวจปล่อยเสร็จ', cls:'ra-primary', fn:`openClearedPrompt('${id}')`});
  } else if(st==='POSTPONED'){
    acts.push({label:'↩️ กลับดำเนินการ', cls:'ra-going', fn:`docReturn('${id}')`});
    acts.push({label:'🛃 ตรวจปล่อยเสร็จ', cls:'ra-primary', fn:`openClearedPrompt('${id}')`});
  } else if(st==='CLEARED'){
    acts.push({label:'✅ งานเสร็จแล้ว', cls:'ra-primary', fn:`docComplete('${id}')`});
  }
  acts.push({label:'ดู', cls:'ra-view', fn:`openDetail('${id}')`, icon:'eye'});
  if(st==='NEW') acts.push({label:'สร้างงานซ้ำ', cls:'ra-dup', fn:`docDuplicate('${id}')`, icon:'copy-plus'});
  if(canDeleteDoc(d)) acts.push({label:'ลบ', cls:'ra-danger', fn:`docDelete('${id}')`, icon:'trash-2'});
  return acts;
}

function _loadStatusForRows(rows, opts){

  const _nj=force?ids:ids.filter(id=>!(id in S.jobStatus)), _ns=force?ids:ids.filter(id=>!(id in S.sysStatus));
  if(!_nj.length && !_ns.length) return;
  const t0=performance.now();
  const tok=++_statusRenderTok;   // #6 กันผล query เก่ากลับมาทีหลังแล้ววาดทับของใหม่
  Promise.all([_loadJobStatus(_nj,{force}), _loadSysStatus(_ns,{force})]).then(()=>{
    _perfMark('timelineQuery', t0);
    if(tok!==_statusRenderTok) return;                       // มีคำขอใหม่กว่าแล้ว → ทิ้งผลนี้
    if(S.view!=='RECEIVED' || !$('view-root')) return;

let _srvSearchTok=0;
async function _maybeServerSearch(q){
  q=String(q||'').trim(); if(!q || !DOC_MODES.includes(S.view)) return;
  const c=_vc(S.view); if(!c.loaded || c.docs.length<VIEW_LIMIT) return;   // ยังไม่เต็ม 200 → client search พอ
  const tok=++_srvSearchTok; const view=S.view;
  try{
    const like='%'+q.replace(/[%,]/g,' ')+'%';
    let query=sb.from(DOC_TABLE).select(_docCols()).eq('app_code',WORK_APP_CODE);
    query=_applyViewFilter(query, view)
      .or(`doc_no.ilike.${like},company.ilike.${like},job_nj.ilike.${like},creator_name.ilike.${like},assigned_name.ilike.${like}`)
      .order('created_at',{ascending:false}).limit(VIEW_LIMIT);
    let { data, error }=await query;
    if(error && /freight_paid/i.test(error.message||'')){ _fpMissing=true; let q2=sb.from(DOC_TABLE).select(DOC_COLS_FALLBACK).eq('app_code',WORK_APP_CODE); q2=_applyViewFilter(q2,view).or(`doc_no.ilike.${like},company.ilike.${like},job_nj.ilike.${like},creator_name.ilike.${like},assigned_name.ilike.${like}`).order('created_at',{ascending:false}).limit(VIEW_LIMIT); ({data,error}=await q2); }
    if(error || tok!==_srvSearchTok || S.view!==view || S.filters.search!==q) return;   // stale/เปลี่ยนแล้ว → ทิ้ง
    let added=false;
    (data||[]).forEach(row=>{ if(row&&row.id && !c.docs.some(d=>d.id===row.id)){ c.docs.push(row); added=true; } });
    if(added){ if(S.view===view){ S.docs=c.docs; } _invalidateDocsCache(); _renderDocBody(); }
  }catch(e){ console.warn('[serverSearch]', e); }
}

let _shipNamesCache=null;
async function _shipNames(){   // Set ชื่อ (full_name/username/display_user) ของ user SHIPPING · ดึงเฉพาะฟิลด์จำเป็น (ไม่ดึงรหัสผ่าน) · cache ต่อ session

const _ssInflight=new Set();   // #6 กัน query สถานะชิปปิ้ง id เดียวกันซ้อนกัน
async function _loadSysStatus(ids, opts){
  const force=!!(opts&&opts.force);
  const all=[...new Set((ids||[]).filter(Boolean))];
  const need=(force?all:all.filter(id=>!(id in S.sysStatus))).filter(id=>!_ssInflight.has(id));
  if(!need.length) return;
  need.forEach(id=>_ssInflight.add(id));

      const tmp={}; let ok=false;                        // ⚠️ เขียนลง tmp ก่อน — ห้ามแตะค่าเดิมระหว่าง query
      try{

          .eq('app_code',WORK_APP_CODE).in('document_id',chunk)
          .neq('action','status')   // ตัด status(=สถานะลูกค้า) · รวม doc_status(SHIPPING+รูป) เหมือนหน้าต่าง · role filter คัด SHIPPING
          .order('created_at',{ascending:false});               // ล่าสุดก่อน → entry SHIPPING แรกที่ผ่าน filter = แถวล่างสุดที่หน้าต่างแสดง
        if(!error){

            seen[did]=1; tmp[did]={ t:fmtTime(l.created_at), m:_sysMsg(l) };   // _sysMsg = ข้อความที่หน้าต่างแสดงเป๊ะ
          });

      }
      // query ล้มเหลว → คงค่าเดิมไว้
    }
  } finally { need.forEach(id=>_ssInflight.delete(id)); }
}

  _FLDD.open=null; _FLDD.data=[]; _FLDD.filtered=[]; _FLDD.hi=-1; _FLDD.q='';
}
function _flddOnScroll(e){ if(!_FLDD.open) return; if(Date.now()-_FLDD.openAt < 400) return; if(_FLDD.open.panel.contains(e.target)) return; _flddClose(); }
function _flddApply(trigger, kind, val){
  const lbl = (val==='') ? _flddAll(kind) : val;
  const el = trigger.querySelector('.sa-fl-dd-lbl'); if(el){ el.textContent=lbl; el.title=lbl; }
  if(kind==='customer') docSetCustomer(val); else docSetCS(val);   // ← handler เดิม (re-render body-only)
}
function _flddPick(v){ const t=_FLDD.trigger, k=_FLDD.kind; _flddApply(t,k,v); _flddClose(); }
function _flddRender(){
  if(!_FLDD.open) return;
  const q=(_FLDD.q||'').trim().toLowerCase();
  const cur=_flddCur(_FLDD.kind);
  const all=[''].concat(_FLDD.data);
  const filtered = q ? all.filter(v=> _flddLabel(_FLDD.kind,v).toLowerCase().includes(q)) : all;   // case-insensitive · substring ทุกตำแหน่ง
  _FLDD.filtered=filtered;
  _FLDD.hi = filtered.indexOf(cur); if(_FLDD.hi<0) _FLDD.hi = filtered.length?0:-1;
  const box=_FLDD.open.items;
  box.innerHTML = filtered.length
    ? filtered.map((v,i)=>{ const label=_flddLabel(_FLDD.kind,v), sel=(v===cur), hi=(i===_FLDD.hi);
        return `<button type="button" class="fldd-item${sel?' sel':''}${hi?' hi':''}" title="${esc(label)}" data-v="${esc(v)}"><span class="fldd-check">${sel?'✓':''}</span><span class="fldd-name">${esc(label)}</span></button>`; }).join('')
    : `<div class="fldd-empty">ไม่พบรายการ</div>`;
  box.querySelectorAll('.fldd-item').forEach(it=>{ it.onclick=()=>_flddPick(it.getAttribute('data-v')||''); });
  const hiEl=box.querySelector('.fldd-item.hi'); if(hiEl) hiEl.scrollIntoView({block:'nearest'});
}
function _flddHi(){
  const box=_FLDD.open&&_FLDD.open.items; if(!box) return;
  box.querySelectorAll('.fldd-item').forEach((it,i)=>{ const on=(i===_FLDD.hi); it.classList.toggle('hi', on); if(on) it.scrollIntoView({block:'nearest'}); });
}
function _flddKey(e){
  const n=_FLDD.filtered?_FLDD.filtered.length:0;
  if(e.key==='ArrowDown'){ e.preventDefault(); if(n){ _FLDD.hi=(_FLDD.hi+1)%n; _flddHi(); } }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(n){ _FLDD.hi=(_FLDD.hi-1+n)%n; _flddHi(); } }
  else if(e.key==='Enter'){ e.preventDefault(); if(n && _FLDD.hi>=0) _flddPick(_FLDD.filtered[_FLDD.hi]); }
  else if(e.key==='Escape'){ e.preventDefault(); const t=_FLDD.trigger; _flddClose(); if(t&&t.focus) t.focus(); }
}
function _flddToggle(trigger, kind){
  if(_FLDD.open && _FLDD.trigger===trigger){ _flddClose(); return; }
  _flddClose();
  _FLDD.kind=kind; _FLDD.trigger=trigger; _FLDD.data=_flddList(kind); _FLDD.q='';
  _FLDD.w=window.innerWidth; _FLDD.openAt=Date.now();   // สำหรับกัน keyboard มือถือ (resize สูง/scroll transient ไม่ปิด)
  const back=document.createElement('div'); back.className='fldd-back'; back.onclick=_flddClose;
  const panel=document.createElement('div'); panel.className='fldd-panel';
  panel.innerHTML=`<div class="fldd-search"><input type="text" class="fldd-input" placeholder="🔍 ค้นหา..." autocomplete="off" spellcheck="false" enterkeyhint="done"></div><div class="fldd-items"></div>`;
  document.body.appendChild(back); document.body.appendChild(panel);
  const input=panel.querySelector('.fldd-input'), items=panel.querySelector('.fldd-items');
  _FLDD.open={panel,back,items};
  input.oninput=()=>{ _FLDD.q=input.value; clearTimeout(_FLDD.timer); _FLDD.timer=setTimeout(_flddRender,170); };   // debounce ~170ms
  input.onkeydown=_flddKey;
  _flddRender();
  // ตำแหน่ง + auto flip · anchor top(ลงล่าง)/bottom(ขึ้นบน) → พิมพ์ค้นหาแล้ว panel ไม่เลื่อนหลุด
  const r=trigger.getBoundingClientRect();
  panel.style.minWidth=r.width+'px';
  let left=Math.min(r.left, window.innerWidth-Math.max(r.width,240)-8); left=Math.max(8,left);
  panel.style.left=left+'px';
  const ph=panel.offsetHeight, below=window.innerHeight-r.bottom-8, above=r.top-8;
  if(below<ph && above>below){ panel.style.bottom=(window.innerHeight-r.top+6)+'px'; panel.style.top='auto'; }
  else { panel.style.top=(r.bottom+6)+'px'; panel.style.bottom='auto'; }
  trigger.classList.add('open');
  window.addEventListener('scroll', _flddOnScroll, {passive:true, capture:true});
  try{ input.focus({preventScroll:true}); }catch(_){ try{ input.focus(); }catch(__){} }   // มือถือ: keyboard เปิดทันที (อยู่ใน user gesture ของการแตะ)
}
function _flddOnResize(){ if(_FLDD.open && window.innerWidth!==_FLDD.w) _flddClose(); }   // ปิดเฉพาะ resize จริง (กว้างเปลี่ยน) · keyboard มือถือ (สูงเปลี่ยน) ไม่ปิด
window.addEventListener('resize', _flddOnResize, {passive:true});
// #3 เปลี่ยนขนาดจอ → ปรับ pageSize (คอม100/มือถือ30) · กลับหน้า 1 · re-render จาก cache (ไม่โหลด DB ใหม่)
let _psResizeTimer=null;
window.addEventListener('resize', ()=>{ clearTimeout(_psResizeTimer); _psResizeTimer=setTimeout(()=>{ const want=_vpMobile()?30:100; if(S.pageSize!==want){ S.pageSize=want; S.page=1; const r=$('view-root'); if(r && r.querySelector('tbody')) _renderDocBody(); } }, 200); }, {passive:true});

/* ---------------- Export Excel (lazy-load xlsx-js-style · clone จาก MASSENGER) ---------------- */
const _lazyScripts = new Map();
function loadScript(url){
  if(_lazyScripts.has(url)) return _lazyScripts.get(url);
  const p = new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src=url; s.async=true;
    s.onload=()=>resolve(); s.onerror=()=>{ _lazyScripts.delete(url); reject(new Error('โหลดไลบรารีไม่สำเร็จ')); };
    document.head.appendChild(s);
  });
  _lazyScripts.set(url,p); return p;
}
function loadXlsxStyle(){
  if(window.XLSX && window.XLSX.__styled) return Promise.resolve();
  return loadScript('https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js').then(()=>{ if(window.XLSX) window.XLSX.__styled=true; });
}

    const dOnlyX = s => { if(!s) return null; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; return (Date.UTC(+m[1],+m[2]-1,+m[3])-_epoch)/86400000; };

    const hYellow = { font:{ name:FONT, sz:FS, bold:true, color:{rgb:'FF000000'} }, fill:{ patternType:'solid', fgColor:{rgb:'FFFFFF00'} }, alignment:{ horizontal:'center', vertical:'center', wrapText:true }, border };

async function docEditSubmit(id){
  const d = S.docs.find(x=>x.id===id); if(!d){ document.getElementById('sa-docedit')?.remove(); return; }
  const newTerm = $('de-terminal').value || null;
  const assignId = $('de-assign').value || null;
  const oldTerm = d.import_terminal || null;
  const termChanged = (newTerm||'') !== (oldTerm||'');
  let assignName = d.assigned_name;
  if((assignId||'') !== (String(d.assigned_user||''))){
    const su = assignId ? (S.users||[]).find(u=>String(u.id)===String(assignId)) : null;
    assignName = su ? (su.full_name||su.username) : null;
  }
  const update = {
    import_terminal: newTerm,
    assigned_user: assignId,
    assigned_name: assignName,
    priority: $('de-priority').value || 'normal',
    description: ($('de-desc').value||'').trim() || null,
    updated_at: new Date().toISOString()
  };
  const btn=$('de-save'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> กำลังบันทึก...'; }
  try{
    const { error } = await sb.from(DOC_TABLE).update(update).eq('app_code',WORK_APP_CODE).eq('id',id);
    if(error) throw error;
    const note = termChanged
      ? `🔁 เปลี่ยนท่านำเข้า ${termLabel(oldTerm)} → ${termLabel(newTerm)}`
      : `แก้ไขข้อมูล · ผู้รับผิดชอบ: ${assignName||'ยังไม่มอบหมาย'} · ${update.priority==='urgent'?'🔴 ด่วน':'🟢 ไม่ด่วน'}`;
    await logDoc(id, termChanged?'reassign':'edited', d.doc_status, note);
    document.getElementById('sa-docedit')?.remove();
    toast(termChanged?'เปลี่ยนท่านำเข้าแล้ว':'บันทึกการแก้ไขแล้ว','success');
    const _i=S.docs.findIndex(x=>x.id===id); if(_i>=0){ S.docs[_i]={ ...S.docs[_i], ...update }; _invalidateDocsCache(); renderSidebar(); routeRender(); } else { await loadDocuments(); _invalidateDocsCache(); renderSidebar(); routeRender(); }   // #1 patch local + ล้าง cache — ไม่ refetch 1000 (realtime reconcile)
  }catch(e){ console.error(e); toast('ผิดพลาด: '+(e.message||''),'error'); if(btn){ btn.disabled=false; btn.innerHTML='บันทึกการแก้ไข'; } }
}

/* ---- รายละเอียดงาน dropdown ↔ กรอกเอง ---- */
function _descEls(){ return { sel:$('f-desc'), inp:$('f-desc-other'), dyn:$('f-desc-dyn'), back:$('f-desc-back') }; }
function _descMode(other){ const e=_descEls(); if(!e.sel||!e.inp) return;
  if(other){ e.sel.style.display='none'; e.inp.style.display=''; if(e.back) e.back.style.display=''; }
  else{ e.inp.style.display='none'; if(e.back) e.back.style.display='none'; e.sel.style.display=''; } }
function _descPick(sel){
  if(sel.value==='__other__'){ const e=_descEls(); if(e.dyn){e.dyn.value='';e.dyn.textContent='';}
    sel.value=''; if(e.inp) e.inp.value=''; _descMode(true); setTimeout(()=>{ e.inp&&e.inp.focus(); },0); }
  else _descMode(false); }
function _descType(inp){ const e=_descEls(); if(!e.sel||!e.dyn) return; e.dyn.value=inp.value; e.dyn.textContent=inp.value; e.sel.value=inp.value; }
function _descBlur(inp){ if(!(inp.value||'').trim()) _descBack(); }
function _descBack(){ const e=_descEls(); if(!e.sel) return; if(e.inp)e.inp.value=''; if(e.dyn){e.dyn.value='';e.dyn.textContent='';} e.sel.value=''; _descMode(false); }
function _descSet(val){ const e=_descEls(); if(!e.sel) return; val=(val==null?'':String(val));
  if(val && DESC_STD.indexOf(val)===-1){ if(e.dyn){e.dyn.value=val;e.dyn.textContent=val;} e.sel.value=val; if(e.inp)e.inp.value=val; _descMode(true); }
  else { if(e.dyn){e.dyn.value='';e.dyn.textContent='';} if(e.inp)e.inp.value=''; e.sel.value=val; _descMode(false); } }

/* ---- ความเร่งด่วน ด่วน/ไม่ด่วน ---- */
function selectPriority(level){
  if(level!=='urgent' && level!=='normal') level='normal';
  const g=$('f-priority-group'); if(g) g.querySelectorAll('.priority-btn').forEach(b=>b.classList.toggle('selected', b.dataset.priority===level));
  const h=$('f-priority'); if(h) h.value=level;
}
/* ---- ค่าใช้จ่ายเฟรทจ่าย — checkbox อิสระ (ไม่กระทบ ด่วน/ไม่ด่วน) ---- */
function setFreight(on){
  const btn=$('f-freight-btn'), h=$('f-freight'); if(!btn||!h) return;

}
