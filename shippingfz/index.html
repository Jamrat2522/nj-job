function openPrompt(opts){
  return new Promise(res=>{
    const { title='หมายเหตุ', sub='', placeholder='พิมพ์ข้อความ...', value='', okLabel='บันทึก', okClass='btn-primary', required=false, presets=null } = opts||{};
    const m = $('modal-prompt');
    const chips = (presets&&presets.length) ? `<div class="prompt-chips">${presets.map(p=>`<button type="button" class="chip" onclick="_promptPick(this)">${esc(p)}</button>`).join('')}</div>` : '';
    m.querySelector('.modal').innerHTML = `
      <div class="modal-head"><div><h2>${esc(title)}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:''}</div><button class="x" onclick="_promptResolve(null)"><i data-lucide="x"></i></button></div>
      <div class="modal-body">
        ${chips}
        <div class="field"><textarea id="prompt-input" class="textarea" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="_promptResolve(null)">ยกเลิก</button>
        <button class="btn ${okClass}" onclick="_promptSubmit(${required?'true':'false'})">${esc(okLabel)}</button>
      </div>`;
    window._promptPick = (btn)=>{ const t=$('prompt-input'); if(t){ t.value=btn.textContent.trim(); t.focus(); } };
    window._promptSubmit = (req)=>{ const t=$('prompt-input'); const v=(t?t.value:'').trim(); if(req&&!v){ toast('กรุณากรอกข้อความ','error'); return; } _promptResolve(v); };
    window._promptResolve = (v)=>{ closeModal('modal-prompt'); res(v); };
    openModal('modal-prompt');
    setTimeout(()=>{ const t=$('prompt-input'); if(t) t.focus(); }, 60);
  });
}

/* ---------------- doc actions (flow) ---------------- */
async function _docUpdate(id, patch, action, logNote){
  patch.updated_at = new Date().toISOString();
  const { error } = await sb.from(DOC_TABLE).update(patch).eq('app_code',WORK_APP_CODE).eq('id',id);
  if(error){ toast('ดำเนินการไม่สำเร็จ: '+(error.message||''),'error'); throw error; }
  await logDoc(id, action, patch.doc_status||null, logNote||null);
  const _i=S.docs.findIndex(x=>x.id===id);
  const _row = (_i>=0) ? { ...S.docs[_i], ...patch } : null;
  if(_row){
    S.docs[_i] = _row;
    /* ย้ายแถวระหว่าง per-mode cache ทันที: อยู่โหมดไหน→upsert · ไม่อยู่แล้ว→ลบออก
       เช่น RECEIVED → COMPLETED : หลุดจาก cache RECEIVED และเข้า cache COMPLETED_TODAY เลย
       ไม่ต้องรอ Realtime และไม่ refetch */
    try{ DOC_MODES.forEach(m=>{ if(_docInMode(_row, m)) _cacheUpsert(m, _row); else _cacheRemove(m, _row.id); }); }catch(_c){ }
    _invalidateDocsCache(); renderSidebar(); routeRender();
    try{ _recountSoon(); }catch(_r){ }                 // badge ทุกโหมดอัปเดตทันที (1 RPC · debounce เดิม)
  } else {
    await loadDocuments(); _invalidateDocsCache(); renderSidebar(); routeRender();
    try{ _recountSoon(); }catch(_r){ }
  }
}

async function _saHeaderSave(){
  const id=_sa.docId;
  const d=S.docs.find(x=>x.id===id); if(!d){ toast('ไม่พบเอกสาร','error'); return; }
  const mode=(document.getElementById('sah-mode')?.value||'').trim();
  const cust=(document.getElementById('sah-cust')?.value||'').trim();
  const bl  =(document.getElementById('sah-bl')?.value||'').trim();
  const wh  =(document.getElementById('sah-wh')?.value||'').trim();
  const update={ category:mode||null, company:cust||null, job_nj:bl||null, import_terminal:wh||null, updated_at:new Date().toISOString() };
  const btn=document.getElementById('sah-save'); if(btn){ btn.disabled=true; btn.textContent='กำลังบันทึก...'; }
  try{
    const { error } = await sb.from(DOC_TABLE).update(update).eq('app_code',WORK_APP_CODE).eq('id',id);   // อ้างอิง id (document_id) เดียว
    if(error) throw error;
    const chips=[];
    if((d.category||'')!==(update.category||'')) chips.push(`โหมด ${d.category||'—'}→${update.category||'—'}`);
    if((d.company||'')!==(update.company||'')) chips.push('ลูกค้า');
    if((d.job_nj||'')!==(update.job_nj||'')) chips.push('B/L');
    if((d.import_terminal||'')!==(update.import_terminal||'')) chips.push(`ท่านำเข้า ${termLabel(d.import_terminal)}→${termLabel(update.import_terminal)}`);
    if(chips.length) await logDoc(id, 'edited', d.doc_status, `📝 แก้ไขข้อมูลงาน · ${chips.join(' · ')}`);   // action 'edited' → เข้า Timeline ระบบ (ไม่ปน Timeline งาน)
    const _i=S.docs.findIndex(x=>x.id===id); if(_i>=0){ S.docs[_i]={ ...S.docs[_i], ...update }; _invalidateDocsCache(); }   // #1 patch local + ล้าง cache — ไม่ refetch
    _sa.header={ mode:(update.category?`${catIcon(update.category)} ${update.category}`:'—'), cust:update.company||'—', bl:update.job_nj||'—', wh:update.import_terminal||'—' };   // sync ให้ COPY ใช้ค่าล่าสุด
    _saHeaderView();
    renderSidebar(); if(typeof S.view==='string') routeRender();   // รีเฟรชการ์ดงาน (ไม่โหลดหน้าใหม่ทั้งหมด)
    _saLoadTimeline(id);   // รีเฟรช Timeline ในหน้าต่าง
    toast('บันทึกข้อมูลงานแล้ว ✅','success');
  }catch(e){ console.error(e); toast('ผิดพลาด: '+(e.message||e),'error'); if(btn){ btn.disabled=false; btn.textContent='💾 บันทึก'; } }
}

async function _saLoadTimeline(docId){
  const top = document.getElementById('sa-v2-timeline');
  const items = [];
  try{
    const { data } = await sb.from(LOG_TABLE).select('id,note,user_name,created_at')
      .eq('app_code',WORK_APP_CODE).eq('document_id',docId).eq('action','status').order('created_at',{ascending:true});
    (data||[]).forEach(l=>{ const msg=String(l.note||'').trim(); if(!msg) return; if(extractImageUrls(l.note).length) return; /* 📋 งาน = JOB เท่านั้น → entry ที่มีรูป = Document (openDocStatusUpdate) ไม่แสดง */ items.push({ id:l.id, when:l.created_at, msg, who:l.user_name }); });
  }catch(e){ console.warn('[sa timeline]', e); }
  _sa.timeline = items.slice(); _sa.tlMode='job';
  if(!items.length){ if(top) top.innerHTML='<div style="color:#94A3B8">ยังไม่มีข้อมูลอัปเดตสถานะ</div>'; return; }
  _saRenderTL(top, items);
}

// 📋 อัปเดตสถานะเอกสาร — Document Timeline (แยกจาก 📋 งาน): อ่านเฉพาะ entry ที่ SHIPPING แนบรูป + จบงาน
async function _saLoadDocTimeline(docId){
  const top = document.getElementById('sa-doc-tl');
  const items = [];
  try{
    const { data } = await sb.from(LOG_TABLE).select('id,note,user_name,created_at,action')
      .eq('app_code',WORK_APP_CODE).eq('document_id',docId).in('action',['status','completed','doc_status','doc_completed']).order('created_at',{ascending:true});
    (data||[]).forEach(l=>{ const msg=String(l.note||'').trim(); if(!msg) return; const isDoc = (l.action==='doc_status'||l.action==='doc_completed'); if(!isDoc && !extractImageUrls(l.note).length) return; /* Document = doc_status/doc_completed (ใหม่) หรือ entry เก่าที่มีรูป */ items.push({ id:l.id, when:l.created_at, msg, who:l.user_name }); });
  }catch(e){ console.warn('[sa doc timeline]', e); }
  _sa.docTimeline = items.slice(); _sa.tlMode='doc';
  if(!top) return;
  if(!items.length){ top.innerHTML='<div style="color:#94A3B8">ยังไม่มีอัปเดตเอกสาร / รูปภาพ</div>'; return; }
  _saRenderTL(top, items);
}

// ดึง URL รูปภาพจากข้อความ timeline (.jpg/.jpeg/.png/.webp/.gif หรือ supabase storage public)
function extractImageUrl(text){
  if(!text) return null;
  const urls = String(text).match(/https?:\/\/[^\s"'<>]+/g);
  if(!urls) return null;
  for(const u of urls){
    if(/\.(jpe?g|png|webp|gif)(\?|#|$)/i.test(u) || /\/storage\/v1\/object\/public\//i.test(u)) return u;
  }
  return null;
}
// ดึง URL รูปภาพ "ทุกใบ" จาก note (รองรับแนบหลายรูป) — filter เดียวกับ extractImageUrl
function extractImageUrls(text){
  if(!text) return [];
  const out=[];
  const refs = String(text).match(/sfz:[^\s"'<>]+/g);                       // private bucket → เก็บเป็น path
  if(refs) refs.forEach(r=>out.push(r));
  const urls = String(text).match(/https?:\/\/[^\s"'<>]+/g);
  if(urls) urls.filter(u=> /\.(jpe?g|png|webp|gif)(\?|#|$)/i.test(u) || /\/storage\/v1\/object\//i.test(u)).forEach(u=>out.push(u));
  return out;
}

function _saRenderTL(wrap, items){
  if(!wrap) return;
  const p=n=>String(n).padStart(2,'0');
  let html='', curDate='';
  items.forEach(it=>{
    const dt=new Date(it.when);
    const dStr=`${p(dt.getDate())}/${p(dt.getMonth()+1)}/${dt.getFullYear()}`;
    const tStr=`${p(dt.getHours())}:${p(dt.getMinutes())}`;
    if(dStr!==curDate){ curDate=dStr; html+=`<div style="font-size:12px;font-weight:800;color:#60A5FA;margin:14px 0 6px">📅 วันที่ : ${dStr}</div>`; }
    const imgUrls = extractImageUrls(it.msg);
    const lines=it.msg.split('\n').filter(x=>{ const t=x.trim(); if(!t) return false; if(imgUrls.some(u=>x.includes(u))) return false; if(/^รูปภาพประกอบ\s*:?\s*$/.test(t)) return false; return true; }).map(x=>`<div style="font-size:13px;color:#fff;line-height:1.5">${esc(x.trim())}</div>`).join('');
    const imgHtml = imgUrls.length ? `<div class="tl-imgs">${imgUrls.map(u=>`<img ${_sfzImgSrcAttr(u)} loading="lazy" decoding="async" class="tl-img" onclick="_sfzOpenRef('${esc(u)}')" alt="รูปภาพประกอบ">`).join('')}</div><span class="timeline-img-link" onclick="_sfzOpenRef('${esc(imgUrls[0])}')">🔍 เปิดรูป (${imgUrls.length})</span>` : '';

    html+=`<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0 6px 4px;border-bottom:1px solid rgba(255,255,255,.06)">

      <div style="flex:1;min-width:0">${lines}${imgHtml}</div>${editBtn}${delBtn}</div>`;
  });
  wrap.innerHTML=html;
  _sfzHydrateImages(wrap);
}

async function _saCopyTimeline(mode){
  const items=(_sa.timeline||[]);
  if(!items.length){ toast('ยังไม่มีรายการให้คัดลอก','error'); return; }
  const h=_sa.header||{};
  const p=n=>String(n).padStart(2,'0');
  const dOf=it=>{ const dt=new Date(it.when); return `${p(dt.getDate())}/${p(dt.getMonth()+1)}/${dt.getFullYear()}`; };
  const tOf=it=>{ const dt=new Date(it.when); return `${p(dt.getHours())}.${p(dt.getMinutes())}`; };
  const header=`🚢 อัปเดตสถานะงาน\n🧭 โหมด : ${h.mode||'—'}\nลูกค้า : ${h.cust||'—'}\nB/L : ${h.bl||'—'}\nโกดัง : ${h.wh||'—'}`;
  let body='';
  if(mode==='last'){
    const lastDate=dOf(items[items.length-1]);
    const pick=items.filter(it=>dOf(it)===lastDate).slice(-2);
    body=pick.map(it=>`• ⏰ ${tOf(it)} ${it.msg}`).join('\n');
  }else{
    const multiDay=new Set(items.map(dOf)).size>1;
    let curDate='', parts=[];
    items.forEach(it=>{ const dStr=dOf(it); if(multiDay&&dStr!==curDate){ curDate=dStr; parts.push(`${parts.length?'\n':''}วันที่ : ${dStr}`); } parts.push(`• ⏰ ${tOf(it)} ${it.msg}`); });
    body=parts.join('\n');
  }
  const text=header+'\n'+body;
  try{ await navigator.clipboard.writeText(text); toast('คัดลอกเรียบร้อย','success'); }
  catch(_){ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); ta.remove(); toast('คัดลอกเรียบร้อย','success'); }catch(e){ toast('คัดลอกไม่สำเร็จ','error'); } }
}

function _saTab(t){
  const n=document.getElementById('sa-pane-n'), p=document.getElementById('sa-pane-p');
  const bn=document.getElementById('sa-tab-n'), bp=document.getElementById('sa-tab-p');
  if(!n||!p||!bn||!bp) return;

async function _saAddSave(){
  const id=_sa.docId;
  const d=S.docs.find(x=>x.id===id); if(!d){ toast('ไม่พบเอกสาร','error'); return; }
  const checks=Array.from(document.querySelectorAll('.sa-opt:checked'));
  const custom=(document.getElementById('sa-custom')?.value||'').trim();
  const lines=checks.map(c=>c.getAttribute('data-text'));
  if(custom) lines.push(custom);
  if(!lines.length){ toast('กรุณาเลือกสถานะอย่างน้อย 1 รายการ','error'); return; }
  const note=lines.join(' + ');
  const dv=(document.getElementById('sa-date')?.value||'').trim();
  const tv=(document.getElementById('sa-time')?.value||'').trim();
  let createdAt;
  if(dv&&tv){ const dt=new Date(`${dv}T${tv}`); createdAt=isNaN(dt.getTime())?new Date().toISOString():dt.toISOString(); }
  else createdAt=new Date().toISOString();
  try{
    const { error } = await sb.from(LOG_TABLE).insert({ app_code:WORK_APP_CODE, document_id:id, action:'status', doc_status:d.doc_status||'RECEIVED', user_id:(S.user&&S.user.id)||null, user_name:uname(), note, created_at:createdAt });
    if(error) throw error;
    try{ await sb.from(DOC_TABLE).update({ card_status:note, updated_at:new Date().toISOString() }).eq('app_code',WORK_APP_CODE).eq('id',id); }catch(_){}
    document.getElementById('sa-v2-status')?.remove();
    toast('บันทึกสถานะลง Timeline แล้ว ✅','success');
    _saLoadTimeline(id);
    S.jobStatus[id] = { t:fmtTime(createdAt), m:_jobStatusText(note) };   // ✚ อัปเดตคอลัมน์สถานะงานทันที (⏰ เวลา + ข้อความ · entry ที่เพิ่ง add = ล่าสุด)
    _saRefreshList();
  }catch(e){ console.error(e); toast('ผิดพลาด: '+(e.message||e),'error'); }
}

// ย่อรูปก่อนอัปโหลด (เฉพาะรูป > 500KB) · canvas → JPEG q0.75 · ยาวสุด 1600px · ชื่อไฟล์เดิม
// fallback คืนไฟล์เดิมเสมอถ้า: ไม่ใช่รูป / <500KB / error / บีบแล้วไม่เล็กลง → upload ไม่มีทางพัง, ครบทุกรูป
async function _saCompressImage(file){
  const _c0=performance.now();
  try{
    if(!file || !/^image\//i.test(file.type||'')) return file;
    if(file.size <= 500*1024) return file;
    const img = await new Promise((res,rej)=>{
      const u=URL.createObjectURL(file); const im=new Image();
      im.onload=()=>{ URL.revokeObjectURL(u); res(im); };
      im.onerror=(e)=>{ URL.revokeObjectURL(u); rej(e); };
      im.src=u;
    });
    let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    if(!w || !h) return file;
    const MAX=1600;
    if(w>MAX || h>MAX){ const s=Math.min(MAX/w, MAX/h); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s)); }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d'); if(!ctx) return file;
    ctx.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>{ try{ cv.toBlob(r,'image/jpeg',0.75); }catch(_){ r(null); } });
    if(!blob || blob.size>=file.size) return file;
    _perfMark('imageCompress', _c0);
    return new File([blob], file.name, { type:'image/jpeg', lastModified:Date.now() });
  }catch(_){ return file; }
}
// อัปโหลด/บีบรูปแบบจำกัด concurrency (มือถือ/หลายไฟล์: เสถียร ไม่ saturate เน็ต/แรม) · เรียงผลตาม index เดิม
async function _mapLimit(arr, limit, fn){
  const out = new Array(arr.length); let idx = 0;
  async function _w(){ while(idx < arr.length){ const i = idx++; out[i] = await fn(arr[i], i); } }
  await Promise.all(Array.from({ length: Math.min(limit, arr.length||0) }, _w));
  return out;
}

  document.body.appendChild(el);

  // ตำแหน่ง: ใต้ปุ่ม · ถ้าพื้นที่ด้านล่างไม่พอ (แถวล่างสุด) ให้เปิดขึ้นด้านบน
  const r = btn.getBoundingClientRect();
  const mh = el.offsetHeight, mw = el.offsetWidth;
  const below = window.innerHeight - r.bottom;
  const top = (below < mh + 12 && r.top > mh + 12) ? (r.top - mh - 6) : (r.bottom + 6);
  let left = r.right - mw;
  if(left < 8) left = 8;
  if(left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
  el.style.top = Math.max(8, top) + 'px';
  el.style.left = left + 'px';

  el.addEventListener('click', ev=>{
    const b = ev.target.closest('.rip-dd-item'); if(!b) return;
    ev.stopPropagation();
    const act = b.getAttribute('data-act');
    if(act==='close' && !canClose){ toast('กรุณาแนบเอกสารก่อนปิดงาน','error'); ripCloseMenu(); return; }
    ripCloseMenu();                                 // กดรายการแล้วปิดเมนูเสมอ
    if(act==='post')       openPostponePrompt(id);  // Function เดิม
    else if(act==='att')   openAttachDocs(id);      // Function เดิม
    else if(act==='close') ripCloseJob(id);         // Function เดิม (เงื่อนไขไฟล์แนบเดิม)
    else if(act==='del')   docDelete(id);           // Function เดิม (มี confirm ในตัว)
  });

  const onDoc = ev=>{ if(!el.contains(ev.target) && ev.target!==btn) ripCloseMenu(); };
  const onKey = ev=>{ if(ev.key==='Escape') ripCloseMenu(); };
  const onScroll = ()=> ripCloseMenu();
  document.addEventListener('mousedown', onDoc, true);
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', onScroll, true);

  btn.setAttribute('aria-expanded','true');
  _ripDD = { el, id, btn, onDoc, onKey, onScroll };
}

/* ปิดงาน — ต้องมีไฟล์แนบอย่างน้อย 1 ไฟล์
   FLOW: RECEIVED → COMPLETED โดยตรง (ไม่ผ่าน CLEARED อีกต่อไป)
   ใช้ docComplete() เดิมของระบบ → confirm + _docUpdate({doc_status:'COMPLETED', completed_at:now})
   + Timeline/Audit action='completed' + ผู้ปิดงาน ตามเดิมทุกอย่าง */
const _ripClosing = new Set();          // กันกดซ้ำ/ยิงซ้อน
async function ripCloseJob(id){
  if(!(_ripAtt[id] > 0)){ toast('กรุณาแนบเอกสารก่อนปิดงาน','error'); return; }
  if(_ripClosing.has(id)) return;
  _ripClosing.add(id);
  try{ await docComplete(id); }
  finally{ _ripClosing.delete(id); }
}

/* โหลดจำนวนไฟล์แนบเฉพาะแถวที่แสดงอยู่ แล้ว patch เฉพาะปุ่ม (ไม่ re-render ตาราง) */
async function _ripLoadAttachCounts(rows){
  if(!SFZ_READY || S.view !== 'RECEIVED') return;
  if(_metaRpcOK) return;        // #P1 rowMeta ให้จำนวนไฟล์แนบมาพร้อมสถานะแล้ว → ไม่ต้องยิงซ้ำ
  const ids  = (rows||[]).filter(d=>d && d.doc_status==='RECEIVED').map(d=>d.id);
  const need = ids.filter(i=>_ripAtt[i]===undefined);
  if(!need.length){ _ripPatchButtons(); return; }
  try{
    for(let i=0;i<need.length;i+=100){
      const chunk = need.slice(i,i+100);
      const { data, error } = await sb.from(ATTACH_TABLE).select('document_id')
        .eq('app_code',WORK_APP_CODE).in('document_id',chunk);
      if(error){ console.warn('[rip attach]', error.message); return; }
      chunk.forEach(x=>{ if(_ripAtt[x]===undefined) _ripAtt[x]=0; });
      (data||[]).forEach(r=>{ _ripAtt[r.document_id] = (_ripAtt[r.document_id]||0) + 1; });
    }
  }catch(e){ console.warn('[rip attach]', e); return; }
  _ripPatchButtons();
}
function _ripPatchButtons(){
  /* คอลัมน์การจัดการเหลือปุ่ม ⋮ อย่างเดียว — สถานะ "ปิดงาน" อ่านจาก _ripAtt ตอนเปิดเมนู (ค่าสดเสมอ)
     ถ้าเมนูเปิดค้างอยู่ตอนจำนวนไฟล์แนบเปลี่ยน → ปิดเมนูเพื่อไม่ให้แสดงค่าเก่า */
  if(_ripDD) ripCloseMenu();
}

async function _ripAttRender(id){
  const box = document.getElementById('rip-att-list'); if(!box) return;
  try{
    const { data, error } = await sb.from(ATTACH_TABLE)
      .select('id,storage_path,file_name,file_size,uploaded_name,created_at')
      .eq('app_code',WORK_APP_CODE).eq('document_id',id).order('created_at',{ascending:false});
    if(error) throw error;
    const list = data||[];
    _ripAtt[id] = list.length;
    _ripPatchButtons();
    if(!list.length){ box.innerHTML = '<div style="padding:10px 0">ยังไม่มีเอกสารแนบ</div>'; return; }
    const canDel = isAdmin();
    box.innerHTML = list.map(f=>`<div class="rip-att-row">
        <span class="rip-att-name" title="${esc(f.file_name||'')}">${esc(f.file_name||'ไฟล์')}</span>
        <span class="rip-att-meta">${f.file_size?Math.round(f.file_size/1024)+' KB':''}${f.uploaded_name?' · '+esc(f.uploaded_name):''}</span>
        <button class="rip-btn rip-att" onclick="_sfzOpenRef('sfz:${esc(f.storage_path)}')">เปิด</button>
        ${canDel?`<button class="rip-btn rip-del" onclick="_ripAttDelete('${esc(f.id)}','${esc(f.storage_path)}','${id}')">ลบ</button>`:''}
      </div>`).join('');
  }catch(e){
    box.innerHTML = '<div style="color:#f87171">โหลดรายการไฟล์ไม่สำเร็จ: '+esc(e.message||'')+'</div>';
  }
}

async function _ripAttUpload(id){
  const inp = document.getElementById('rip-att-file');
  const st  = document.getElementById('rip-att-status');
  const files = Array.prototype.slice.call((inp && inp.files) || []);
  if(!files.length) return;
  if(inp) inp.disabled = true;                       // กันกดซ้ำระหว่างอัปโหลด
  let done=0, fail=0;
  for(const f of files){
    if(st) st.textContent = 'กำลังอัปโหลด '+(done+fail+1)+'/'+files.length+'...';
    try{ await _saUploadStatusImage(id, f); done++; }
    catch(e){ fail++; console.warn('[rip upload]', e); }
  }
  if(inp){ inp.value=''; inp.disabled=false; }
  if(st) st.textContent = 'อัปโหลดสำเร็จ '+done+' ไฟล์'+(fail?(' · ล้มเหลว '+fail+' ไฟล์'):'');
  if(done) logDoc(id,'attachment', null, 'แนบเอกสาร '+done+' ไฟล์');
  _ripAttRender(id);
}

async function _ripAttDelete(rowId, path, docId){
  const ok = await confirmDialog({ title:'⚠️ ลบไฟล์แนบ', message:'ยืนยันลบไฟล์นี้ออกจากงาน?', okLabel:'ลบไฟล์', danger:true });
  if(!ok) return;
  try{
    await sb.storage.from(STORAGE_BUCKET).remove([path]);
    const { error } = await sb.from(ATTACH_TABLE).delete().eq('app_code',WORK_APP_CODE).eq('id',rowId);
    if(error) throw error;
    logDoc(docId,'attachment_deleted', null, 'ลบไฟล์แนบ');
    toast('ลบไฟล์แล้ว','success');
    _ripAttRender(docId);
  }catch(e){ toast('ลบไฟล์ไม่สำเร็จ: '+(e.message||''),'error'); }
}

      .map(l=>{ const sys=_isSysAutoLog(l);
        return { id:l.id, when:l.created_at,
          msg: sys ? _sysAutoMsg(l.note) : (labels[l.action]||l.note||l.action||'—'),   // ระบบ auto → ข้อความสั้น
          note: sys ? '' : (l.note||''),   // auto → ไม่มีรูป/ไม่ประมวลผล note

}

// ADMIN — ลบเอกสาร
async function docDelete(id){
  const d = S.docs.find(x=>x.id===id); if(!d) return;
  if(!canDeleteDoc(d)){ toast('เฉพาะ SUPER ADMIN เท่านั้นที่ลบงานได้','error'); return; }
  const ok = await confirmDialog({
    title:'⚠️ ยืนยันการลบงาน',
    message: S.view==='NEW' ? 'ยืนยันลบงานนี้ออกจากรอรับงาน?' : `คุณต้องการลบงานนี้ใช่หรือไม่<br><br><span style="color:#f87171">การลบจะลบข้อมูลของงานนี้ทั้งหมด และไม่สามารถย้อนกลับได้</span>`,
    okLabel:'ลบงาน', danger:true
  });
  if(!ok) return;
  try{
    // 📝 Audit log ก่อนลบ (document_id=null → รอดการลบ timeline ของงาน) · best-effort
    try{
      const _menuLabel = ({NEW:'🟡 รอรับงาน',RECEIVED:'🔵 ดำเนินตรวจปล่อย',COMPLETED_TODAY:'🟢 ปล่อยเสร็จวันนี้',POSTPONED:'🔴 เลื่อนตรวจปล่อย',EDIT:'🛠 งานแก้ไข',all:'📋 งานทั้งหมด'})[S.view] || S.view;
      await sb.from(LOG_TABLE).insert({
        app_code:WORK_APP_CODE, document_id:null, action:'DELETE_JOB', doc_status:d.doc_status||null,
        user_id:(S.user&&S.user.id)||null, user_name:uname(),
        note:`🗑 DELETE JOB · JOB ${d.doc_no||'—'} · doc_id ${id} · role ${String(S.user&&S.user.role||'')} · เมนู ${_menuLabel}`,
        created_at:new Date().toISOString()
      });
    }catch(_a){ console.warn('[audit]', _a); }
    // 🖼 ลบไฟล์แนบใน storage ของงานนี้ · best-effort
    try{
      const { data:files } = await sb.storage.from(STORAGE_BUCKET).list(`shipping_fz/status/${id}`);
      if(files && files.length){ await sb.storage.from(STORAGE_BUCKET).remove(files.map(f=>`shipping_fz/status/${id}/${f.name}`)); }
    }catch(_s){ console.warn('[storage]', _s); }
    // 🗂 ลบทะเบียนไฟล์แนบของ SHIPPING FZ (ตาราง V2 เท่านั้น)
    try{ await sb.from(ATTACH_TABLE).delete().eq('app_code',WORK_APP_CODE).eq('document_id',id); }catch(_at){ console.warn('[attach]', _at); }
    // 🔄 ลบ timeline ของงาน (ทั้งระบบ + อัปเดตสถานะ)
    await sb.from(LOG_TABLE).delete().eq('app_code',WORK_APP_CODE).eq('document_id',id);
    // 🗑 ลบเอกสารงาน
    const { error } = await sb.from(DOC_TABLE).delete().eq('app_code',WORK_APP_CODE).eq('id',id);
    if(error) throw error;
    closeModal('modal-detail');
    const _i=S.docs.findIndex(x=>x.id===id); if(_i>=0) S.docs.splice(_i,1); _invalidateDocsCache(); renderSidebar(); routeRender();   // #1 ลบ local + ล้าง cache (realtime reconcile) — ไม่ refetch
    toast('ลบงานแล้ว','success');
  }catch(e){ console.error(e); toast('ลบไม่สำเร็จ: '+(e.message||''),'error'); }
}

/* ---------------- graph view ---------------- */
function renderGraph(){
  const docs = S.docs;
  const by = st => docs.filter(d=>d.doc_status===st).length;
  const cnt = { NEW:by('NEW'), RECEIVED:by('RECEIVED'), POSTPONED:by('POSTPONED'), CLEARED:by('CLEARED'), COMPLETED:by('COMPLETED') };
  const total = docs.length;
  const doneToday = docs.filter(d=>d.doc_status==='COMPLETED' && d.completed_at && ymd(d.completed_at)===todayYMD()).length;

  const cards = [
    { cls:'s-all',   label:'เอกสารทั้งหมด', val:total,            foot:'ในระบบ' },
    { cls:'s-wait',  label:'🟡 รอรับงาน',    val:cnt.NEW,          foot:'ยังไม่รับ' },
    { cls:'s-going', label:'🔵 ดำเนินการ',   val:cnt.RECEIVED,     foot:'กำลังตรวจปล่อย' },
    { cls:'s-purple',label:'🛃 ตรวจปล่อยเสร็จ', val:cnt.CLEARED,   foot:'รอปิดงาน' },
    { cls:'s-done',  label:'🟢 ปล่อยเสร็จ',   val:cnt.COMPLETED,    foot:`วันนี้ ${doneToday}` }
  ];

  // by status bar
  const statRows = [
    ['NEW','รอรับงาน'],['RECEIVED','ดำเนินการ'],['POSTPONED','เลื่อนตรวจ'],['CLEARED','ตรวจปล่อย'],['COMPLETED','เสร็จแล้ว']
  ];
  const maxStat = Math.max(1, ...statRows.map(r=>cnt[r[0]]));
  const statBars = statRows.map(([k,lbl])=>{
    const m = stMeta(k); const v=cnt[k]; const w=Math.round(v/maxStat*100);
    return `<div class="bar-line"><div class="bl-lbl">${m.emoji} ${esc(lbl)}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${m.color}"></div></div><div class="bl-val" style="color:${m.color}">${v}</div></div>`;
  }).join('');

  // by terminal bar — นับเฉพาะ 🟢 ปล่อยเสร็จวันนี้ (COMPLETED + completed_at = วันนี้)
  const doneTodayDocs = docs.filter(d=>d.doc_status==='COMPLETED' && d.completed_at && ymd(d.completed_at)===todayYMD());
  const termCounts = {};
  doneTodayDocs.forEach(d=>{ const t=(d.import_terminal||'ไม่ระบุ'); termCounts[t]=(termCounts[t]||0)+1; });
  const termOrder = TERMINALS.map(t=>t[0]);
  const termLabel = v => { const f=TERMINALS.find(t=>t[0]===v); return f?f[1]:v; };
  const termEntries = Object.keys(termCounts)
    .sort((a,b)=>{ const ia=termOrder.indexOf(a), ib=termOrder.indexOf(b); return (ia===-1?999:ia)-(ib===-1?999:ib); })
    .map(k=>[k, termCounts[k]]);
  const maxCat = Math.max(1, ...termEntries.map(e=>e[1]));
  const palette = ['#0EA672','#3B82F6','#F59E0B','#A855F7','#EF4444','#14B8A6','#F97316'];
  const catBars = termEntries.length ? termEntries.map(([v,n],i)=>{
    const col=palette[i%palette.length]; const w=Math.round(n/maxCat*100);
    return `<div class="bar-line"><div class="bl-lbl">🏢 ${esc(termLabel(v))}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${col}"></div></div><div class="bl-val" style="color:${col}">${n}</div></div>`;
  }).join('') : '<div style="color:var(--muted);font-size:13px;padding:8px 2px">ยังไม่มีงานปล่อยเสร็จวันนี้</div>';

  $('view-root').innerHTML = `
    <div class="topbar">
      <div><h1>📊 กราฟงานทั้งหมด</h1><p class="sub">ภาพรวมเอกสารทั้งหมด ${total} รายการ</p></div>
      <div class="topbar-actions"><button class="btn btn-ghost btn-icon" onclick="docRefresh()" title="รีเฟรช"><i data-lucide="refresh-cw"></i></button></div>
    </div>
    <div class="content">
      <div class="stats-grid">
        ${cards.map(c=>`<div class="stat-card ${c.cls}"><div class="label">${esc(c.label)}</div><div class="val">${c.val}</div><div class="foot">${esc(c.foot)}</div></div>`).join('')}
      </div>
      <div class="panel" style="padding:20px">
        <h3 style="margin:0 0 16px;font-size:15px;font-weight:800">🟢 ปล่อยเสร็จวันนี้ — จำแนกตามท่านำเข้า</h3>
        <div class="bar-chart">${catBars}</div>
      </div>
    </div>`;
  refreshIcons();
}

/* ---------------- users view (จัดการผู้ใช้งาน) ---------------- */
const USER_COLS = 'id,username,full_name,display_user,email,department,role,status,avatar_color,password_display,terminals,online,last_seen,created_at,app_code';
const USER_COLS_FALLBACK = 'id,username,full_name,display_user,email,department,role,status,avatar_color,password_display,online,last_seen,created_at,app_code';
const USER_DEPARTMENTS = ['SHIPPING','MASSERGER','OFFICE','ADMIN','ACCOUNT'];
const USER_ROLES = ['STAFF','MESSENGER','SHIPPING','ADMIN','SUPER_ADMIN'];

function _splitTerminals(v){
  if(!v) return [];
  let arr;
  if(Array.isArray(v)) arr=v;
  else{ let t=String(v).trim(); if(!t) return []; if(t[0]==='['){ try{ const a=JSON.parse(t); if(Array.isArray(a)) arr=a; }catch(_){} } if(!arr) arr=[t]; }
  const out=[]; arr.forEach(x=>String(x==null?'':x).split(/[\n,;|]/).forEach(s=>{ s=s.trim(); if(s) out.push(s); })); return out;
}
function _userTerminals(u){ return u?_splitTerminals(u.terminals):[]; }
function _userIsShipping(u){ return u && (String(u.department||'').toUpperCase()==='SHIPPING' || String(u.role||'').toUpperCase()==='SHIPPING'); }

async function loadUsersData(){
  let data=null, error=null;
  ({ data, error } = await sb.from('users').select(USER_COLS).eq('app_code', LOGIN_APP_CODE).order('created_at',{ascending:false}));
  if(error){ // คอลัมน์ terminals อาจยังไม่มี → fallback
    ({ data, error } = await sb.from('users').select(USER_COLS_FALLBACK).eq('app_code', LOGIN_APP_CODE).order('created_at',{ascending:false}));
    if(error) throw error;
  }
  S.users = data || [];
  return S.users;
}

function userRow(u){
  const isSelf = u.id===(S.user&&S.user.id);
  const sup = isSuper();
  const disp = u.display_user || u.full_name || u.username;
  const role = String(u.role||'STAFF').toUpperCase();
  const status = String(u.status||'active').toLowerCase();
  const terms = _userTerminals(u);
  const pwCell = sup
    ? `<span class="pw-cell"><span id="pw-${u.id}" class="pw-mask" style="color:var(--text)">••••••••</span>
       <button class="btn btn-sm btn-ghost btn-icon" title="ดูรหัสผ่าน" onclick="revealPassword('${u.id}')"><i data-lucide="eye"></i></button></span>`
    : `<span class="pw-mask">••••••••</span>`;
  const termCell = terms.length
    ? `<span class="u-terms">${esc(terms.join(', '))}</span>`
    : (_userIsShipping(u) ? '<span class="u-terms none">— ยังไม่กำหนด</span>' : '<span class="u-terms">—</span>');
  return `<tr>
    <td data-l="ชื่อ"><span class="msg-cell"><span class="avatar" style="${u.avatar_color?`background:${esc(u.avatar_color)};box-shadow:none`:''}">${esc(avatarText(disp))}</span><span style="font-weight:600">${esc(disp)}</span></span></td>
    <td data-l="USERNAME" style="color:var(--muted)">@${esc(u.username||'')}</td>
    <td data-l="PASSWORD">${pwCell}</td>
    <td data-l="แผนก">${esc(u.department||'—')}</td>
    <td data-l="บทบาท"><span class="role-badge r-${esc(role)}">${esc(role.replace('_',' '))}</span></td>
    <td data-l="ท่านำเข้า">${termCell}</td>
    <td data-l="สถานะ"><span class="s-${esc(status)}">${esc(status.toUpperCase())}</span></td>
    <td data-l="วันที่สร้าง" style="color:var(--muted);font-size:12px">${fmtDateTime(u.created_at)}</td>
    <td data-l="การจัดการ" class="td-actions"><div class="u-acts" style="justify-content:flex-end">
      ${isSuper() ? (
          (status==='pending' ? `<button class="btn btn-sm btn-primary" onclick="approveUser('${u.id}')"><i data-lucide="check"></i> อนุมัติ</button>` : '')
        + `<button class="btn btn-sm btn-ghost" onclick="openUserEdit('${u.id}')"><i data-lucide="pencil"></i> แก้ไข</button>`
        ) : '<span style="font-size:11.5px;color:var(--muted2)">🔒 อ่านอย่างเดียว</span>'}
    </div></td>
  </tr>`;
}

function revealPassword(id){
  if(!isSuper()){ toast('เฉพาะ SUPER ADMIN เท่านั้น','error'); return; }
  const u = (S.users||[]).find(x=>x.id===id);
  const pw = (u && u.password_display) ? u.password_display : '(ไม่มีข้อมูลรหัสผ่าน)';
  const el = $('pw-'+id);
  if(el){ el.textContent = pw; el.style.color = '#F59E0B'; el.style.letterSpacing='.5px'; }
}

/* 🔒 READ-ONLY: SHIPPING FZ ไม่อนุมัติบัญชีในตาราง users เดิม (ลบ query ออกจากไฟล์แล้ว) */
async function approveUser(id){
  if(!isSuper()){ toast('เฉพาะ SUPER ADMIN เท่านั้นที่อนุมัติบัญชีได้','error'); return; }
  if(_userBusy.has(id)) return;
  _userBusy.add(id);
  try{
    const { error } = await sb.rpc('sfz_admin_update_user', {
      p_actor_id: String((S.user&&S.user.id)||''), p_app_code: LOGIN_APP_CODE,
      p_user_id: String(id), p_status: 'active'
    });
    if(error) throw error;
    toast('อนุมัติบัญชีแล้ว','success');
    await loadUsersData(); renderUsers();
  }catch(e){ toast(_userRpcMsg(e),'error'); }
  finally{ _userBusy.delete(id); }
}

async function syncUsers(btn){
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Sync...'; }
  try{
    const list = await loadUsersData();
    toast(`ซิงค์รายชื่อแล้ว · ${list.length} คน`,'success');
    renderUsers();
  }catch(e){ toast('ซิงค์ไม่สำเร็จ: '+(e.message||''),'error'); }
  finally{ if(btn){ btn.disabled=false; btn.innerHTML='<i data-lucide="refresh-cw"></i> Sync Users'; refreshIcons(); } }
}

          <div style="position:relative">

          </div></div>
        <div class="field"><label>สถานะ</label>

/* 🔒 READ-ONLY: SHIPPING FZ ไม่เพิ่ม/แก้บัญชีในตาราง users เดิม (ลบ query ออกจากไฟล์แล้ว) */
/* แปลง error code จาก RPC เป็นข้อความที่อ่านรู้เรื่อง (ระบุสาเหตุจริง ไม่ใช่ "เพิ่มผู้ใช้ไม่ได้") */
const _userBusy = new Set();
function _userRpcMsg(e){
  const raw = String((e && (e.message || e.details || e.hint)) || '');
  if(/permission_denied/.test(raw))            return 'ไม่มีสิทธิ์: เฉพาะ SUPER ADMIN เท่านั้น (permission_denied)';
  const dup = raw.match(/username_already_exists:?\s*(\S*)/);
  if(dup)                                      return 'Username นี้ถูกใช้แล้ว: '+(dup[1]||'')+' (username_already_exists)';
  const role = raw.match(/invalid_role:?\s*(\S*)/);
  if(role)                                     return 'บทบาทไม่ถูกต้อง: '+(role[1]||'')+' (invalid_role)';
  const st = raw.match(/invalid_status:?\s*(\S*)/);
  if(st)                                       return 'สถานะไม่ถูกต้อง: '+(st[1]||'')+' (invalid_status)';
  const miss = raw.match(/missing_required_field:?\s*(\S*)/);
  if(miss)                                     return 'กรอกข้อมูลไม่ครบ: '+(miss[1]||'')+' (missing_required_field)';
  if(/user_not_found/.test(raw))               return 'ไม่พบบัญชีนี้ (user_not_found)';
  if(/Could not find the function|PGRST202/.test(raw))
    return 'ยังไม่ได้ติดตั้ง RPC จัดการผู้ใช้ — รันไฟล์ sql/030_user_admin_rpc.sql ก่อน';
  return raw || 'บันทึกไม่สำเร็จ';
}

async function saveUser(editId){
  if(!isSuper()){ toast('เฉพาะ SUPER ADMIN เท่านั้นที่จัดการผู้ใช้ได้','error'); return; }
  const full_name = $('u-name').value.trim();
  const username  = $('u-username') ? $('u-username').value.trim() : '';
  const password  = $('u-password') ? $('u-password').value : '';
  const status    = $('u-status').value || 'active';
  const department= $('u-dept').value || null;
  const role      = $('u-role').value || 'STAFF';
  const termsArr  = Array.from(document.querySelectorAll('.u-term-chk:checked')).map(c=>c.value);
  const terminals = termsArr.length ? termsArr.join(', ') : null;

  if(!full_name){ toast('กรอกชื่อ-สกุล','error'); return; }
  if(!editId && !username){ toast('กรอก Username','error'); return; }
  if(!editId && !password){ toast('ตั้งรหัสผ่าน','error'); return; }
  if(USER_ROLES.indexOf(String(role).toUpperCase())<0){ toast('บทบาทไม่ถูกต้อง','error'); return; }

  const key = editId || ('new:'+username);
  if(_userBusy.has(key)) return;                       // กันกดซ้ำ / INSERT ซ้ำ
  _userBusy.add(key);

  const btn=$('u-save'); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> บันทึก...'; }
  try{
    if(editId){
      const { error } = await sb.rpc('sfz_admin_update_user', {
        p_actor_id: String((S.user&&S.user.id)||''), p_app_code: LOGIN_APP_CODE,
        p_user_id: String(editId), p_full_name: full_name, p_department: department,
        p_role: role, p_status: status, p_password: password || null,
        p_terminals: terminals, p_set_terminals: true
      });
      if(error) throw error;
      toast('บันทึกการแก้ไขแล้ว','success');
    }else{
      const colors=['#0EA672','#3B82F6','#A855F7','#F59E0B','#EF4444','#14B8A6','#F97316'];
      const { error } = await sb.rpc('sfz_admin_create_user', {
        p_actor_id: String((S.user&&S.user.id)||''), p_app_code: LOGIN_APP_CODE,
        p_username: username, p_password: password, p_full_name: full_name,
        p_department: department, p_role: role, p_status: status,
        p_terminals: terminals, p_avatar: colors[Math.floor(Math.random()*colors.length)]
      });
      if(error) throw error;
      toast('เพิ่มผู้ใช้สำเร็จ','success');
    }
    closeModal('modal-form');
    _shipSetsCache=null;                               // รายชื่อเปลี่ยน → ล้าง cache map ผู้ใช้
    await loadUsersData();                             // reload เฉพาะรายชื่อผู้ใช้
    renderUsers();
  }catch(e){
    console.error('[saveUser]', e);
    toast(_userRpcMsg(e),'error');
  }finally{
    _userBusy.delete(key);
    if(btn){ btn.disabled=false; btn.innerHTML='<i data-lucide="check"></i> บันทึก'; refreshIcons(); }
  }
}

/* ---------------- boot ---------------- */
async function boot(){
  // 🚫 Environment Gate — file:// = ห้ามเริ่มระบบ ห้าม Login (ต้องเปิดผ่าน SHIPPING FZ.exe เท่านั้น)
  if(SFZ_IS_FILE){ _sfzShowFileGate(); return; }
  // #1 boot รอ DOM + library (Supabase) พร้อมก่อน createClient — กัน defer/network race
  //    (ปกติ deferred scripts รันเสร็จก่อน DOMContentLoaded อยู่แล้ว · loop นี้เป็น safety net)
  const _libT0 = Date.now();
  while(!(window.supabase && window.supabase.createClient)){
    if(Date.now()-_libT0 > 8000){
      console.error('[boot] supabase library not ready');
      showScreen('screen-auth');
      authAlert('โหลดไลบรารีไม่สำเร็จ กรุณารีเฟรชหน้าใหม่','error');
      return;
    }
    await new Promise(r=>setTimeout(r,30));
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth:{ persistSession:false, autoRefreshToken:false }
    });
  }catch(e){
    console.error('[boot] supabase init failed', e);
    showScreen('screen-auth');
    authAlert('โหลดไลบรารีไม่สำเร็จ กรุณารีเฟรชหน้าใหม่','error');
    return;
  }
  /* ลำดับใหม่: ไม่ตรวจฐานข้อมูลก่อน → แสดงหน้า Login ทันที
     การตรวจ Table / Storage / Realtime ย้ายไปทำหลัง Login สำเร็จ (ใน enterApp) */
  _sfzOfflineBar(navigator.onLine===false);
  { const _v=document.getElementById('sfz-ver');
    if(_v && SFZ_ENV==='local') _v.textContent='SHIPPING FZ · v.1.0 · LOCAL';
    if(_v && SFZ_ENV==='file')  _v.textContent='SHIPPING FZ · v.1.0 · FILE'; }
  await _sfzAfterHealth();
}
async function _sfzAfterHealth(){
  _sfzHideHealth();
  const sess = loadSession();
  if(sess && sess.id){
    S.user = sess;
    try{ await enterApp(); }
    catch(e){ console.error(e); showScreen('screen-auth'); }
  }else{
    showScreen('screen-auth');
  }
  refreshIcons();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
