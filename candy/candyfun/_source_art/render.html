  const add = (o, px, py, pz, ry = 0) => { o.position.set(px, py, pz); o.rotation.y = ry; scene.add(o); return o; };
  const hill = (col, px, py, pz, sx, sy, sz) => { const h = mesh(new T.SphereGeometry(1, 64, 40), matte(col, 0.6)); h.scale.set(sx, sy, sz); add(h, px, py, pz); };
  hill(0x6fd44f, 0, -30, 2, 46, 30, 30); hill(0xff6fb6, -15, -10, -14, 16, 13, 12); hill(0xffb347, 15, -11, -16, 17, 14, 12); hill(0x9a7bff, 0, -9, -30, 22, 14, 12);
  add(mountain(0xff5fa8, 2.3), -11, 1.2, -36); add(mountain(0x45c9a5, 2.9), 3, 2.5, -42); add(mountain(0xa070ff, 2.2), 15, 1.5, -38);
  const xs = wide ? [-17, -10, -3.5, 4, 10.5, 17] : [-5.2, 0.4, 5.4, -1.8];

  xs.forEach((px, i) => add(house(hc[i % 6][0], hc[i % 6][1], 0.85 + R() * 0.45), px, -0.25 - Math.abs(px) * 0.02, -3 - (i % 2) * 5 - R() * 2, (R() - 0.5) * 0.7));
  const lc = ['#f2264b', '#ff8412', '#2f9dff', '#9a3df0', '#2fc440', '#ff3f95'];
  for (let i = 0; i < (wide ? 22 : 12); i++) { const px = (R() - 0.5) * (wide ? 44 : 15), pz = 1.5 - R() * 14; add(lolly(lc[i % 6], 1.4 + R() * 1.6, 0.5 + R() * 0.4), px, -0.3, pz, (R() - 0.5)); }
  for (let i = 0; i < (wide ? 8 : 4); i++) add(cane(1.6 + R()), (R() - 0.5) * (wide ? 40 : 13), -0.2, 2.5 - R() * 6, R() * 3);
  for (let i = 0; i < (wide ? 46 : 26); i++) { const gd = mesh(new T.SphereGeometry(0.28 + R() * 0.2, 20, 14, 0, 6.283, 0, 1.7), glossy([0xf2264b, 0xff8412, 0xffcf0d, 0x2fc440, 0x1f8dff, 0x9a3df0][i % 6])); add(gd, (R() - 0.5) * (wide ? 46 : 16), -0.12, 5 - R() * 9); }
  for (let i = 0; i < (wide ? 9 : 6); i++) add(cloud(1.1 + R() * 1.3), (R() - 0.5) * (wide ? 70 : 26), (wide ? 9 : 12) + R() * (wide ? 8 : 16), -22 - R() * 16);

  renderer.render(scene, cam); return renderer.domElement.toDataURL('image/jpeg', 0.95);
};

/* ---------- ตัวการ์ตูนประจำเกม (ออกแบบเอง สไตล์ chibi 3D) ---------- */
function seg(a, b, r, mat) { const A = new T.Vector3(...a), Bv = new T.Vector3(...b), d = Bv.clone().sub(A), len = d.length();
  const m = mesh(new T.CapsuleGeometry(r, len, 10, 20), mat); m.position.copy(A).add(Bv).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize()); return m; }
function character(pose) {
  const g = new T.Group(), win = pose === 'win';
  const skin = new T.MeshPhysicalMaterial({ color: 0xffd3b8, roughness: 0.5, clearcoat: 0.3, envMapIntensity: 0.45 });
  const hair = glossy(0x33201a, { roughness: 0.3, clearcoat: 0.7 }), tee = new T.MeshPhysicalMaterial({ color: 0xa3a6ad, roughness: 0.8, envMapIntensity: 0.35 });
  const dark = glossy(0x2a171c), put = (o, x, y, z, par) => { o.position.set(x, y, z); (par || g).add(o); return o; };
  const head = new T.Group(); head.position.set(0, 2.0, 0);
  const face = mesh(new T.SphereGeometry(1, 64, 48), skin); face.scale.set(1, 0.96, 0.94); head.add(face);
  const cap = mesh(new T.SphereGeometry(1.08, 64, 48, 0, Math.PI * 2, 0, Math.PI * 0.6), hair); cap.rotation.x = -0.55; put(cap, 0, 0.05, -0.08, head);
  for (const s of [-1, 1]) {
    const b = mesh(new T.SphereGeometry(1, 32, 24), hair); b.scale.set(0.62, 0.34, 0.34); b.rotation.z = s * -0.5; put(b, s * 0.47, 0.74, 0.56, head);
    put(seg([s * 0.98, 0.35, 0.3], [s * 1.0, -0.75, 0.38], 0.17, hair), 0, 0, 0, head).position.add(new T.Vector3(0, 0, 0));
    put(seg([s * 0.88, -0.6, 0.2], [s * 0.8, -2.5, 0.42], 0.24, hair), 0, 0, 0, head);
    put(mesh(new T.SphereGeometry(0.11, 16, 12), skin), s * 0.99, -0.08, 0.05, head);
    const bl = mesh(new T.SphereGeometry(0.17, 20, 14), new T.MeshBasicMaterial({ color: 0xff8fa5, transparent: true, opacity: 0.55 })); bl.scale.set(1, 0.6, 0.25); put(bl, s * 0.58, -0.27, 0.74, head);
    const br = seg([s * 0.24, 0.32, 0.9], [s * 0.5, 0.36, 0.82], 0.028, hair); head.add(br);
    if (win) { const e = mesh(new T.TorusGeometry(0.15, 0.045, 10, 24, Math.PI), dark); put(e, s * 0.36, -0.02, 0.88, head); }
    else { const e = mesh(new T.SphereGeometry(0.15, 24, 18), dark); e.scale.set(1, 1.28, 0.55); put(e, s * 0.36, 0.0, 0.85, head);
      put(mesh(new T.SphereGeometry(0.05, 12, 8), new T.MeshBasicMaterial({ color: 0xffffff })), s * 0.36 + 0.05, 0.08, 0.94, head); }
  }
  const back = mesh(new T.CapsuleGeometry(0.78, 2.3, 12, 32), hair); back.scale.set(1.22, 1, 0.5); put(back, 0, -1.35, -0.5, head);
  const sc = mesh(new T.TorusGeometry(0.24, 0.11, 14, 28), glossy(0xff8fc0)); sc.rotation.x = Math.PI / 2 - 0.4; put(sc, 0, 1.06, -0.28, head);
  const tail = new T.CatmullRomCurve3([new T.Vector3(0, 1.05, -0.28), new T.Vector3(0.08, 1.5, -0.42), new T.Vector3(0.42, 1.5, -0.85), new T.Vector3(0.72, 0.8, -1.0), new T.Vector3(0.8, -0.3, -0.9)]);
  head.add(mesh(new T.TubeGeometry(tail, 40, 0.25, 14), hair));
  if (win) { const m = mesh(new T.SphereGeometry(0.17, 24, 16), glossy(0xb3243c)); m.scale.set(1.15, 0.95, 0.4); put(m, 0, -0.4, 0.84, head); }
  else { const m = mesh(new T.TorusGeometry(0.15, 0.036, 10, 24, Math.PI), glossy(0xd43c5c)); m.rotation.z = Math.PI; put(m, 0, -0.3, 0.88, head); }
  head.rotation.set(win ? -0.06 : 0.16, 0, win ? 0.07 : -0.04); g.add(head);
  put(mesh(new T.CylinderGeometry(0.26, 0.3, 0.45, 24), skin), 0, 0.95, 0);
  const torso = mesh(new T.CapsuleGeometry(0.68, 0.9, 14, 32), tee); torso.scale.set(1.14, 1, 0.8); put(torso, 0, 0.0, 0);
  const nk = mesh(new T.TorusGeometry(0.36, 0.07, 10, 28), tee); nk.rotation.x = Math.PI / 2; put(nk, 0, 0.8, 0.02);
  put(mesh(new T.CylinderGeometry(0.8, 0.95, 1.1, 32), tee), 0, -1.25, 0).scale.z = 0.8;
  const belt = mesh(new T.TorusGeometry(0.74, 0.07, 10, 32), glossy(0x6b3d22, { roughness: 0.5 })); belt.rotation.x = Math.PI / 2; belt.scale.y = 0.8; put(belt, 0, -0.72, 0);
  for (const s of [-1, 1]) {
    const sh = [s * 0.82, 0.52, 0], el = win ? [s * 1.3, 1.0, 0.15] : [s * 0.98, -0.32, 0.3], hd = win ? [s * 1.5, 2.0, 0.25] : [s * 0.3, 0.02, 0.88];
    g.add(seg(sh, [sh[0] + (el[0] - sh[0]) * 0.55, sh[1] + (el[1] - sh[1]) * 0.55, sh[2] + (el[2] - sh[2]) * 0.55], 0.24, tee));
    g.add(seg(sh, el, 0.16, skin)); g.add(seg(el, hd, 0.15, skin)); put(mesh(new T.SphereGeometry(0.2, 20, 14), skin), hd[0], hd[1], hd[2]);
  }
  if (!win) { const ph = new T.Group(); ph.add(mesh(new RoundedBoxGeometry(0.56, 0.98, 0.1, 5, 0.08), glossy(0xff8fc0)));
    const scn = mesh(new RoundedBoxGeometry(0.47, 0.88, 0.04, 4, 0.05), glossy(0x1b1622)); scn.position.z = -0.05; ph.add(scn);
    for (const [x, y] of [[-0.12, 0.3], [0.08, 0.3], [-0.12, 0.12]]) { const c = mesh(new T.CylinderGeometry(0.07, 0.07, 0.04, 20), glossy(0x1b1622)); c.rotation.x = Math.PI / 2; c.position.set(x, y, 0.07); ph.add(c); }
    ph.rotation.x = -0.3; put(ph, 0, 0.2, 0.98); }
  return g;
}

  const cam = new T.OrthographicCamera(-hw, hw, cy + hh, cy - hh, 0.1, 50); cam.position.set(0, 0, 12);
