<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NJL SYSTEM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Tahoma", sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    .header {
      background: #102a56;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: .85;
    }

    .container {
      width: min(1200px, calc(100% - 30px));
      margin: 28px auto;
    }

    .department {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .department h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .system-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 12px;
      border-radius: 12px;
      background: #1769e0;
      color: white;
      text-decoration: none;
      font-weight: 700;
      text-align: center;
      transition: .15s ease;
    }

    .system-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(23,105,224,.25);
    }

    .loading,
    .error,
    .empty {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
    }

    .error {
      color: #b42318;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .container {
        width: calc(100% - 20px);
        margin-top: 18px;
      }

      .department {
        padding: 16px;
      }

      .links {
        grid-template-columns: repeat(2, 1fr);
      }

      .system-link {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>NJL SYSTEM</h1>
    <p>ศูนย์รวมระบบ บริษัท เอ็น.เจ. โลจิสติกส์</p>
  </header>

  <main class="container">
    <div id="portal">
      <div class="loading">กำลังโหลดระบบ...</div>
    </div>
  </main>

<script>
const SUPABASE_URL =
  "https://sytgqjglcnsabcszbngg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_e2yN3kPpkQ0dzi-K2EBa8g_hlo1gUYp";

const portal = document.getElementById("portal");

async function loadPortal() {
  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/portal_links" +
      "?select=id,name,url,department,is_active,sort_order" +
      "&is_active=eq.true" +
      "&order=department.asc,sort_order.asc",
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        "โหลดข้อมูลไม่ได้ (" + response.status + ")"
      );
    }

    const rows = await response.json();

    if (!rows.length) {
      portal.innerHTML =
        '<div class="empty">ยังไม่มีระบบที่เปิดใช้งาน</div>';
      return;
    }

    const groups = {};

    rows.forEach(item => {
      if (!groups[item.department]) {
        groups[item.department] = [];
      }

      groups[item.department].push(item);
    });

    portal.innerHTML = "";

    Object.keys(groups).forEach(department => {

      const section = document.createElement("section");
      section.className = "department";

      const title = document.createElement("h2");
      title.textContent = department;

      const links = document.createElement("div");
      links.className = "links";

      groups[department].forEach(item => {

        const link = document.createElement("a");

        link.className = "system-link";
        link.href = item.url;
        link.textContent = item.name;

        links.appendChild(link);
      });

      section.appendChild(title);
      section.appendChild(links);

      portal.appendChild(section);
    });

  } catch (error) {

    console.error(error);

    portal.innerHTML =
      '<div class="error">' +
      'ไม่สามารถโหลดรายการระบบได้<br><br>' +
      error.message +
      '</div>';
  }
}

loadPortal();
</script>

</body>
</html>
