<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NJ LOGISTIC HR — V2</title>
  <meta name="theme-color" content="#101827">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    /* ── Deployment Version ของไฟล์ชุดนี้ ─────────────────────────────
       ทุกครั้งที่ deploy: (1) เปลี่ยนค่านี้ (2) เรียก njhr_version_set ให้ตรงกัน
       version-guard จะเทียบค่านี้กับเซิร์ฟเวอร์ — ไม่ตรง = บังคับโหลดชุดใหม่ */
    window.NJHR_V2_BUILD = 'v2-preview-1';
    /* ── โหมด Preview (ยังไม่ใช่ระบบใช้งานจริง) ─────────────────────────
       PREVIEW = true  : แสดงแถบเตือนทุกหน้า · ห้าม cutover · เปิดเฉพาะผู้ทดสอบ
       WRITE_LOCK = true: ล็อกคำสั่งเขียนข้อมูลธุรกิจจริงทั้งหมด (เพิ่ม/แก้/ลบ/อนุมัติ/ลงเวลา)
                          SUPER_ADMIN ปลดล็อกได้ชั่วคราวรายเซสชันที่หน้า #/system เพื่อทดสอบทีละ Module */
    window.NJHR_V2_PREVIEW = true;
    window.NJHR_V2_WRITE_LOCK = true;
    window.NJHR_SUPABASE_URL = 'https://sytgqjglcnsabcszbngg.supabase.co';
    window.NJHR_SUPABASE_ANON_KEY = 'sb_publishable_e2yN3kPpkQ0dzi-K2EBa8g_hlo1gUYp'; /* publishable key เท่านั้น */
  </script>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <script>
    /* cache-bust CSS ตาม build (URL สาธารณะของแอปไม่เปลี่ยน — เปลี่ยนเฉพาะ query) */
    document.querySelectorAll('link[rel="stylesheet"][href^="styles/"]').forEach(function (l) {
      l.href = l.getAttribute('href') + '?v=' + window.NJHR_V2_BUILD;
    });
  </script>
</head>
<body>
  <div id="v2-app"></div>
  <div id="v2-modal-root"></div>
  <div id="v2-toasts" aria-live="polite"></div>
  <script type="module">
    /* V2 ไม่ลงทะเบียน Service Worker (Phase 2 ตามแผน) — กันปัญหาไฟล์เก่าค้าง
       และห้ามยุ่งกับ SW ของระบบเดิม (scope '/') */
    var bootUrl = new URL('./app/bootstrap.js?v=' + window.NJHR_V2_BUILD, location.href).href;
    if (location.protocol === 'file:') {
      /* V2 เป็น ES Module — เบราว์เซอร์บล็อกการโหลด module ผ่าน file:// เสมอ (ต่างจาก V1 ที่เป็นไฟล์เดียว)
         แจ้งให้ชัดตั้งแต่ต้น ไม่ต้องรอ error ที่อ่านไม่รู้เรื่อง */
      document.getElementById('v2-app').innerHTML =
        '<div style="max-width:640px;margin:60px auto;padding:26px;font-family:Prompt,Tahoma,sans-serif;' +
        'background:#fff;border:1px solid #E5E7EB;border-radius:16px">' +
        '<h2 style="margin:0 0 10px;color:#B80000">ต้องเปิดผ่านเว็บเซิร์ฟเวอร์</h2>' +
        '<p style="color:#111827;margin:0 0 12px">ขณะนี้เปิดจากไฟล์ในเครื่อง (file://) ' +
        'ระบบ HR V2 แยกไฟล์เป็นโมดูล เบราว์เซอร์จึงไม่อนุญาตให้โหลดด้วยวิธีนี้ ' +
        '(ต่างจากระบบเดิม V1 ที่เป็นไฟล์เดียว)</p>' +
        '<div style="background:#F6F7F9;border:1px solid #E5E7EB;border-radius:8px;padding:12px;font-size:13.5px">' +
        '<b>วิธีเปิดที่ถูกต้อง</b><br>① ใช้งานจริง: อัปโหลดโฟลเดอร์นี้ขึ้นโฮสต์ แล้วเปิด ' +
        '<code>https://&lt;โดเมน&gt;/hr-v2/</code><br>' +
        '② ทดสอบในเครื่อง: เปิด Command Prompt ที่โฟลเดอร์ <code>hr-v2</code> พิมพ์ ' +
        '<code>python -m http.server 8080</code> แล้วเปิด <code>http://localhost:8080/</code></div></div>';
    } else {
      import(bootUrl).catch(function (e) { reportBootFailure(bootUrl, e); });
    }

    /* รายงานความผิดพลาดแบบระบุไฟล์จริง: URL · HTTP status · Content-Type · เนื้อหาต้นไฟล์
       (ห้ามแสดงเพียง "Failed to fetch dynamically imported module" ลอย ๆ) */
    function reportBootFailure(url, e) {
      var box = document.getElementById('v2-app');
      var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
      var show = function (extra) {
        box.innerHTML =
          '<div style="max-width:640px;margin:60px auto;padding:26px;font-family:Prompt,Tahoma,sans-serif;' +
          'background:#fff;border:1px solid #E5E7EB;border-radius:16px">' +
          '<h2 style="margin:0 0 10px;color:#B80000">เปิดระบบไม่สำเร็จ</h2>' +
          '<p style="color:#111827;margin:0 0 12px">โหลดไฟล์โปรแกรมไม่สำเร็จ — รายละเอียดสำหรับผู้ดูแลระบบ</p>' +
          '<div style="font-family:monospace;font-size:12px;background:#F6F7F9;border:1px solid #E5E7EB;' +
          'border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all">' +
          'MODULE : app/bootstrap.js\nURL    : ' + esc(url) + '\nERROR  : ' + esc(e && e.message || e) + extra +
          '</div>' +
          '<p style="margin:14px 0 0"><a href="diag.html" style="color:#B80000;font-weight:600">' +
          'เปิดหน้าตรวจการโหลดไฟล์ทั้งหมด (diag.html) →</a></p></div>';
      };
      show('');
      /* ยิงซ้ำแบบ fetch เพื่ออ่านสถานะจริงจากเซิร์ฟเวอร์ */
      fetch(url, { cache: 'no-store' }).then(function (r) {
        return r.text().then(function (t) {
          var ct = r.headers.get('content-type') || '(ไม่มี)';
          var hint = '';
          if (r.status === 404) hint = '\nสาเหตุที่พบบ่อย: ไฟล์ยังไม่ถูกอัปโหลด หรือชื่อโฟลเดอร์/ตัวพิมพ์ไม่ตรง (Linux แยกตัวพิมพ์เล็ก-ใหญ่)';
          else if (/text\/html/i.test(ct) || /^\s*<(!doctype|html)/i.test(t))
            hint = '\nสาเหตุ: เซิร์ฟเวอร์ส่ง index.html แทนไฟล์ .js — ต้องแก้ Rewrite Rule ไม่ให้ rewrite ไฟล์ .js/.css/.json/assets';
          else if (!/javascript|ecmascript/i.test(ct))
            hint = '\nสาเหตุ: Content-Type ของไฟล์ .js ไม่ถูกต้อง ต้องเป็น text/javascript';
          show('\nHTTP   : ' + r.status + ' ' + r.statusText + '\nCT     : ' + ct +
               '\nHEAD   : ' + esc(t.slice(0, 120).replace(/\s+/g, ' ')) + hint);
        });
      }).catch(function (fe) {
        show('\nHTTP   : ยิง fetch ไม่สำเร็จ (' + esc(fe && fe.message) + ') — ตรวจเครือข่าย/โดเมน/HTTPS');
      });
    }
  </script>
</body>
</html>
