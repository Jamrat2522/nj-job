<style>
/* TRANSPORT NJ — NJL TRANSPORT theme */
:root{
  --navy:#0F2B4C;--navy-2:#163A66;--navy-3:#1E4B82;--blue:#1E6FE8;--blue-2:#155FCC;--sky:#E8F1FD;
  --bg:#F3F6FA;--card:#fff;--line:#E3E8EF;--txt:#1B2430;--muted:#66728A;--muted-2:#9AA5B8;
  --green:#1E9E5A;--green-bg:#E6F6EC;--orange:#F08A1E;--orange-bg:#FFF1E0;--red:#D93B3B;--red-bg:#FDE8E8;
  --amber:#D99A06;--amber-bg:#FFF6D9;--teal:#0F9D9A;--teal-bg:#E0F5F4;--purple:#6D4FD6;--purple-bg:#EEEAFB;
  --cyan:#0D8DBF;--cyan-bg:#E0F2FA;--gray:#6B7A90;--gray-bg:#EDF0F4;
  --r:12px;--r-s:8px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sh-2:0 8px 24px rgba(15,43,76,.14);
  --sb-w:224px;--top-h:58px;--f:'Sarabun','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f);font-size:15px;color:var(--txt);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}button{font-family:inherit}input,select,textarea{font-family:inherit;font-size:15px}
h1,h2,h3,h4{margin:0;font-weight:700}h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}.b{font-weight:700}.mono{font-variant-numeric:tabular-nums}
.r{text-align:right}.c{text-align:center}.nowrap{white-space:nowrap}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt1{margin-top:8px}.mt2{margin-top:16px}.mb1{margin-bottom:8px}.mb2{margin-bottom:16px}.ml1{margin-left:8px}
.flex{display:flex;gap:8px;align-items:center}.flex-wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1 1 auto;min-width:0}.col{flex-direction:column;align-items:stretch}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:var(--r-s);padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px;white-space:nowrap;transition:.12s}
.btn:hover{background:#F7F9FC}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-2)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-2)}
.btn-g{background:var(--green);border-color:var(--green);color:#fff}.btn-o{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-r{background:var(--red);border-color:var(--red);color:#fff}.btn-t{background:var(--teal);border-color:var(--teal);color:#fff}.btn-pu{background:var(--purple);border-color:var(--purple);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}.btn-sm{padding:4px 10px;min-height:30px;font-size:13px}.btn-lg{padding:14px 18px;min-height:54px;font-size:17px;border-radius:var(--r)}
.btn-xl{min-height:60px;font-size:18px}.btn-block{width:100%}.btn-icon{width:34px;height:34px;min-height:34px;padding:0;border-radius:8px}
/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:13px;font-weight:600;color:var(--muted)}.field label .req{color:var(--red)}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;background:#fff;min-height:40px;color:var(--txt)}
.inp:focus{outline:2px solid rgba(30,111,232,.25);border-color:var(--blue)}textarea.inp{min-height:70px;resize:vertical}
.inp-lg{min-height:52px;font-size:18px}.inp-xl{min-height:60px;font-size:28px;font-weight:700;text-align:right;letter-spacing:1px}
.form-section{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:#fff}.form-section h4{color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.inline-row{display:flex;gap:8px}.inline-row>*{flex:1}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
/* ---------- layout ---------- */
#app{min-height:100vh}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-3) 60%,#2A62A8 100%)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:28px 24px;box-shadow:var(--sh-2)}
.logo{display:flex;align-items:center;gap:10px;color:var(--navy)}.logo .lg{font-weight:900;font-size:26px;letter-spacing:-1px;background:var(--navy);color:#fff;border-radius:8px;padding:2px 8px}
.logo .t1{font-weight:800;font-size:17px;line-height:1.1}.logo .t2{font-size:10px;letter-spacing:2px;color:var(--muted)}
.shell{display:grid;grid-template-columns:var(--sb-w) 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:12px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.sidebar .logo{color:#fff;padding:6px 8px 14px}.sidebar .logo .lg{background:#fff;color:var(--navy)}.sidebar .logo .t2{color:#B9C6DA}
.nav a{display:flex;align-items:center;gap:10px;color:#D6E0EE;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.08)}.nav a.active{background:#fff;color:var(--navy)}.nav a .ic{width:20px;text-align:center}
.sidebar .foot{margin-top:auto;padding:10px 8px;font-size:12px;color:#B9C6DA}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--top-h);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
.topbar .search{flex:1;max-width:460px;position:relative}.topbar .search .inp{padding-left:34px;min-height:38px}.topbar .search .ic{position:absolute;left:11px;top:9px;color:var(--muted)}
.bell{position:relative}.bell .n{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;font-weight:700}
.user-chip{display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--sky);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800}
.content{padding:16px;flex:1}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}.card-b{padding:14px}.card-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;text-align:center;cursor:pointer;transition:.12s}.stat:hover{box-shadow:var(--sh-2)}
.stat .ic{font-size:20px}.stat .l{font-size:12px;color:var(--muted);min-height:32px;display:flex;align-items:center;justify-content:center;line-height:1.2}.stat .v{font-size:26px;font-weight:800;line-height:1.1}
.stat.active{outline:2px solid var(--blue)}
/* table */
.tbl-wrap{overflow:auto;border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.tbl th{background:#F7F9FC;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;position:sticky;top:0}
.tbl td{padding:8px 10px;border-bottom:1px solid #EEF1F5;vertical-align:middle}.tbl tr:hover td{background:#FAFBFD}.tbl tr.click{cursor:pointer}
.tbl tfoot td{font-weight:700;background:#F7F9FC}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px}
/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.3}
.st-NEW{background:var(--gray-bg);color:var(--gray)}.st-ASSIGNED{background:var(--amber-bg);color:var(--amber)}.st-ACCEPTED{background:var(--teal-bg);color:var(--teal)}
.st-GOING_TO_PICKUP,.st-ARRIVED_PICKUP{background:var(--orange-bg);color:var(--orange)}.st-CONTAINER_PICKED_UP{background:var(--green-bg);color:var(--green)}
.st-GOING_TO_FACTORY{background:var(--purple-bg);color:var(--purple)}.st-ARRIVED_FACTORY,.st-LEAVING_FACTORY{background:var(--sky);color:var(--blue)}
.st-GOING_TO_RETURN,.st-ARRIVED_RETURN{background:var(--cyan-bg);color:var(--cyan)}.st-CONTAINER_RETURNED{background:var(--green-bg);color:var(--green)}
.st-COMPLETED{background:var(--navy);color:#fff}.st-PROBLEM{background:var(--red);color:#fff}.st-CANCELLED{background:#3b4452;color:#fff}
.badge.gray{background:var(--gray-bg);color:var(--gray)}.badge.red{background:var(--red-bg);color:var(--red)}.badge.green{background:var(--green-bg);color:var(--green)}.badge.amber{background:var(--amber-bg);color:var(--amber)}.badge.blue{background:var(--sky);color:var(--blue)}
.gps-ok{color:var(--green);font-weight:600}.gps-stale{color:var(--muted-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:#fff;cursor:pointer}.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* map */

<script>

(function () {

  T.FILE_TYPES = ['B/L', 'Booking', 'ใบรับตู้', 'EIR รับตู้', 'เอกสารโรงงาน', 'POD', 'EIR คืนตู้', 'ใบเสร็จ', 'รูปตู้', 'รูปซีล', 'รูปเลขไมล์', 'รูปปัญหา', 'อื่น ๆ'];

  T.ago = (iso) => { if (!iso) return 'ไม่มี GPS'; const m = Math.max(0, Math.floor((Date.now() + T.server.offsetMs - new Date(iso).getTime()) / 60000)); return m < 1 ? 'GPS น้อยกว่า 1 นาทีที่แล้ว' : m < 60 ? `GPS ล่าสุด ${m} นาทีที่แล้ว` : m < 1440 ? `GPS ล่าสุด ${Math.floor(m / 60)} ชม. ${m % 60} นาทีที่แล้ว` : `GPS ล่าสุด ${Math.floor(m / 1440)} วันที่แล้ว`; };

  /* ---------- toast / loading / modal ---------- */
  T.toast = (msg, type = '', ms = 3200) => { let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); } const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; box.appendChild(el); setTimeout(() => el.remove(), ms); };

  T.confirm = (title, text, okLabel = 'ยืนยัน', cls = 'btn-p') => new Promise((res) => {

  T.prompt = (title, label, placeholder = '') => new Promise((res) => {

  });

  /* ---------- errors ---------- */
  T.parseErr = (e) => { const m = (e && (e.message || e.error)) || String(e); const code = (m.match(/TNJ_[A-Z_]+/) || [])[0]; let text = m; if (code === 'TNJ_VALIDATION') text = m.split('TNJ_VALIDATION:')[1] || m; else if (code === 'TNJ_FORBIDDEN') text = 'คุณไม่มีสิทธิ์ทำรายการนี้'; else if (code === 'TNJ_SESSION_INVALID') text = 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'; else if (code === 'TNJ_MAINTENANCE') text = 'ระบบกำลังอัปเดตเวอร์ชันใหม่'; else if (code === 'TNJ_VERSION_MISMATCH') text = 'เวอร์ชันแอปไม่ตรงกับเซิร์ฟเวอร์'; else if (/Failed to fetch|NetworkError|Load failed/i.test(m)) text = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต'; return { code, text: text.replace(/\s*\(SQLSTATE.*$/, '').trim() }; };
  T.err = (e) => { const p = T.parseErr(e); console.warn('TNJ error', e); if (p.code === 'TNJ_MAINTENANCE') { T.checkVersion(true); return p; } if (p.code === 'TNJ_SESSION_INVALID' || p.code === 'TNJ_VERSION_MISMATCH') { T.logout(true, 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); return p; } if (!p.code && T.isNetErr(e)) T.connError(e); T.toast(p.text, 'err', 4500); return p; };

  /* ---------- RPC ---------- */
  T.rpc = async (fn, args = {}, opt = {}) => {
    if (!opt.silent) T.loading(true);

    finally { if (!opt.silent) T.loading(false); }
  };
  T.auth = (fn, args = {}, opt = {}) => T.rpc(fn, Object.assign({ p_token: T.session ? T.session.token : '' }, args), opt);

  /* ---------- session ---------- */
  T.saveSession = (s) => { T.session = s; try { if (s) localStorage.setItem(C.SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(C.SESSION_KEY); } catch (_) { } };
  T.loadSession = () => { try { const s = JSON.parse(localStorage.getItem(C.SESSION_KEY) || 'null'); if (s && s.token) T.session = s; else if (s) localStorage.removeItem(C.SESSION_KEY); } catch (_) { T.session = null; } return T.session; };
  T.login = async (username, password) => {
    const data = await T.rpc('tnj_login', { p_username: username, p_password: password, p_app_version: null, p_device: (C.APP_VERSION + ' | ' + navigator.userAgent).slice(0, 200) }); // version = info only (never a login gate)

  };
  T.logout = async (silent, msg) => {

  };
  T.applySettings = (d) => { if (!d) return; if (d.gps_interval_sec) T.settings.gps_interval_sec = Number(d.gps_interval_sec); if (d.gps_stale_min) T.settings.gps_stale_min = Number(d.gps_stale_min); if (d.server_time) T.server.offsetMs = new Date(d.server_time).getTime() - Date.now(); };

    $('#connRetry').onclick = async () => { const s = await T.checkVersion(true); if (s.online) { T.toast('เชื่อมต่อฐานข้อมูลได้แล้ว', 'ok'); T.render(); } else T.toast(title, 'err'); };

  /* ---------- version / force update / maintenance ---------- */
  let lastCheck = 0, checking = null;

  T.checkVersion = async (force) => {

  };
  T.clearAppCaches = async () => {

    try { if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.filter((r) => (r.scope || '').includes('/transportnj')).map((r) => r.unregister())); } } catch (_) { }
  };

    T.showMismatch(data);
  };
  T.showMaintenance = (data) => {
    T.saveSession(null); T.session = null; T.stopRealtime();
    const gate = T._gate('maint');

      gate.innerHTML = `<div class="box"><div class="logo" style="justify-content:center;color:#fff"><span class="lg" style="background:#fff;color:var(--navy)">NJ</span><div><div class="t1">TRANSPORT NJ</div><div class="t2" style="color:#B9C6DA">CONTAINER LOGISTICS</div></div></div>
        <h2 style="margin-top:22px">${T.h(data.maintenance_message || 'ระบบกำลังอัปเดตเวอร์ชันใหม่ กรุณาเข้าสู่ระบบอีกครั้งหลังครบ 10 นาที')}</h2>
        <div class="big">${ends ? `${T.pad(mm)}:${T.pad(ss)}` : '--:--'}</div>
        <div class="muted" style="color:#B9C6DA">เวลาที่เหลือ (ตามเวลาเซิร์ฟเวอร์) · เวอร์ชันใหม่ ${T.h(data.version || '')}</div>
        <div class="muted small" style="color:#B9C6DA;margin-top:14px">ระบบจะตรวจสอบและเปิดให้ใช้งานอัตโนมัติ ไม่ต้องกดรีเฟรช</div></div>`;
    };
    draw(); clearInterval(T._timers.maint); T._timers.maint = setInterval(draw, 1000);
    clearInterval(T._timers.maintCheck); T._timers.maintCheck = setInterval(async () => {
      const d = await T.versionStatus(); if (!d) return;
      if (!d.maintenance_active) { clearInterval(T._timers.maint); clearInterval(T._timers.maintCheck); await T.clearAppCaches(); try { sessionStorage.removeItem('tnj.reload.' + d.version); } catch (_) { } location.replace(location.pathname + '?v=' + encodeURIComponent(d.version || Date.now()) + '#/login'); }
      else if (d.maintenance_ends_at !== data.maintenance_ends_at) { data = d; T.showMaintenance(d); }
    }, 15000);
  };
  T.showMismatch = (data) => {
    const gate = T._gate('maint');
    gate.innerHTML = `<div class="box"><div class="logo" style="justify-content:center;color:#fff"><span class="lg" style="background:#fff;color:var(--navy)">NJ</span><div><div class="t1">TRANSPORT NJ</div></div></div>
      <h2 style="margin-top:22px">TRANSPORT NJ เวอร์ชันไม่ตรง</h2>
      <p style="color:#fff;font-size:17px;line-height:1.7">LOCAL VERSION: <b>${T.h(C.APP_VERSION)}</b><br>SERVER VERSION: <b>${T.h(data.version)}</b></p>
      <p style="color:#FDE68A;font-weight:700">กรุณาใช้ LOCAL เวอร์ชันล่าสุด</p>
      <p class="small" style="color:#B9C6DA">ถ้าเพิ่งอัปโหลด Release ใหม่ ผู้ดูแลระบบสูงสุด (SUPER_ADMIN) เข้าสู่ระบบด้านล่างเพื่อประกาศเวอร์ชัน <b style="color:#fff">${T.h(C.APP_VERSION)}</b> — ระบบจะเข้าสู่โหมดปรับปรุง 10 นาทีและบังคับทุกเครื่องโหลดเวอร์ชันใหม่</p>
      <div class="login-card" style="margin:14px auto 0;text-align:left;padding:18px"><div class="field"><label>รหัสพนักงาน (SUPER_ADMIN)</label><input class="inp" id="mmUser" autocomplete="username"></div><div class="field"><label>รหัสผ่าน</label><input class="inp" id="mmPw" type="password" autocomplete="current-password"></div>
      <button class="btn btn-p btn-block" id="mmGo">ประกาศเวอร์ชัน ${T.h(C.APP_VERSION)}</button><div class="c mt1"><button class="btn btn-ghost btn-sm" id="mmReload">โหลดเวอร์ชันล่าสุดจากเซิร์ฟเวอร์</button></div></div></div>`;
    $('#mmReload').onclick = async () => { await T.clearAppCaches(); try { sessionStorage.removeItem('tnj.reload.' + data.version); } catch (_) { } location.replace(location.pathname + '?v=' + Date.now()); };
    $('#mmGo').onclick = async () => {
      try { T.loading(true); const s = await T.rpc('tnj_login', { p_username: $('#mmUser').value.trim(), p_password: $('#mmPw').value, p_app_version: C.APP_VERSION }, { silent: true });
        if (s.role !== 'SUPER_ADMIN') throw new Error('TNJ_FORBIDDEN');
        const r = await T.rpc('tnj_version_set', { p_token: s.token, p_version: C.APP_VERSION, p_maintenance_minutes: 10 }, { silent: true });
        T.toast('ประกาศเวอร์ชันแล้ว ระบบเข้าสู่โหมดปรับปรุง', 'ok'); T.showMaintenance(r);
      } catch (e) { T.toast(T.parseErr(e).text, 'err'); } finally { T.loading(false); }
    };
    clearInterval(T._timers.mmCheck); T._timers.mmCheck = setInterval(async () => { const d = await T.versionStatus(); if (d && (d.maintenance_active || d.version === C.APP_VERSION)) { clearInterval(T._timers.mmCheck); T.checkVersion(true); } }, 20000);
  };
  T._gate = (cls) => { let g = $('#gate'); if (!g) { g = document.createElement('div'); g.id = 'gate'; document.body.appendChild(g); } g.className = cls; g.classList.remove('hidden'); $('#app').classList.add('hidden'); return g; };
  T.hideGate = () => { const g = $('#gate'); if (g) { g.classList.add('hidden'); g.innerHTML = ''; } $('#app').classList.remove('hidden'); clearInterval(T._timers.maint); clearInterval(T._timers.maintCheck); clearInterval(T._timers.mmCheck); };

  /* ---------- realtime (broadcast ping only) ---------- */
  T.subscribe = (topic, handler) => {

  T.getPos = (timeout = 8000) => new Promise((res) => { if (!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), () => res(null), { enableHighAccuracy: true, timeout, maximumAge: 15000 }); });

  /* ---------- files (Edge Function) ---------- */
  T.files = {
    async upload(jobId, file, fileType, timelineId, note) {
      const fd = new FormData(); fd.append('file', file, file.name); fd.append('job_id', jobId); fd.append('file_type', fileType || 'อื่น ๆ'); if (timelineId) fd.append('timeline_id', timelineId); if (note) fd.append('note', note);
      const r = await fetch(C.FILES_FN + '/upload', { method: 'POST', headers: { 'x-tnj-token': T.session.token, apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY }, body: fd });
      const j = await r.json().catch(() => ({ error: 'HTTP ' + r.status })); if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status)); return j;
    },
    async url(id, mode = 'preview') {
      const r = await fetch(`${C.FILES_FN}/url?id=${encodeURIComponent(id)}&mode=${mode}`, { headers: { 'x-tnj-token': T.session.token, apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY } });
      const j = await r.json().catch(() => ({ error: 'HTTP ' + r.status })); if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status)); return j;
    },
    async del(id) {
      const r = await fetch(`${C.FILES_FN}/${encodeURIComponent(id)}`, { method: 'DELETE', headers: { 'x-tnj-token': T.session.token, apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY } });
      const j = await r.json().catch(() => ({ error: 'HTTP ' + r.status })); if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status)); return j;
    },
    // shrink camera photos before upload (≤1600px, JPEG)
    async shrink(file, max = 1600) {
      if (!/^image\/(jpeg|png)$/.test(file.type) || file.size < 400 * 1024) return file;
      try {
        const bmp = await createImageBitmap(file); const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)); if (sc >= 1) return file;
        const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
        const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.85)); return new File([blob], file.name.replace(/\.(png|jpeg)$/i, '.jpg'), { type: 'image/jpeg' });
      } catch (_) { return file; }
    },
    async preview(f) {
      try { const r = await T.files.url(f.id, 'preview'); const isImg = /image/.test(f.mime_type || ''); const isPdf = /pdf/.test(f.mime_type || '');
        if (!isImg && !isPdf) { window.open(r.url, '_blank'); return; }
        T.modal({ title: f.file_name, size: 'w', body: isImg ? `<div class="c"><img src="${r.url}" style="max-width:100%;max-height:75vh;border-radius:8px"></div>` : `<iframe class="prev" src="${r.url}"></iframe>`, foot: `<a class="btn" href="${r.url}" target="_blank" rel="noopener">เปิดแท็บใหม่</a><button class="btn btn-p" data-dl>ดาวน์โหลด</button>`, onOpen: (el) => { el.querySelector('[data-dl]').onclick = () => T.files.download(f); } });
      } catch (e) { T.err(e); }
    },
    async download(f) { try { const r = await T.files.url(f.id, 'download'); const a = document.createElement('a'); a.href = r.url; a.download = f.file_name; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { T.err(e); } },
  };
  T.fileRow = (f, canDel) => `<div class="filebox" data-fid="${f.id}"><div class="fi">${T.fileIcon(f.mime_type, f.file_name)}</div><div class="grow"><div class="b ell">${T.h(f.file_name)}</div><div class="xs muted">${T.h(f.file_type)} · ${T.size(f.size_bytes)} · ${T.h(f.uploaded_by_name || '')} · ${T.fmtDT(f.uploaded_at)}</div></div><div class="flex"><button class="btn btn-sm" data-prev title="ดู">👁</button><button class="btn btn-sm" data-dl title="ดาวน์โหลด">⬇</button>${canDel ? '<button class="btn btn-sm btn-r" data-del title="ลบ">🗑</button>' : ''}</div></div>`;
  T.bindFileRows = (root, files, onDeleted) => {
    T.$$('.filebox', root).forEach((row) => { const f = files.find((x) => x.id === row.dataset.fid); if (!f) return;
      const p = row.querySelector('[data-prev]'); if (p) p.onclick = () => T.files.preview(f);
      const d = row.querySelector('[data-dl]'); if (d) d.onclick = () => T.files.download(f);
      const x = row.querySelector('[data-del]'); if (x) x.onclick = async () => { if (!(await T.confirm('ลบไฟล์', `ลบไฟล์ <b>${T.h(f.file_name)}</b> ?`, 'ลบ', 'btn-r'))) return; try { T.loading(true); await T.files.del(f.id); T.toast('ลบไฟล์แล้ว', 'ok'); onDeleted && onDeleted(); } catch (e) { T.err(e); } finally { T.loading(false); } };
    });
  };
  // upload sheet (shared by office + driver)
  T.uploadDialog = (jobId, opt = {}) => new Promise((resolve) => {
    const types = T.FILE_TYPES.map((t) => `<option ${t === (opt.defaultType || '') ? 'selected' : ''}>${T.h(t)}</option>`).join('');
    const m = T.modal({ title: opt.title || 'แนบไฟล์ / ถ่ายรูป', sheet: opt.sheet, size: 's', body: `
      <div class="field"><label>ประเภทเอกสาร</label><select class="inp inp-lg" id="upType">${types}</select></div>
      <div class="grid g2"><label class="btn btn-lg btn-navy"><span>📷 ถ่ายรูป</span><input type="file" accept="image/*" capture="environment" id="upCam" class="hidden" multiple></label><label class="btn btn-lg"><span>📁 เลือกไฟล์</span><input type="file" accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx,.doc,.docx,image/*,application/pdf" id="upFile" class="hidden" multiple></label></div>
      <div id="upList" class="mt1 small muted"></div><div class="field mt1"><label>หมายเหตุ (ถ้ามี)</label><input class="inp" id="upNote"></div>`,
      foot: `<button class="btn" data-close>ยกเลิก</button><button class="btn btn-p" id="upGo" disabled>อัปโหลด</button>`, onClose: () => resolve(null) });
    let picked = [];
    const show = () => { $('#upList', m.el).innerHTML = picked.map((f) => `• ${T.h(f.name)} (${T.size(f.size)})`).join('<br>') || 'ยังไม่ได้เลือกไฟล์'; $('#upGo', m.el).disabled = !picked.length; };
    const pick = (e) => { picked = picked.concat(Array.from(e.target.files || [])); show(); };
    $('#upCam', m.el).onchange = pick; $('#upFile', m.el).onchange = pick; show();
    $('#upGo', m.el).onclick = async () => {
      const type = $('#upType', m.el).value, note = $('#upNote', m.el).value.trim(); const done = [];
      try { T.loading(true); for (const f of picked) { const g = await T.files.shrink(f); done.push(await T.files.upload(jobId, g, type, opt.timelineId, note)); } T.toast(`อัปโหลด ${done.length} ไฟล์แล้ว`, 'ok'); m.el.remove(); resolve(done); }
      catch (e) { T.err(e); } finally { T.loading(false); }
    };
  });

  /* ---------- router ---------- */
  T.route = () => { const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const seg = path.split('/').filter(Boolean); const q = {}; (qs || '').split('&').forEach((p) => { if (!p) return; const [k, v] = p.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v || ''); }); return { path, seg, q }; };
  T.go = (h) => { if (location.hash === '#/' + h) T.render(); else location.hash = '#/' + h; };
  T.render = async () => {
    const r = T.route(); const app = $('#app');
    if (!T.session) { if (r.path !== 'login') { location.hash = '#/login'; return; } return T.pages.login(app); }
    const isDrv = T.session.role === 'DRIVER';
    if (r.path === 'login' || r.path === '') { location.hash = isDrv ? '#/d/jobs' : '#/jobs'; return; }
    if (isDrv && r.seg[0] !== 'd') { location.hash = '#/d/jobs'; return; }
    if (!isDrv && r.seg[0] === 'd') { location.hash = '#/jobs'; return; }
    T.stopRealtime();
    try { if (isDrv) await T.pages.driver(app, r); else await T.pages.office(app, r); } catch (e) { T.err(e); }
  };

  /* ---------- login page ---------- */
  T.pages.login = (app) => {
    app.innerHTML = `<div class="screen"><div class="login-card"><div class="logo c" style="justify-content:center;margin-bottom:18px"><span class="lg">NJ</span><div><div class="t1">TRANSPORT NJ</div><div class="t2">CONTAINER LOGISTICS</div></div></div>
      <form id="loginForm"><div class="field"><label>รหัสพนักงาน</label><input class="inp inp-lg" id="lgUser" autocomplete="username" autocapitalize="off" required></div>
      <div class="field"><label>รหัสผ่าน</label><input class="inp inp-lg" id="lgPw" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-p btn-lg btn-block" type="submit">เข้าสู่ระบบ</button></form>
      <div class="c xs muted mt2">${location.protocol === 'file:' ? 'โหมด LOCAL (Open check) · ' : /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'โหมด LOCAL (localhost) · ' : ''}เวอร์ชัน ${T.h(C.APP_VERSION)}${T.server.version && T.server.version !== C.APP_VERSION ? ' · server ' + T.h(T.server.version) : ''}</div></div></div>`;
    $('#loginForm').onsubmit = async (e) => { e.preventDefault(); try { const s = await T.login($('#lgUser').value.trim(), $('#lgPw').value); T.toast(`ยินดีต้อนรับ ${s.full_name}`, 'ok'); location.hash = s.role === 'DRIVER' ? '#/d/jobs' : '#/jobs'; } catch (er) { const p = T.parseErr(er); if (p.code === 'TNJ_MAINTENANCE') T.checkVersion(true); else if (!p.code && (T.isNetErr(er) || T.isNotInstalled(er))) { T.connError(er); T.toast(T.isNetErr(er) ? 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้' : 'ฐานข้อมูลยังไม่พร้อม', 'err'); } else T.toast(p.text, 'err'); } };
  };

  /* ---------- boot ---------- */
  T.boot = async () => {
    T.loadSession();
    await T.checkVersion(true);
    if (T.server.maintenance_active) return;
    if (T.session) { try { const d = await T.rpc('tnj_session_check', { p_token: T.session.token }, { silent: true }); T.applySettings(d); T.session = Object.assign({}, T.session, { role: d.role, driver_id: d.driver_id, full_name: d.full_name }); } catch (e) { const p = T.parseErr(e); if (p.code === 'TNJ_MAINTENANCE') { T.checkVersion(true); return; } if (p.code) { T.saveSession(null); T.session = null; if (p.code === 'TNJ_SESSION_INVALID' || p.code === 'TNJ_VERSION_MISMATCH') T.toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'warn', 5000); } else if (T.isNetErr(e) || T.isNotInstalled(e)) T.connError(e); } }
    window.addEventListener('hashchange', () => { T.checkVersion(); T.render(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') T.checkVersion(true); });
    window.addEventListener('focus', () => T.checkVersion());
    window.addEventListener('online', () => { T.checkVersion(true); T.toast('กลับมาออนไลน์แล้ว', 'ok'); });
    window.addEventListener('offline', () => T.toast('ออฟไลน์ — ข้อมูลจะถูกส่งเมื่อกลับมาออนไลน์', 'warn'));
    setInterval(() => T.checkVersion(), C.VERSION_CHECK_SEC * 1000);
    if ('serviceWorker' in navigator && location.protocol !== 'file:') { navigator.serviceWorker.register('sw.js').catch(() => { }); navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'TNJ_NEW_SW') T.checkVersion(true); }); }
    T.render();
  };
  document.addEventListener('DOMContentLoaded', T.boot);
})();

</script>
<script>
/* TRANSPORT NJ — OFFICE (desktop + responsive) */
(function () {
  'use strict';
  if (!window.TNJ) return; // core.js stopped (file:// or libraries failed) — fatal screen already shown
  const T = window.TNJ, h = T.h, $ = T.$, $$ = T.$$;
  const M = { customers: [], drivers: [], vehicles: [], locations: [], at: 0 };
  const isMobile = () => window.innerWidth <= 640;

  async function loadMasters(force) {
    if (!force && Date.now() - M.at < 60000) return M;
    const [c, d, v, l] = await Promise.all(['customers', 'drivers', 'vehicles', 'locations'].map((k) => T.auth('tnj_master_list', { p_kind: k }, { silent: true })));
    Object.assign(M, { customers: c, drivers: d, vehicles: v, locations: l, at: Date.now() }); return M;
  }
  const opts = (arr, val, label, sel, empty = '— เลือก —') => `<option value="">${empty}</option>` + arr.map((x) => `<option value="${h(x[val])}" ${String(x[val]) === String(sel || '') ? 'selected' : ''}>${h(typeof label === 'function' ? label(x) : x[label])}</option>`).join('');
  const stOpts = (sel, list) => (list || T.STATUS).map((s) => `<option value="${s}" ${s === sel ? 'selected' : ''}>${h(T.ST_TH[s])}</option>`).join('');

  const NAV = [
    ['jobs', '🚚', 'งานขนส่ง'], ['mileage', '⛽', 'ไมล์รถ/น้ำมัน'], ['map', '🗺️', 'แผนที่ GPS'],
  ];
  const CARDS = [
    ['total', 'งานทั้งหมดวันนี้', '📋', null], ['waiting', 'รอรับ', '🕒', ['NEW', 'ASSIGNED']], ['going_pickup', 'กำลังไปรับตู้', '🚚', ['ACCEPTED', 'GOING_TO_PICKUP', 'ARRIVED_PICKUP']],
    ['picked', 'รับตู้แล้ว', '📦', ['CONTAINER_PICKED_UP']], ['going_factory', 'กำลังไปโรงงาน', '🏭', ['GOING_TO_FACTORY']], ['arrived_factory', 'ถึงโรงงานแล้ว', '🏢', ['ARRIVED_FACTORY', 'LEAVING_FACTORY']],
    ['returning', 'กำลังคืนตู้', '↩️', ['GOING_TO_RETURN', 'ARRIVED_RETURN']], ['returned', 'คืนตู้แล้ว', '✅', ['CONTAINER_RETURNED']], ['completed', 'เสร็จแล้ว', '🏁', ['COMPLETED']], ['problem', 'มีปัญหา', '⚠️', ['PROBLEM']],
  ];
  const MAP_GROUPS = [['all', 'รถทั้งหมด', '#1E6FE8'], ['running', 'กำลังวิ่ง', '#1E9E5A'], ['pickup', 'รอรับตู้', '#F08A1E'], ['factory', 'ไปโรงงาน', '#1E6FE8'], ['return', 'กำลังคืนตู้', '#0F9D9A'], ['problem', 'มีปัญหา', '#D93B3B']];

  /* ---------- shell ---------- */
  function shell(app, r) {
    if (!$('#officeShell')) {
      app.innerHTML = `<div class="shell" id="officeShell"><aside class="sidebar" id="sb"><div class="logo"><span class="lg">NJ</span><div><div class="t1">TRANSPORT NJ</div><div class="t2">CONTAINER LOGISTICS</div></div></div>
        <nav class="nav" id="nav">${NAV.map(([p, ic, l]) => `<a href="#/${p}" data-nav="${p}"><span class="ic">${ic}</span>${l}</a>`).join('')}</nav>
        <div class="foot">เวอร์ชัน ${h(T.C.APP_VERSION)}<br><span id="rtState">●</span> Realtime</div></aside>
        <div class="main"><header class="topbar"><button class="btn btn-icon" id="sbToggle">☰</button><div class="search"><span class="ic">🔍</span><input class="inp" id="gSearch" placeholder="ค้นหา Job No. / B/L / ลูกค้า / ทะเบียนรถ / คนขับ ..."></div>
          <div class="grow"></div><button class="btn btn-icon bell" id="bell" title="งานมีปัญหา">🔔<span class="n hidden" id="bellN"></span></button>
          <div class="user-chip"><div class="avatar">${h((T.session.full_name || '?').slice(0, 1))}</div><div class="nm"><div class="b small">${h(T.session.full_name)}</div><div class="xs muted">${h(T.session.role)}</div></div><button class="btn btn-sm" id="logoutBtn">ออก</button></div></header>
        <main class="content" id="page"></main></div></div>`;
      $('#logoutBtn').onclick = () => T.logout();
      $('#sbToggle').onclick = () => { $('#sb').classList.toggle('open'); let m = $('.sb-mask'); if ($('#sb').classList.contains('open') && !m) { m = document.createElement('div'); m.className = 'sb-mask'; m.onclick = () => { $('#sb').classList.remove('open'); m.remove(); }; document.body.appendChild(m); } else if (m) m.remove(); };
      $('#nav').onclick = () => { $('#sb').classList.remove('open'); const m = $('.sb-mask'); if (m) m.remove(); };
      $('#gSearch').onkeydown = (e) => { if (e.key === 'Enter') T.go('jobs?q=' + encodeURIComponent(e.target.value.trim())); };
      $('#bell').onclick = () => T.go('jobs?status=PROBLEM');
      refreshBell();
      T.subscribe('tnj:office', (p, ev) => { if (ev === 'problem') { T.toast(`⚠ แจ้งปัญหา ${p.job_no || ''}: ${p.type || ''}`, 'err', 8000); refreshBell(); } if (ev === 'version') T.checkVersion(true); });
    }
    $$('#nav a').forEach((a) => a.classList.toggle('active', r.path === a.dataset.nav || r.path.startsWith(a.dataset.nav + '/')));
    const rt = T._rt['tnj:office']; const rs = $('#rtState'); if (rs) rs.style.color = rt && rt.state === 'SUBSCRIBED' ? '#4ADE80' : '#F59E0B';
    return $('#page');
  }
  async function refreshBell() { try { const d = await T.auth('tnj_dashboard_counts', {}, { silent: true }); const n = $('#bellN'); if (!n) return; n.textContent = d.problem_open; n.classList.toggle('hidden', !d.problem_open); } catch (_) { } }

  T.pages.office = async (app, r) => {
    const page = shell(app, r); const p = r.seg[0] || 'dashboard';
    // keep office channel alive across pages (stopRealtime removed it) — resubscribe
    if (!T._rt['tnj:office']) T.subscribe('tnj:office', (p2, ev) => { if (ev === 'problem') { T.toast(`⚠ แจ้งปัญหา ${p2.job_no || ''}: ${p2.type || ''}`, 'err', 8000); refreshBell(); } if (ev === 'version') T.checkVersion(true); });
    if (p === 'dashboard') return pageDashboard(page, r);
    if (p === 'jobs' && r.seg[1] === 'new') return pageJobForm(page, null);
    if (p === 'jobs' && r.seg[1]) return pageJobDetail(page, r.seg[1], r.q.tab);
    if (p === 'jobs') return pageJobs(page, r);
    if (p === 'map') return pageMap(page);
    if (p === 'schedule') return pageSchedule(page, r);
    if (p === 'mileage') return pageMileage(page, r);
    if (p === 'reports') return pageReports(page, r);
    if (p === 'documents') return pageDocuments(page, r);
    if (p === 'masters') return pageMasters(page, r.seg[1] || 'customers');
    if (p === 'settings') return pageSettings(page);
    page.innerHTML = '<div class="empty">ไม่พบหน้า</div>';
  };

  /* ---------- Leaflet helpers ---------- */
  function mkMap(el, center) { const map = L.map(el, { zoomControl: true }).setView(center || [13.1, 100.9], 9); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map); return map; }
  const truckIcon = (grp, stale) => L.divIcon({ className: 'truck-marker', html: `<div class="tm ${stale ? 'stale' : grp}">🚚</div>`, iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -16] });
  const pinIcon = (color, emo) => L.divIcon({ className: 'truck-marker', html: `<div class="pin" style="background:${color}"><span>${emo}</span></div>`, iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -26] });
  function vehPopup(v) { return `<b>${h(v.license_plate || '-')}</b> ${h(v.vehicle_name || '')}<br>👤 ${h(v.driver_name || '-')}<br>📋 <a href="#/jobs/${v.job_id}">${h(v.job_no)}</a><br>🏢 ${h(v.customer_name)}<br>📦 ${h(v.container_no || '-')}<br>${T.badge(v.status)}<br><span class="${v.gps_stale ? 'gps-stale' : 'gps-ok'}">${h(v.last_gps_at ? T.ago(v.last_gps_at) : 'ไม่มี GPS')}</span>${v.speed != null && !v.gps_stale ? ` · ${Math.round(v.speed * 3.6)} กม./ชม.` : ''}<br><a href="#/jobs/${v.job_id}" class="btn btn-sm btn-p" style="margin-top:6px;color:#fff">เปิด Job Detail</a>`; }
  // live map component (dashboard + full map)
  function liveMap(container, opt = {}) {
    container.innerHTML = `<div class="card"><div class="card-h"><div class="flex"><h3>แผนที่ GPS</h3><span class="muted small" id="lmCount"></span></div><div class="flex flex-wrap" id="lmChips">${MAP_GROUPS.map(([k, l, c]) => `<button class="chip ${k === 'all' ? 'active' : ''}" data-g="${k}"><span class="dot" style="background:${c}"></span>${l}</button>`).join('')}</div></div><div class="map ${opt.tall ? 'tall' : ''}" id="lmMap"></div></div>`;
    const map = mkMap($('#lmMap', container)); const layer = L.layerGroup().addTo(map); let grp = 'all', data = [], fitted = false;
    const draw = () => {
      layer.clearLayers(); const rows = data.filter((v) => v.lat != null && (grp === 'all' || (grp === 'running' ? !v.gps_stale && v.status !== 'PROBLEM' : v.map_group === grp)));
      rows.forEach((v) => L.marker([v.lat, v.lng], { icon: truckIcon(v.map_group, v.gps_stale) }).bindPopup(vehPopup(v)).addTo(layer));
      $('#lmCount', container).textContent = `(รถที่มีงาน ${data.length} คัน · มีตำแหน่ง ${rows.length})`;
      if (!fitted && rows.length) { fitted = true; map.fitBounds(rows.map((v) => [v.lat, v.lng]), { padding: [30, 30], maxZoom: 13 }); }
    };
    $$('#lmChips .chip', container).forEach((b) => b.onclick = () => { grp = b.dataset.g; $$('#lmChips .chip', container).forEach((x) => x.classList.toggle('active', x === b)); draw(); });
    const load = async () => { try { const d = await T.auth('tnj_live_vehicles', {}, { silent: true }); data = d.vehicles; T.server.offsetMs = new Date(d.server_time).getTime() - Date.now(); draw(); } catch (e) { console.warn(e); } };
    load(); T.subscribe('tnj:gps', T.debounce(load, 1500)); T.subscribe('tnj:office', T.debounce(load, 1500)); T.every('livemap', 60000, load);
    return { map, reload: load };
  }

  /* ---------- jobs table (งานหัวลาก) ---------- */
  const isNarrow = () => window.innerWidth <= 768;
  const schedTxt = (j) => j.factory_date ? `${hlDMY(j.factory_date)}${j.factory_time ? ' ' + T.fmtT(j.factory_time) : ''}` : '-';
  const lastSt = (j) => j.tl_status ? `<span class="hl-st-tag">${h(j.tl_status)}</span>` : T.badge(j.status);
  function jobsTable(rows, opt = {}) {
    if (!rows.length) return '<div class="empty">ไม่พบงาน</div>';
    const btn = (j) => `<button type="button" class="btn btn-sm btn-p" data-tlu="${j.id}">อัปเดต Timeline</button>`;
    if (isNarrow()) return `<div class="jc-list">${rows.map((j) => `<div class="jobcard click" data-job="${j.id}"><div class="flex between"><span class="jn" style="font-size:17px">${h(j.job_no)}</span><span class="xs muted">${hlDMY(j.job_date)}</span></div>
      <div class="jc-kv"><span>ลูกค้า</span><b>${h(j.customer_name)}</b><span>B/L</span><b>${h(j.bl_no)}</b><span>เบอร์ตู้</span><b>${h(j.container_no || '-')}</b><span>กำหนดส่ง</span><b>${schedTxt(j)}</b><span>คนขับ</span><b>${h(j.driver_name || '-')}</b><span>สถานะล่าสุด</span><b>${lastSt(j)}</b></div>
      <div class="jc-act">${btn(j)}</div></div>`).join('')}</div>`;
    return `<div class="tbl-wrap"><table class="tbl jobs-tbl"><thead><tr><th>Job No.</th><th>วันที่งาน</th><th>ลูกค้า</th><th>B/L</th><th>เบอร์ตู้</th><th>กำหนดส่ง</th><th>คนขับ</th><th>สถานะล่าสุด</th><th>จัดการ</th></tr></thead><tbody>
      ${rows.map((j) => `<tr class="click" data-job="${j.id}"><td class="b nowrap">${h(j.job_no)}</td><td class="nowrap">${hlDMY(j.job_date)}</td><td class="ell" style="max-width:200px">${h(j.customer_name)}</td><td class="ell" style="max-width:150px">${h(j.bl_no)}</td><td class="nowrap">${h(j.container_no || '-')}</td><td class="nowrap">${schedTxt(j)}</td><td class="ell" style="max-width:150px">${h(j.driver_name || '-')}</td><td class="ell" style="max-width:240px">${lastSt(j)}</td><td class="nowrap">${btn(j)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function bindJobRows(root, onDone) {
    $$('[data-tlu]', root).forEach((b) => b.onclick = (e) => { e.stopPropagation(); hualakDialog(b.dataset.tlu, onDone); });
    $$('[data-job]', root).forEach((el) => el.onclick = (e) => { if (e.target.closest('a,button')) return; T.go('jobs/' + el.dataset.job); });
  }

  /* ---------- Timeline งานหัวลาก (12 สถานะ OFFICE) + Free Time ---------- */
  const HL_STATUS = ['รถถึงโรงงานเรียบร้อย รอคิวลงสินค้า', 'รอคิวลงสินค้า', 'ลงสินค้าได้ครึ่งตู้', 'ลงสินค้าเรียบร้อย ออกจากโรงงาน', 'รอรับตู้เปล่า', 'รถรับตู้หนาแน่น', 'รถติดในท่าเรือ', 'รถติดในลานตู้', 'บรรจุตู้เรียบร้อย ออกจากโรงงาน', 'คืนตู้เรียบร้อย', '⏱️ เกิน Free Time เริ่มคิดค่าเสียเวลา', '✅ ปิดงาน'];
  const HL_CLOSE = '✅ ปิดงาน';
  const FT_END = ['ลงสินค้าเรียบร้อย ออกจากโรงงาน', 'บรรจุตู้เรียบร้อย ออกจากโรงงาน'];
  const FT_HOURS = 4;
  // Asia/Bangkok (+07:00, no DST) — independent of the browser time zone
  const bkk = (v) => { const s = new Date(new Date(v).getTime() + 7 * 3600e3).toISOString(); return { date: s.slice(0, 10), time: s.slice(11, 16) }; };
  function hlDMY(v) { if (!v) return '-'; const [y, m, d] = String(v).slice(0, 10).split('-'); return (y && m && d) ? `${d}/${m}/${y}` : String(v); }
  const hlItems = (job) => (job.timeline || []).filter((t) => t.event_type === 'STATUS' && HL_STATUS.includes(t.title))
    .sort((a, b) => (new Date(a.event_at) - new Date(b.event_at)) || ((a.seq || 0) - (b.seq || 0)));
  function freeTime(job) {
    const base = { hours: FT_HOURS, over_min: 0, end_id: null };
    if (!job.factory_date || !job.factory_time) return Object.assign(base, { state: 'nosched', text: `🆓 Free Time ${FT_HOURS} ชม. | ยังไม่ระบุกำหนดส่ง — ยังคำนวณไม่ได้` });
    const ends = hlItems(job).filter((t) => FT_END.includes(t.title));
    if (!ends.length) return Object.assign(base, { state: 'wait', text: 'รอสถานะจบงานเพื่อคำนวณ Free Time' });
    const end = ends[ends.length - 1]; // latest by real DateTime
    const start = Date.parse(`${String(job.factory_date).slice(0, 10)}T${String(job.factory_time).slice(0, 5)}:00+07:00`);
    const freeEnd = start + FT_HOURS * 3600e3, endAt = new Date(end.event_at).getTime();
    Object.assign(base, { end_id: end.id, end_title: end.title, end_at: end.event_at, free_end: new Date(freeEnd).toISOString() });
    if (endAt <= freeEnd) return Object.assign(base, { state: 'ok', text: `🆓 Free Time ${FT_HOURS} ชม. | ไม่เกินเวลา — ไม่มีค่าใช้จ่าย` });
    const m = Math.floor((endAt - freeEnd) / 60000);
    return Object.assign(base, { state: 'over', over_min: m, text: `🆓 Free Time ${FT_HOURS} ชม. | เกิน ${Math.floor(m / 60)} ชม. ${m % 60} นาที — มีค่าใช้จ่าย` });
  }
  T.freeTime = freeTime;
  function hlHeader(job) {
    return `<div class="hl-hd"><div>ลูกค้า: <b>${h(job.customer_name || '-')}</b> | B/L: <b>${h(job.bl_no || '-')}</b> | ท่านำเข้า: <b>${h(job.pickup_location_text || '-')}</b> | คืนตู้เปล่า: <b>${h(job.return_location_text || '-')}</b></div>
      <div>เบอร์ตู้: <b>${h(job.container_no || '-')}</b> | เบอร์ซีล: <b>${h(job.seal_no || '-')}</b></div>
      <div>กำหนดส่ง: <b>${hlDMY(job.factory_date)}</b> | เวลา: <b>${job.factory_time ? T.fmtT(job.factory_time) : '-'}</b></div>
      <div>คนขับ: <b>${h(job.driver_name || '-')}</b> | หัว/หาง: <b>${h(job.license_plate || '-')} / ${h(job.trailer_plate || '-')}</b> | เบอร์โทร: <b>${job.driver_phone ? `<a href="tel:${h(job.driver_phone)}">${h(job.driver_phone)}</a>` : '-'}</b></div></div>`;
  }
  function hualakTimelineHtml(job, opt = {}) {
    const items = hlItems(job), ft = freeTime(job); const title = '<div class="hl-title">🚛 อัปเดตสถานะงานหัวลาก</div>';
    const ftRow = `<div class="hl-ft ${ft.state}" data-ft="${ft.state}">${h(ft.text)}</div>`;
    let out = '', lastDate = null, first = true;
    items.forEach((t) => {
      const b = bkk(t.event_at);
      if (b.date !== lastDate) { out += `<div class="hl-date">วันที่ ${hlDMY(b.date)}</div>`; lastDate = b.date; if (first && opt.header) out += title + hlHeader(job); first = false; }
      out += `<div class="hl-it" data-hl="${t.id}">${t.title === HL_CLOSE ? `• ${h(t.title)}` : `• ⏰ ${b.time} ${h(t.title)}`}</div>${t.note ? `<div class="hl-note">หมายเหตุ: ${h(t.note)}</div>` : ''}`;
      if (t.id === ft.end_id) out += ftRow;
    });
    if (!items.length) out = (opt.header ? title + hlHeader(job) : '') + '<div class="empty small">ยังไม่มีการอัปเดตสถานะ</div>';
    if (!ft.end_id) out += ftRow;
    return `<div class="hl-tl">${out}</div>`;
  }

  }

    const canEdit = T.canEdit(), admin = T.isAdmin(); const m = job.mileage || {}; let tab = opt.tab || 'info'; let map = null;

      <div class="flex flex-wrap" id="jdActions">${opt.pageMode ? '<a class="btn" href="#/jobs">‹ รายการงาน</a>' : `<a class="btn" href="#/jobs/${job.id}">เปิดหน้าเต็ม</a>`}
        ${canEdit && ['NEW', 'ASSIGNED'].includes(job.status) ? '<button class="btn btn-p" data-act="assign">🚚 สั่งงาน</button>' : ''}
        ${canEdit && !['COMPLETED', 'CANCELLED'].includes(job.status) ? '<button class="btn" data-act="edit">✏️ แก้ไข</button>' : ''}

        ${canEdit && !['COMPLETED', 'CANCELLED'].includes(job.status) ? '<button class="btn btn-r" data-act="cancel">ยกเลิกงาน</button>' : ''}</div></div>
      ${job.status === 'CANCELLED' ? `<div class="alert err">ยกเลิกงาน: ${h(job.cancel_reason || '')} (${T.fmtDT(job.cancelled_at)})</div>` : ''}
      ${job.incomplete_flag ? '<div class="alert warn">⚠ งานจบแล้ว แต่ยังไม่ได้บันทึกไมล์หลัง</div>' : ''}
      <div class="tabs" id="jdTabs">${[['info', 'A. ข้อมูลงาน'], ['gps', 'B. Live GPS'], ['timeline', `C. Timeline (${job.timeline.length})`], ['docs', `D. เอกสาร (${job.files.length})`], ['fuel', 'E. ไมล์ / น้ำมัน'], ['audit', 'ประวัติแก้ไข']].map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'active' : ''}">${l}</button>`).join('')}</div><div id="jdBody"></div>`;

          <div><div class="card card-b mb1"><h3 class="mb1">📍 จุดรับตู้</h3><div class="kv"><div class="k">ท่ารับตู้</div><div class="v">${loc(job.pickup_location_text, job.pickup_loc)}</div><div class="k">วัน/เวลา</div><div class="v">${T.fmtD(job.pickup_date)} ${T.fmtT(job.pickup_time)} น.</div><div class="k">หมายเหตุ</div><div class="v">${h(job.pickup_note || '-')}</div></div></div>

          <div class="card card-b"><h3 class="mb1">↩️ จุดคืนตู้</h3><div class="kv"><div class="k">สถานที่</div><div class="v">${loc(job.return_location_text, job.return_loc)}</div><div class="k">วัน/เวลา</div><div class="v">${T.fmtD(job.return_date)} ${T.fmtT(job.return_time)} น.</div><div class="k">หมายเหตุ</div><div class="v">${h(job.return_note || '-')}</div></div></div></div></div>`;
      } else if (tab === 'gps') {
        body.innerHTML = `<div class="card card-b"><div class="flex between mb1"><div><b>ตำแหน่งรถ</b> <span class="${job.gps_stale ? 'gps-stale' : 'gps-ok'}">${h(job.last_gps_at ? T.ago(job.last_gps_at) : 'ไม่มี GPS')}</span>${job.last_speed != null && !job.gps_stale ? ` · ${Math.round(job.last_speed * 3.6)} กม./ชม.` : ''}</div><div class="flex"><label class="check"><input type="checkbox" id="gpRoute" checked> เส้นทางย้อนหลัง</label><button class="btn btn-sm" id="gpRefresh">รีเฟรช</button></div></div><div class="map" id="jdMap"></div><div id="gpPts" class="small muted mt1"></div></div>`;

      <div class="card card-b"><h3 class="mb1">GPS</h3><div class="field"><label>ส่ง GPS ทุก (วินาที)</label><input type="number" class="inp" id="gpsInt" value="${h(d.settings.gps_interval_sec || 30)}" ${sa ? '' : 'disabled'}></div><div class="field"><label>ถือว่า GPS ขาดหายหลัง (นาที)</label><input type="number" class="inp" id="gpsStale" value="${h(d.settings.gps_stale_min || 5)}" ${sa ? '' : 'disabled'}></div>${sa ? '<button class="btn btn-p" id="gpsSave">บันทึก</button>' : ''}</div></div>
      ${sa ? '<div class="card mt2"><div class="card-h"><h3>ผู้ใช้ / สิทธิ์ (app_code: transport)</h3><button class="btn btn-p btn-sm" id="usAdd">+ เพิ่มผู้ใช้</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์ TRANSPORT NJ</th><th>role เดิม (app_users)</th><th>สถานะ</th><th></th></tr></thead><tbody id="usBody"></tbody></table></div></div>' : ''}`;
    const vg = $('#verGo'); if (vg) vg.onclick = async () => { if (!(await T.confirm('ประกาศเวอร์ชัน', `ประกาศ <b>${h(T.C.APP_VERSION)}</b> — ระบบจะเข้าสู่โหมดปรับปรุง 10 นาที ผู้ใช้ทุกคน (รวมคุณ) จะถูกออกจากระบบและต้อง Login ใหม่หลังครบเวลา`, 'ประกาศ', 'btn-r'))) return; try { const r = await T.auth('tnj_version_set', { p_version: T.C.APP_VERSION, p_maintenance_minutes: 10 }); T.showMaintenance(r); } catch (e) { T.err(e); } };
    const gs = $('#gpsSave'); if (gs) gs.onclick = async () => { try { await T.auth('tnj_settings_set', { p: { gps_interval_sec: $('#gpsInt').value, gps_stale_min: $('#gpsStale').value } }); T.toast('บันทึกแล้ว', 'ok'); } catch (e) { T.err(e); } };
    if (sa) { const ROLES = ['SUPER_ADMIN', 'ADMIN', 'TRANSPORT', 'DRIVER', 'VIEWER']; const loadUsers = async () => { try { const us = await T.auth('tnj_users_list', {}, { silent: true }); $('#usBody').innerHTML = us.map((u) => `<tr><td class="b">${h(u.username)}</td><td>${h(u.full_name || '')}</td><td><span class="badge blue">${h(u.tnj_role)}</span></td><td class="xs muted">${h(u.base_role)}</td><td>${u.is_active ? '<span class="badge green">ใช้งาน</span>' : '<span class="badge gray">ปิด</span>'}</td><td><button class="btn btn-sm" data-u="${u.id}">✏️</button></td></tr>`).join(''); $$('[data-u]', page).forEach((b) => b.onclick = () => uform(us.find((x) => x.id === b.dataset.u))); } catch (e) { T.err(e); } };
      const uform = (u) => T.modal({ title: u ? 'แก้ไขผู้ใช้ ' + u.username : 'เพิ่มผู้ใช้', size: 's', body: `${u ? '' : '<div class="field"><label>ชื่อผู้ใช้ <span class="req">*</span></label><input class="inp" id="uUser" autocapitalize="off"></div>'}<div class="field"><label>ชื่อ-สกุล</label><input class="inp" id="uName" value="${h(u ? u.full_name || '' : '')}"></div><div class="field"><label>รหัสผ่าน ${u ? '(เว้นว่าง = ไม่เปลี่ยน)' : '<span class="req">*</span>'}</label><input class="inp" id="uPw" type="password" autocomplete="new-password"></div><div class="field"><label>สิทธิ์</label><select class="inp" id="uRole">${ROLES.map((r) => `<option ${u && u.tnj_role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>${u ? `<label class="check"><input type="checkbox" id="uAct" ${u.is_active ? 'checked' : ''}> เปิดใช้งาน</label>` : ''}`, foot: `<button class="btn" data-close>ยกเลิก</button><button class="btn btn-p" id="uGo">บันทึก</button>`, onOpen: (el, close) => { $('#uGo', el).onclick = async () => { const p = { id: u ? u.id : null, username: u ? u.username : $('#uUser', el).value.trim(), full_name: $('#uName', el).value.trim(), password: $('#uPw', el).value || null, tnj_role: $('#uRole', el).value, is_active: u ? $('#uAct', el).checked : true }; try { await T.auth('tnj_users_save', { p }); T.toast('บันทึกแล้ว', 'ok'); close(); loadUsers(); } catch (e) { T.err(e); } }; } });
      $('#usAdd').onclick = () => uform(null); loadUsers(); }
  }
})();

</script>
<script>
/* TRANSPORT NJ — DRIVER mobile (minimal UI) + GPS tracker */
(function () {
  'use strict';
  if (!window.TNJ) return; // core.js stopped (file:// or libraries failed) — fatal screen already shown
  const T = window.TNJ, h = T.h, $ = T.$, $$ = T.$$;
  const S = { data: null, at: 0 };

  /* ---------- GPS tracker ---------- */
  const GPS = T.gps = {
    watchId: null, jobId: null, buf: [], timer: null, lastSent: null, lastFix: null, wakeLock: null, status: 'off', QKEY: 'tnj.gpsq',
    start(jobId) {
      if (!navigator.geolocation) { GPS.status = 'unsupported'; return; }
      if (GPS.watchId != null && GPS.jobId === jobId) return;
      GPS.stop(false); GPS.jobId = jobId; GPS.status = 'starting';
      GPS.watchId = navigator.geolocation.watchPosition((p) => { GPS.status = 'on'; GPS.lastFix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, speed: p.coords.speed, heading: p.coords.heading, t: new Date(p.timestamp).toISOString() }; const last = GPS.buf[GPS.buf.length - 1]; if (!last || Date.now() - new Date(last.t).getTime() >= 5000) GPS.buf.push(GPS.lastFix); GPS.draw(); }, (e) => { GPS.status = e.code === 1 ? 'denied' : 'error'; GPS.draw(); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
      clearInterval(GPS.timer); GPS.timer = setInterval(() => GPS.flush(), Math.max(10, T.settings.gps_interval_sec || 30) * 1000);
      GPS.lock(); GPS.draw();
    },
    stop(flush = true) { if (GPS.watchId != null) navigator.geolocation.clearWatch(GPS.watchId); GPS.watchId = null; clearInterval(GPS.timer); GPS.timer = null; if (flush) GPS.flush(); GPS.jobId = null; GPS.status = 'off'; if (GPS.wakeLock) { try { GPS.wakeLock.release(); } catch (_) { } GPS.wakeLock = null; } GPS.draw(); },
    async lock() { try { if ('wakeLock' in navigator && !GPS.wakeLock) { GPS.wakeLock = await navigator.wakeLock.request('screen'); GPS.wakeLock.addEventListener('release', () => { GPS.wakeLock = null; }); } } catch (_) { } },
    queue() { try { return JSON.parse(localStorage.getItem(GPS.QKEY) || '[]'); } catch (_) { return []; } },
    async flush() {
      if (!T.session) return;
      let q = GPS.queue(); if (GPS.buf.length && GPS.jobId) { q.push({ job_id: GPS.jobId, points: GPS.buf.splice(0, GPS.buf.length) }); }
      if (!q.length) return; try { localStorage.setItem(GPS.QKEY, JSON.stringify(q.slice(-200))); } catch (_) { }
      if (!navigator.onLine) return;
      const rest = [];
      for (const item of q) { try { await T.rpc('tnj_gps_insert', { p_token: T.session.token, p_job_id: item.job_id, p_points: item.points }, { silent: true }); GPS.lastSent = Date.now(); } catch (e) { const p = T.parseErr(e); if (!p.code || p.code === 'TNJ_MAINTENANCE' || p.code === 'TNJ_SESSION_INVALID' || p.code === 'TNJ_VERSION_MISMATCH') { rest.push(item); if (p.code) { T.err(e); break; } } } }
      try { if (rest.length) localStorage.setItem(GPS.QKEY, JSON.stringify(rest.slice(-200))); else localStorage.removeItem(GPS.QKEY); } catch (_) { }
      GPS.draw();
    },
    draw() { const el = $('#gpsBar'); if (!el) return; const q = GPS.queue().length; const txt = GPS.status === 'on' ? `GPS ทำงาน · ส่งล่าสุด ${GPS.lastSent ? T.fmtTime(new Date(GPS.lastSent)) : '-'}${q ? ` · รอส่ง ${q}` : ''}` : GPS.status === 'denied' ? 'ไม่ได้รับอนุญาตใช้ตำแหน่ง — เปิด Location ให้เว็บนี้' : GPS.status === 'starting' ? 'กำลังหาสัญญาณ GPS...' : GPS.status === 'unsupported' ? 'อุปกรณ์ไม่รองรับ GPS' : GPS.status === 'error' ? 'หาสัญญาณ GPS ไม่ได้' : 'GPS ปิด (ไม่มีงานที่กำลังทำ)'; el.innerHTML = `<span class="${GPS.status === 'on' ? 'dot-live' : 'dot-off'}"></span><span class="grow">${h(txt)}</span>${GPS.status === 'on' ? '<span class="xs muted">เปิดหน้านี้ค้างไว้ขณะวิ่งงาน</span>' : ''}`; },
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && GPS.jobId) { GPS.lock(); GPS.flush(); } });
  window.addEventListener('online', () => GPS.flush());

  /* ---------- data ---------- */
  async function loadJobs(force) {
    if (!force && S.data && Date.now() - S.at < 5000) return S.data;
    S.data = await T.auth('tnj_driver_jobs', {}, { silent: true }); S.at = Date.now(); T.server.offsetMs = new Date(S.data.server_time).getTime() - Date.now();
    if (S.data.gps_interval_sec) T.settings.gps_interval_sec = S.data.gps_interval_sec;
    const a = S.data.active; if (a && T.ACTIVE.has(a.status)) GPS.start(a.id); else if (GPS.jobId) GPS.stop(true);
    return S.data;
  }
  async function getJob(id) { const d = await loadJobs(); if (d.active && d.active.id === id) return d.active; return T.auth('tnj_job_get', { p_job_id: id }, { silent: true }); }

  /* ---------- shell ---------- */
  function shell(app, title, back, nav) {
    app.innerHTML = `<div class="drv"><header class="drv-top">${back ? `<button class="back" data-back>‹</button>` : '<span style="width:36px"></span>'}<h2>${title}</h2><span style="width:36px"></span></header><div class="gpsbar" id="gpsBar"></div><div class="drv-body" id="dbody"></div>
      <nav class="drv-nav">${[['d/jobs', '📋', 'งานของฉัน'], ['d/map', '🗺️', 'แผนที่'], ['d/docs', '📁', 'เอกสาร'], ['d/profile', '👤', 'โปรไฟล์']].map(([p, ic, l]) => `<a href="#/${p}" class="${nav === p ? 'active' : ''}"><span class="ic">${ic}</span>${l}</a>`).join('')}</nav></div>`;
    const b = $('[data-back]', app); if (b) b.onclick = () => T.go(back); GPS.draw(); return $('#dbody', app);
  }
  T.pages.driver = async (app, r) => {
    const p = r.seg[1] || 'jobs';
    if (!T._rt['tnj:driver:' + T.session.driver_id]) T.subscribe('tnj:driver:' + T.session.driver_id, (pl, ev) => { S.at = 0; if (ev === 'job' && pl.event === 'assigned') { T.toast('🔔 มีงานใหม่มอบหมายให้คุณ', 'ok', 6000); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (_) { } } if (pl.event === 'cancelled') T.toast('งานถูกยกเลิก', 'warn', 6000); T.render(); });
    if (p === 'jobs' && r.seg[2]) return pageJob(app, r.seg[2], r.q.tab);
    if (p === 'jobs') return pageJobs(app);
    if (p === 'map') return pageMap(app);
    if (p === 'docs') return pageDocs(app);
    if (p === 'profile') return pageProfile(app);
    T.go('d/jobs');
  };

  /* ---------- pages ---------- */
  const card = (j, active) => `<div class="jobcard"><div class="flex between"><span class="jn">${h(j.job_no)}</span>${T.badge(j.status)}</div>
    <div class="mt1"><b>${h(j.customer_name)}</b><div class="small muted">B/L: ${h(j.bl_no)} · ตู้: ${h(j.container_no || '-')} ${h(j.container_size || '')}</div></div>
    <div class="pt"><div class="ic a">📍</div><div><div class="l">ท่ารับตู้ · ${T.fmtD(j.pickup_date)} ${T.fmtT(j.pickup_time)} น.</div><div class="v">${h(j.pickup_location_text)}</div></div></div>
    <div class="pt"><div class="ic b">🏭</div><div><div class="l">โรงงาน${j.factory_date ? ' · ' + T.fmtD(j.factory_date) + ' ' + T.fmtT(j.factory_time) : ''}</div><div class="v">${h(j.factory_location_text)}</div></div></div>
    <div class="pt" style="border:0"><div class="ic c">↩️</div><div><div class="l">จุดคืนตู้ · ${T.fmtD(j.return_date)} ${T.fmtT(j.return_time)} น.</div><div class="v">${h(j.return_location_text)}</div></div></div>
    ${j.pickup_note || j.job_note ? `<div class="alert info mt1 small">${h(j.job_note || '')} ${h(j.pickup_note || '')}</div>` : ''}
    <div class="grid g2 mt1">${active ? `<a class="btn btn-lg btn-p" href="#/d/jobs/${j.id}">ดูรายละเอียด</a><button class="btn btn-lg btn-g" data-next="${j.id}">${nextLabel(j)}</button>` : `<a class="btn btn-lg" href="#/d/jobs/${j.id}">ดูรายละเอียด</a><button class="btn btn-lg btn-g" data-accept="${j.id}">✅ รับงาน</button>`}</div></div>`;
  const nextLabel = (j) => { if (j.status === 'PROBLEM') return '⚠ แจ้งปัญหาอยู่'; const n = T.nextStatus(j.status); return n ? `${T.ST_BTN[n][1]} ${T.ST_BTN[n][0]}` : 'อัปเดต Timeline'; };

  async function pageJobs(app) {
    const body = shell(app, 'งานของฉัน', null, 'd/jobs'); body.innerHTML = '<div class="empty">กำลังโหลด...</div>';
    let d; try { d = await loadJobs(true); } catch (e) { body.innerHTML = `<div class="empty">${h(T.parseErr(e).text)}</div>`; T.err(e); return; }
    body.innerHTML = `${d.active ? `<h3 class="mb1">งานปัจจุบัน</h3>${card(d.active, true)}` : '<div class="card card-b c muted mb2">ยังไม่มีงานที่กำลังทำ</div>'}
      <h3 class="mb1">งานรอรับ (${d.assigned.length})</h3>${d.assigned.map((j) => card(j, false)).join('') || '<div class="card card-b c muted mb2">ไม่มีงานรอรับ</div>'}
      ${d.recent.length ? `<h3 class="mb1 mt2">งานล่าสุด</h3>${d.recent.map((j) => `<a class="card card-b flex between mb1" href="#/d/jobs/${j.id}" style="color:inherit"><span><b>${h(j.job_no)}</b> <span class="small muted">${h(j.customer_name)}</span></span>${T.badge(j.status)}</a>`).join('')}` : ''}`;
    $$('[data-accept]', body).forEach((b) => b.onclick = () => accept(b.dataset.accept));
    $$('[data-next]', body).forEach((b) => b.onclick = () => statusSheet(d.active, () => T.render()));
    T.every('drvjobs', 30000, () => { S.at = 0; T.render(); });
  }
  async function accept(id) {
    if (!(await T.confirm('รับงาน', 'ยืนยันรับงานนี้? ระบบจะบันทึกเวลา ตำแหน่ง และเริ่มส่ง GPS', 'รับงาน', 'btn-g'))) return;
    try { T.loading(true); const pos = await T.getPos(); const j = await T.auth('tnj_driver_accept', { p_job_id: id, p_lat: pos && pos.lat, p_lng: pos && pos.lng, p_acc: pos && pos.acc }, { silent: true }); T.toast('รับงานแล้ว ✅', 'ok'); S.at = 0; GPS.start(j.id); T.go('d/jobs/' + j.id); } catch (e) { T.err(e); } finally { T.loading(false); }
  }

  async function pageJob(app, id, tab) {
    const body = shell(app, '', 'd/jobs', 'd/jobs'); body.innerHTML = '<div class="empty">กำลังโหลด...</div>';
    let j; try { j = await getJob(id); } catch (e) { body.innerHTML = `<div class="empty">${h(T.parseErr(e).text)}</div>`; return; }
    $('.drv-top h2', app).innerHTML = `${h(j.job_no)}<div class="xs" style="font-weight:400">${h(T.ST_TH[j.status])}</div>`;
    const active = T.ACTIVE.has(j.status), assigned = j.status === 'ASSIGNED', closed = ['COMPLETED', 'CANCELLED'].includes(j.status); const m = j.mileage || {};
    tab = tab || 'info';
    const reload = () => { S.at = 0; pageJob(app, id, tab); };
    body.innerHTML = `${j.status === 'PROBLEM' ? '<div class="alert err">⚠ งานอยู่ในสถานะมีปัญหา — เมื่อแก้ไขแล้วกด "แก้ไขปัญหาแล้ว" เพื่อทำงานต่อ</div>' : ''}
      <div class="tabs" id="dtabs">${[['info', 'ข้อมูลงาน'], ['tl', `Timeline (${j.timeline.length})`], ['docs', `เอกสาร (${j.files.length})`], ['fuel', 'ไมล์/น้ำมัน']].map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'active' : ''}">${l}</button>`).join('')}</div><div id="dtb"></div>
      ${closed ? '' : `<div class="bigbtns">
        <button class="btn btn-navy" data-a="map"><span class="ic">🗺️</span>เปิดแผนที่</button>
        ${assigned ? '<button class="btn btn-g" data-a="accept"><span class="ic">✅</span>รับงาน</button>' : j.status === 'PROBLEM' ? '<button class="btn btn-g" data-a="resolve"><span class="ic">✅</span>แก้ไขปัญหาแล้ว</button>' : '<button class="btn btn-p" data-a="status"><span class="ic">📝</span>อัปเดต Timeline</button>'}
        <button class="btn btn-o" data-a="mile" ${assigned ? 'disabled' : ''}><span class="ic">⛽</span>${!m.start_mileage ? 'บันทึกไมล์ก่อน' : !m.end_mileage ? 'บันทึกไมล์หลัง' : 'ไมล์ / น้ำมัน'}</button>
        <button class="btn" data-a="docs"><span class="ic">📷</span>ถ่ายรูป / แนบไฟล์</button>
        <button class="btn btn-r" data-a="problem" ${assigned ? 'disabled' : ''}><span class="ic">⚠️</span>แจ้งปัญหา</button>
        <button class="btn" data-a="fuel" ${assigned ? 'disabled' : ''}><span class="ic">🛢️</span>เติมน้ำมัน</button></div>`}`;
    const tb = $('#dtb', body);
    const draw = () => {
      if (tab === 'info') tb.innerHTML = `<div class="jobcard"><div class="kv"><div class="k">ลูกค้า</div><div class="v">${h(j.customer_name)}</div><div class="k">B/L</div><div class="v">${h(j.bl_no)}</div><div class="k">Container</div><div class="v">${h(j.container_no || '-')} ${h(j.container_size || '')}</div><div class="k">Seal</div><div class="v">${h(j.seal_no || '-')}</div><div class="k">รถ</div><div class="v">${h(j.license_plate || '-')}</div></div>
        <div class="pt mt1"><div class="ic a">📍</div><div class="grow"><div class="l">ท่ารับตู้ · ${T.fmtD(j.pickup_date)} ${T.fmtT(j.pickup_time)} น.</div><div class="v">${h(j.pickup_location_text)}</div>${j.pickup_note ? `<div class="small muted">${h(j.pickup_note)}</div>` : ''}</div><a class="btn btn-sm" target="_blank" rel="noopener" href="${T.mapsUrl(j.pickup_loc, j.pickup_location_text)}">🧭</a></div>
        <div class="pt"><div class="ic b">🏭</div><div class="grow"><div class="l">โรงงาน · ${j.factory_date ? T.fmtD(j.factory_date) + ' ' + T.fmtT(j.factory_time) : '-'}</div><div class="v">${h(j.factory_location_text)}</div>${j.factory_contact || j.factory_phone ? `<div class="small">${h(j.factory_contact || '')} ${j.factory_phone ? `<a href="tel:${h(j.factory_phone)}">📞 ${h(j.factory_phone)}</a>` : ''}</div>` : ''}${j.factory_note ? `<div class="small muted">${h(j.factory_note)}</div>` : ''}</div><a class="btn btn-sm" target="_blank" rel="noopener" href="${T.mapsUrl(j.factory_loc, j.factory_location_text)}">🧭</a></div>
        <div class="pt" style="border:0"><div class="ic c">↩️</div><div class="grow"><div class="l">จุดคืนตู้ · ${T.fmtD(j.return_date)} ${T.fmtT(j.return_time)} น.</div><div class="v">${h(j.return_location_text)}</div>${j.return_note ? `<div class="small muted">${h(j.return_note)}</div>` : ''}</div><a class="btn btn-sm" target="_blank" rel="noopener" href="${T.mapsUrl(j.return_loc, j.return_location_text)}">🧭</a></div>${j.job_note ? `<div class="alert info small mt1">${h(j.job_note)}</div>` : ''}</div>`;
      else if (tab === 'tl') tb.innerHTML = `<div class="jobcard">${j.timeline.length ? `<ul class="tl">${j.timeline.map((t) => `<li class="${h(t.event_type)}"><div class="flex"><span class="t">${T.fmtTime(t.event_at)}</span><span class="ttl">${h(t.title)}</span></div><div class="meta">${T.fmtD(t.event_at)} · ${h(t.actor_name || '')}${t.files && t.files.length ? ' · 📎 ' + t.files.length : ''}</div>${t.note || t.problem_detail ? `<div class="note">${h(t.note || t.problem_detail)}</div>` : ''}</li>`).join('')}</ul>` : '<div class="empty">ยังไม่มี Timeline</div>'}</div>`;

    const body = shell(app, 'โปรไฟล์', null, 'd/profile'); const q = GPS.queue().length;
    body.innerHTML = `<div class="jobcard c"><div class="avatar" style="width:64px;height:64px;font-size:28px;margin:0 auto 8px">${h((T.session.full_name || '?').slice(0, 1))}</div><h3>${h(T.session.full_name)}</h3><div class="muted small">${h(T.session.username)} · คนขับ</div></div>
      <div class="jobcard"><div class="kv"><div class="k">สถานะ GPS</div><div class="v">${h(GPS.status)}</div><div class="k">รอส่ง GPS</div><div class="v">${q} ชุด</div><div class="k">ส่ง GPS ทุก</div><div class="v">${T.settings.gps_interval_sec} วินาที</div><div class="k">เวอร์ชันแอป</div><div class="v">${h(T.C.APP_VERSION)}</div><div class="k">เซิร์ฟเวอร์</div><div class="v">${h(T.server.version || '-')}</div></div><button class="btn btn-block mt1" id="pfSync">🔄 ส่ง GPS ที่ค้างอยู่</button></div>
      <div class="alert info small">คำแนะนำ: ขณะวิ่งงานให้เปิดหน้าแอปค้างไว้ (หน้าจอไม่ล็อก) เพื่อให้ส่ง GPS ต่อเนื่อง หากปิดหน้าจอ GPS อาจหยุดส่งชั่วคราวและจะส่งต่อเมื่อเปิดแอปอีกครั้ง</div>
      <button class="btn btn-lg btn-block btn-r" id="pfOut">ออกจากระบบ</button>`;
    $('#pfSync', body).onclick = async () => { await GPS.flush(); T.toast('ส่งแล้ว', 'ok'); T.render(); };
    $('#pfOut', body).onclick = async () => { if (await T.confirm('ออกจากระบบ', 'GPS จะหยุดส่งเมื่อออกจากระบบ', 'ออกจากระบบ', 'btn-r')) { GPS.stop(true); T.logout(); } };
  }
})();

</script>
</body>
</html>
