// หน้าต่างรายงานผล (เปิดอัตโนมัติเมื่อพบ NW>GW) — แสดงเฉพาะ ITEM | NW | GW | ผลการตรวจสอบ
function schwShowErrorModal(){
  const errs=SCHW.results.filter(r=>r.isError);
  if(!errs.length) return;
  const fnum=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:3});
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="width:min(560px,94vw);max-height:88vh;display:flex;flex-direction:column;background:#1c2128;border:1px solid #30363d;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5)">

function exportSchwErrors(){
  const errs=SCHW.results.filter(r=>r.isError);
  if(!errs.length){ toast('ไม่มีรายการผิดให้ Export','err'); return; }
  const head=['ITEM','Sheet','Row','Invoice','Product Code','Description','NW','GW','Difference'];
  const ws={}; const thin={style:'thin',color:{rgb:'B0B0B0'}}; const border={top:thin,bottom:thin,left:thin,right:thin};
  head.forEach((h,ci)=>ws[XLSX.utils.encode_cell({r:0,c:ci})]={t:'s',v:h,s:{font:{name:'Tahoma',sz:11,bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'C0392B'}},alignment:{horizontal:'center',vertical:'center'},border}});
  errs.forEach((r,ri)=>{ const R=ri+1;
    const vals=[r.item,r.sheet,r.excelRow,r.invoice,r.product,r.desc,r.nw,r.gw,r.diff];
    vals.forEach((v,ci)=>{ const ref=XLSX.utils.encode_cell({r:R,c:ci}); let cell;
      if(ci===2){ cell={t:'n',v:Number(v)||0}; }
      else if(ci>=6){ cell={t:'n',v:Number(v)||0,z:'#,##0.000'}; }
      else cell={t:'s',v:String(v==null?'':v)};
      cell.s={font:{name:'Tahoma',sz:10},alignment:{vertical:'center',wrapText:(ci===5)},border};
      ws[ref]=cell; });
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:errs.length,c:8}});
  ws['!cols']=[{wch:8},{wch:12},{wch:10},{wch:14},{wch:20},{wch:38},{wch:12},{wch:12},{wch:14}];
  ws['!rows']=[{hpt:26}];
  ws['!autofilter']={ref:'A1:I'+(errs.length+1)};
  ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  const now=new Date(); const ts=now.getFullYear()+_ancaPad2(now.getMonth()+1)+_ancaPad2(now.getDate())+'_'+_ancaPad2(now.getHours())+_ancaPad2(now.getMinutes())+_ancaPad2(now.getSeconds());
  const fname=`SCH_WEIGHT_ERROR_${ts}.xlsx`; XLSX.writeFile(wb,fname);
  toast(`Export สำเร็จ · ${errs.length} รายการผิด · ${fname}`,'ok');
}
function resetSchwFiles(){ SCHW.files=[]; SCHW.results=[]; SCHW.page=1; SCHW.filter='err'; SCHW.search=''; schwRenderView(); toast('ล้างข้อมูลแล้ว','info'); }

function sigParseWorkbook(name, arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array',cellDates:true});
  const findSheet=re=>wb.SheetNames.find(n=>re.test(n));
  const invSn=findSheet(/invoice/i)||wb.SheetNames[0];
  const pkSn=findSheet(/packing/i);
  const inv=sigParseInvoice(XLSX.utils.sheet_to_json(wb.Sheets[invSn],{header:1,raw:true,defval:''}));
  const pack=pkSn?sigParsePacking(XLSX.utils.sheet_to_json(wb.Sheets[pkSn],{header:1,raw:true,defval:''})):{};
  return { name, inv, pack };
}
function sigParseInvoice(aoa){
  const flat=aoa.map(r=>r.map(c=>String(c==null?'':c)));
  let invoiceNo='',date=null,inland=null,brand='SIG COMBIBLOC',origin='',dest='',mark='As address';
  aoa.forEach(r=>{ r.forEach(c=>{ const s=String(c==null?'':c);
    let m;
    if(!invoiceNo&&(m=s.match(/invoice\s*no\.?\s*:?\s*([0-9]{5,})/i))) invoiceNo=m[1];
    if(!date&&(m=s.match(/date\s*:?\s*([A-Za-z]{3,}\.?\s+\d{1,2},?\s+\d{4})/i))){ const d=new Date(m[1].replace(/\./,'')); if(!isNaN(d)) date=new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
    if((m=s.match(/brand of goods\s*:?\s*(.+)/i))) brand=m[1].trim();
    if(!origin&&(m=s.match(/country of origin[^:]*:\s*([A-Za-z]+)/i))) origin=normalizeCountry(m[1])||m[1];
  }); });
  // inland charge
  for(let i=0;i<aoa.length;i++){ if(aoa[i].some(c=>/INLAND CHARGE/i.test(String(c)))){ const nums=aoa[i].map(sigNum).filter(v=>v!=null); if(nums.length) inland=ancaRound2(nums[nums.length-1]); break; } }
  // purchase country: หา country name ในบล็อกที่อยู่ผู้รับ (ไม่ใช่ Thailand)
  for(const r of aoa){ for(const c of r){ const cc=normalizeCountry(String(c==null?'':c).trim()); if(cc && cc!=='TH'){ dest=cc; break; } } if(dest) break; }
  // shipping mark
  for(let i=0;i<aoa.length;i++){ if(aoa[i].some(c=>/Shipping Marks/i.test(String(c)))){ for(let j=i+1;j<Math.min(i+5,aoa.length);j++){ const v=String(aoa[j][0]==null?'':aoa[j][0]).trim(); if(v){ mark=v; break; } } break; } }
  // product header: แถวที่มี 'Unit Price EUR' หรือ 'Designation'
  let hr=-1;
  for(let i=0;i<aoa.length;i++){ if(aoa[i].some(c=>/Unit Price EUR/i.test(String(c)))||aoa[i].some(c=>/^Designation$/i.test(String(c).trim()))){ hr=i; break; } }
  const items=[];
  if(hr>=0){ for(let i=hr+1;i<aoa.length;i++){ const row=aoa[i];
    if(row.some(c=>/EXW PRICE|FOB PRICE|INLAND CHARGE/i.test(String(c)))) break;
    const qty=sigNum(row[0]); const desg=String(row[2]==null?'':row[2]).replace(/\s+/g,' ').trim();
    if(qty!=null && desg){ items.push({ qty, designation:desg, unitPrice:sigNum(row[5]), amount:sigNum(row[7]), currency:'EUR' }); }
  } }
  return { invoiceNo, date, inland, brand, origin:origin||'TH', dest:dest||'', mark, items };
}
function sigParsePacking(aoa){
  let hr=-1;
  for(let i=0;i<aoa.length;i++){ if(String(aoa[i][0]==null?'':aoa[i][0]).trim().toLowerCase()==='products'){ hr=i; break; } }
  const map={}; if(hr<0) return map;
  let boi='';
  for(let i=hr+1;i<aoa.length;i++){ const row=aoa[i]; const a=String(row[0]==null?'':row[0]).trim();
    if(!a) continue;
    let m=a.match(/BOI No\.?\s*(.+)/i); if(m){ boi=m[1].trim(); continue; }
    if(/^Total/i.test(a)||/^BRAND/i.test(a)) continue;
    const pallet=sigNum(row[3]); if(pallet==null) continue;
    map[a.replace(/\s+/g,' ')]={ designation:a, pallet, carton:sigNum(row[4]), qty:sigNum(row[5]), nw:sigNum(row[6]), gw:sigNum(row[7]), boi };
  }
  return map;
}
function sigNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return isFinite(v)?v:null; const n=parseFloat(String(v).replace(/,/g,'').trim()); return isFinite(n)?n:null; }
function sigProductCode(desg){ const m=String(desg).match(/^(.*?\bML)\b/i); if(m) return m[1].replace(/\s+/g,' ').trim(); return String(desg).split(/\s+/).slice(0,3).join(' '); }

function buildSigMapping(){
  SIG.errors=[]; SIG.warnings=[];
  const parsed=SIG.files.filter(f=>f.parsed&&!f.error).map(f=>f.parsed);
  if(!parsed.length){ SIG.errors.push('ยังไม่ได้อัปโหลดไฟล์ที่อ่านได้'); return false; }
  const map=[]; let run=0;

    if(!inv.date) SIG.warnings.push(`${p.name}: อ่าน Invoice Date ไม่ได้`);
    if(!inv.dest) SIG.warnings.push(`${p.name}: อ่าน Purchase Country (ปลายทาง) ไม่ได้`);
    inv.items.forEach((it,idx)=>{ run++;
      const pk=pack[it.designation.replace(/\s+/g,' ')]||null;

      const yr=inv.date instanceof Date?inv.date.getFullYear():new Date().getFullYear();
      map.push({ _i:map.length,_warn:[],_err:[],
        A:inv.invoiceNo?Number(inv.invoiceNo):'', B:inv.date, C:run,
        D:sigProductCode(it.designation), E:SIG_FIX.E,
        F:SIG_FIX.F_PRE+SIG_FIX.SEP+it.designation+SIG_FIX.SEP+SIG_FIX.F_SUF,
        G:it.qty, H:SIG_FIX.H, I:it.unitPrice, J:SIG_FIX.J,
        K:(it.unitPrice!=null?it.unitPrice/SIG_FIX.J:''), L:it.amount, M:it.currency||'EUR',
        N:(idx===0?inv.inland:''), O:(idx===0?'EUR':''),
        P:pk?pk.pallet:'', Q:SIG_FIX.Q, R:pk?pk.carton:'', S:SIG_FIX.S, T:pk?pk.nw:'', U:pk?pk.gw:'',
        V:inv.mark, W:inv.dest, X:inv.origin, Y:yr, Z:SIG_FIX.Z, AA:SIG_FIX.AA, AB:inv.brand,
        AC:SIG_FIX.AC, AD:pk?pk.boi:'', AE:SIG_FIX.AE, AF:SIG_FIX.AF, AG:inv.date, AH:SIG_FIX.AH,
        _desg:it.designation });
    });
  });
  SIG.mapping=map; validateSigMapping(); return SIG.errors.length===0;
}
function validateSigMapping(){

    if(!r.D) r._err.push('Product code ว่าง');
    if(!(r.G>0)) r._err.push('Qty ต้อง > 0');
    if(sigNum(r.I)==null) r._err.push('Unit Price ว่าง');
    if(sigNum(r.L)==null) r._err.push('Amount ว่าง');
    if(!r.W) r._err.push('Purchase Country ว่าง (กรอกเอง)');
    if(!r.X) r._err.push('Country of origin ว่าง');
    if(r.P===''||r.P==null) r._err.push('หีบห่อ ว่าง (จาก Packing list)');
    if(sigNum(r.T)==null) r._err.push('NET WEIGHT ว่าง (จาก Packing list)');
    if(sigNum(r.U)==null) r._err.push('GROSS WEIGHT ว่าง (จาก Packing list)');
    if(!r.AD) r._warn.push('BOI License ว่าง');
    if(sigNum(r.T)!=null && sigNum(r.U)!=null && sigNum(r.T)>sigNum(r.U)) r._warn.push('NET > GROSS');
    if(pk_qty_mismatch(r)) r._warn.push('Qty Invoice ≠ Packing');
  });
  return SIG.mapping.filter(r=>r._err.length).length;
}
function pk_qty_mismatch(r){ return false; }

function sigRenderView(){
  document.getElementById('pageTitle').textContent='SIG EXPORT';
  document.getElementById('pageSub').textContent='อัปโหลดไฟล์ Invoice ของ SIG (มีชีต Invoice + Packing list) เพื่อสร้าง Mapping 34 คอลัมน์';
  document.getElementById('pageActions').innerHTML='';
  document.getElementById('content').innerHTML=`<div class="anca-view">
    <div class="drop" id="sigDrop">
      <h4>ไฟล์ Invoice SIG (.xlsx/.xls) — หลายไฟล์ได้</h4>
      <label class="pick">📊 อัปโหลดไฟล์ Invoice
        <input id="sigInput" type="file" accept=".xlsx,.xls" multiple style="display:none" onchange="sigAddFiles(this.files)"></label>
      <span class="hint">ต้องมีชีต Invoice และ Packing list ในไฟล์เดียวกัน</span>
      <div class="flist" id="sigList"></div>
    </div>
    <div class="actions">
      <button class="abtn export primary" id="sigExportBtn" onclick="exportSigExcel()">📥 EXPORT EXCEL</button>
      <button class="abtn" onclick="resetSigFiles()">🗑️ ล้างข้อมูล</button>
    </div>
    <div id="sigMsgs"></div><div id="sigPreview"></div>
  </div>`;
  ancaBindDrop('sigDrop',files=>sigAddFiles(files));
  sigRenderFiles();
}
function sigRenderFiles(){
  const el=document.getElementById('sigList'); if(!el) return;
  el.innerHTML=SIG.files.map((f,i)=>{ const p=f.parsed;
    const st=f.error?`<span class="ferr">อ่านไม่ได้: ${escapeHtml(f.error)}</span>`:(p?`<span class="fok">อ่านสำเร็จ</span> · Invoice <b>${escapeHtml(p.inv.invoiceNo||'?')}</b> · ${ancaDateToStr(p.inv.date)||'—'} · ${p.inv.items.length} รายการ · ปลายทาง <b>${escapeHtml(p.inv.dest||'?')}</b>`:'กำลังอ่าน...');
    return `<div class="frow"><span class="fn">📊 ${escapeHtml(f.name)}</span><span class="fmeta">${ancaFmtBytes(f.size)} · ${st}</span><button class="del" onclick="sigDelFile(${i})">✕</button></div>`;
  }).join('')||'<div style="color:#8b949e;font-size:12.5px">ยังไม่มีไฟล์</div>';
}
async function sigAddFiles(files){
  for(const f of files){ if(!/\.xlsx?$/i.test(f.name)) continue;
    const rec={name:f.name,size:f.size,parsed:null,error:null}; SIG.files.push(rec); sigRenderFiles();
    try{ rec.parsed=sigParseWorkbook(f.name, await f.arrayBuffer()); }catch(e){ rec.error=e.message; }
    sigRenderFiles();
  }
  sigResetOutput();
}
function sigDelFile(i){ SIG.files.splice(i,1); sigRenderFiles(); sigResetOutput(); }
function sigResetOutput(){ SIG.mapping=[]; const pv=document.getElementById('sigPreview'); if(pv)pv.innerHTML=''; const mb=document.getElementById('sigMsgs'); if(mb)mb.innerHTML=''; }
function sigAnalyze(){
  buildSigMapping();
  const mb=document.getElementById('sigMsgs'); if(mb) mb.innerHTML='';   // ไม่แสดงกล่องสรุป Warning/Error
  const has=SIG.mapping.length>0; document.getElementById('sigPreviewBtn').disabled=!has;
  const nErr=SIG.mapping.filter(r=>r._err.length).length;
  document.getElementById('sigExportBtn').disabled=!(has&&nErr===0&&SIG.errors.length===0);
  sigShowPreview();
  if(nErr||SIG.errors.length) toast(`วิเคราะห์เสร็จ · Error ${nErr+SIG.errors.length} จุด (ตรวจสอบภายหลังได้)`,'err');
  else toast(`วิเคราะห์เสร็จ · ${SIG.mapping.length} รายการ พร้อม Export`,'ok');
}
function sigRenderMsgs(){
  const mb=document.getElementById('sigMsgs'); if(!mb) return;
  const re=[],rw=[]; SIG.mapping.forEach(r=>{ r._err.forEach(e=>re.push(`item ${r.C} (${r.D}): ${e}`)); r._warn.forEach(w=>rw.push(`item ${r.C}: ${w}`)); });
  const E=[...SIG.errors,...re], W=[...SIG.warnings,...rw]; let h='';
  if(E.length) h+=`<div class="msgbox err"><b>⚠️ ควรตรวจสอบ (${E.length})</b><ul>${E.slice(0,40).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;
  if(W.length) h+=`<div class="msgbox warn"><b>⚠️ Warning (${W.length})</b><ul>${W.slice(0,30).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;
  mb.innerHTML=h;
}
function sigShowPreview(){
  if(!SIG.mapping.length) return;
  validateSigMapping();                 // ยังคำนวณ error/warning เบื้องหลังเพื่อใช้ตอน Export
  const pv=document.getElementById('sigPreview'); if(pv) pv.innerHTML='';   // ไม่แสดงกล่องสรุป/ตาราง
}
function sigEditCell(i,k,val){
  const r=SIG.mapping.find(x=>x._i===i); if(!r) return; val=String(val).trim();
  if(['G','I','L','P','R','T','U'].includes(k)) r[k]=Number(val.replace(/,/g,''))||0;
  else if(k==='W'||k==='X') r[k]=normalizeCountry(val)||val.toUpperCase();
  else r[k]=val;
  if(k==='I'||k==='L') r.K=(sigNum(r.I)!=null?Number(r.I)/SIG_FIX.J:'');
  const nErr=validateSigMapping();
  document.getElementById('sigExportBtn').disabled=!(nErr===0&&SIG.errors.length===0);
  sigRenderMsgs();
}
function exportSigExcel(){
  buildSigMapping();   // อัตโนมัติ: อ่าน → วิเคราะห์ → mapping
  const mb=document.getElementById('sigMsgs'); if(mb) mb.innerHTML='';
  if(!SIG.mapping.length){ toast('ยังไม่มีข้อมูล — อัปโหลดไฟล์ Invoice ก่อน','err'); return; }
  validateSigMapping();   // คำนวณเบื้องหลัง (ไม่บล็อก ไม่แจ้งเตือน)
  if(typeof SIG_TPL_B64!=='string'||!SIG_TPL_B64){ toast('ไม่พบไฟล์ Template ในระบบ','err'); return; }
  // อ่านไฟล์ต้นฉบับเพื่อดึงความกว้างคอลัมน์ / number format / margins / หัวข้อ ตามจริง (ไม่เดา)
  const tplwb = XLSX.read(SIG_TPL_B64, {type:'base64', cellStyles:true, cellNF:true});
  const tplws = tplwb.Sheets[tplwb.SheetNames[0]];
  const tplName = tplwb.SheetNames[0];
  const rng = XLSX.utils.decode_range(tplws['!ref']);
  const NC = rng.e.c+1;
  const H=[], tplZ=[]; for(let c=0;c<NC;c++){ const hc=tplws[XLSX.utils.encode_cell({r:0,c})]; H.push(hc?hc.v:(SIG_HEADERS[c]||'')); const d=tplws[XLSX.utils.encode_cell({r:1,c})]; tplZ.push(d&&d.z); }
  const cols=(tplws['!cols']||[]).map(c=>{ const o={}; if(c){ if(typeof c.wpx==='number')o.wpx=Math.round(c.wpx); else if(typeof c.wch==='number')o.wch=c.wch; } return o; });
  const margins=tplws['!margins'];
  // สไตล์ตามไฟล์ต้นฉบับจริง: Calibri 11, ไม่หนา, ไม่มีสีพื้น, จัดกึ่งกลางแนวตั้ง, เส้นขอบบางครบ 4 ด้าน (โคลนต่อเซลล์ กัน format รั่ว)
  const _thin={style:'thin',color:{rgb:'000000'}};
  const mkS=()=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},alignment:{vertical:'center'},border:{top:_thin,bottom:_thin,left:_thin,right:_thin}});
  const dserial=v=>{ if(v instanceof Date) return Math.floor((Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())-Date.UTC(1899,11,30))/86400000);
    if(typeof v==='number' && isFinite(v)) return Math.round(v);   // เป็น serial อยู่แล้ว → ปัดเศษเวลาทิ้ง (46216.0000462963 → 46216)
    const d=new Date(v); return isNaN(d.getTime())?v:Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000); };
  const dateC=new Set(['B','AG']);
  const numC=new Set(['A','C','G','I','J','K','L','N','P','R','T','U','Y']);
  const sumK=new Set(['G','L','N','P','R','T','U']);   // คอลัมน์ที่รวมยอดใน TOTAL (Qty/Amount/Inland/หีบห่อ/CT/NW/GW)
  const fmtK=new Set(['L','N','T','U']);               // #,##0.000 เฉพาะ เงิน/มูลค่า (Amount,Inland) + น้ำหนัก (NW,GW)
  const FMT3='#,##0.000';
  const n=SIG.mapping.length;
  // ประกอบ worksheet โดยคงหัวข้อ/รูปแบบจากต้นฉบับ แล้วฉีดข้อมูล
  const ws={};
  for(let c=0;c<NC;c++){ ws[XLSX.utils.encode_cell({r:0,c})]={t:'s',v:String(H[c]==null?'':H[c]),s:mkS()}; }
  SIG.mapping.forEach((r,ri)=>{ const R=ri+1;
    SIG_KEYS.forEach((k,c)=>{ if(c>=NC) return; const ref=XLSX.utils.encode_cell({r:R,c}); let v=r[k]; let cell;
      if(v===''||v==null){ ws[ref]={t:'s',v:'',s:mkS()}; return; }   // ช่องว่าง (N/O เฉพาะแถว 1) คงเส้นขอบตาราง
      if(dateC.has(k)) cell={t:'n', v:dserial(v), z:'dd/mm/yyyy'};   // วันที่ serial สะอาด · แสดง 13/07/2026
      else if(numC.has(k)) cell={t:'n', v:Number(v)};
      else cell={t:'s', v:String(v)};
      if(fmtK.has(k)) cell.z=FMT3;                                  // เงิน/น้ำหนัก = #,##0.000 (ปริมาณไม่ใส่)
      else if(tplZ[c] && !dateC.has(k)) cell.z=tplZ[c];             // คงรูปแบบตัวเลขจากต้นฉบับ (เช่น AF = '0')
      cell.s=mkS();
      ws[ref]=cell;
    });
  });
  // แถว TOTAL (สูตร SUM ของ Excel · ตัวหนา · คงเส้นขอบ)
  if(n>0){ const TR=n+1; const mkTot=()=>{ const s=mkS(); s.font={...s.font,bold:true}; return s; };
    for(let c=0;c<NC;c++){ const ref=XLSX.utils.encode_cell({r:TR,c}); const k=SIG_KEYS[c]; const L=XLSX.utils.encode_col(c);
      if(c===0){ ws[ref]={t:'s',v:'TOTAL',s:mkTot()}; }
      else if(sumK.has(k)){ let sum=0; for(const r of SIG.mapping) sum+=Number(r[k])||0; const cc={t:'n',f:`SUM(${L}2:${L}${n+1})`,v:sum,s:mkTot()}; if(fmtK.has(k)) cc.z=FMT3; ws[ref]=cc; }
      else { ws[ref]={t:'s',v:'',s:mkTot()}; }
    }
  }
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(n+1,1), c:NC-1}});
  ws['!cols']=cols;
  if(margins) ws['!margins']=margins;
  const wb={SheetNames:[tplName], Sheets:{}}; wb.Sheets[tplName]=ws;
  const now=new Date(); const ts=now.getFullYear()+_ancaPad2(now.getMonth()+1)+_ancaPad2(now.getDate())+'_'+_ancaPad2(now.getHours())+_ancaPad2(now.getMinutes())+_ancaPad2(now.getSeconds());
  const fname=`MAPPING_SIG_${ts}.xlsx`;
  XLSX.writeFile(wb, fname, {bookType:'xlsx'});   // .xlsx เพื่อคงเส้นขอบ/สไตล์ตารางให้เหมือนต้นฉบับ
  toast(`Export สำเร็จ · ${n} รายการ · ${fname}`,'ok');
}
function resetSigFiles(){ SIG.files=[]; SIG.mapping=[]; SIG.errors=[]; SIG.warnings=[]; SIG.page=1; SIG.search=''; sigRenderView(); toast('ล้างข้อมูลแล้ว','info'); }
</script>
