    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const cell=(r,c)=>(aoa[r]&&aoa[r][c]!=null)?aoa[r][c]:null;
    const rowText=r=>(aoa[r]||[]).map(S).join(' ');
    const invoiceNo=cleanText(cell(6,0));
    const date=parseDate(cell(6,4));
    let tax=TY_TAX_FALLBACK;
    for(let r=0;r<12;r++){ const m=rowText(r).match(/Tax\.?\s*No\.?\s*(\d{13})/i); if(m){tax=m[1];break;} }
    let hdr=-1;
    for(let r=0;r<aoa.length;r++){ const t=rowText(r).toUpperCase();
      if(t.includes('ITEM')&&t.includes('DESCRIPTION OF GOODS')&&t.includes('PRODUCT CODE')&&t.includes('QTY')){hdr=r;break;} }
    if(hdr<0) throw new Error('ไม่พบหัวตารางสินค้าใน Invoice (ITEM / Description of goods / Product Code / QTY.)');
    const items=[];

      const aS=norm(cell(r,0)); if(/^TOTAL/i.test(aS))break;

      const qty=cell(r,5),price=cell(r,8),amount=cell(r,10);

      items.push({ item:aS, desc, descRaw:cleanText(cell(r,1)), productCode:pcode,
        qty:(qty==null||qty===''?null:Number(qty)), price:(price==null||price===''?null:Number(price)),
        curr:norm(cell(r,7))||norm(cell(r,9))||'', amount:(amount==null||amount===''?null:Number(amount)),
        boi:cleanText(cell(r,11)), set:setM?setM[1]:'' });
    }
    const findLabelVal=kw=>{ for(let r=0;r<aoa.length;r++){ if(norm(cell(r,0)).toUpperCase().startsWith(kw)){
      for(let c=1;c<8;c++){ const v=cell(r,c); if(v!=null&&!isNaN(Number(v))&&S(v).trim()!=='')return Number(v); } } } return null; };
    const netWeight=findLabelVal('NET WEIGHT'), grossWeight=findLabelVal('GROSS WEIGHT');
    let packages=null;

      for(let c=0;c<row.length;c++){ if(/SHIPPING\s*MARK\s*:?/i.test(S(row[c]))){
        const lines=[]; for(let rr=r+1;rr<aoa.length;rr++){ const v=cell(rr,c); if(v==null||S(v).trim()==='')break; lines.push(S(v).trim()); }
        shipMark=lines.join('\n'); break outer; } } }
    let totalQty=null, totalAmount=null;
    for(let r=hdr+1;r<aoa.length;r++){ if(/^TOTAL/i.test(norm(cell(r,0)))){
      const q=cell(r,5); if(q!=null&&!isNaN(Number(q))&&S(q).trim()!=='') totalQty=Number(q);
      const a=cell(r,10); if(a!=null&&!isNaN(Number(a))&&S(a).trim()!=='') totalAmount=Number(a); break; } }
    return {invoiceNo,date,tax,items,netWeight,grossWeight,packages,shipMark,totalQty,totalAmount};
  }
  function parseMaster(wb){
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const map=new Map();
    for(let r=1;r<aoa.length;r++){ const row=aoa[r]||[];
      const b=row[1]; if(b==null||norm(b)==='')continue; const d=row[3]; if(d==null||norm(d)==='')continue;
      const key=normKey(b); if(!map.has(key)) map.set(key,{th:cleanText(row[2]),hs:digits(row[3]),boiNote:norm(row[4]),stat:cleanText(row[5])}); }
    return map;
  }
  function buildMapping(inv,master){
    if(!inv.items.length) throw new Error('ไม่พบรายการสินค้าใน Invoice');
    const qtyTotal=inv.items.reduce((s,it)=>s+(it.qty||0),0);
    if(!(qtyTotal>0)) throw new Error('QTY รวมเป็น 0 — หยุด Export');
    const net=inv.netWeight; const unmatched=[]; const rows=[];
    inv.items.forEach((it,idx)=>{
      const m=master.get(normKey(it.desc));
      if(!m){ unmatched.push(it.desc); return; }
      const boiBlank=/ไม่ต้องระบุ/.test(m.boiNote||'');
      rows.push({ A:inv.invoiceNo, B:inv.date?inv.date.serial:null, C:it.item||String(idx+1), D:it.descRaw, E:m.th,
        F:it.set||'', G:it.productCode, H:it.qty, I:'C62', J:it.set?'SET':'', K:it.price, L:it.curr||'',
        M:(it.amount!=null?it.amount:((it.qty!=null&&it.price!=null)?it.qty*it.price:null)),
        N:boiBlank?'':it.boi, O:digits(m.hs), P:m.stat, Q:(net!=null&&qtyTotal>0)?(it.qty*net/qtyTotal):null,
        R:idx===0?inv.grossWeight:'', S:idx===0?inv.packages:'', T:idx===0?'PK':'', U:inv.shipMark, V:TY_NOTE,
        W:'Y', X:'NO BRAND', Y:'TH', Z:'BOI'+(inv.tax||TY_TAX_FALLBACK),
        AA:(inv.date?inv.date.year:new Date().getFullYear())+'-00-00', AB:'0994000740964', AC:'02' });
    });
    if(unmatched.length){ const e=new Error('Mapping ไม่พบใน MASTER'); e.unmatched=[...new Set(unmatched)]; throw e; }
    const itemAmt=inv.items.reduce((s,it)=>s+(it.amount||0),0); const mism=[];
    if(inv.totalQty!=null&&Math.abs(qtyTotal-inv.totalQty)>0.001) mism.push('QTY: รายการรวม='+qtyTotal+' ≠ Invoice TOTAL='+inv.totalQty);
    if(inv.totalAmount!=null&&Math.abs(itemAmt-inv.totalAmount)>0.01) mism.push('AMOUNT: รายการรวม='+(Math.round(itemAmt*100)/100)+' ≠ Invoice TOTAL='+inv.totalAmount);
    if(mism.length){ const e=new Error('ยอดรวมไม่ตรงกับ Invoice TOTAL'); e.mismatch=mism; throw e; }
    return {rows,qtyTotal,net,totalQty:(inv.totalQty!=null?inv.totalQty:qtyTotal),totalAmount:(inv.totalAmount!=null?inv.totalAmount:itemAmt)};
  }
  const COLS=[{k:'A',s:1,t:'str'},{k:'B',s:2,t:'num'},{k:'C',s:1,t:'num'},{k:'D',s:1,t:'str'},{k:'E',s:1,t:'str'},
    {k:'F',s:1,t:'num'},{k:'G',s:1,t:'str'},{k:'H',s:1,t:'num'},{k:'I',s:1,t:'str'},{k:'J',s:1,t:'str'},
    {k:'K',s:1,t:'num'},{k:'L',s:1,t:'str'},{k:'M',s:1,t:'num'},{k:'N',s:1,t:'str'},{k:'O',s:1,t:'num'},
    {k:'P',s:1,t:'str'},{k:'Q',s:1,t:'num'},{k:'R',s:1,t:'num'},{k:'S',s:1,t:'num'},{k:'T',s:1,t:'str'},
    {k:'U',s:1,t:'str'},{k:'V',s:1,t:'str'},{k:'W',s:1,t:'str'},{k:'X',s:1,t:'str'},{k:'Y',s:1,t:'str'},
    {k:'Z',s:1,t:'str'},{k:'AA',s:1,t:'str'},{k:'AB',s:1,t:'str'},{k:'AC',s:1,t:'str'}];
  const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n/g,'&#10;');
  function cellXml(ref,cd,val){
    if(val==null||val==='')return '<c r="'+ref+'" s="'+cd.s+'"/>';
    if(cd.t==='num'){ const n=Number(val); if(!isFinite(n))return '<c r="'+ref+'" s="'+cd.s+'"/>'; return '<c r="'+ref+'" s="'+cd.s+'"><v>'+n+'</v></c>'; }
    return '<c r="'+ref+'" s="'+cd.s+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(val)+'</t></is></c>';
  }
  function exportTemplate(templateBytes,rows,totals){
    const files=fflate.unzipSync(new Uint8Array(templateBytes));
    const dec=new TextDecoder(),enc=new TextEncoder();
    let sheet=dec.decode(files['xl/worksheets/sheet1.xml']);
    const N=rows.length, lastData=N+1, tr=N+2;
    sheet=sheet.replace(/<dimension ref="[^"]*"\/>/,'<dimension ref="A1:AC'+tr+'"/>');
    const row1=sheet.match(/<row[^>]*r="1"[^>]*>[\s\S]*?<\/row>/)[0];
    let body='';
    rows.forEach(function(row,i){ const R=i+2; let cells=''; COLS.forEach(function(cd){ cells+=cellXml(cd.k+R,cd,row[cd.k]); }); body+='<row r="'+R+'" spans="1:29">'+cells+'</row>'; });
    const tq=(totals&&totals.totalQty!=null)?totals.totalQty:'', ta=(totals&&totals.totalAmount!=null)?totals.totalAmount:'';
    const trc='<c r="H'+tr+'" s="4"><f>SUM(H2:H'+lastData+')</f><v>'+tq+'</v></c>'
      +'<c r="I'+tr+'" s="4"/><c r="J'+tr+'" s="4"/><c r="K'+tr+'" s="4"/><c r="L'+tr+'" s="4"/>'
      +'<c r="M'+tr+'" s="4"><f>SUM(M2:M'+lastData+')</f><v>'+ta+'</v></c>';
    body+='<row r="'+tr+'" spans="1:29">'+trc+'</row>';
    sheet=sheet.replace(/<sheetData>[\s\S]*?<\/sheetData>/,'<sheetData>'+row1+body+'</sheetData>');
    files['xl/worksheets/sheet1.xml']=enc.encode(sheet);
    return fflate.zipSync(files);
  }
  return {parseInvoice,parseMaster,buildMapping,exportTemplate,parseDate};
})();

function tyB64ToBytes(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
function tySafeName(s){ return String(s==null?'':s).replace(/[\\\/:*?"<>|]/g,'_'); }

async function tyLoadInvoice(f){ if(!f)return;
  try{ const wb=XLSX.read(await csvToUploadBuffer(f),{type:'array',cellDates:false});
    const inv=TYR.parseInvoice(wb); TYS.inv=inv; TYS.invName=f.name; TYS.invErr=null;
    toast('อ่าน Invoice: '+(inv.invoiceNo||'?')+' · '+inv.items.length+' รายการ','ok');
  }catch(e){ TYS.inv=null; TYS.invErr=e.message; toast('อ่าน Invoice ไม่ได้: '+e.message,'err'); }
  tyRenderFiles(); tyUpdateBtn();
}
async function tyLoadMaster(f){ if(!f)return;
  try{ const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});
    const m=TYR.parseMaster(wb); if(!m.size) throw new Error('MASTER ว่าง (ไม่พบชื่อสินค้าในคอลัมน์ B)');
    TYS.master=m; TYS.mName=f.name; TYS.mErr=null; toast('อ่าน MASTER: '+m.size+' รายการ','ok');
  }catch(e){ TYS.master=null; TYS.mErr=e.message; toast('อ่าน MASTER ไม่ได้: '+e.message,'err'); }

}

function tyUpdateBtn(){ const b=document.getElementById('tyExpBtn'); if(b) b.disabled = TYS.busy || !TYS.inv || !TYS.master; }
async function tyExport(){
  if(TYS.busy)return;
  if(!TYS.inv){ toast('ยังไม่ได้อัปโหลด Invoice','err'); return; }
  if(!TYS.master){ toast('ยังไม่ได้อัปโหลด MASTER','err'); return; }
  const inv=TYS.inv; const errs=[];
  if(!inv.invoiceNo) errs.push('ไม่พบ Invoice No.');
  if(!inv.date) errs.push('ไม่พบ/อ่าน Invoice Date ไม่ได้');
  if(!inv.items.length) errs.push('ไม่พบรายการสินค้า');
  if(inv.netWeight==null) errs.push('ไม่พบ Net Weight');
  if(inv.grossWeight==null) errs.push('ไม่พบ Gross Weight');
  if(inv.packages==null) errs.push('ไม่พบจำนวน Package');
  inv.items.forEach(it=>{ if(!it.productCode) errs.push('ITEM '+it.item+': ไม่มี Product Code'); if(it.qty==null||isNaN(it.qty)) errs.push('ITEM '+it.item+': QTY ไม่เป็นตัวเลข'); if(it.price==null||isNaN(it.price)) errs.push('ITEM '+it.item+': ราคาไม่เป็นตัวเลข'); });
  if(errs.length){ tyShowErr('ข้อมูลไม่ครบ — ยกเลิก Export', errs.slice(0,20)); toast('ข้อมูลไม่ครบ ('+errs.length+')','err'); return; }
  let R;
  try{ R=TYR.buildMapping(inv,TYS.master); }
  catch(e){ if(e.unmatched&&e.unmatched.length){ tyShowErr('พบสินค้าที่ Mapping ไม่พบใน MASTER ('+e.unmatched.length+') — ยกเลิก Export', e.unmatched); } else if(e.mismatch&&e.mismatch.length){ tyShowErr('ยอดรวมไม่ตรงกับแถว TOTAL ของ Invoice — ยกเลิก Export', e.mismatch); } else { tyShowErr('Export ไม่สำเร็จ',[e.message]); } toast('ตรวจสอบไม่ผ่าน','err'); return; }
  // ตรวจ HS 8 หลัก + Stat
  const hsBad=R.rows.filter(r=>!/^\d{8}$/.test(String(r.O||''))).map(r=>r.D);
  if(hsBad.length){ tyShowErr('HS Code ไม่ครบ 8 หลัก — ยกเลิก Export',[...new Set(hsBad)]); toast('HS Code ผิด','err'); return; }
  TYS.busy=true; tyUpdateBtn();
  try{
    const bytes=TYR.exportTemplate(tyB64ToBytes(TYROLIT_TPL_B64), R.rows, R);
    const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='MAPPING '+tySafeName(inv.invoiceNo)+'.xlsx'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
    tyShowOk(R.rows.length, inv);
    toast('Export สำเร็จ '+R.rows.length+' แถว','ok');
  }catch(e){ tyShowErr('สร้างไฟล์ไม่สำเร็จ',[e.message]); toast('Export ล้มเหลว: '+e.message,'err'); }
  finally{ TYS.busy=false; tyUpdateBtn(); }
}

   UNITED MECHANICAL MODE  (Invoice+PL ไฟล์เดียว → template A:O + Total)
   แยกจากโหมดอื่นทั้งหมด · ใช้ template ฝังในระบบ (UNITED_TPL_B64)
================================================================== */
const UNI = (function(){
  const S=v=>(v==null?'':String(v));
  const norm=s=>S(s).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
  const normKey=s=>norm(s).toLowerCase();
  const clean=v=>v==null?'':String(v).trim();
  const num=v=>(v==null||S(v).trim()==='')?null:Number(v);
  function parseDate(v){
    if(v==null||S(v).trim()==='')return null;
    if(typeof v==='number'&&isFinite(v)){ const d=new Date(Math.round((v-25569)*86400000)); return {serial:Math.floor(v),year:d.getUTCFullYear()}; }
    const m=S(v).trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/); if(!m)return null;
    return {serial:Math.floor((Date.UTC(+m[3],+m[2]-1,+m[1])-Date.UTC(1899,11,30))/86400000),year:+m[3]};
  }
  const aoaOf=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const findSheet=(wb,pfx)=>wb.SheetNames.find(n=>norm(n).toLowerCase().startsWith(pfx));
  function rightOf(aoa,re){ for(let r=0;r<aoa.length;r++){ const row=aoa[r]||[];
    for(let c=0;c<row.length;c++){ if(re.test(S(row[c]))){ for(let cc=c+1;cc<row.length;cc++){ const v=row[cc]; if(v!=null&&S(v).trim()!=='')return v; } } } } return null; }
  function headerRow(aoa,kws){ for(let r=0;r<aoa.length;r++){ const t=(aoa[r]||[]).map(S).join(' ').toUpperCase(); if(kws.every(k=>t.includes(k)))return r; } return -1; }
  const isTotal=s=>/^TOTAL\s*[:：]?/i.test(norm(s))||/\*+\s*END/i.test(S(s))||/END\s*\*+/i.test(S(s));

  function parseInvoice(wb){
    const sn=findSheet(wb,'invoice'); if(!sn) throw new Error('ไม่พบ Sheet ที่ขึ้นต้นด้วย "Invoice"');
    const aoa=aoaOf(wb.Sheets[sn]);
    const invoiceNo=clean(rightOf(aoa,/Invoice\s*No\.?\s*:/i));
    const date=parseDate(rightOf(aoa,/^\s*Date\s*:/i));
    const hdr=headerRow(aoa,['NO.','PART NO.','DESCRIPTION OF GOODS','QUANTITY','UNIT PRICE','AMOUNT']);
    if(hdr<0) throw new Error('ไม่พบหัวตารางสินค้าใน Invoice');
    let currency='';
    for(let r=hdr+1;r<Math.min(hdr+3,aoa.length);r++){ const row=aoa[r]||[]; for(const c of [5,6,7]){ const v=norm(row[c]); if(/^[A-Z]{3}$/.test(v)){currency=v;break;} } if(currency)break; }
    const items=[];
    for(let r=hdr+1;r<aoa.length;r++){ const row=aoa[r]||[]; const aS=norm(row[0]);
      if(isTotal(aS))break; if(!/^\d+$/.test(aS))continue;
      const partNo=clean(row[2]),desc=clean(row[3]); if(!partNo&&!desc)continue;
      items.push({no:aS,partNo,desc,qty:num(row[4]),unitPrice:num(row[5]),amount:num(row[6]),notes:clean(row[7])}); }
    return {sheet:sn,invoiceNo,date,currency,items};
  }
  function parsePacking(wb){
    const sn=findSheet(wb,'packing list'); if(!sn) throw new Error('ไม่พบ Sheet ที่ขึ้นต้นด้วย "Packing list"');
    const aoa=aoaOf(wb.Sheets[sn]);
    const hdr=headerRow(aoa,['NO.','PART NO.','QUANTITY','T.N.W.','T.G.W.']);
    if(hdr<0) throw new Error('ไม่พบหัวตารางใน Packing List');
    const items=[];
    for(let r=hdr+1;r<aoa.length;r++){ const row=aoa[r]||[]; const aS=norm(row[0]);
      if(isTotal(aS))break; if(!/^\d+$/.test(aS))continue; const partNo=clean(row[2]); if(!partNo)continue;
      items.push({no:aS,partNo,qty:num(row[4]),tnw:num(row[6]),tgw:num(row[7])}); }
    return {sheet:sn,items};
  }
  function buildMapping(inv,pl){
    if(!inv.items.length) throw new Error('ไม่พบรายการใน Invoice');
    const byPart=new Map();
    pl.items.forEach(p=>{ const k=normKey(p.partNo); if(!byPart.has(k))byPart.set(k,[]); byPart.get(k).push(p); });
    const cursor=new Map(),unmatched=[],rows=[];
    inv.items.forEach((it,idx)=>{
      if(!it.partNo){ unmatched.push('ITEM '+it.no+': ไม่มี Part No.'); return; }
      const k=normKey(it.partNo),arr=byPart.get(k)||[],ci=cursor.get(k)||0,p=arr[ci]; cursor.set(k,ci+1);
      if(!p||p.tnw==null||p.tgw==null){ unmatched.push('Part No. '+it.partNo+' (ITEM '+it.no+'): จับคู่ T.N.W./T.G.W. ไม่ได้'); return; }
      rows.push({A:idx+1,B:inv.invoiceNo,C:inv.date?inv.date.serial:null,D:it.partNo,E:it.desc,F:'',
        G:it.qty,H:it.unitPrice,I:(it.amount!=null?it.amount:((it.qty!=null&&it.unitPrice!=null)?it.qty*it.unitPrice:null)),
        J:it.notes,K:it.currency||inv.currency||'USD',L:p.tnw,M:p.tgw,N:'KGM',O:'C62'}); });
    if(unmatched.length){ const e=new Error('ข้อมูลไม่ครบ'); e.unmatched=unmatched; throw e; }
    return {rows};
  }
  const COLS=[{k:'A',s:1,t:'num'},{k:'B',s:1,t:'str'},{k:'C',s:9,t:'num'},{k:'D',s:1,t:'str'},{k:'E',s:1,t:'str'},
    {k:'F',s:1,t:'str'},{k:'G',s:1,t:'num'},{k:'H',s:1,t:'num'},{k:'I',s:1,t:'num'},{k:'J',s:1,t:'str'},
    {k:'K',s:1,t:'str'},{k:'L',s:1,t:'num'},{k:'M',s:7,t:'num'},{k:'N',s:8,t:'str'},{k:'O',s:8,t:'str'}];
  const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n/g,'&#10;');
  function cellXml(ref,s,typ,val){
    if(val==null||val==='')return '<c r="'+ref+'" s="'+s+'"/>';
    if(typ==='num'){ const n=Number(val); if(!isFinite(n))return '<c r="'+ref+'" s="'+s+'"/>'; return '<c r="'+ref+'" s="'+s+'"><v>'+n+'</v></c>'; }
    return '<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(val)+'</t></is></c>';
  }
  function exportTemplate(templateBytes,rows){
    const files=fflate.unzipSync(new Uint8Array(templateBytes));
    const dec=new TextDecoder(),enc=new TextEncoder();
    let styles=dec.decode(files['xl/styles.xml']);
    if(styles.indexOf('formatCode="dd/mm/yyyy"')<0){
      styles=styles.replace(/(<styleSheet[^>]*>)/,'$1<numFmts count="1"><numFmt numFmtId="176" formatCode="dd/mm/yyyy"/></numFmts>');
      styles=styles.replace(/<cellXfs count="(\d+)">/,function(m,c){return '<cellXfs count="'+((+c)+1)+'">';});
      styles=styles.replace(/<\/cellXfs>/,'<xf numFmtId="176" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/></cellXfs>');
      files['xl/styles.xml']=enc.encode(styles);
    }
    let sheet=dec.decode(files['xl/worksheets/sheet1.xml']);
    const N=rows.length,lastData=N+1,tr=N+2;
    sheet=sheet.replace(/<dimension ref="[^"]*"\/>/,'<dimension ref="A1:O'+tr+'"/>');
    const row1=sheet.match(/<row[^>]*r="1"[^>]*>[\s\S]*?<\/row>/)[0];
    let body='';
    rows.forEach(function(row,i){ const R=i+2; let cells=''; COLS.forEach(function(cd){ cells+=cellXml(cd.k+R,cd.s,cd.t,row[cd.k]); }); body+='<row r="'+R+'" spans="1:15">'+cells+'</row>'; });
    const sum=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
    const f=(k,v)=>'<c r="'+k+tr+'" s="5"><f>SUM('+k+'2:'+k+lastData+')</f><v>'+v+'</v></c>';
    let trc=''; ['A','B','C','D','E','F'].forEach(k=>trc+='<c r="'+k+tr+'" s="1"/>');
    trc+=f('G',sum('G'))+'<c r="H'+tr+'" s="5"/>'+f('I',sum('I'))+'<c r="J'+tr+'" s="1"/><c r="K'+tr+'" s="1"/>'+f('L',sum('L'))+f('M',sum('M'));
    body+='<row r="'+tr+'" spans="1:15">'+trc+'</row>';
    sheet=sheet.replace(/<sheetData>[\s\S]*?<\/sheetData>/,'<sheetData>'+row1+body+'</sheetData>');
    files['xl/worksheets/sheet1.xml']=enc.encode(sheet);
    return fflate.zipSync(files);
  }
  return {parseInvoice,parsePacking,buildMapping,exportTemplate,parseDate};
})();

const UNS={ files:[], busy:false };   // files: [{name,inv,pl,err}]
function uniB64ToBytes(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
function uniSafeName(s){ return String(s==null?'':s).replace(/[\\\/:*?"<>|]/g,'_'); }
function uniTick(){ return new Promise(r=>setTimeout(r,0)); }

async function uniLoad(fileList){
  if(!fileList||!fileList.length)return;
  for(const f of Array.from(fileList)){
    if(!/\.(xlsx|xls|csv)$/i.test(f.name)) continue;
    const rec={name:f.name,inv:null,pl:null,err:null}; UNS.files.push(rec);
    try{ const wb=XLSX.read(await csvToUploadBuffer(f),{type:'array',cellDates:false});
      rec.inv=UNI.parseInvoice(wb); rec.pl=UNI.parsePacking(wb);
    }catch(e){ rec.err=e.message; }
    uniRenderFiles();
  }
  const okN=UNS.files.filter(x=>x.inv&&x.pl).length;
  toast('อ่านไฟล์แล้ว '+okN+'/'+UNS.files.length,'ok');
  uniRenderFiles(); uniUpdateBtn();
}
function uniDelFile(i){ UNS.files.splice(i,1); const s=document.getElementById('uniSummary'); if(s)s.innerHTML=''; uniRenderFiles(); uniUpdateBtn(); }
function uniRenderFiles(){ const el=document.getElementById('uniList'); if(!el)return;
  if(!UNS.files.length){ el.innerHTML='<div style="color:#8b949e;font-size:12.5px">ยังไม่มีไฟล์</div>'; return; }
  el.innerHTML=UNS.files.map((r,i)=>{
    const st = r.err ? '<span class="ferr">อ่านไม่ได้: '+escapeHtml(r.err)+'</span>'
      : (r.inv&&r.pl ? '<span class="fok">พร้อม</span> · Inv <b>'+escapeHtml(r.inv.invoiceNo||'?')+'</b> · '+r.inv.items.length+' รายการ · PL '+r.pl.items.length : '⏳ กำลังอ่าน...');
    return '<div class="frow"><span class="fn">📄 '+escapeHtml(r.name)+'</span><span class="fmeta">'+st+'</span><button class="del" onclick="uniDelFile('+i+')">✕</button></div>';
  }).join('');
}
function uniUpdateBtn(){ const b=document.getElementById('uniExpBtn'); if(b) b.disabled=UNS.busy||!UNS.files.some(x=>x.inv&&x.pl); }
async function uniExport(){
  if(UNS.busy)return;
  const valid=UNS.files.filter(x=>x.inv&&x.pl);
  if(!valid.length){ toast('ยังไม่มีไฟล์ที่อ่านได้','err'); return; }
  // 1) validate ทุกไฟล์ก่อน — ถ้าไฟล์ใดผิด ยกเลิกทั้งหมด แจ้งชื่อไฟล์ต้นฉบับ + สาเหตุ
  const fails=[];
  const builds=[];
  for(const rec of UNS.files){
    if(!(rec.inv&&rec.pl)){ fails.push(rec.name+': '+(rec.err||'อ่านไฟล์ไม่ได้')); continue; }
    const inv=rec.inv, e=[];
    if(!inv.invoiceNo) e.push('ไม่พบ Invoice No.');
    if(!inv.date) e.push('ไม่พบ Invoice Date');
    if(!inv.items.length) e.push('ไม่พบรายการสินค้า');
    inv.items.forEach(it=>{ if(!it.partNo) e.push('ITEM '+it.no+': ไม่มี Part No.'); });
    let R=null;
    if(!e.length){ try{ R=UNI.buildMapping(inv,rec.pl); }catch(ex){ (ex.unmatched||[ex.message]).forEach(m=>e.push(m)); } }
    if(e.length){ fails.push('ไม่สามารถ Export ไฟล์ '+rec.name+': '+e.slice(0,6).join(' · ')); }
    else builds.push({name:rec.name, invoiceNo:inv.invoiceNo, rows:R.rows});
  }
  if(fails.length){ uniShowErr('พบไฟล์ที่ข้อมูลไม่ครบ '+fails.length+' ไฟล์ — ยกเลิก Export ทั้งหมด', fails); toast('มีไฟล์ข้อมูลไม่ครบ','err'); return; }
  // 2) สร้าง Mapping แยกทุกไฟล์ (template ใหม่ทุกครั้ง — ไม่ปะปน)
  UNS.busy=true; uniUpdateBtn();
  const results=[];
  try{
    for(let i=0;i<builds.length;i++){
      uniProgress('กำลังประมวลผล '+(i+1)+'/'+builds.length+' — '+builds[i].invoiceNo); await uniTick();
      const bytes=UNI.exportTemplate(uniB64ToBytes(UNITED_TPL_B64), builds[i].rows);   // template สดทุกไฟล์
      results.push({invoiceNo:builds[i].invoiceNo, buffer:bytes});
    }
    if(results.length===1){
      // ไฟล์เดียว → ดาวน์โหลด .xlsx ตรง (ไม่ ZIP)
      uniDownload(results[0].buffer, uniSafeName(results[0].invoiceNo)+'.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    }else{
      // หลายไฟล์ → ZIP เดียว (fflate)
      const zipObj={}, seen={};
      results.forEach(r=>{ let base=uniSafeName(r.invoiceNo)||'invoice'; let nm=base+'.xlsx'; if(seen[nm]!=null){ seen[nm]++; nm=base+'('+seen[base+'.xlsx']+').xlsx'; } else seen[nm]=0; zipObj[nm]=r.buffer; });
      const zipBytes=fflate.zipSync(zipObj,{level:0});
      uniDownload(zipBytes, 'United_Mechanical_Mapping.zip', 'application/zip');
    }
    uniShowOkMulti(builds);
    toast('Export สำเร็จ '+results.length+' Invoice','ok');
  }catch(e){ uniShowErr('สร้างไฟล์ไม่สำเร็จ',[e.message]); toast('Export ล้มเหลว: '+e.message,'err'); }
  finally{ UNS.busy=false; uniUpdateBtn(); }
}
function uniDownload(bytes, filename, mime){
  const blob=new Blob([bytes],{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
}
function uniProgress(msg){ const d=document.getElementById('uniSummary'); if(d) d.innerHTML='<div style="margin-top:16px;padding:12px 16px;border:1px solid #30363d;border-radius:10px;background:#161b22;color:#c9d1d9;font-size:13px">⏳ '+escapeHtml(msg)+'</div>'; }
function uniShowErr(title,list){ const d=document.getElementById('uniSummary'); if(!d)return;
  d.innerHTML='<div style="margin-top:16px;padding:14px 16px;border:1px solid #f85149;border-radius:10px;background:rgba(248,81,73,.08)">'
    +'<div style="color:#f85149;font-weight:600;margin-bottom:8px">⚠️ '+escapeHtml(title)+'</div>'
    +'<ul style="margin:0;padding-left:20px;color:#c9d1d9;font-size:13px;max-height:260px;overflow:auto">'+list.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul></div>'; }
function uniShowOkMulti(builds){ const d=document.getElementById('uniSummary'); if(!d)return;
  const single=builds.length===1;
  const head = single ? ('สร้างไฟล์แล้ว: '+escapeHtml(builds[0].invoiceNo)+'.xlsx')
    : ('Export สำเร็จ '+builds.length+' Invoice → United_Mechanical_Mapping.zip');
  const list = builds.map(b=>{ const rows=b.rows; const sum=k=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);
    return '<li><b>'+escapeHtml(b.invoiceNo)+'.xlsx</b> · '+rows.length+' รายการ · Qty '+sum('G')+' · Amount '+(Math.round(sum('I')*100)/100)+' · T.N.W. '+sum('L')+' · T.G.W. '+sum('M')+'</li>'; }).join('');
  d.innerHTML='<div style="margin-top:16px;padding:14px 16px;border:1px solid #3fb950;border-radius:10px;background:rgba(63,185,80,.08)">'
    +'<div style="color:#3fb950;font-weight:600">✅ '+escapeHtml(head)+'</div>'
    +'<ul style="margin:8px 0 0;padding-left:20px;color:#c9d1d9;font-size:13px;max-height:260px;overflow:auto">'+list+'</ul></div>'; }
function uniReset(){ UNS.files=[];
  const i=document.getElementById('uniInput'); if(i)i.value=''; const s=document.getElementById('uniSummary'); if(s)s.innerHTML='';
  uniRenderFiles(); uniUpdateBtn(); toast('ล้างไฟล์แล้ว','ok'); }

        <label class="pick">📄 เลือกไฟล์ Invoice PDF
          <input id="cvtInvInput" type="file" accept=".pdf" multiple style="display:none" onchange="cvtAddInv(this.files)"></label>
        <span class="hint">รองรับหลายไฟล์ · ลากวางได้ · ลำดับตามที่อัปโหลด</span>
        <div class="flist" id="cvtInvList" style="max-height:270px;overflow-y:auto"></div>
      </div>
      <div class="drop anca-upload-card" id="cvtPlDrop">
        <h4>2. PACKING LIST PDF (1 ไฟล์)</h4>
        <label class="pick">📄 เลือกไฟล์ PL PDF
          <input id="cvtPlInput" type="file" accept=".pdf" style="display:none" onchange="cvtSetPl(this.files[0])"></label>
        <span class="hint">อ่านทุกหน้า · Net/Package Weight</span>
        <div class="flist" id="cvtPlList"></div>
      </div>
      <div class="drop anca-upload-card" id="cvtThDrop">
        <h4>3. TH SHIP (Excel)</h4>
        <label class="pick">📊 เลือกไฟล์ TH Ship
          <input id="cvtThInput" type="file" accept=".xlsx,.xls" style="display:none" onchange="cvtSetTh(this.files[0])"></label>
        <span class="hint">Sheet: Fill in + RA DATA</span>
        <div class="flist" id="cvtThList"></div>
      </div>
    </div>
    <div class="actions">
      <button class="abtn export primary" id="cvtExpMainBtn" onclick="cvtExportMain()" disabled>📤 EXPORT EXCEL</button>
      <button class="abtn export" id="cvtExpLpiBtn" onclick="cvtExportLpi()" disabled>📤 EXPORT LPI</button>
      <button class="abtn" id="cvtClearBtn" onclick="cvtReset()">🧹 ล้างข้อมูล</button>
    </div>
    <div id="cvtSummary"></div>
    <div id="cvtDash"></div>
    <div id="cvtPreview"></div>
  </div>`;
  ancaBindDrop('cvtInvDrop', f=>cvtAddInv(f));
  ancaBindDrop('cvtPlDrop', f=>cvtSetPl(f[0]));
  ancaBindDrop('cvtThDrop', f=>cvtSetTh(f[0]));
  cvtRenderFiles();
}

/* ---------------- FILE HANDLERS (parse + cache in background) ---------------- */
async function cvtAddInv(files){
  for(const f of files){ if(!/\.pdf$/i.test(f.name)) continue;
    const buf=await f.arrayBuffer();
    const rec={name:f.name,size:f.size,parsed:null,error:null}; CS.invPdfs.push(rec); cvtResetOutput(); cvtRenderFiles();
    try{ const {pages,numPages}=await cvtPdfPages(buf); const iv=CVT.parseInvoice(pages); iv.pages=numPages; rec.parsed=iv; }
    catch(e){ rec.error=e.message; }
    cvtRenderFiles();
  }
}
function cvtDelInv(i){ CS.invPdfs.splice(i,1); cvtResetOutput(); cvtRenderFiles(); }
async function cvtSetPl(f){ if(!f) return; const buf=await f.arrayBuffer();
  try{ const {pages,numPages}=await cvtPdfPages(buf); const pl=CVT.parsePL(pages); CS.pl={name:f.name,size:f.size,data:pl,pages:numPages}; toast('อ่าน PL สำเร็จ '+pl.rows.length+' รายการ','ok'); }
  catch(e){ CS.pl=null; toast('อ่าน PL ไม่ได้: '+e.message,'err'); }
  cvtResetOutput(); cvtRenderFiles();
}
async function cvtSetTh(f){ if(!f) return; const buf=await f.arrayBuffer();
  try{ const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const fiName=wb.SheetNames.find(n=>n.replace(/\s+/g,'').toLowerCase()==='fillin');
    const raName=wb.SheetNames.find(n=>/^ra data/i.test(n.trim()));
    if(!fiName) throw new Error('ไม่พบ Sheet "Fill in"');
    if(!raName) throw new Error('ไม่พบ Sheet "RA DATA…"');
    const fi=CVT.parseFillIn(cvtSheetAOA(wb,fiName));
    const ra=CVT.parseRAData(cvtSheetAOA(wb,raName));
    if(fi.missing&&fi.missing.length) throw new Error('Fill in ขาดคอลัมน์: '+fi.missing.join(', '));
    CS.th={name:f.name,size:f.size,fi,ra,fiName,raName};
    toast('อ่าน TH Ship สำเร็จ (Fill in '+fi.rows.length+' / RA '+Object.keys(ra.byS).length+')','ok');
  }catch(e){ CS.th=null; toast('อ่าน TH Ship ไม่ได้: '+e.message,'err'); }
  cvtResetOutput(); cvtRenderFiles();
}
function cvtDelPl(){ CS.pl=null; cvtResetOutput(); cvtRenderFiles(); }
function cvtDelTh(){ CS.th=null; cvtResetOutput(); cvtRenderFiles(); }
function cvtFmtBytes(b){ return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'; }

let cvtDragIdx=null;
function cvtInvDragStart(e,i){ cvtDragIdx=i; try{ e.dataTransfer.effectAllowed='move'; }catch(_){} }
function cvtInvDrop(e,i){ e.preventDefault(); if(cvtDragIdx==null||cvtDragIdx===i){ cvtDragIdx=null; return; }
  const a=CS.invPdfs; const [m]=a.splice(cvtDragIdx,1); a.splice(i,0,m); cvtDragIdx=null;
  cvtResetOutput(); cvtRenderFiles();   /* ลำดับล่าสุด → Main MAPPING/ENTRY LINE สร้างใหม่ตอน Export */
}
function cvtRenderFiles(){
  const il=document.getElementById('cvtInvList');
  if(il) il.innerHTML = CS.invPdfs.map((p,i)=>{
    const st=p.error?'<span class="ferr">อ่านไม่ได้</span>':(p.parsed?'<span class="fok">● พร้อม</span>':'⏳ กำลังอ่าน');
    return `<div class="frow" draggable="true" data-cvti="${i}" ondragstart="cvtInvDragStart(event,${i})" ondragover="event.preventDefault()" ondrop="cvtInvDrop(event,${i})" style="cursor:grab;padding:8px 10px;min-height:32px"><span class="fn" title="${escapeHtml(p.name)}" style="flex:1;min-width:0;max-width:none">☰ 📄 ${escapeHtml(p.name)}</span><span class="fmeta" style="flex:0 0 auto">${st}</span><button class="del" onclick="cvtDelInv(${i})">✕</button></div>`;
  }).join('')||'<div style="color:#8b949e;font-size:12.5px">ยังไม่มีไฟล์</div>';
  const pl=document.getElementById('cvtPlList');
  if(pl) pl.innerHTML = CS.pl?`<div class="frow" style="padding:8px 10px;min-height:32px"><span class="fn" title="${escapeHtml(CS.pl.name)}" style="flex:1;min-width:0;max-width:none">📄 ${escapeHtml(CS.pl.name)}</span><span class="fmeta" style="flex:0 0 auto"><span class="fok">● พร้อม</span></span><button class="del" onclick="cvtDelPl()">✕</button></div>`:'<div style="color:#8b949e;font-size:12.5px">ยังไม่มีไฟล์</div>';
  const th=document.getElementById('cvtThList');
  if(th) th.innerHTML = CS.th?`<div class="frow" style="padding:8px 10px;min-height:32px"><span class="fn" title="${escapeHtml(CS.th.name)}" style="flex:1;min-width:0;max-width:none">📊 ${escapeHtml(CS.th.name)}</span><span class="fmeta" style="flex:0 0 auto"><span class="fok">● พร้อม</span></span><button class="del" onclick="cvtDelTh()">✕</button></div>`:'<div style="color:#8b949e;font-size:12.5px">ยังไม่มีไฟล์</div>';
  cvtUpdateButtons();
  cvtTryPreview();
}
function cvtFmtNum(v,d){ const n=Number(v)||0; return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
/* ข้อ 5: ฟังก์ชันกลาง — Preview / EXPORT EXCEL / EXPORT LPI ต้องเรียกทางเดียวกันเสมอ
   CVT.buildMapping เป็น Pure Function (ไม่แก้ข้อมูลต้นฉบับ) จึงให้ผลเท่ากันทุกครั้งที่เรียก */
function cvtBuildFreshResult(){
  const invoices=CS.invPdfs.filter(p=>p.parsed).map(p=>p.parsed);
  const plData=(CS.pl&&CS.pl.data)?CS.pl.data:{rows:[],meta:null};
  const thFi=(CS.th&&CS.th.fi)?CS.th.fi:{rows:[]};
  const thRa=(CS.th&&CS.th.ra)?CS.th.ra:{byS:{}};
  return CVT.buildMapping(invoices, plData, thFi, thRa, convatecStaLookup);
}
function cvtTryPreview(){
  const sm=document.getElementById('cvtSummary'); if(!sm) return;
  if(CS.busy) return;
  if(!cvtFilesComplete()){ sm.innerHTML=''; return; }
  try{
    const res=cvtBuildFreshResult();
    CS.result=res;
    cvtRenderSummary(res);
  }catch(e){ sm.innerHTML=''; }
}
function cvtRenderSummary(res){
  const sm=document.getElementById('cvtSummary'); if(!sm) return;
  const v=res.validation;
  const card=(label,val,unit)=>`<div style="flex:1;min-width:150px;border:1px solid #30363d;border-radius:10px;padding:10px 14px;background:#161b22">
    <div style="font-size:12px;color:#8b949e;margin-bottom:3px">${label}</div>
    <div style="font-size:19px;font-weight:700;color:#e6edf3">${val}<span style="font-size:12px;color:#6e7681;font-weight:500"> ${unit||''}</span></div></div>`;
  sm.innerHTML=`<div style="margin-top:12px">
    <div style="font-weight:700;font-size:13px;color:#8b949e;margin-bottom:8px">📋 ยอดสรุปก่อน Export · ${res.mainRows.length} รายการ</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${card('QTY SHIPPED', cvtFmtNum(v.sumQty,0), 'EA')}
      ${card('NW', cvtFmtNum(v.sumNW,3), 'kg')}
      ${card('GW', cvtFmtNum(v.sumGW,3), 'kg')}
      ${card('VALUE', cvtFmtNum(v.sumValue,2), '')}
    </div>
  </div>`;
}
function cvtResetOutput(){ CS.result=null; const d=document.getElementById('cvtDash'); if(d) d.innerHTML=''; const pv=document.getElementById('cvtPreview'); if(pv) pv.innerHTML=''; const sm=document.getElementById('cvtSummary'); if(sm) sm.innerHTML=''; }

/* files complete = >=1 parsed invoice + PL + TH, no pending parse */
function cvtFilesComplete(){
  const pending=CS.invPdfs.some(p=>!p.parsed&&!p.error);
  const okInv=CS.invPdfs.filter(p=>p.parsed).length>=1;
  return okInv && !!CS.pl && !!CS.th && !pending;
}
function cvtUpdateButtons(){
  const on=!CS.busy;   // ข้อ 1: Export ได้ตลอด · Disabled เฉพาะขณะสร้างไฟล์ (CS.busy)
  const a=document.getElementById('cvtExpMainBtn'), b=document.getElementById('cvtExpLpiBtn');
  if(a) a.disabled=!on; if(b) b.disabled=!on;
}

/* ---------------- PIPELINE (runs on Export click) ---------------- */
function cvtSleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function cvtStep(btn, text){ if(btn) btn.innerHTML='<span class="cvt-sp"></span>'+text; await cvtSleep(30); }
async function cvtRunPipeline(btn){
  if(CS.invPdfs.some(p=>!p.parsed&&!p.error)){ await cvtStep(btn,'กำลังอ่านไฟล์...');
    while(CS.invPdfs.some(p=>!p.parsed&&!p.error)) await cvtSleep(80); }
  await cvtStep(btn,'กำลังอ่านไฟล์...');
  await cvtStep(btn,'กำลังจับคู่ข้อมูล...');
  await cvtStep(btn,'กำลังคำนวณ NW/GW...');
  // ข้อ 5: ใช้ฟังก์ชันกลางเดียวกับ Preview (ไฟล์ไม่ครบก็ Export ได้ — ค่าที่พึ่งไฟล์นั้นจะว่าง)
  const res=cvtBuildFreshResult();
  await cvtStep(btn,'กำลังตรวจสอบ...');
  CS.result=res;
  return res;
}

/* ---------------- EXPORT (single button, full auto) ---------------- */
function cvtDownload(bytes,fname){
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },800);
}
function cvtTs(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }

async function cvtExport(kind){
  if(CS.busy) return;   // ข้อ 1: ไม่บล็อกจากไฟล์ไม่ครบ — Export ได้เสมอ (ไม่มี Confirmation Modal)
  const btnMain=document.getElementById('cvtExpMainBtn'), btnLpi=document.getElementById('cvtExpLpiBtn');
  const btn = kind==='main'?btnMain:btnLpi;
  const origMain=btnMain.innerHTML, origLpi=btnLpi.innerHTML;
  const clearBtn=document.getElementById('cvtClearBtn');
  CS.busy=true; btnMain.disabled=true; btnLpi.disabled=true; if(clearBtn) clearBtn.disabled=true;
  const restore=()=>{ CS.busy=false; btnMain.innerHTML=origMain; btnLpi.innerHTML=origLpi; if(clearBtn) clearBtn.disabled=false; cvtUpdateButtons(); };
  try{
    const res=await cvtRunPipeline(btn);
    // ข้อ 7: ไฟล์ครบทั้ง 3 แหล่ง แต่จับคู่ TH Ship = 0 → หยุดก่อนสร้างไฟล์ (ห้ามดาวน์โหลดไฟล์ว่าง/ห้ามแจ้งสำเร็จ)
    const v=res.validation||{};
    const allSrc = (CS.invPdfs.filter(p=>p.parsed).length>=1)
                 && (CS.pl&&CS.pl.data&&CS.pl.data.rows&&CS.pl.data.rows.length>0)
                 && (CS.th&&CS.th.fi&&CS.th.fi.rows&&CS.th.fi.rows.length>0);
    const zeroMatch = allSrc && (v.totalBatches>0) && (v.matchedBatches===0);
    if(zeroMatch){
      const sk=v.sampleKeys||{};
      res.warnings.push('❌ จับคู่ข้อมูล TH Ship ไม่สำเร็จทั้งหมด กรุณาตรวจสอบ Invoice + Delivery + SAP + Batch (0/'+v.totalBatches+' Batch)');
      (sk.invoicePdf||[]).forEach(k=>res.warnings.push('  Invoice PDF: Invoice '+k.invoice+' · Delivery '+k.delivery));
      (sk.packingList||[]).forEach(k=>res.warnings.push('  Packing List: Delivery '+k.delivery+' · SAP '+k.sap+' · Batch '+k.batch+' · Qty '+k.qty));
      (sk.thShip||[]).forEach(k=>res.warnings.push('  TH Ship: Invoice '+k.invoice+' · Delivery '+k.delivery+' · SAP '+k.sap+' · Batch '+k.batch+' · Qty '+k.qty));
      try{ console.warn('CVT zero-match sampleKeys',sk); }catch(_){}
      cvtRenderDash(res);
      restore();
      toast('จับคู่ข้อมูล TH Ship ไม่สำเร็จทั้งหมด กรุณาตรวจสอบ Invoice + Delivery + SAP + Batch','err');
      return;   // ข้อ 7: ไม่สร้างไฟล์
    }
    await cvtStep(btn,'กำลังสร้าง Excel...');
    if(kind==='main'){ const bytes=CVT.exportMain(XLSX,null,res.mainRows); cvtDownload(bytes,'MAPPING_CONVATEC_'+cvtTs()+'.xlsx'); }
    else { const bytes=CVT.exportLPI(XLSX,null,res.lpiRows); cvtDownload(bytes,'MAPPING_LPI_CONVATEC_'+cvtTs()+'.xlsx'); }
    cvtRenderDash(res);
    restore();
    toast('Export สำเร็จ','ok');
  }catch(e){
    console.error(e); restore(); toast('Export ล้มเหลว: '+(e.message||e),'err');
  }
}
function cvtExportMain(){ return cvtExport('main'); }
function cvtExportLpi(){ return cvtExport('lpi'); }

/* ---------------- ERROR TABLE ---------------- */
function cvtRenderErrorTable(res){
  const rows=(res.issues||[]).map(x=>`<tr>
    <td>${escapeHtml(x.invoice||'')}</td><td>${escapeHtml(x.delivery||'')}</td>
    <td>${escapeHtml(String(x.line===''?'':x.line))}</td><td>${escapeHtml(x.item||'')}</td>
    <td>${escapeHtml(x.batch||'')}</td><td>${escapeHtml(x.reason||'')}</td></tr>`).join('');
  document.getElementById('cvtDash').innerHTML=`
    <div style="margin-top:14px;border:1px solid #f85149;border-radius:10px;padding:12px 14px;background:#161b22">
      <div style="font-weight:700;color:#d29922;margin-bottom:8px">⚠️ พบข้อมูลที่ควรตรวจสอบ ${res.issues.length} รายการ — ระบบยัง Export ได้</div>
      <div style="overflow:auto;max-height:340px">
        <table class="cvt-errtbl"><thead><tr><th>Invoice</th><th>Delivery</th><th>Line</th><th>Item</th><th>Batch</th><th>สาเหตุ</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
  document.getElementById('cvtPreview').innerHTML='';
}

/* ---------------- SUCCESS DASHBOARD ---------------- */
function cvtBadge(ok,txt){ return `<span style="display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:${ok?'#132e1e':'#3a1416'};color:${ok?'#3fb950':'#f85149'};border:1px solid ${ok?'#238636':'#a5232c'}">${ok?'✓':'✕'} ${txt}</span>`; }
function cvtRenderDash(res){
  const v=res.validation, meta=v.plMeta||{};
  const chkQ = meta.totalQty!=null ? Math.abs(v.sumQty-meta.totalQty)<0.5 : true;
  const chkN = meta.totalNW!=null ? Math.abs(v.sumNW-meta.totalNW)<=0.001 : true;
  const chkG = meta.totalGW!=null ? Math.abs(v.sumGW-meta.totalGW)<=0.001 : true;
  const per={}; res.mainRows.forEach(r=>per[r.A]=(per[r.A]||0)+1);
  const perHtml=Object.keys(per).map(k=>`${escapeHtml(k)}: <b>${per[k]}</b>`).join(' · ');
  const box=(title,color,items)=> items&&items.length?`<div style="margin-top:8px;border:1px solid ${color};border-radius:8px;padding:8px 10px;background:#0d1117">
    <div style="font-weight:600;color:${color};margin-bottom:4px">${title} (${items.length})</div>
    <div style="font-size:12.5px;color:#c9d1d9;max-height:140px;overflow:auto">${items.map(escapeHtml).join('<br>')}</div></div>`:'';
  document.getElementById('cvtDash').innerHTML=`
  <div style="margin-top:14px;border:1px solid #30363d;border-radius:10px;padding:12px 14px;background:#161b22">
    <div style="font-weight:700;font-size:14px;margin-bottom:8px">✅ Export สำเร็จ — สรุปผล</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      ${cvtBadge(chkQ,`SUM QTY ${v.sumQty}${meta.totalQty!=null?' / PL '+meta.totalQty:''}`)}
      ${cvtBadge(chkN,`SUM NW ${v.sumNW.toFixed(3)}${meta.totalNW!=null?' / PL '+meta.totalNW:''}`)}
      ${cvtBadge(chkG,`SUM GW ${v.sumGW.toFixed(3)}${meta.totalGW!=null?' / PL '+meta.totalGW:''}`)}
      ${cvtBadge(true,`แถว Main ${v.rowCount}`)}
      ${cvtBadge(true,`แถว LPI ${v.lpiCount}`)}
      ${cvtBadge(meta.totalPackages!=null,`Packages ${meta.totalPackages!=null?meta.totalPackages:'-'}`)}
    </div>
    <div style="font-size:12.5px;color:#8b949e">รายการต่อ Invoice: ${perHtml}</div>
    ${box('⚠️ Warnings','#d29922',res.warnings)}
  </div>`;
  const cols=['A','C','D','E','H','I','J','K','L','O','P','U'];
  const head=['INV','ITEM','INVLN','ENTRY','QTY','UOM','VALUE','HS','sta','COO','NW','GW'];
  const rows=res.mainRows.slice(0,12).map(r=>`<tr>${cols.map(c=>`<td style="border:1px solid #30363d;padding:3px 6px;font-size:12px">${escapeHtml(String(r[c]==null?'':r[c]))}</td>`).join('')}</tr>`).join('');
  document.getElementById('cvtPreview').innerHTML=`<div style="margin-top:12px;overflow:auto">
    <div style="font-size:12.5px;color:#8b949e;margin-bottom:4px">ตัวอย่าง Main Mapping (12 แถวแรก จาก ${res.mainRows.length})</div>
    <table style="border-collapse:collapse"><thead><tr>${head.map(h=>`<th style="border:1px solid #30363d;padding:3px 6px;font-size:12px;background:#21262d">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------------- RESET + MEMORY ---------------- */
function cvtReset(){
  if(CS.busy) return;
  CS.invPdfs=[]; CS.pl=null; CS.th=null; CS.result=null;
  const i1=document.getElementById('cvtInvInput'),i2=document.getElementById('cvtPlInput'),i3=document.getElementById('cvtThInput');
  if(i1)i1.value='';if(i2)i2.value='';if(i3)i3.value='';
  cvtResetOutput(); cvtRenderFiles();
  toast('ล้างข้อมูลและ Memory แล้ว','ok');
}

</script>
