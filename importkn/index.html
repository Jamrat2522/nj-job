/* อ่านวันที่จาก Invoice โดยตรง → 'DD/MM/YYYY' (ไม่ใช้ UTC/toISOString/timezone shift) */
function _wp2(n){ return String(n).padStart(2,'0'); }
function wisDMY(v){
  if(v==null||v==='') return null;
  if(typeof v==='number' && isFinite(v)){
    const str=XLSX.SSF.format('dd/mm/yyyy', v);           // คณิตล้วน ไม่มี timezone
    const m=str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? {str, y:+m[3]} : null;
  }
  if(v instanceof Date && !isNaN(v)){ return {str:`${_wp2(v.getDate())}/${_wp2(v.getMonth()+1)}/${v.getFullYear()}`, y:v.getFullYear()}; }
  let t=String(v).trim();
  let m=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; if(y>2400) y-=543; return {str:`${_wp2(+m[1])}/${_wp2(+m[2])}/${y}`, y}; }
  const TH={'ม.ค.':1,'ก.พ.':2,'มี.ค.':3,'เม.ย.':4,'พ.ค.':5,'มิ.ย.':6,'ก.ค.':7,'ส.ค.':8,'ก.ย.':9,'ต.ค.':10,'พ.ย.':11,'ธ.ค.':12};
  m=t.match(/(\d{1,2})\s*[-\s]\s*([ก-๙.]+)\s*[-\s]\s*(\d{2,4})/);
  if(m){ const mo=TH[m[2].replace(/\s/g,'')]; if(mo){ let y=+m[3]; if(y<100) y+=2000; if(y>2400) y-=543; return {str:`${_wp2(+m[1])}/${_wp2(mo)}/${y}`, y}; } }
  return null;
}

async function parseWisdomInvoice(arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const cellL=(r)=>r.map(c=>String(c==null?'':c).replace(/\s+/g,' ').trim().toLowerCase());
  const findNext=(r,ci)=>{ for(let j=ci+1;j<r.length;j++){ if(r[j]!=null&&String(r[j]).trim()!=='') return r[j]; } return ''; };
  let invoiceNo='',invoiceDate='',invoiceYear=null,purchaseCountry='';
  aoa.forEach(r=>{ const lc=cellL(r);
    lc.forEach((v,ci)=>{
      if(/invoice number/.test(v) && !invoiceNo){ const nx=findNext(r,ci); if(nx) invoiceNo=String(nx).replace(/\s+/g,' ').trim(); }
      if(/^date\s*:?$/.test(v) && !invoiceDate){ const nx=findNext(r,ci); const dmy=wisDMY(nx); if(dmy){ invoiceDate=dmy.str; invoiceYear=dmy.y; } }
      if(/from .*to\s*:/.test(v) && !purchaseCountry){ const nx=findNext(r,ci); if(nx) purchaseCountry=normalizeCountry(nx)||String(nx).trim(); }
    });
  });
  // item header row
  let hr=-1, cP,cN,cNW,cGW,cQ,cO,cPr,cAmt;
  for(let i=0;i<aoa.length;i++){ const lc=cellL(aoa[i]);
    const pi=lc.findIndex(v=>v==='part no.'||v==='part no'||/^part no\.?$/.test(v));
    if(pi>=0){ hr=i; const find=lbl=>lc.findIndex(v=>v===lbl);
      cP=pi; cN=find('part name'); cNW=find('nw.'); cGW=find('gw.'); cQ=find('quantity'); cO=find('origin');
      if(cN<0)cN=pi+1; if(cNW<0)cNW=5; if(cGW<0)cGW=6; if(cQ<0)cQ=7; if(cO<0)cO=8;
      cPr=cO+1; cAmt=cO+2; break; }
  }
  if(hr<0) throw new Error('ไม่พบตารางรายการ (Part No.) ในไฟล์ Invoice');
  const items=[];
  for(let i=hr+1;i<aoa.length;i++){ const r=aoa[i]; if(!r) continue;
    const pn=r[cP]; const pns=String(pn==null?'':pn).replace(/\s+/g,' ').trim();
    if(pns===''||/^total$/i.test(pns)) { if(items.length) break; else continue; }
    items.push({ partNo:pn, name:ancaCleanDesc(r[cN]), nw:Number(r[cNW])||0, gw:Number(r[cGW])||0, qty:Number(r[cQ])||0, origin:String(r[cO]||'').trim(), price:Number(r[cPr])||0, amount:Number(r[cAmt])||0 });
  }
  return { invoiceNo, invoiceDate, invoiceYear, purchaseCountry, items };
}

function buildWisdomMapping(){
  WISDOM.errors=[]; WISDOM.warnings=[];
  const ok=WISDOM.invoices.filter(f=>f.parsed && !f.error);
  if(!ok.length){ WISDOM.errors.push('ยังไม่ได้อัปโหลด Invoice (Excel) ที่อ่านได้'); return false; }
  const map=[]; let run=0;
  ok.forEach(f=>{ const inv=f.parsed;
    if(!inv.invoiceNo) WISDOM.warnings.push(`${f.name}: อ่าน Invoice No. ไม่ได้`);
    if(!inv.invoiceDate) WISDOM.warnings.push(`${f.name}: อ่าน Invoice Date ไม่ได้`);
    if(!inv.purchaseCountry) WISDOM.warnings.push(`${f.name}: อ่าน Purchase Country ไม่ได้`);
    inv.items.forEach(it=>{ run++;
      const pnNum=(typeof it.partNo==='number')?it.partNo:(/^\d+$/.test(String(it.partNo).trim())?Number(String(it.partNo).trim()):String(it.partNo||'').trim());
      map.push({ _i:map.length,_warn:[],_err:[],
        A:pnNum, B:it.name, C:'',D:'',E:'', F:it.nw, G:it.gw, H:it.qty, I:normalizeCountry(it.origin)||'', J:it.price, K:ancaRound2(it.amount),
        L:WIS_FIX.L, M:inv.invoiceNo, N:inv.invoiceDate, O:run, P:inv.purchaseCountry,
        Q:WIS_FIX.Q, R:WIS_FIX.R, S:(inv.invoiceYear||new Date().getFullYear()),
        T:WIS_FIX.T, U:WIS_FIX.U, V:WIS_FIX.V, W:WIS_FIX.W, X:WIS_FIX.X, Y:WIS_FIX.Y, Z:WIS_FIX.Z, AA:WIS_FIX.AA, AB:WIS_FIX.AB });
    });
  });
  WISDOM.mapping=map; validateWisdomMapping(); return WISDOM.errors.length===0;
}
function validateWisdomMapping(){
  const seen=new Set();
  WISDOM.mapping.forEach(r=>{ r._warn=[]; r._err=[];
    if(r.A===''||r.A==null) r._err.push('Part No. ว่าง');
    if(!r.B) r._err.push('Part Name ว่าง');
    if(!(r.H>0)) r._err.push('Quantity ต้อง > 0');
    if(!r.I) r._err.push('Origin ว่าง (กรอกเอง)');
    if(isNaN(Number(r.J))) r._err.push('Price ไม่ใช่ตัวเลข');
    if(isNaN(Number(r.K))) r._err.push('Amt. ไม่ใช่ตัวเลข');
    if(!r.M) r._err.push('invoice ว่าง');
    if(!r.N) r._err.push('invoice date ว่าง (กรอกเอง)');
    if(!r.P) r._err.push('Purchase Country ว่าง (กรอกเอง)');
    if(seen.has(r.O)) r._err.push('no. ซ้ำ'); seen.add(r.O);
    const calc=ancaRound2(Number(r.J)*Number(r.H));
    if(Number(r.K) && Math.abs(calc-Number(r.K))>0.5) r._warn.push('Price×Qty ต่าง Amt.');
    if(!(r.F>0)) r._warn.push('NW. ว่าง'); if(!(r.G>0)) r._warn.push('GW. ว่าง');
  });
  return WISDOM.mapping.filter(r=>r._err.length).length;
}

function exportWisdomExcel(){
  if(WISDOM.invoices.some(f=>!f.parsed&&!f.error)){ toast('กำลังอ่านไฟล์อยู่ รอสักครู่','info'); return; }

  const mb=document.getElementById('wisMsgs'); if(mb) mb.innerHTML='';
  if(!WISDOM.mapping.length){ toast('ยังไม่มีข้อมูล — อัปโหลดไฟล์ Invoice ก่อน','err'); return; }
  validateWisdomMapping();   // คำนวณเบื้องหลัง (ไม่บล็อก ไม่แจ้งเตือน)
  if(typeof WIS_TPL_B64!=='string'||!WIS_TPL_B64){ toast('ไม่พบไฟล์ Template ในระบบ','err'); return; }
  // อ่านไฟล์ต้นฉบับเพื่อดึงความกว้างคอลัมน์ / number format / margins / หัวข้อ / ชื่อ sheet ตามจริง (ไม่เดา)
  const tplwb=XLSX.read(WIS_TPL_B64,{type:'base64',cellStyles:true,cellNF:true});
  const tplws=tplwb.Sheets[tplwb.SheetNames[0]]; const tplName=tplwb.SheetNames[0];
  const NC=XLSX.utils.decode_range(tplws['!ref']).e.c+1;
  const H=[],tplZ=[]; for(let c=0;c<NC;c++){ const hc=tplws[XLSX.utils.encode_cell({r:0,c})]; H.push(hc?hc.v:(WIS_HEADERS[c]||'')); const d=tplws[XLSX.utils.encode_cell({r:1,c})]; tplZ.push(d&&d.z); }
  const cols=(tplws['!cols']||[]).map(c=>{ const o={}; if(c){ if(typeof c.wch==='number')o.wch=c.wch; else if(typeof c.wpx==='number')o.wpx=Math.round(c.wpx); } return o; });
  const margins=tplws['!margins'];
  // สไตล์ตามไฟล์ต้นฉบับจริง: Calibri 11 ไม่หนา · เส้นขอบบางครบ 4 ด้าน · หัวตารางพื้นสีส้ม FFC000 (โคลนต่อเซลล์กัน format รั่ว)
  const _thin={style:'thin',color:{rgb:'000000'}}; const _bd={top:_thin,bottom:_thin,left:_thin,right:_thin};
  const mkHead=()=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},fill:{patternType:'solid',fgColor:{rgb:'FFC000'}},border:_bd,alignment:{vertical:'center'}});
  const mkData=()=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},border:_bd,alignment:{vertical:'center'}});
  const dserial=v=>{ const d=(v instanceof Date)?v:new Date(v); return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000); };
  const acctC=new Set(['F','G','J','K']);          // รูปแบบ accounting
  const intC=new Set(['H','O','Q','S','X']);        // ตัวเลขจำนวนเต็ม
  const sumK=new Set(['F','G','H','K']);            // คอลัมน์ที่รวมยอดใน TOTAL (NW/GW/Quantity/Amount)
  const fmtK=new Set(['F','G','K']);                // #,##0.000 เฉพาะ น้ำหนัก (NW,GW) + เงิน (Amt) — ไม่ใส่ Quantity
  const FMT3='#,##0.000';
  const n=WISDOM.mapping.length;
  const ws={};
  for(let c=0;c<NC;c++){ ws[XLSX.utils.encode_cell({r:0,c})]={t:'s',v:String(H[c]==null?'':H[c]),s:mkHead()}; }
  WISDOM.mapping.forEach((r,ri)=>{ const R=ri+1;
    WIS_KEYS.forEach((k,c)=>{ if(c>=NC) return; const ref=XLSX.utils.encode_cell({r:R,c}); let v=r[k]; let cell;
      if(k==='N'){ cell={t:'s',v:(v==null?'':String(v))}; }   // วันที่เป็นข้อความ DD/MM/YYYY (ไม่ serial/ไม่ timezone)
      else if(acctC.has(k)){ cell={t:'n',v:Number(v)||0,z:tplZ[c]}; }
      else if(k==='A'){ cell=(typeof v==='number')?{t:'n',v}:{t:'s',v:String(v==null?'':v)}; }
      else if(intC.has(k)){ cell={t:'n',v:Number(v)||0}; }
      else { cell={t:'s',v:(v==null?'':String(v))}; }
      if(fmtK.has(k)) cell.z=FMT3;                  // เงิน/น้ำหนัก = #,##0.000 (Quantity ไม่ใส่)
      cell.s=mkData();
      ws[ref]=cell;
    });
  });
  // แถว TOTAL (สูตร SUM · ตัวหนา · คงเส้นขอบ)
  if(n>0){ const TR=n+1; const mkTot=()=>{ const s=mkData(); s.font={...s.font,bold:true}; return s; };
    for(let c=0;c<NC;c++){ const ref=XLSX.utils.encode_cell({r:TR,c}); const k=WIS_KEYS[c]; const L=XLSX.utils.encode_col(c);
      if(c===0){ ws[ref]={t:'s',v:'TOTAL',s:mkTot()}; }
      else if(sumK.has(k)){ let sum=0; for(const r of WISDOM.mapping) sum+=Number(r[k])||0; const cc={t:'n',f:`SUM(${L}2:${L}${n+1})`,v:sum,s:mkTot()}; if(fmtK.has(k)) cc.z=FMT3; ws[ref]=cc; }
      else { ws[ref]={t:'s',v:'',s:mkTot()}; }
    }
  }
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(n+1,1),c:NC-1}});
  ws['!cols']=cols; if(margins) ws['!margins']=margins;
  const wb={SheetNames:[tplName],Sheets:{}}; wb.Sheets[tplName]=ws;
  const invNos=[...new Set(WISDOM.mapping.map(r=>String(r.M==null?'':r.M).trim()).filter(Boolean))];
  if(!invNos.length){ toast('ไม่พบเลข Invoice ในไฟล์ — ไม่สามารถ Export ได้','err'); return; }
  const fname=invNos.join('_')+'.xlsx'; XLSX.writeFile(wb,fname,{bookType:'xlsx'});   // ชื่อไฟล์ = เลข Invoice
  const invs=[...new Set(WISDOM.mapping.map(r=>r.M))];
  toast(`Export สำเร็จ · ${invs.length} Invoice · ${n} รายการ · ${fname}`,'ok');
}

/* ==================================================================
   ตรวจน้ำหนัก SCH — เช็ค Net Weight ห้ามมากกว่า Gross Weight
   (browser-only · ฟังก์ชันแยกเฉพาะ prefix schw · ไม่แตะโหมดอื่น)
================================================================== */
const SCHW = { files:[], results:[], page:1, filter:'err', search:'' };
const SCHW_NW = ['NET WEIGHT','NW','NW.','NETWEIGHT','N.W.','N.W'];
const SCHW_GW = ['GROSS WEIGHT','GW','GW.','GROSSWEIGHT','G.W.','G.W'];
const SCHW_ITEM = ['ITEM NO.','ITEM NO','ITEM','ITEM NUMBER','NO.','LN'];
const SCHW_PROD = ['PRODUCT CODE','PART NO.','PART NO','PRODUCTCODE','ITEM NUMBER','PART NUMBER'];
const SCHW_DESC = ['DESC.','DESCRIPTION','DESC','PART NAME','PART DESC','DESC1','ENGLISH DESCRIPTION'];
function schwNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return isFinite(v)?v:null; const n=parseFloat(String(v).replace(/,/g,'').trim()); return isFinite(n)?n:null; }
function schwHeaderMatch(cell,list){ const s=String(cell==null?'':cell).replace(/\s+/g,' ').trim().toUpperCase(); return list.includes(s); }
function schwFindCol(headerRow,list){ for(let i=0;i<headerRow.length;i++){ if(schwHeaderMatch(headerRow[i],list)) return i; } return -1; }

function parseWeightWorkbook(name, arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array',cellDates:false});
  const out=[];
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn]; if(!ws) return;
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    if(!aoa.length) return;
    // หาแถวหัวตาราง: แถวที่มีทั้ง NW และ GW
    let hr=-1,nwCol=-1,gwCol=-1;
    for(let i=0;i<Math.min(aoa.length,30);i++){ const nw=schwFindCol(aoa[i],SCHW_NW), gw=schwFindCol(aoa[i],SCHW_GW);
      if(nw>=0&&gw>=0){ hr=i; nwCol=nw; gwCol=gw; break; } }
    if(hr<0) return; // ชีตนี้ไม่มีคอลัมน์น้ำหนัก → ข้าม
    const H=aoa[hr];
    const itemCol=schwFindCol(H,SCHW_ITEM), prodCol=schwFindCol(H,SCHW_PROD), descCol=schwFindCol(H,SCHW_DESC);
    let invCol=H.findIndex(c=>/invoice/i.test(String(c==null?'':c)));
    let lastInv='';
    for(let r=hr+1;r<aoa.length;r++){ const row=aoa[r]; if(!row||!row.length) continue;
      // invoice: จากคอลัมน์ invoice หรือสแกนทั้งแถว (รูปแบบ "Invoice No. :xxxx") แล้ว forward-fill
      let invHere='';
      const scan=(invCol>=0)?[row[invCol]]:row;
      for(const c of scan){ const m=String(c==null?'':c).match(/invoice\s*no\.?\s*:?\s*([A-Za-z0-9\-\/]+)/i); if(m){ invHere=m[1]; break; } }
      if(invHere) lastInv=invHere;
      const nw=schwNum(row[nwCol]), gw=schwNum(row[gwCol]);
      if(nw==null||gw==null) continue;                 // ข้ามแถวที่น้ำหนักว่าง/ไม่ใช่ตัวเลข
      out.push({ file:name, sheet:sn, excelRow:r+1, invoice:lastInv,
        item:String(row[itemCol]==null?'':row[itemCol]).trim(),
        product:String(row[prodCol]==null?'':row[prodCol]).trim(),
        desc:String(row[descCol]==null?'':row[descCol]).replace(/\s+/g,' ').trim(),
        nw, gw, diff:Math.round((nw-gw+Number.EPSILON)*1000)/1000, isError:nw>gw });
    }
  });
  return out;
}

function schwRenderResults(){
  const box=document.getElementById('schwResult'); if(!box) return;
  const all=SCHW.results, total=all.length, nErr=all.filter(r=>r.isError).length, nOk=total-nErr;
  let h=`<div class="stats">
      <div class="stat"><div class="k">ตรวจทั้งหมด</div><div class="v">${total}</div></div>
      <div class="stat"><div class="k">ถูกต้อง</div><div class="v" style="color:#3fb950">${nOk}</div></div>
      <div class="stat err"><div class="k">ผิดพลาด (NW&gt;GW)</div><div class="v">${nErr}</div></div>

  if(nErr===0){

function exportSchwErrors(){
  const errs=SCHW.results.filter(r=>r.isError);
  if(!errs.length){ toast('ไม่มีรายการผิดให้ Export','err'); return; }
  const head=['ITEM','Sheet','Row','Invoice','Product Code','Description','NW','GW','Difference'];
  const ws={}; const thin={style:'thin',color:{rgb:'B0B0B0'}}; const border={top:thin,bottom:thin,left:thin,right:thin};
  head.forEach((h,ci)=>ws[XLSX.utils.encode_cell({r:0,c:ci})]={t:'s',v:h,s:{font:{name:'Tahoma',sz:11,bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'C0392B'}},alignment:{horizontal:'center',vertical:'center'},border}});
  errs.forEach((r,ri)=>{ const R=ri+1;
    const vals=[r.item,r.sheet,r.excelRow,r.invoice,r.product,r.desc,r.nw,r.gw,r.diff];
    vals.forEach((v,ci)=>{ const ref=XLSX.utils.encode_cell({r:R,c:ci}); let cell;
      if(ci===2){ cell={t:'n',v:Number(v)||0}; }
      else if(ci>=6){ cell={t:'n',v:Number(v)||0,z:'#,##0.000'}; }
      else cell={t:'s',v:String(v==null?'':v)};
      cell.s={font:{name:'Tahoma',sz:10},alignment:{vertical:'center',wrapText:(ci===5)},border};
      ws[ref]=cell; });
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:errs.length,c:8}});
  ws['!cols']=[{wch:8},{wch:12},{wch:10},{wch:14},{wch:20},{wch:38},{wch:12},{wch:12},{wch:14}];
  ws['!rows']=[{hpt:26}];
  ws['!autofilter']={ref:'A1:I'+(errs.length+1)};
  ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  const now=new Date(); const ts=now.getFullYear()+_ancaPad2(now.getMonth()+1)+_ancaPad2(now.getDate())+'_'+_ancaPad2(now.getHours())+_ancaPad2(now.getMinutes())+_ancaPad2(now.getSeconds());
  const fname=`SCH_WEIGHT_ERROR_${ts}.xlsx`; XLSX.writeFile(wb,fname);
  toast(`Export สำเร็จ · ${errs.length} รายการผิด · ${fname}`,'ok');
}

function sigParseWorkbook(name, arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array',cellDates:true});
  const findSheet=re=>wb.SheetNames.find(n=>re.test(n));
  const invSn=findSheet(/invoice/i)||wb.SheetNames[0];
  const pkSn=findSheet(/packing/i);
  const inv=sigParseInvoice(XLSX.utils.sheet_to_json(wb.Sheets[invSn],{header:1,raw:true,defval:''}));
  const pack=pkSn?sigParsePacking(XLSX.utils.sheet_to_json(wb.Sheets[pkSn],{header:1,raw:true,defval:''})):{rows:[],boi:''};
  return { name, inv, pack };
}
function sigParseInvoice(aoa){
  const flat=aoa.map(r=>r.map(c=>String(c==null?'':c)));
  let invoiceNo='',date=null,inland=null,brand='SIG COMBIBLOC',origin='',dest='',mark='As address';
  aoa.forEach(r=>{ r.forEach(c=>{ const s=String(c==null?'':c);
    let m;
    if(!invoiceNo&&(m=s.match(/invoice\s*no\.?\s*:?\s*([0-9]{5,})/i))) invoiceNo=m[1];
    if(!date&&(m=s.match(/date\s*:?\s*([A-Za-z]{3,}\.?\s+\d{1,2},?\s+\d{4})/i))){ const d=new Date(m[1].replace(/\./,'')); if(!isNaN(d)) date=new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
    if((m=s.match(/brand of goods\s*:?\s*(.+)/i))) brand=m[1].trim();
    if(!origin&&(m=s.match(/country of origin[^:]*:\s*([A-Za-z]+)/i))) origin=normalizeCountry(m[1])||m[1];
  }); });
  // inland charge
  for(let i=0;i<aoa.length;i++){ if(aoa[i].some(c=>/INLAND CHARGE/i.test(String(c)))){ const nums=aoa[i].map(sigNum).filter(v=>v!=null); if(nums.length) inland=ancaRound2(nums[nums.length-1]); break; } }
  // purchase country: หา country name ในบล็อกที่อยู่ผู้รับ (ไม่ใช่ Thailand)
  for(const r of aoa){ for(const c of r){ const cc=normalizeCountry(String(c==null?'':c).trim()); if(cc && cc!=='TH'){ dest=cc; break; } } if(dest) break; }
  // shipping mark
  for(let i=0;i<aoa.length;i++){ if(aoa[i].some(c=>/Shipping Marks/i.test(String(c)))){ for(let j=i+1;j<Math.min(i+5,aoa.length);j++){ const v=String(aoa[j][0]==null?'':aoa[j][0]).trim(); if(v){ mark=v; break; } } break; } }
  // product header: แถวที่มี 'Unit Price EUR' หรือ 'Designation'
  let hr=-1;
  for(let i=0;i<aoa.length;i++){ if(aoa[i].some(c=>/Unit Price EUR/i.test(String(c)))||aoa[i].some(c=>/^Designation$/i.test(String(c).trim()))){ hr=i; break; } }
  const items=[];
  if(hr>=0){ for(let i=hr+1;i<aoa.length;i++){ const row=aoa[i];
    if(row.some(c=>/EXW PRICE|FOB PRICE|INLAND CHARGE/i.test(String(c)))) break;
    const qty=sigNum(row[0]); const desg=String(row[2]==null?'':row[2]).replace(/\s+/g,' ').trim();
    if(qty!=null && desg){ items.push({ qty, designation:desg, unitPrice:sigNum(row[5]), amount:sigNum(row[7]), currency:'EUR' }); }
  } }
  return { invoiceNo, date, inland, brand, origin:origin||'TH', dest:dest||'', mark, items };
}
function sigParsePacking(aoa){
  let hr=-1;
  for(let i=0;i<aoa.length;i++){ if(String(aoa[i][0]==null?'':aoa[i][0]).trim().toLowerCase()==='products'){ hr=i; break; } }
  const rows=[]; let boi='', boiSeen=false, blocks=[];
  if(hr<0) return {rows, boi, blocks};
  // เก็บ "ทุกแถว" ตามลำดับบน→ล่าง · ห้ามยุบรายการที่ชื่อสินค้าซ้ำกัน (เดิมเก็บเป็น map จึงถูกทับ)
  // BOI No. : ทุกครั้งที่พบ = เริ่ม "ช่วงใหม่" ใช้กับรายการที่อยู่ถัดจากบรรทัดนั้นจนกว่าจะพบ BOI No. บรรทัดถัดไป
  // → BOI เดิมที่กลับมาปรากฏอีกครั้ง ถือเป็นช่วงใหม่ · เก็บค่าดิบ (คง / และ - · ไม่ตัดศูนย์ · ไม่แปลงเป็นตัวเลข)
  for(let i=hr+1;i<aoa.length;i++){ const row=aoa[i]; const a=String(row[0]==null?'':row[0]).trim();
    if(!a) continue;
    let m=a.match(/BOI\s*No\.?\s*(.+)/i);
    if(m){ boi=String(m[1]).trim(); boiSeen=true; blocks.push({boi, from:rows.length+1, to:null}); continue; }
    if(/^Total/i.test(a)||/^BRAND/i.test(a)) continue;
    const pallet=sigNum(row[3]); if(pallet==null) continue;
    rows.push({ order:rows.length+1, designation:a.replace(/\s+/g,' '), pallet,
                carton:sigNum(row[4]), qty:sigNum(row[5]), nw:sigNum(row[6]), gw:sigNum(row[7]),
                boi:boi });   // ← BOI ของช่วงที่แถวนี้สังกัด (ไม่ใช่ BOI ตัวสุดท้ายของไฟล์)
  }
  blocks.forEach((b,i)=>{ b.to = (i+1<blocks.length? blocks[i+1].from-1 : rows.length); });
  return {rows, boi, blocks, boiSeen};
}

function sigDesgKey(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().toUpperCase(); }
/* จับคู่ Invoice แบบ One-to-One ตามลำดับแถว · แถวที่ใช้แล้วห้ามนำกลับมาใช้ซ้ำ

   ห้ามใช้ find() ที่คืนรายการแรกเสมอ */
function sigTakeInvItem(items, used, desgKey, qty){
  for(let i=0;i<items.length;i++){ if(used[i]) continue;
    if(sigDesgKey(items[i].designation)===desgKey && sigNum(items[i].qty)===qty){ used[i]=true; return items[i]; } }
  for(let i=0;i<items.length;i++){ if(used[i]) continue;
    if(sigDesgKey(items[i].designation)===desgKey){ used[i]=true; return items[i]; } }
  return null;
}
function sigNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return isFinite(v)?v:null; const n=parseFloat(String(v).replace(/,/g,'').trim()); return isFinite(n)?n:null; }
function sigProductCode(desg){ const m=String(desg).match(/^(.*?\bML)\b/i); if(m) return m[1].replace(/\s+/g,' ').trim(); return String(desg).split(/\s+/).slice(0,3).join(' '); }

function buildSigMapping(){
  SIG.errors=[]; SIG.warnings=[];
  const parsed=SIG.files.filter(f=>f.parsed&&!f.error).map(f=>f.parsed);
  if(!parsed.length){ SIG.errors.push('ยังไม่ได้อัปโหลดไฟล์ที่อ่านได้'); return false; }
  const map=[]; let run=0;
  parsed.forEach(p=>{ const inv=p.inv, packRows=(p.pack&&p.pack.rows)?p.pack.rows:[];
    if(!inv.invoiceNo) SIG.warnings.push(`${p.name}: อ่าน Invoice No. ไม่ได้`);
    if(!inv.date) SIG.warnings.push(`${p.name}: อ่าน Invoice Date ไม่ได้`);
    if(!inv.dest) SIG.warnings.push(`${p.name}: อ่าน Purchase Country (ปลายทาง) ไม่ได้`);
    const yr=inv.date instanceof Date?inv.date.getFullYear():new Date().getFullYear();
    let fileRow=0;
    // สร้าง 1 แถว Export ต่อ 1 รายการ (ห้ามรวม/ตัดรายการซ้ำ) · ค่าหีบห่อ/CT/NW/GW มาจาก Packing แถวเดียวกัน
    const emit=(it,pk)=>{ run++; fileRow++;
      const desg = it? it.designation : (pk?pk.designation:'');
      const qty  = (it && it.qty!=null) ? it.qty : (pk?pk.qty:'');
      map.push({ _i:map.length,_warn:[],_err:[],
        A:inv.invoiceNo?Number(inv.invoiceNo):'', B:inv.date, C:run,
        D:sigProductCode(desg), E:SIG_FIX.E,
        F:SIG_FIX.F_PRE+SIG_FIX.SEP+desg+SIG_FIX.SEP+SIG_FIX.F_SUF,
        G:(qty==null?'':qty), H:SIG_FIX.H, I:(it?it.unitPrice:''), J:SIG_FIX.J,
        K:(it&&it.unitPrice!=null?it.unitPrice/SIG_FIX.J:''), L:(it?it.amount:''), M:(it&&it.currency)||'EUR',
        N:(fileRow===1?inv.inland:''), O:(fileRow===1?'EUR':''),
        P:pk?pk.pallet:'', Q:SIG_FIX.Q, R:pk?pk.carton:'', S:SIG_FIX.S, T:pk?pk.nw:'', U:pk?pk.gw:'',
        V:inv.mark, W:inv.dest, X:inv.origin, Y:yr, Z:SIG_FIX.Z, AA:SIG_FIX.AA, AB:inv.brand,
        AC:SIG_FIX.AC, AD:(pk&&pk.boi)?pk.boi:'', AE:SIG_FIX.AE, AF:SIG_FIX.AF, AG:inv.date, AH:SIG_FIX.AH,
        _desg:desg });
    };
    if(packRows.length){
      // เรียงตาม Packing list จากบนลงล่าง 100% (ไม่เรียงตาม Product code / Description / จำนวน)
      const used=inv.items.map(()=>false);
      packRows.forEach(pk=>{
        const it=sigTakeInvItem(inv.items, used, sigDesgKey(pk.designation), pk.qty);
        if(!it) SIG.warnings.push(`${p.name}: Packing แถวที่ ${pk.order} ไม่พบรายการที่ตรงใน Invoice → ${pk.designation} (Qty ${pk.qty})`);
        emit(it, pk);
      });
      // รายการใน Invoice ที่ไม่มีแถว Packing รองรับ — ต้องไม่หาย (ต่อท้าย + แจ้งเตือน)
      inv.items.forEach((it,i)=>{ if(!used[i]){
        SIG.warnings.push(`${p.name}: ไม่พบใน Packing list → ${it.designation} (Qty ${it.qty})`);
        emit(it, null);
      } });
    } else {
      SIG.warnings.push(`${p.name}: ไม่พบชีต Packing list — ใช้ลำดับตาม Invoice`);
      inv.items.forEach(it=>emit(it, null));
    }
  });
  SIG.mapping=map;
  // แจ้งเตือนก่อน Export: รายการที่ไม่พบ BOI License No (เว้นว่างไว้ ไม่เดาค่า)
  const noBoi=map.filter(r=>!r.AD).map(r=>r.C);
  if(noBoi.length) SIG.warnings.push(`ไม่พบ BOI License No สำหรับ Item ที่ ${noBoi.join(', ')}`);
  validateSigMapping(); return SIG.errors.length===0;
}
function validateSigMapping(){
  const seen=new Set();
  SIG.mapping.forEach(r=>{ r._warn=[]; r._err=[];
    if(r.A===''||r.A==null) r._err.push('INVOICE ว่าง');
    if(!(r.B instanceof Date)) r._err.push('INVOICE DATE ว่าง');
    if(seen.has(r.C)) r._err.push('ITEMS ซ้ำ'); seen.add(r.C);
    if(!r.D) r._err.push('Product code ว่าง');
    if(!(r.G>0)) r._err.push('Qty ต้อง > 0');
    if(sigNum(r.I)==null) r._err.push('Unit Price ว่าง');
    if(sigNum(r.L)==null) r._err.push('Amount ว่าง');
    if(!r.W) r._err.push('Purchase Country ว่าง (กรอกเอง)');
    if(!r.X) r._err.push('Country of origin ว่าง');
    if(r.P===''||r.P==null) r._err.push('หีบห่อ ว่าง (จาก Packing list)');
    if(sigNum(r.T)==null) r._err.push('NET WEIGHT ว่าง (จาก Packing list)');
    if(sigNum(r.U)==null) r._err.push('GROSS WEIGHT ว่าง (จาก Packing list)');
    if(!r.AD) r._warn.push('BOI License ว่าง');
    if(sigNum(r.T)!=null && sigNum(r.U)!=null && sigNum(r.T)>sigNum(r.U)) r._warn.push('NET > GROSS');
    if(pk_qty_mismatch(r)) r._warn.push('Qty Invoice ≠ Packing');
  });
  return SIG.mapping.filter(r=>r._err.length).length;
}
function pk_qty_mismatch(r){ return false; }

function sigRenderFiles(){
  const el=document.getElementById('sigList'); if(!el) return;
  el.innerHTML=SIG.files.map((f,i)=>{ const p=f.parsed;
    const st=f.error?`<span class="ferr">อ่านไม่ได้: ${escapeHtml(f.error)}</span>`:(p?`<span class="fok">อ่านสำเร็จ</span> · Invoice <b>${escapeHtml(p.inv.invoiceNo||'?')}</b> · ${ancaDateToStr(p.inv.date)||'—'} · ${p.inv.items.length} รายการ · ปลายทาง <b>${escapeHtml(p.inv.dest||'?')}</b>`:'กำลังอ่าน...');
    return `<div class="frow"><span class="fn">📊 ${escapeHtml(f.name)}</span><span class="fmeta">${ancaFmtBytes(f.size)} · ${st}</span><button class="del" onclick="sigDelFile(${i})">✕</button></div>`;
  }).join('')||'<div style="color:#8b949e;font-size:12.5px">ยังไม่มีไฟล์</div>';
}
async function sigAddFiles(files){
  for(const f of files){ if(!/\.(xlsx?|csv)$/i.test(f.name)) continue;
    const rec={name:f.name,size:f.size,parsed:null,error:null}; SIG.files.push(rec); sigRenderFiles();
    try{ rec.parsed=sigParseWorkbook(f.name, await csvToUploadBuffer(f)); }catch(e){ rec.error=e.message; }
    sigRenderFiles();
  }
  sigResetOutput();
}
function sigDelFile(i){ SIG.files.splice(i,1); sigRenderFiles(); sigResetOutput(); }
function sigResetOutput(){ SIG.mapping=[]; const pv=document.getElementById('sigPreview'); if(pv)pv.innerHTML=''; const mb=document.getElementById('sigMsgs'); if(mb)mb.innerHTML=''; }
function sigAnalyze(){
  buildSigMapping();
  const mb=document.getElementById('sigMsgs'); if(mb) mb.innerHTML='';   // ไม่แสดงกล่องสรุป Warning/Error
  const has=SIG.mapping.length>0; document.getElementById('sigPreviewBtn').disabled=!has;
  const nErr=SIG.mapping.filter(r=>r._err.length).length;
  document.getElementById('sigExportBtn').disabled=!(has&&nErr===0&&SIG.errors.length===0);
  sigShowPreview();
  if(nErr||SIG.errors.length) toast(`วิเคราะห์เสร็จ · Error ${nErr+SIG.errors.length} จุด (ตรวจสอบภายหลังได้)`,'err');
  else toast(`วิเคราะห์เสร็จ · ${SIG.mapping.length} รายการ พร้อม Export`,'ok');
}
function sigRenderMsgs(){
  const mb=document.getElementById('sigMsgs'); if(!mb) return;
  const re=[],rw=[]; SIG.mapping.forEach(r=>{ r._err.forEach(e=>re.push(`item ${r.C} (${r.D}): ${e}`)); r._warn.forEach(w=>rw.push(`item ${r.C}: ${w}`)); });
  const E=[...SIG.errors,...re], W=[...SIG.warnings,...rw]; let h='';
  if(E.length) h+=`<div class="msgbox err"><b>⚠️ ควรตรวจสอบ (${E.length})</b><ul>${E.slice(0,40).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;
  if(W.length) h+=`<div class="msgbox warn"><b>⚠️ Warning (${W.length})</b><ul>${W.slice(0,30).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;
  mb.innerHTML=h;
}
function sigShowPreview(){
  if(!SIG.mapping.length) return;
  validateSigMapping();                 // ยังคำนวณ error/warning เบื้องหลังเพื่อใช้ตอน Export
  const pv=document.getElementById('sigPreview'); if(pv) pv.innerHTML='';   // ไม่แสดงกล่องสรุป/ตาราง
}
function sigEditCell(i,k,val){
  const r=SIG.mapping.find(x=>x._i===i); if(!r) return; val=String(val).trim();
  if(['G','I','L','P','R','T','U'].includes(k)) r[k]=Number(val.replace(/,/g,''))||0;
  else if(k==='W'||k==='X') r[k]=normalizeCountry(val)||val.toUpperCase();
  else r[k]=val;
  if(k==='I'||k==='L') r.K=(sigNum(r.I)!=null?Number(r.I)/SIG_FIX.J:'');
  const nErr=validateSigMapping();
  document.getElementById('sigExportBtn').disabled=!(nErr===0&&SIG.errors.length===0);
  sigRenderMsgs();
}
function exportSigExcel(){
  buildSigMapping();   // อัตโนมัติ: อ่าน → วิเคราะห์ → mapping
  const mb=document.getElementById('sigMsgs'); if(mb) mb.innerHTML='';
  if(!SIG.mapping.length){ toast('ยังไม่มีข้อมูล — อัปโหลดไฟล์ Invoice ก่อน','err'); return; }
  validateSigMapping();   // คำนวณเบื้องหลัง (ไม่บล็อก ไม่แจ้งเตือน)
  if(typeof SIG_TPL_B64!=='string'||!SIG_TPL_B64){ toast('ไม่พบไฟล์ Template ในระบบ','err'); return; }
  // อ่านไฟล์ต้นฉบับเพื่อดึงความกว้างคอลัมน์ / number format / margins / หัวข้อ ตามจริง (ไม่เดา)
  const tplwb = XLSX.read(SIG_TPL_B64, {type:'base64', cellStyles:true, cellNF:true});
  const tplws = tplwb.Sheets[tplwb.SheetNames[0]];
  const tplName = tplwb.SheetNames[0];
  const rng = XLSX.utils.decode_range(tplws['!ref']);
  const NC = rng.e.c+1;
  const H=[], tplZ=[]; for(let c=0;c<NC;c++){ const hc=tplws[XLSX.utils.encode_cell({r:0,c})]; H.push(hc?hc.v:(SIG_HEADERS[c]||'')); const d=tplws[XLSX.utils.encode_cell({r:1,c})]; tplZ.push(d&&d.z); }
  const cols=(tplws['!cols']||[]).map(c=>{ const o={}; if(c){ if(typeof c.wpx==='number')o.wpx=Math.round(c.wpx); else if(typeof c.wch==='number')o.wch=c.wch; } return o; });
  const margins=tplws['!margins'];
  // สไตล์ตามไฟล์ต้นฉบับจริง: Calibri 11, ไม่หนา, ไม่มีสีพื้น, จัดกึ่งกลางแนวตั้ง, เส้นขอบบางครบ 4 ด้าน (โคลนต่อเซลล์ กัน format รั่ว)
  const _thin={style:'thin',color:{rgb:'000000'}};
  const mkS=()=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},alignment:{vertical:'center'},border:{top:_thin,bottom:_thin,left:_thin,right:_thin}});
  const dserial=v=>{ if(v instanceof Date) return Math.floor((Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())-Date.UTC(1899,11,30))/86400000);
    if(typeof v==='number' && isFinite(v)) return Math.round(v);   // เป็น serial อยู่แล้ว → ปัดเศษเวลาทิ้ง (46216.0000462963 → 46216)
    const d=new Date(v); return isNaN(d.getTime())?v:Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000); };
  const dateC=new Set(['B','AG']);
  const numC=new Set(['A','C','G','I','J','K','L','N','P','R','T','U','Y']);
  const sumK=new Set(['G','L','N','P','R','T','U']);   // คอลัมน์ที่รวมยอดใน TOTAL (Qty/Amount/Inland/หีบห่อ/CT/NW/GW)
  const fmtK=new Set(['L','N','T','U']);               // #,##0.000 เฉพาะ เงิน/มูลค่า (Amount,Inland) + น้ำหนัก (NW,GW)
  const FMT3='#,##0.000';
  const n=SIG.mapping.length;
  // ประกอบ worksheet โดยคงหัวข้อ/รูปแบบจากต้นฉบับ แล้วฉีดข้อมูล
  const ws={};
  for(let c=0;c<NC;c++){ ws[XLSX.utils.encode_cell({r:0,c})]={t:'s',v:String(H[c]==null?'':H[c]),s:mkS()}; }
  SIG.mapping.forEach((r,ri)=>{ const R=ri+1;
    SIG_KEYS.forEach((k,c)=>{ if(c>=NC) return; const ref=XLSX.utils.encode_cell({r:R,c}); let v=r[k]; let cell;
      if(v===''||v==null){ ws[ref]={t:'s',v:'',s:mkS()}; return; }   // ช่องว่าง (N/O เฉพาะแถว 1) คงเส้นขอบตาราง
      if(dateC.has(k)) cell={t:'n', v:dserial(v), z:'dd/mm/yyyy'};   // วันที่ serial สะอาด · แสดง 13/07/2026
      else if(numC.has(k)) cell={t:'n', v:Number(v)};
      else cell={t:'s', v:String(v)};
      if(fmtK.has(k)) cell.z=FMT3;                                  // เงิน/น้ำหนัก = #,##0.000 (ปริมาณไม่ใส่)
      else if(tplZ[c] && !dateC.has(k)) cell.z=tplZ[c];             // คงรูปแบบตัวเลขจากต้นฉบับ (เช่น AF = '0')
      cell.s=mkS();
      ws[ref]=cell;
    });
  });
  // แถว TOTAL (สูตร SUM ของ Excel · ตัวหนา · คงเส้นขอบ)
  if(n>0){ const TR=n+1; const mkTot=()=>{ const s=mkS(); s.font={...s.font,bold:true}; return s; };
    for(let c=0;c<NC;c++){ const ref=XLSX.utils.encode_cell({r:TR,c}); const k=SIG_KEYS[c]; const L=XLSX.utils.encode_col(c);
      if(c===0){ ws[ref]={t:'s',v:'TOTAL',s:mkTot()}; }
      else if(sumK.has(k)){ let sum=0; for(const r of SIG.mapping) sum+=Number(r[k])||0; const cc={t:'n',f:`SUM(${L}2:${L}${n+1})`,v:sum,s:mkTot()}; if(fmtK.has(k)) cc.z=FMT3; ws[ref]=cc; }
      else { ws[ref]={t:'s',v:'',s:mkTot()}; }
    }
  }
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(n+1,1), c:NC-1}});
  ws['!cols']=cols;
  if(margins) ws['!margins']=margins;
  const wb={SheetNames:[tplName], Sheets:{}}; wb.Sheets[tplName]=ws;
  const sigInvNos=[...new Set(SIG.files.filter(f=>f.parsed&&!f.error).map(f=>f.parsed&&f.parsed.inv&&f.parsed.inv.invoiceNo).map(v=>String(v==null?'':v).trim()).filter(Boolean))];
  if(!sigInvNos.length){ toast('ไม่พบเลข Invoice ในไฟล์ — ไม่สามารถ Export ได้','err'); return; }
  const fname=sigInvNos.join('_')+'.xlsx';   // ชื่อไฟล์ = เลข Invoice เท่านั้น
  XLSX.writeFile(wb, fname, {bookType:'xlsx'});   // .xlsx เพื่อคงเส้นขอบ/สไตล์ตารางให้เหมือนต้นฉบับ
  toast(`Export สำเร็จ · ${n} รายการ · ${fname}`,'ok');
}

// แปลงวันที่จริง (รองรับ ค.ศ./พ.ศ. · yyyy-mm-dd / dd-mm-yyyy / Date) → timestamp หรือ null (ว่าง)
function knParseDate(v){
  if(v==null||v==='') return null;
  let d=null;
  if(v instanceof Date && !isNaN(v.getTime())) d=v;
  else { const s=String(v).trim(); let m;
    if(m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)){ let y=+m[1]; if(y>2500)y-=543; d=new Date(y,(+m[2])-1,+m[3]); }
    else if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/)){ let y=+m[3]; if(y>2500)y-=543; d=new Date(y,(+m[2])-1,+m[1]); }
    else { const dd=new Date(s); if(!isNaN(dd.getTime())) d=dd; }
  }
  if(!d||isNaN(d.getTime())) return null;
  let y=d.getFullYear(); if(y>2500) d=new Date(y-543,d.getMonth(),d.getDate());   // เผื่อ Date เก็บปี พ.ศ.
  return d.getTime();
}
// จัดเรียงเฉพาะตารางแสดงผล (ไม่แตะ knFiltered → ไม่กระทบ Export)
// กลุ่มบนสุด: รอดราฟใบขน + มีวันที่ลูกค้าส่งเอกสารครบ → เก่า→ใหม่ · ถัดไป: สถานะอื่นที่มีวันที่ → เก่า→ใหม่ · ท้ายสุด: ไม่มีวันที่
function knSortForList(rows){
  const tier=r=>{ const has=knParseDate(r.kn_doc_complete_date)!=null; if(!has) return 2; return r.kn_st_draft?0:1; };
  return rows.slice().sort((a,b)=>{
    const ta=tier(a), tb=tier(b);
    if(ta!==tb) return ta-tb;
    if(ta<2){ return knParseDate(a.kn_doc_complete_date)-knParseDate(b.kn_doc_complete_date); }   // มีวันที่ → เก่า→ใหม่
    return String(b[C.createdAt]||'').localeCompare(String(a[C.createdAt]||''));   // ไม่มีวันที่ → ใหม่ก่อน (ท้ายสุดของทั้งหมด)
  });
}
function knTableHtml(rows){
  rows=knSortForList(rows);   // เรียงใหม่ทุกครั้งที่เรนเดอร์ (เพิ่ม/แก้ไข/รีเฟรช/เปลี่ยนสถานะ)
  const admin=isSuperAdmin();
  const PS=CONFIG.PAGE_SIZE, start=(KNS.page-1)*PS, slice=rows.slice(start,start+PS);
  const dcol=new Set(KN_FIELDS.filter(f=>f[2]).map(f=>f[1]));
  const HIDE=new Set(['kn_order_customer','kn_doc_sent_date','kn_release_port','kn_user','kn_delivery_date','kn_billing_date','kn_job_nj','kn_job_kn']);   // ซ่อนจากตารางหลัก → ไปดู/แก้ในปุ่ม ⋮ แทน (ยังบันทึก/ค้นหา/Import/Export ได้)
  const cols=KN_FIELDS.filter(f=>!HIDE.has(f[1]));
  const th = cols.map(f=>`<th>${escapeHtml(f[0])}</th>`).join('') + '<th></th>';
  let body;
  if(!slice.length){ body=`<tr><td colspan="${cols.length+1}" style="text-align:center;color:var(--muted);padding:26px">— ไม่มีข้อมูล —</td></tr>`; }
  else body=slice.map((r,i)=>{
    const canEdit=true;   // USER แก้ได้ทุกแถว
    const nf=(S.knBillCount&&S.knBillCount[r[C.id]])||0;
    const fileBtn = nf>0?`<button class="iconbtn" title="ไฟล์แนบ (${nf})" onclick="knBillViewModal('${String(r[C.id])}')">📎</button>`:'';
    const tds=cols.map(f=>{
      if(f[1]==='_seq') return `<td style="text-align:center;color:var(--muted)">${start+i+1}</td>`;
      if(f[1]==='status') return `<td>${knStatusesOf(r).map(knStatusChip).join(' ')||'—'}</td>`;
      let v=r[f[1]];
      if(dcol.has(f[1])) return `<td>${v?fmtDate(v):'—'}</td>`;
      return `<td>${escapeHtml(v!=null&&v!==''?String(v):'—')}</td>`;
    }).join('');
    const acts = `<div class="rowact" style="justify-content:flex-end">
        <button class="iconbtn" title="จัดการ (USER, วันที่ส่งของ, วันที่วางบิล, JOB NJ, JOB KN)" onclick="knQuickModal('${String(r[C.id])}')">⋮</button>
        ${fileBtn}
        ${canEdit?`<button class="iconbtn" title="แก้ไข" onclick="knOpenModal('${String(r[C.id])}')">✏️</button>`:''}
        ${admin?`<button class="iconbtn del" title="ลบ" onclick="knDelete('${String(r[C.id])}')">🗑️</button>`:''}
        ${(!fileBtn&&!canEdit&&!admin)?'<span style="color:var(--muted2)">—</span>':''}
      </div>`;
    return `<tr>${tds}<td>${acts}</td></tr>`;
  }).join('');
  const totalP=Math.max(1,Math.ceil(rows.length/PS));
  const pager=`<div class="pager"><span class="pinfo">หน้า ${KNS.page}/${totalP} · ${rows.length} งาน</span>
    <div class="pbtns"><button class="pbtn" ${KNS.page<=1?'disabled':''} onclick="knPage(${KNS.page-1})">‹</button>
    <button class="pbtn" ${KNS.page>=totalP?'disabled':''} onclick="knPage(${KNS.page+1})">›</button></div></div>`;
  return `<div class="tablewrap"><div class="tscroll kn-tscroll"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>${pager}</div>`;
}

    kn_user:g('kn_user')||null,
    kn_delivery_date:dv('kn_delivery_date'),
    kn_billing_date:dv('kn_billing_date'),
    kn_job_nj:dv('kn_job_nj'),

  };

    if(!sb) initSupabase();

    const r=S.reports.find(x=>String(x[C.id])===String(id)); if(r) Object.assign(r,payload);   // อัปเดต local ทันที (ไม่ต้องรีเฟรชหน้า)
    closeModal(); knRenderView();   // รายการเดิมอัปเดตทันที
    toast('บันทึกข้อมูลสำเร็จ','ok');
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='💾 บันทึก';} toast('บันทึกไม่สำเร็จ: '+(e.message||e),'err'); }
}
async function knSave(id){
  const g=k=>{const el=document.getElementById('kf_'+k);return el?el.value.trim():'';};
  const dv=k=>{const v=g(k);return v||null;};
  const cb=k=>{const el=document.getElementById('kf_'+k);return !!(el&&el.checked);};   // checkbox → boolean
  const editing=id!=null;
  const r = editing ? S.reports.find(x=>String(x[C.id])===String(id)) : null;
  // สิทธิ์: USER แก้ได้ทุกงาน · จำกัดเฉพาะการลบ (SUPER_ADMIN)
  const payload={
    customer:CONFIG.KN,
    bl_awb:dv('bl_awb'),
    kn_order_customer:dv('kn_order_customer'), kn_company:dv('kn_company'),
    kn_import_port:dv('kn_import_port'), kn_release_port:dv('kn_release_port'),
    kn_job_nj:dv('kn_job_nj'), kn_job_kn:dv('kn_job_kn'),
    kn_problem_status:dv('kn_problem_status'),
    kn_user:g('kn_user')||CUR.username,
    kn_eta:dv('kn_eta'), kn_doc_sent_date:dv('kn_doc_sent_date'), kn_doc_complete_date:dv('kn_doc_complete_date'),
    kn_doc_enter_date:dv('kn_doc_enter_date'),
    kn_nj_confirm_date:dv('kn_nj_confirm_date'), kn_cust_confirm_date:dv('kn_cust_confirm_date'),
    kn_do_date:dv('kn_do_date'), kn_release_date:dv('kn_release_date'),
    kn_delivery_date:dv('kn_delivery_date'), kn_billing_date:dv('kn_billing_date')
  };
  // สถานะ = เลือกได้ 1 (radio) · อ่านจาก hidden kf_kn_selstatus → boolean เดียว true · อื่น false
  const selCol = g('kn_selstatus');
  KN_ST_FIELDS.forEach(s=>{ payload[s[1]] = (s[1]===selCol); });
  const selField = KN_ST_FIELDS.find(s=>s[1]===selCol);
  payload.status = selField ? selField[0] : '';
  // เอกสารที่ลูกค้าส่งมา → boolean (true/false แยกคอลัมน์)
  KN_DOC_FIELDS.forEach(d=>{ payload[d[1]]=cb(d[1]); });
  payload[KN_DOC_OTHER_COL]=dv('kn_doc_other_text');   // ข้อความใบอนุญาตอื่น (แยกคอลัมน์ · ยกเลิกติ๊กไม่ลบข้อความ)
  // รายละเอียดแต่ละสถานะ → text แยกคอลัมน์ (ทุกช่องอยู่ใน DOM · แก้ช่องหนึ่งไม่ทับช่องอื่น)
  KN_ST_FIELDS.forEach(s=>{ payload[s[3]]=dv(s[3]); });
  // auto-fill วันที่ตามสถานะที่เลือก (เติมเฉพาะช่องว่าง)
  const today=new Date().toISOString().slice(0,10);
  if(payload.kn_st_confirm && !payload.kn_nj_confirm_date) payload.kn_nj_confirm_date=today;
  if(payload.kn_st_released && !payload.kn_release_date) payload.kn_release_date=today;
  if(payload.kn_st_billed && !payload.kn_billing_date) payload.kn_billing_date=today;
  const btn=document.getElementById('knSaveBtn'); if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก...';}
  try{
    if(!sb) initSupabase();
    let rid=id;
    if(editing){ const {error}=await sb.from(CONFIG.TABLE).update(payload).eq(C.id,id); if(error)throw error; }
    else { payload[C.createdBy]=CUR.username; const {data,error}=await sb.from(CONFIG.TABLE).insert(payload).select('id').single(); if(error)throw error; rid=data&&data.id; }
    const fmsg = await knBillCommit(rid);   // อัปโหลด/ลบ/เปลี่ยนชื่อไฟล์แนบ
    closeModal(); await loadReports(); await knRefreshBillCounts(); knRenderView();
    toast('บันทึกงาน KN สำเร็จ'+(fmsg?' · '+fmsg:''),'ok');
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='💾 บันทึก';} toast('บันทึกไม่สำเร็จ: '+(e.message||e),'err'); }
}
async function knDelete(id){
  if(!isSuperAdmin()){ toast('เฉพาะผู้ดูแลระบบเท่านั้น','err'); return; }
  const r=S.reports.find(x=>String(x[C.id])===String(id));
  if(!confirm(`ลบงาน KN "${(r&&(r.kn_job_nj||r.bl_awb))||id}" ?`)) return;

    await loadReports(); knRenderView(); toast('ลบงาน KN แล้ว','ok'); }
  catch(e){ toast('ลบไม่สำเร็จ: '+(e.message||e),'err'); }
}

/* ---------- ไฟล์แนบใบวางบิล ---------- */
function knBillFind(uid){ return KN_BILL.items.find(x=>x._uid===uid); }
function knBillReset(){ KN_BILL={items:[],reportId:null}; }
async function knBillInit(reportId){
  KN_BILL={items:[],reportId:reportId||null};
  knBillRender();
  if(!reportId) return;
  try{ if(!sb) initSupabase();
    const {data,error}=await sb.from(KN_BILL_TABLE).select('*').eq('report_id',reportId).order('uploaded_at',{ascending:true});
    if(error)throw error;
    KN_BILL.items=(data||[]).map(d=>({id:d.id,display_name:d.display_name,file_name:d.file_name,storage_path:d.storage_path,size:d.size,mime_type:d.mime_type,uploaded_at:d.uploaded_at,_uid:'e'+d.id}));
    knBillRender();
  }catch(e){ console.error('load bill files',e); const box=document.getElementById('knBillList'); if(box) box.innerHTML='<div class="knbill-empty">โหลดไฟล์แนบไม่สำเร็จ</div>'; }
}
function knBillRender(){
  const box=document.getElementById('knBillList'); if(!box) return;
  const items=KN_BILL.items.filter(it=>!it._deleted);
  if(!items.length){ box.innerHTML='<div class="knbill-empty">— ยังไม่มีไฟล์แนบ —</div>'; return; }
  box.innerHTML=items.map(it=>`<div class="knbill-item">
    <div class="knbill-item-main">
      <input class="knbill-name" id="knbn_${it._uid}" value="${attr(it.display_name)}" placeholder="${attr(it.file_name)}" oninput="knBillSetName('${it._uid}',this.value)">
      <div class="knbill-meta">📄 ${escapeHtml(it.file_name)} · ${ancaFmtBytes(it.size||0)}${it._new?' · <span class="knbill-new">ใหม่</span>':''}</div>
    </div>
    <div class="knbill-acts">
      <button type="button" class="knbill-b" title="ดู/ดาวน์โหลด" onclick="knBillOpen('${it._uid}')">⬇️</button>
      <button type="button" class="knbill-b" title="เปลี่ยนชื่อ" onclick="knBillFocusName('${it._uid}')">✏️</button>
      <button type="button" class="knbill-b del" title="ลบ" onclick="knBillDelete('${it._uid}')">🗑️</button>
    </div>
  </div>`).join('');
}
function knBillTriggerAdd(){ const el=document.getElementById('knBillInput'); if(el){ el.value=''; el.click(); } }
function knBillOnPick(ev){
  const files=Array.from(ev.target.files||[]);
  files.forEach(f=>{ KN_BILL.items.push({_new:true,_file:f,display_name:f.name,file_name:f.name,size:f.size,mime_type:f.type||'application/octet-stream',_uid:'n'+(++_knBillUid)}); });
  ev.target.value='';
  knBillRender();
}
function knBillSetName(uid,val){ const it=knBillFind(uid); if(!it) return; it.display_name=val; if(it.id) it._renamed=true; }
function knBillFocusName(uid){ const el=document.getElementById('knbn_'+uid); if(el){ el.focus(); el.select(); } }
function knBillDelete(uid){
  const it=knBillFind(uid); if(!it) return;
  const nm=(it.display_name||it.file_name||'').trim();
  if(!confirm(`ลบไฟล์ "${nm}" ?`)) return;
  if(it._new){ KN_BILL.items=KN_BILL.items.filter(x=>x._uid!==uid); }
  else { it._deleted=true; }   // ไฟล์เดิม → ทำเครื่องหมายลบ (ลบจริงตอนบันทึก) · ไม่กระทบไฟล์อื่น
  knBillRender();
}
async function knBillOpen(uid){
  const it=knBillFind(uid); if(!it) return;
  if(it._new && it._file){ const url=URL.createObjectURL(it._file); window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000); return; }
  try{ if(!sb) initSupabase();
    const {data,error}=await sb.storage.from(KN_BILL_BUCKET).createSignedUrl(it.storage_path,3600);
    if(error)throw error; window.open(data.signedUrl,'_blank');
  }catch(e){ toast('เปิดไฟล์ไม่สำเร็จ: '+(e.message||e),'err'); }
}
// บันทึกการเปลี่ยนแปลงไฟล์ (อัปโหลดใหม่ · ลบเดิม · เปลี่ยนชื่อ) — เรียกหลังบันทึกงานสำเร็จ
async function knBillCommit(reportId){
  if(!reportId||!KN_BILL||!KN_BILL.items.length) return '';
  let up=0,del=0,ren=0,err=0;
  for(const it of KN_BILL.items){
    try{
      if(it._deleted){
        if(it.id){ if(it.storage_path){ try{ await sb.storage.from(KN_BILL_BUCKET).remove([it.storage_path]); }catch(_e){} }
          const {error}=await sb.from(KN_BILL_TABLE).delete().eq('id',it.id); if(error)throw error; del++; }
        continue;
      }
      if(it._new){
        const name=(it.display_name||'').trim()||it.file_name;
        const safe=String(it.file_name).replace(/[^\w.\-]+/g,'_');
        const path=reportId+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+safe;
        const {error:ue}=await sb.storage.from(KN_BILL_BUCKET).upload(path,it._file,{contentType:it.mime_type||'application/octet-stream',upsert:false});
        if(ue)throw ue;
        const {error:ie}=await sb.from(KN_BILL_TABLE).insert({report_id:reportId,app_code:CONFIG.APP_CODE,display_name:name,file_name:it.file_name,storage_path:path,size:it.size,mime_type:it.mime_type,uploaded_by:(CUR&&CUR.username)||null});
        if(ie){ try{ await sb.storage.from(KN_BILL_BUCKET).remove([path]); }catch(_e){} throw ie; }
        up++;
      } else if(it._renamed){
        const name=(it.display_name||'').trim()||it.file_name;
        const {error}=await sb.from(KN_BILL_TABLE).update({display_name:name}).eq('id',it.id); if(error)throw error; ren++;
      }
    }catch(e){ err++; console.error('bill file op',e); }
  }
  const parts=[]; if(up)parts.push('แนบ '+up+' ไฟล์'); if(del)parts.push('ลบ '+del); if(ren)parts.push('เปลี่ยนชื่อ '+ren); if(err)parts.push('ไฟล์ผิดพลาด '+err);
  return parts.join(' · ');
}
// นับจำนวนไฟล์แนบต่อรายงาน (ปุ่ม 📎 ในตาราง)
async function knRefreshBillCounts(){
  try{ if(!sb) initSupabase();
    const ids=knBaseSet().map(r=>r[C.id]).filter(Boolean);

    const {data,error}=await sb.from(KN_BILL_TABLE).select('report_id').in('report_id',ids);

    const m={}; (data||[]).forEach(d=>{ m[d.report_id]=(m[d.report_id]||0)+1; });
    S.knBillCount=m;

function knExport(){
  const rows=knFiltered().length?knFiltered():knVisible();
  if(!rows.length){ toast('ไม่มีข้อมูลให้ส่งออก','err'); return; }
  if(typeof KN_TPL_B64!=='string'||!KN_TPL_B64){ toast('ไม่พบ template ในระบบ','err'); return; }
  const tplwb=XLSX.read(KN_TPL_B64,{type:'base64',cellStyles:true,cellNF:true});
  const tplName='รอปล่อย2';
  const tplws=tplwb.Sheets[tplName]||tplwb.Sheets[tplwb.SheetNames[0]];
  const NC=29;   // A-AC (เพิ่ม ENTER, วันที่ ENTER เอกสาร, ใบอนุญาตอื่น(ระบุ) จาก template เดิม 26)
  const enc=(r,c)=>XLSX.utils.encode_cell({r,c});
  const _thin={style:'thin',color:{rgb:'000000'}}, _bd={top:_thin,bottom:_thin,left:_thin,right:_thin};
  const mkHead=(fill)=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},fill:{patternType:'solid',fgColor:{rgb:fill}},border:_bd,alignment:{horizontal:'center',vertical:'center'}});
  const mkData=(center)=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},border:_bd,alignment:center?{horizontal:'center',vertical:'center'}:{vertical:'center'}});
  // map คอลัมน์ → {k:key, t:type, h:หัว}  (type: seq/date/bool/status/text · spacer=คอลัมน์ว่างหัวเหลือง)
  const M=[
    {t:'seq',h:'ลำดับ'},                                    // A
    {k:'kn_order_customer',h:'ชื่อลูกค้าที่สั่งงาน'},        // B
    {k:'kn_company',h:'บริษัท'},                            // C
    {k:'bl_awb',h:'BL'},                                    // D
    {k:'kn_eta',t:'date',h:'ETA'},                          // E
    {k:'kn_import_port',h:'ท่านำเข้า'},                     // F
    {k:'kn_doc_sent_date',t:'date',h:'วันที่ลูกค้าส่งเอกสาร'},      // G
    {k:'kn_doc_enter_date',t:'date',h:'วันที่ ENTER เอกสาร'},       // H (ใหม่)
    {k:'kn_doc_complete_date',t:'date',h:'วันที่ลูกค้าส่งเอกสารครบ'},// I
    {k:'kn_nj_confirm_date',t:'date',h:'วันที่ NJ ส่งคอนเฟิร์มดราฟ'},// I
    {t:'status',h:'สถานะ'},                                 // J
    {k:'kn_problem_status',h:'สถานะติดปัญหา'},              // K
    {k:'kn_user',h:'USER'},                                 // L
    {k:'kn_cust_confirm_date',t:'date',h:'วันที่ลูกค้าคอนเฟิร์มดราฟ'},// M
    {k:'kn_do_date',t:'date',h:'วันที่ได้รับดีโอ'},          // N
    {k:'kn_release_date',t:'date',h:'วันที่ตรวจปล่อย'},      // O
    {k:'kn_delivery_date',t:'date',h:'วันที่ส่งของ'},        // P
    {k:'kn_doc_enter',t:'bool',h:'ENTER'},                  // Q ENTER (ก่อน BL)
    {k:'kn_doc_bl',t:'bool',h:'BL'},                        // R BL
    {k:'kn_doc_inv',t:'bool',h:'INV'},                      // S INV
    {k:'kn_doc_pkl',t:'bool',h:'PKL'},                      // T PKL
    {k:'kn_doc_rm_excel',t:'bool',h:'FORM'},                // U FORM (เดิม RM EXCEL)
    {k:'kn_doc_import_pdf',t:'bool',h:'สมอ'},               // V สมอ (เดิม ใบขาเข้า PDF)
    {k:'kn_doc_export_excel',t:'bool',h:'ใบอนุญาตอื่น'},    // W ใบอนุญาตอื่น (เดิม ใบขาออก EXCEL)
    {k:'kn_doc_other_text',h:'ใบอนุญาตอื่น (ระบุ)'},        // X ข้อความใบอนุญาตอื่น
    {spacer:true,h:''},                                     // Y คอลัมน์ว่าง (หัวเหลือง)
    {k:'kn_billing_date',t:'date',h:'วันที่ส่งเอกสารเข้าวางบิล'},   // Z
    {k:'kn_job_nj',h:'JOB NJ'},                             // AA
    {k:'kn_job_kn',h:'JOB KN'}                              // AB
  ];
  const dserial=v=>{ if(v==null||v==='')return null; const d=(v instanceof Date)?v:new Date(v); if(isNaN(d.getTime()))return null; return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000); };
  const ws={};
  // หัว (style ตาม template · spacer=เหลือง FFFF00 · อื่น=FFC000)
  for(let c=0;c<NC;c++) ws[enc(0,c)]={t:'s',v:M[c].h,s:mkHead(M[c].spacer?'FFFF00':'FFC000')};
  // ข้อมูล
  rows.forEach((r,ri)=>{ const R=ri+1;
    for(let c=0;c<NC;c++){
      const m=M[c]; const ref=enc(R,c); let cell;
      if(m.spacer){ cell={t:'s',v:'',s:mkData(false)}; ws[ref]=cell; continue; }   // คอลัมน์ว่าง
      if(m.t==='seq'){ cell={t:'n',v:ri+1,s:mkData(true)}; }
      else if(m.t==='status'){ cell={t:'s',v:knStatusText(r)||String(r.status||''),s:mkData(false)}; }
      else if(m.t==='date'){ const s=dserial(r[m.k]); cell=(s==null)?{t:'s',v:'',s:mkData(false)}:{t:'n',v:s,z:'dd/mm/yyyy',s:mkData(false)}; cell.s.numFmt='dd/mm/yyyy'; }
      else if(m.t==='bool'){ cell={t:'s',v:(r[m.k]?'✓':''),s:mkData(true)}; }
      else { const v=r[m.k]; cell=(v==null||v==='')?{t:'s',v:'',s:mkData(false)}:{t:'s',v:String(v),s:mkData(false)}; }
      ws[ref]=cell;
    }
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length,1),c:NC-1}});
  // ความกว้างคอลัมน์ตาม template (A/ข้อความ/spacer/วันที่วางบิล ≈19.7 · อื่น 13)
  const wideCol=new Set([0,24,25,26]);
  ws['!cols']=Array.from({length:NC},(_,c)=>({wch: wideCol.has(c)?19.71:13}));
  const wb={SheetNames:[tplName],Sheets:{}}; wb.Sheets[tplName]=ws;
  const now=new Date(), p2=n=>String(n).padStart(2,'0');
  const fname=`Report_KN_${now.getFullYear()}${p2(now.getMonth()+1)}${p2(now.getDate())}_${p2(now.getHours())}${p2(now.getMinutes())}${p2(now.getSeconds())}.xlsx`;
  XLSX.writeFile(wb,fname,{bookType:'xlsx'});
  toast(`Export สำเร็จ · ${rows.length} งาน · ${fname}`,'ok');
}

function knTriggerImport(){ const el=document.getElementById('knImportFile'); if(el) el.click(); }   // USER นำเข้าได้

// แปลงค่าวันที่จาก Excel (serial/Date/ข้อความ) → 'YYYY-MM-DD' รองรับ พ.ศ. (>2500 → -543)
function knImportDate(v){
  if(v==null||v==='') return null;
  let d=null;
  if(v instanceof Date && !isNaN(v.getTime())) d=v;
  else if(typeof v==='number' && isFinite(v)){ const o=new Date(Math.round((v-25569)*86400*1000)); if(!isNaN(o.getTime())) d=new Date(o.getUTCFullYear(),o.getUTCMonth(),o.getUTCDate()); }
  else { const s=String(v).trim(); let m;
    if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/)){ let y=+m[3]; if(y>2500)y-=543; d=new Date(y,(+m[2])-1,+m[1]); }
    else if(m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)){ let y=+m[1]; if(y>2500)y-=543; d=new Date(y,(+m[2])-1,+m[3]); }
    else { const dd=new Date(s); if(!isNaN(dd.getTime())) d=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate()); }
  }
  if(!d||isNaN(d.getTime())) return null;
  let y=d.getFullYear(); if(y>2500)y-=543;   // เผื่อ Date object เก็บปี พ.ศ.
  return y+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
async function knImportExcel(ev){
  const file=ev.target.files&&ev.target.files[0]; ev.target.value='';
  if(!file) return;
  const EXPECT=KN_FIELDS.map(f=>f[0]);   // หัว A-T ที่ต้องตรง (20 คอลัมน์) — ['ลำดับ',...,'JOB KN']
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    // หาชีตที่มี "หัวคอลัมน์ KN จริง" (ชื่อลูกค้าที่สั่งงาน + JOB NJ/KN) — รองรับทุกชื่อชีต (Sheet1 / รอปล่อย2 ฯลฯ)
    let sn=null;
    for(const name of wb.SheetNames){
      const test=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
      if(!test.length) continue;
      const h=test[0].map(x=>String(x==null?'':x).replace(/\s+/g,' ').trim());
      if(h.includes('ชื่อลูกค้าที่สั่งงาน') && (h.includes('JOB NJ')||h.includes('JOB KN'))){ sn=name; break; }
    }
    if(!sn){ alert('ไม่พบชีตที่มีหัวคอลัมน์ KN (ต้องมี "ชื่อลูกค้าที่สั่งงาน" และ "JOB NJ")\n\nชีตที่มีในไฟล์: '+wb.SheetNames.join(', ')); return; }
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    if(!aoa.length){ alert('ไฟล์ว่างเปล่า — ไม่พบข้อมูล'); return; }
    // ตรวจหัวคอลัมน์ A-T ต้องตรง 100%
    const hdr=aoa[0].map(x=>String(x==null?'':x).replace(/\s+/g,' ').trim());
    const norm=s=>String(s).replace(/\s+/g,'').trim();
    for(let c=0;c<EXPECT.length;c++){
      if(norm(hdr[c]||'')!==norm(EXPECT[c])){
        alert(`หัวคอลัมน์ไม่ตรงกับต้นฉบับ — หยุดนำเข้า\n\nคอลัมน์ที่ ${c+1} (${String.fromCharCode(65+c)})\nต้องเป็น: "${EXPECT[c]}"\nแต่พบ: "${hdr[c]||'(ว่าง)'}"\n\nอ่านจาก sheet: ${sn}`);
        return;
      }
    }
    // อ่านแถวข้อมูล → payload (A-T map ตาม KN_FIELDS · A=ลำดับ ข้าม · ข้ามคอลัมน์หลัง T)
    const items=[]; const rowErrors=[];
    const _normSt=x=>String(x==null?'':x).replace(/\s+/g,'').toLowerCase();
    for(let r=1;r<aoa.length;r++){
      const raw=aoa[r]; if(!raw||raw.every(x=>x==null||x==='')) continue;   // ข้ามแถวว่าง
      const rec={customer:CONFIG.KN};
      for(let c=1;c<KN_FIELDS.length;c++){   // c=0 คือ 'ลำดับ' ข้าม · อ่านแค่ A-T
        const f=KN_FIELDS[c]; const val=raw[c];
        if(f[2]){   // คอลัมน์วันที่
          const hasVal = val!=null && String(val).trim()!=='';
          const dv=knImportDate(val);
          if(hasVal && dv==null) rowErrors.push(`แถว ${r+1} คอลัมน์ ${String.fromCharCode(65+c)} (${f[0]}): วันที่ผิดรูปแบบ "${String(val).trim()}" — นำเข้าแถวนี้ (เว้นวันที่)`);
          rec[f[1]]=dv;
        } else { const s=(val==null?'':String(val)).trim(); rec[f[1]] = s===''?null:s; }
      }
      // สถานะ: match แบบ normalize (เว้นวรรค/ตัวพิมพ์) → ติ๊ก boolean · ไม่ตรงก็ยังนำเข้า (ไม่ skip)
      const stRaw=(rec.status==null?'':String(rec.status)).trim();
      const matched=KN_ST_FIELDS.find(s=>_normSt(s[0])===_normSt(stRaw));
      KN_ST_FIELDS.forEach(s=>{ rec[s[1]] = !!(matched && matched[1]===s[1]); });
      rec.status = matched ? matched[0] : stRaw;   // ตรง→ชื่อมาตรฐาน · ไม่ตรง→เก็บข้อความดิบ
      if(stRaw && !matched) rowErrors.push(`แถว ${r+1}: สถานะ "${stRaw}" ไม่ตรง 5 สถานะมาตรฐาน — นำเข้าแล้ว (ยังไม่ติ๊กสถานะ แก้ไขภายหลังได้)`);
      if(!rec.kn_user) rec.kn_user=CUR.username;
      rec._row=r+1;
      items.push(rec);
    }
    if(!items.length){ alert('ไม่มีแถวที่นำเข้าได้\n\n'+(rowErrors.length?('ปัญหา:\n'+rowErrors.slice(0,20).join('\n')):'ไม่พบข้อมูล')); return; }
    // dedupe ด้วย JOB NJ + JOB KN · แถวที่ JOB ว่างทั้งคู่ → ไม่ dedupe (นำเข้าทุกแถว)
    const keyOf=x=>{ const nj=String(x.kn_job_nj||'').trim(), kn=String(x.kn_job_kn||'').trim(); return (nj===''&&kn==='')?null:(nj+'||'+kn); };
    const existMap={};
    knBaseSet().forEach(x=>{ const k=keyOf(x); if(k!==null) existMap[k]=x[C.id]; });
    const dupCount=items.filter(x=>{ const k=keyOf(x); return k!==null && existMap[k]!=null; }).length;
    let updateDup=false;
    if(dupCount>0){
      updateDup=confirm(`พบรายการซ้ำ (JOB NJ + JOB KN) จำนวน ${dupCount} รายการ\n\nกด "OK" = อัปเดตข้อมูลเดิม\nกด "Cancel" = ข้ามรายการซ้ำ`);
    }
    // ประมวลผล upsert
    if(!sb) initSupabase();
    let created=0,updated=0,skipped=0,failed=0; const errs=[]; const warns=[...rowErrors];
    const seenInFile=new Set();
    for(const it of items){
      const key=keyOf(it); const row=it._row; delete it._row;
      if(key!==null){   // มี JOB → ตรวจซ้ำ · ไม่มี JOB → นำเข้าเสมอ
        if(seenInFile.has(key)){ skipped++; warns.push(`แถว ${row}: ซ้ำในไฟล์เดียวกัน (ข้าม)`); continue; }
        seenInFile.add(key);
      }
      const existId = key!==null ? existMap[key] : undefined;
      try{
        if(existId!=null){
          if(!updateDup){ skipped++; continue; }
          const {error}=await sb.from(CONFIG.TABLE).update(it).eq(C.id,existId); if(error)throw error; updated++;
        } else {
          it[C.createdBy]=CUR.username;
          const {error}=await sb.from(CONFIG.TABLE).insert(it); if(error)throw error; created++;
        }
      }catch(e){ failed++; errs.push(`แถว ${row}: ${e.message||e}`); }
    }
    await loadReports(); knRenderView();   // รีเฟรชรายการ + Dashboard อัตโนมัติ
    let msg=`นำเข้าเสร็จสิ้น (ชีต: ${sn})\n\n`+
      `รายการทั้งหมดในไฟล์: ${items.length}\n`+
      `นำเข้าสำเร็จ (สร้างใหม่): ${created}\n`+
      `อัปเดตข้อมูลเดิม: ${updated}\n`+
      `ข้าม: ${skipped}\n`+
      `ผิดพลาด (บันทึกไม่สำเร็จ): ${failed}`;
    if(errs.length) msg+=`\n\n❌ ผิดพลาด:\n`+errs.slice(0,20).join('\n')+(errs.length>20?`\n...อีก ${errs.length-20} รายการ`:'');
    if(warns.length) msg+=`\n\n⚠️ คำเตือน (นำเข้าแล้ว):\n`+warns.slice(0,20).join('\n')+(warns.length>20?`\n...อีก ${warns.length-20} รายการ`:'');
    alert(msg);
    toast(`นำเข้า KN: สร้าง ${created} · อัปเดต ${updated} · ข้าม ${skipped}`+(failed?` · ผิดพลาด ${failed}`:'')+(warns.length?` · คำเตือน ${warns.length}`:''), failed?'err':'ok');
  }catch(e){ alert('นำเข้าไม่สำเร็จ: '+(e.message||e)); }
}

// แปลงวันที่จริง (รองรับ ค.ศ./พ.ศ. · yyyy-mm-dd / dd-mm-yyyy / Date) → timestamp หรือ null (ว่าง)
function schParseDate(v){
  if(v==null||v==='') return null;
  let d=null;
  if(v instanceof Date && !isNaN(v.getTime())) d=v;
  else { const s=String(v).trim(); let m;
    if(m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)){ let y=+m[1]; if(y>2500)y-=543; d=new Date(y,(+m[2])-1,+m[3]); }
    else if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/)){ let y=+m[3]; if(y>2500)y-=543; d=new Date(y,(+m[2])-1,+m[1]); }
    else { const dd=new Date(s); if(!isNaN(dd.getTime())) d=dd; }
  }
  if(!d||isNaN(d.getTime())) return null;
  let y=d.getFullYear(); if(y>2500) d=new Date(y-543,d.getMonth(),d.getDate());   // เผื่อ Date เก็บปี พ.ศ.
  return d.getTime();
}
// จัดเรียงเฉพาะตารางแสดงผล (ไม่แตะ schFiltered → ไม่กระทบ Export)
// กลุ่มบนสุด: รอดราฟใบขน + มีวันที่ลูกค้าส่งเอกสารครบ → เก่า→ใหม่ · ถัดไป: สถานะอื่นที่มีวันที่ → เก่า→ใหม่ · ท้ายสุด: ไม่มีวันที่
function schSortForList(rows){
  const tier=r=>{ const has=schParseDate(r.kn_doc_complete_date)!=null; if(!has) return 2; return r.kn_st_draft?0:1; };
  return rows.slice().sort((a,b)=>{
    const ta=tier(a), tb=tier(b);
    if(ta!==tb) return ta-tb;
    if(ta<2){ return schParseDate(a.kn_doc_complete_date)-schParseDate(b.kn_doc_complete_date); }   // มีวันที่ → เก่า→ใหม่
    return String(b[C.createdAt]||'').localeCompare(String(a[C.createdAt]||''));   // ไม่มีวันที่ → ใหม่ก่อน (ท้ายสุดของทั้งหมด)
  });
}
function schTableHtml(rows){
  rows=schSortForList(rows);   // เรียงใหม่ทุกครั้งที่เรนเดอร์ (เพิ่ม/แก้ไข/รีเฟรช/เปลี่ยนสถานะ)
  const admin=isSuperAdmin();
  const PS=CONFIG.PAGE_SIZE, start=(SCHS.page-1)*PS, slice=rows.slice(start,start+PS);
  const dcol=new Set(SCH_FIELDS.filter(f=>f[2]).map(f=>f[1]));
  const HIDE=new Set(['kn_order_customer','kn_doc_sent_date','kn_release_port','kn_user','kn_delivery_date','kn_billing_date','kn_job_nj','kn_job_kn']);   // ซ่อนจากตารางหลัก → ไปดู/แก้ในปุ่ม ⋮ แทน (ยังบันทึก/ค้นหา/Import/Export ได้)
  const cols=SCH_FIELDS.filter(f=>!HIDE.has(f[1]));
  const th = cols.map(f=>`<th>${escapeHtml(f[0])}</th>`).join('') + '<th></th>';
  let body;
  if(!slice.length){ body=`<tr><td colspan="${cols.length+1}" style="text-align:center;color:var(--muted);padding:26px">— ไม่มีข้อมูล —</td></tr>`; }
  else body=slice.map((r,i)=>{
    const canEdit=true;   // USER แก้ได้ทุกแถว
    const nf=(S.schBillCount&&S.schBillCount[r[C.id]])||0;
    const fileBtn = nf>0?`<button class="iconbtn" title="ไฟล์แนบ (${nf})" onclick="schBillViewModal('${String(r[C.id])}')">📎</button>`:'';
    const tds=cols.map(f=>{
      if(f[1]==='_seq') return `<td style="text-align:center;color:var(--muted)">${start+i+1}</td>`;
      if(f[1]==='status') return `<td>${schStatusesOf(r).map(schStatusChip).join(' ')||'—'}</td>`;
      let v=r[f[1]];
      if(dcol.has(f[1])) return `<td>${v?fmtDate(v):'—'}</td>`;
      return `<td>${escapeHtml(v!=null&&v!==''?String(v):'—')}</td>`;
    }).join('');
    const acts = `<div class="rowact" style="justify-content:flex-end">
        <button class="iconbtn" title="จัดการ (USER, วันที่ส่งของ, วันที่วางบิล, JOB NJ, JOB KN)" onclick="schQuickModal('${String(r[C.id])}')">⋮</button>
        ${fileBtn}
        ${canEdit?`<button class="iconbtn" title="แก้ไข" onclick="schOpenModal('${String(r[C.id])}')">✏️</button>`:''}
        ${admin?`<button class="iconbtn del" title="ลบ" onclick="schDelete('${String(r[C.id])}')">🗑️</button>`:''}
        ${(!fileBtn&&!canEdit&&!admin)?'<span style="color:var(--muted2)">—</span>':''}
      </div>`;
    return `<tr>${tds}<td>${acts}</td></tr>`;
  }).join('');
  const totalP=Math.max(1,Math.ceil(rows.length/PS));
  const pager=`<div class="pager"><span class="pinfo">หน้า ${SCHS.page}/${totalP} · ${rows.length} งาน</span>
    <div class="pbtns"><button class="pbtn" ${SCHS.page<=1?'disabled':''} onclick="schPage(${SCHS.page-1})">‹</button>
    <button class="pbtn" ${SCHS.page>=totalP?'disabled':''} onclick="schPage(${SCHS.page+1})">›</button></div></div>`;
  return `<div class="tablewrap"><div class="tscroll kn-tscroll"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>${pager}</div>`;
}

async function schQuickSave(id){
  const g=k=>{const el=document.getElementById('sqf_'+k);return el?el.value.trim():'';};
  const dv=k=>{const v=g(k);return v||null;};
  const payload={   // อัปเดตเฉพาะ 5 คอลัมน์นี้ (partial update → ไม่แตะข้อมูลเดิมคอลัมน์อื่น/สถานะ/สูตร)
    kn_user:g('kn_user')||null,
    kn_delivery_date:dv('kn_delivery_date'),
    kn_billing_date:dv('kn_billing_date'),
    kn_job_nj:dv('kn_job_nj'),
    kn_job_kn:dv('kn_job_kn')
  };
  const btn=document.getElementById('schQuickSaveBtn'); if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก...';}
  try{
    if(!sb) initSupabase();
    const {error}=await sb.from(CONFIG.TABLE).update(payload).eq(C.id,id); if(error)throw error;
    const r=S.reports.find(x=>String(x[C.id])===String(id)); if(r) Object.assign(r,payload);   // อัปเดต local ทันที
    closeModal(); schRenderView();   // รายการเดิมอัปเดตทันที
    toast('บันทึกข้อมูลสำเร็จ','ok');
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='💾 บันทึก';} toast('บันทึกไม่สำเร็จ: '+(e.message||e),'err'); }
}
async function schSave(id){
  const g=k=>{const el=document.getElementById('kf_'+k);return el?el.value.trim():'';};
  const dv=k=>{const v=g(k);return v||null;};
  const cb=k=>{const el=document.getElementById('kf_'+k);return !!(el&&el.checked);};   // checkbox → boolean
  const editing=id!=null;
  const r = editing ? S.reports.find(x=>String(x[C.id])===String(id)) : null;
  // สิทธิ์: USER แก้ได้ทุกงาน · จำกัดเฉพาะการลบ (SUPER_ADMIN)
  const payload={
    customer:CONFIG.SCH,
    bl_awb:dv('bl_awb'), invoice_no:dv('invoice_no'), kn_vessel_name:dv('kn_vessel_name'),
    kn_order_customer:dv('kn_order_customer'), kn_company:dv('kn_company'),
    kn_import_port:dv('kn_import_port'), kn_release_port:dv('kn_release_port'),
    kn_job_nj:dv('kn_job_nj'), kn_job_kn:dv('kn_job_kn'),
    kn_problem_status:dv('kn_problem_status'),
    kn_user:g('kn_user')||CUR.username,
    kn_eta:dv('kn_eta'), kn_doc_sent_date:dv('kn_doc_sent_date'), kn_doc_complete_date:dv('kn_doc_complete_date'),
    kn_doc_enter_date:dv('kn_doc_enter_date'),
    kn_nj_confirm_date:dv('kn_nj_confirm_date'), kn_cust_confirm_date:dv('kn_cust_confirm_date'),
    kn_do_date:dv('kn_do_date'), kn_release_date:dv('kn_release_date'),
    kn_delivery_date:dv('kn_delivery_date'), kn_billing_date:dv('kn_billing_date')
  };
  // สถานะ = เลือกได้ 1 (radio) · อ่านจาก hidden kf_kn_selstatus → boolean เดียว true · อื่น false
  const selCol = g('kn_selstatus');
  SCH_ST_FIELDS.forEach(s=>{ payload[s[1]] = (s[1]===selCol); });
  const selField = SCH_ST_FIELDS.find(s=>s[1]===selCol);
  payload.status = selField ? selField[0] : '';
  // เอกสารที่ลูกค้าส่งมา → boolean (true/false แยกคอลัมน์)
  SCH_DOC_FIELDS.forEach(d=>{ payload[d[1]]=cb(d[1]); });
  payload[SCH_DOC_OTHER_COL]=dv('kn_doc_other_text');   // ข้อความใบอนุญาตอื่น (แยกคอลัมน์ · ยกเลิกติ๊กไม่ลบข้อความ)
  // รายละเอียดแต่ละสถานะ → text แยกคอลัมน์ (ทุกช่องอยู่ใน DOM · แก้ช่องหนึ่งไม่ทับช่องอื่น)
  SCH_ST_FIELDS.forEach(s=>{ payload[s[3]]=dv(s[3]); });
  // auto-fill วันที่ตามสถานะที่เลือก (เติมเฉพาะช่องว่าง)
  const today=new Date().toISOString().slice(0,10);
  if(payload.kn_st_confirm && !payload.kn_nj_confirm_date) payload.kn_nj_confirm_date=today;
  if(payload.kn_st_released && !payload.kn_release_date) payload.kn_release_date=today;
  if(payload.kn_st_billed && !payload.kn_billing_date) payload.kn_billing_date=today;
  const btn=document.getElementById('schSaveBtn'); if(btn){btn.disabled=true;btn.textContent='กำลังบันทึก...';}
  try{
    if(!sb) initSupabase();
    let rid=id;
    if(editing){ const {error}=await sb.from(CONFIG.TABLE).update(payload).eq(C.id,id); if(error)throw error; }
    else { payload[C.createdBy]=CUR.username; const {data,error}=await sb.from(CONFIG.TABLE).insert(payload).select('id').single(); if(error)throw error; rid=data&&data.id; }
    const fmsg = await schBillCommit(rid);   // อัปโหลด/ลบ/เปลี่ยนชื่อไฟล์แนบ
    closeModal(); await loadReports(); await schRefreshBillCounts(); schRenderView();
    toast('บันทึกงาน Sch สำเร็จ'+(fmsg?' · '+fmsg:''),'ok');
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='💾 บันทึก';} toast('บันทึกไม่สำเร็จ: '+(e.message||e),'err'); }
}
async function schDelete(id){
  if(!isSuperAdmin()){ toast('เฉพาะผู้ดูแลระบบเท่านั้น','err'); return; }
  const r=S.reports.find(x=>String(x[C.id])===String(id));
  if(!confirm(`ลบงาน Sch "${(r&&(r.kn_job_nj||r.bl_awb))||id}" ?`)) return;
  try{ const {error}=await sb.from(CONFIG.TABLE).delete().eq(C.id,id); if(error)throw error;
    await loadReports(); schRenderView(); toast('ลบงาน Sch แล้ว','ok'); }
  catch(e){ toast('ลบไม่สำเร็จ: '+(e.message||e),'err'); }
}

/* ---------- ไฟล์แนบใบวางบิล ---------- */
function schBillFind(uid){ return SCH_BILL.items.find(x=>x._uid===uid); }
function schBillReset(){ SCH_BILL={items:[],reportId:null}; }
async function schBillInit(reportId){
  SCH_BILL={items:[],reportId:reportId||null};
  schBillRender();
  if(!reportId) return;
  try{ if(!sb) initSupabase();
    const {data,error}=await sb.from(SCH_BILL_TABLE).select('*').eq('report_id',reportId).order('uploaded_at',{ascending:true});
    if(error)throw error;
    SCH_BILL.items=(data||[]).map(d=>({id:d.id,display_name:d.display_name,file_name:d.file_name,storage_path:d.storage_path,size:d.size,mime_type:d.mime_type,uploaded_at:d.uploaded_at,_uid:'e'+d.id}));
    schBillRender();
  }catch(e){ console.error('load bill files',e); const box=document.getElementById('schBillList'); if(box) box.innerHTML='<div class="knbill-empty">โหลดไฟล์แนบไม่สำเร็จ</div>'; }
}
function schBillRender(){
  const box=document.getElementById('schBillList'); if(!box) return;
  const items=SCH_BILL.items.filter(it=>!it._deleted);
  if(!items.length){ box.innerHTML='<div class="knbill-empty">— ยังไม่มีไฟล์แนบ —</div>'; return; }
  box.innerHTML=items.map(it=>`<div class="knbill-item">
    <div class="knbill-item-main">
      <input class="knbill-name" id="knbn_${it._uid}" value="${attr(it.display_name)}" placeholder="${attr(it.file_name)}" oninput="schBillSetName('${it._uid}',this.value)">
      <div class="knbill-meta">📄 ${escapeHtml(it.file_name)} · ${ancaFmtBytes(it.size||0)}${it._new?' · <span class="knbill-new">ใหม่</span>':''}</div>
    </div>
    <div class="knbill-acts">
      <button type="button" class="knbill-b" title="ดู/ดาวน์โหลด" onclick="schBillOpen('${it._uid}')">⬇️</button>
      <button type="button" class="knbill-b" title="เปลี่ยนชื่อ" onclick="schBillFocusName('${it._uid}')">✏️</button>
      <button type="button" class="knbill-b del" title="ลบ" onclick="schBillDelete('${it._uid}')">🗑️</button>
    </div>
  </div>`).join('');
}
function schBillTriggerAdd(){ const el=document.getElementById('schBillInput'); if(el){ el.value=''; el.click(); } }
function schBillOnPick(ev){
  const files=Array.from(ev.target.files||[]);
  files.forEach(f=>{ SCH_BILL.items.push({_new:true,_file:f,display_name:f.name,file_name:f.name,size:f.size,mime_type:f.type||'application/octet-stream',_uid:'n'+(++_schBillUid)}); });
  ev.target.value='';
  schBillRender();
}
function schBillSetName(uid,val){ const it=schBillFind(uid); if(!it) return; it.display_name=val; if(it.id) it._renamed=true; }
function schBillFocusName(uid){ const el=document.getElementById('knbn_'+uid); if(el){ el.focus(); el.select(); } }
function schBillDelete(uid){
  const it=schBillFind(uid); if(!it) return;
  const nm=(it.display_name||it.file_name||'').trim();
  if(!confirm(`ลบไฟล์ "${nm}" ?`)) return;
  if(it._new){ SCH_BILL.items=SCH_BILL.items.filter(x=>x._uid!==uid); }
  else { it._deleted=true; }   // ไฟล์เดิม → ทำเครื่องหมายลบ (ลบจริงตอนบันทึก) · ไม่กระทบไฟล์อื่น
  schBillRender();
}
async function schBillOpen(uid){
  const it=schBillFind(uid); if(!it) return;
  if(it._new && it._file){ const url=URL.createObjectURL(it._file); window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000); return; }
  try{ if(!sb) initSupabase();
    const {data,error}=await sb.storage.from(SCH_BILL_BUCKET).createSignedUrl(it.storage_path,3600);
    if(error)throw error; window.open(data.signedUrl,'_blank');
  }catch(e){ toast('เปิดไฟล์ไม่สำเร็จ: '+(e.message||e),'err'); }
}
// บันทึกการเปลี่ยนแปลงไฟล์ (อัปโหลดใหม่ · ลบเดิม · เปลี่ยนชื่อ) — เรียกหลังบันทึกงานสำเร็จ
async function schBillCommit(reportId){
  if(!reportId||!SCH_BILL||!SCH_BILL.items.length) return '';
  let up=0,del=0,ren=0,err=0;
  for(const it of SCH_BILL.items){
    try{
      if(it._deleted){
        if(it.id){ if(it.storage_path){ try{ await sb.storage.from(SCH_BILL_BUCKET).remove([it.storage_path]); }catch(_e){} }
          const {error}=await sb.from(SCH_BILL_TABLE).delete().eq('id',it.id); if(error)throw error; del++; }
        continue;
      }
      if(it._new){
        const name=(it.display_name||'').trim()||it.file_name;
        const safe=String(it.file_name).replace(/[^\w.\-]+/g,'_');
        const path=reportId+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+safe;
        const {error:ue}=await sb.storage.from(SCH_BILL_BUCKET).upload(path,it._file,{contentType:it.mime_type||'application/octet-stream',upsert:false});
        if(ue)throw ue;
        const {error:ie}=await sb.from(SCH_BILL_TABLE).insert({report_id:reportId,app_code:CONFIG.APP_CODE,display_name:name,file_name:it.file_name,storage_path:path,size:it.size,mime_type:it.mime_type,uploaded_by:(CUR&&CUR.username)||null});
        if(ie){ try{ await sb.storage.from(SCH_BILL_BUCKET).remove([path]); }catch(_e){} throw ie; }
        up++;
      } else if(it._renamed){
        const name=(it.display_name||'').trim()||it.file_name;
        const {error}=await sb.from(SCH_BILL_TABLE).update({display_name:name}).eq('id',it.id); if(error)throw error; ren++;
      }
    }catch(e){ err++; console.error('bill file op',e); }
  }
  const parts=[]; if(up)parts.push('แนบ '+up+' ไฟล์'); if(del)parts.push('ลบ '+del); if(ren)parts.push('เปลี่ยนชื่อ '+ren); if(err)parts.push('ไฟล์ผิดพลาด '+err);
  return parts.join(' · ');
}

function schExport(){
  const rows=schFiltered().length?schFiltered():schVisible();
  if(!rows.length){ toast('ไม่มีข้อมูลให้ส่งออก','err'); return; }
  if(typeof KN_TPL_B64!=='string'||!KN_TPL_B64){ toast('ไม่พบ template ในระบบ','err'); return; }
  const tplwb=XLSX.read(KN_TPL_B64,{type:'base64',cellStyles:true,cellNF:true});
  const tplName='รอปล่อย2';
  const tplws=tplwb.Sheets[tplName]||tplwb.Sheets[tplwb.SheetNames[0]];
  const NC=SCH_EXCEL_COLUMNS.length;   // 31 คอลัมน์ A–AE (โครงเดียวกับ Import → round-trip ได้)
  const enc=(r,c)=>XLSX.utils.encode_cell({r,c});
  const _thin={style:'thin',color:{rgb:'000000'}}, _bd={top:_thin,bottom:_thin,left:_thin,right:_thin};
  const mkHead=(fill)=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},fill:{patternType:'solid',fgColor:{rgb:fill}},border:_bd,alignment:{horizontal:'center',vertical:'center'}});
  const mkData=(center)=>({font:{name:'Calibri',sz:11,color:{rgb:'000000'}},border:_bd,alignment:center?{horizontal:'center',vertical:'center'}:{vertical:'center'}});
  const M=SCH_EXCEL_COLUMNS;   // A ลำดับ · M สถานะ · AB spacer · date/bool/text (BL 2 ครั้ง D/U)
  const dserial=v=>{ if(v==null||v==='')return null; const d=(v instanceof Date)?v:new Date(v); if(isNaN(d.getTime()))return null; return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000); };
  const ws={};
  // หัว A–AE (spacer=เหลือง FFFF00 · อื่น=FFC000)
  for(let c=0;c<NC;c++) ws[enc(0,c)]={t:'s',v:M[c].h,s:mkHead(M[c].t==='spacer'?'FFFF00':'FFC000')};
  // ข้อมูล
  rows.forEach((r,ri)=>{ const R=ri+1;
    for(let c=0;c<NC;c++){
      const m=M[c]; const ref=enc(R,c); let cell;
      if(m.t==='spacer'){ ws[ref]={t:'s',v:'',s:mkData(false)}; continue; }   // AB คอลัมน์ว่าง
      if(m.t==='seq'){ cell={t:'n',v:ri+1,s:mkData(true)}; }
      else if(m.t==='status'){ cell={t:'s',v:schStatusText(r)||String(r.status||''),s:mkData(false)}; }
      else if(m.t==='date'){ const s=dserial(r[m.k]); cell=(s==null)?{t:'s',v:'',s:mkData(false)}:{t:'n',v:s,z:'dd/mm/yyyy',s:mkData(false)}; cell.s.numFmt='dd/mm/yyyy'; }
      else if(m.t==='bool'){ cell={t:'s',v:(r[m.k]?'✓':''),s:mkData(true)}; }
      else { const v=r[m.k]; cell=(v==null||v==='')?{t:'s',v:'',s:mkData(false)}:{t:'s',v:String(v),s:mkData(false)}; }   // text — บังคับข้อความ (BL/InvoiceNo/ท่านำเข้า/JOB ไม่มี .0/scientific)
      ws[ref]=cell;
    }
  });
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length,1),c:NC-1}});
  // ความกว้าง: ลำดับ 6 · spacer 3 · อื่น 15
  ws['!cols']=SCH_EXCEL_COLUMNS.map(col=>({wch: col.t==='seq'?6 : (col.t==='spacer'?3 : 15)}));
  const wb={SheetNames:[tplName],Sheets:{}}; wb.Sheets[tplName]=ws;
  const now=new Date(), p2=n=>String(n).padStart(2,'0');
  const fname=`Report_SCH_${now.getFullYear()}${p2(now.getMonth()+1)}${p2(now.getDate())}_${p2(now.getHours())}${p2(now.getMinutes())}${p2(now.getSeconds())}.xlsx`;
  XLSX.writeFile(wb,fname,{bookType:'xlsx'});
  toast(`Export สำเร็จ · ${rows.length} งาน · ${fname}`,'ok');
}
