<!DOCTYPE html>
<!--
  SHIPPING AIR  v.10  —  N.J. Logistics
  ============================================================
  ระบบใหม่ทั้งหมด · Single HTML File · แยกขาดจาก MASSERGER
    • LOGIN : ใช้บัญชีเดิม (RPC login_plain · app_code='massenger') — ไม่สร้าง user ใหม่
    • WORK  : ฐานข้อมูลของตัวเอง (sa_documents / sa_document_logs) — เริ่มงานใหม่ทั้งหมด
  ไม่แตะ HTML/CSS/JS/Query/DB/Storage/Realtime ของระบบเดิมแม้แต่บรรทัดเดียว
  Flow: NEW → RECEIVED → CLEARED → COMPLETED  ·  RECEIVED ⇄ POSTPONED
  ============================================================
-->
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHIPPING AIR">
<meta name="theme-color" content="#10B981">
<meta name="mobile-web-app-capable" content="yes">
<title>SHIPPING AIR — N.J. Logistics</title>

<link rel="preconnect" href="https://sytgqjglcnsabcszbngg.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" as="script">
<link rel="preload" href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" as="script">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============ DESIGN TOKENS (clone of NJ dark enterprise system) ============ */
:root{
  --bg:#0B1018; --bg2:#111827; --sidebar:#0F172A;
  --panel:#1E2430; --panel2:#262E3D;
  --border:#2D3545; --border-soft:#222a37;
  --text:#F3F4F6; --muted:#AAB3C2; --muted2:#7c8597;
  --brand:#0EA672; --brand-strong:#10B981; --brand-soft:rgba(14,166,114,.15);
  --wait:#F59E0B; --going:#3B82F6; --done:#10B981; --canceled:#EF4444;
  --purple:#A855F7; --orange:#F97316;
  --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-glow:0 0 24px rgba(14,166,114,.35);
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;background:var(--bg);color:var(--text);
  color-scheme:dark;
  font-family:'Sarabun','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-size:14px;line-height:1.5;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
}
body{min-height:100vh;overflow-x:hidden}
@supports (height:100dvh){ body{min-height:100dvh} .app{min-height:100dvh} }
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
a{color:var(--brand-strong);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3343;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4456}
button,.btn,.pill,.menu-item,.row-act,.m-tab,.pg-btn,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:768px),(pointer:coarse){ .row-act,.pg-btn,.btn-icon,.input-icon-btn{min-height:44px;min-width:44px} }
.hidden{display:none !important}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .1s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(180deg,#10B981,#0EA672);color:#fff;box-shadow:0 6px 16px rgba(14,166,114,.3)}
.btn-primary:hover{background:linear-gradient(180deg,#13c08c,#10B981)}
.btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--panel2)}
.btn-danger{background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff}
.btn-warn{background:linear-gradient(180deg,#F59E0B,#D97706);color:#fff}
.btn-going{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--panel);color:var(--text)}
.btn-block{width:100%}
.btn-lg{padding:16px 20px;font-size:15px;border-radius:14px}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:8px}
.btn-icon{width:36px;height:36px;padding:0}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* ============ ALERTS ============ */
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;border:1px solid}
.alert-error{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.alert-success{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#86efac}
.alert-info{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:#93c5fd}

/* ============ AUTH ============ */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,rgba(14,166,114,.07),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:440px;background:linear-gradient(180deg,#161D2A 0%,#121826 100%);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:var(--shadow)}
.auth-header{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.logo-box{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#10B981,#0EA672);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(16,185,129,.45);font-weight:800;color:#fff;font-size:20px}
.auth-title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
.auth-title p{margin:3px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.5px}
.register-note{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
.register-note b{color:#10B981}

/* ============ FORM ============ */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;color:#cdd3df;margin-bottom:8px;font-weight:500}
.field label .req{color:#EF4444;margin-left:3px;font-weight:700}
.input,.select,.textarea{width:100%;background:#0d1320;border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:14px;outline:none;transition:border .15s,box-shadow .15s;box-sizing:border-box;font-family:inherit;line-height:1.5}
input[type="date"],input[type="time"]{color-scheme:dark}
input[type="date"]{background-color:#0d1320;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2718%27%20height%3D%2718%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27%2310B981%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Crect%20x%3D%273%27%20y%3D%274%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%272%27%2F%3E%3Cline%20x1%3D%2716%27%20y1%3D%272%27%20x2%3D%2716%27%20y2%3D%276%27%2F%3E%3Cline%20x1%3D%278%27%20y1%3D%272%27%20x2%3D%278%27%20y2%3D%276%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2710%27%20x2%3D%2721%27%20y2%3D%2710%27%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:right 13px center;background-size:18px 18px;padding-right:42px}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:0;cursor:pointer}
#sa-date::-webkit-calendar-picker-indicator,#sa-edit-date::-webkit-calendar-picker-indicator{opacity:.9;cursor:pointer}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,166,114,.15)}
.input::placeholder,.textarea::placeholder{color:#5d6678}
.textarea{resize:vertical;min-height:78px;white-space:pre-wrap;word-break:break-word}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.input-wrap{position:relative}
.input-icon-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.input-icon-btn:hover{color:var(--text);background:#1a2230}
.input-icon-btn svg{width:18px;height:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:560px){ .grid-2,.grid-3{grid-template-columns:1fr} }

/* ============ APP LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:#071224;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;padding:8px 0 6px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:40}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:3px}
.sidebar .brand,.sidebar .user-card{padding-left:14px;padding-right:14px}
.sidebar .brand{padding-top:6px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#10B981,#0EA672);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;box-shadow:0 0 10px rgba(16,185,129,.4)}
.brand-text{font-size:15px;font-weight:800;letter-spacing:.6px;line-height:1.15}
.brand-text small{display:block;font-size:9px;color:var(--muted);font-weight:600;letter-spacing:1.4px;margin-top:1px}
.sidebar .user-card{padding-top:8px;padding-bottom:8px;margin-top:2px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:15px;background:linear-gradient(135deg,#10B981,#0EA672);box-shadow:0 0 10px rgba(16,185,129,.30)}
.user-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.user-name{font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;line-height:1.2}
.user-role{font-size:10px;color:#10B981;letter-spacing:.8px;font-weight:700;text-transform:uppercase}
.dot-online{width:8px;height:8px;background:#10B981;border-radius:50%;box-shadow:0 0 7px rgba(16,185,129,.7);flex-shrink:0}
.menu-section{padding:0 10px}
.menu-section .title{position:relative;display:flex;align-items:center;gap:10px;margin:9px 14px 4px;padding:0 0 0 10px;font-size:10px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:#A4B5D0;opacity:.75;user-select:none;pointer-events:none}
.menu-section .title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:12px;border-radius:999px;background:#2DD4BF;box-shadow:0 0 6px rgba(45,212,191,.5)}
.menu-section .title.system{color:#A8BEDF}
.menu-section .title.system::before{background:#3B82F6;box-shadow:0 0 6px rgba(59,130,246,.55)}
.menu-section .title.pending{color:#FCD9A8}
.menu-section .title.pending::before{background:#F59E0B;box-shadow:0 0 6px rgba(245,158,11,.55)}
.menu-item{position:relative;display:flex;align-items:center;justify-content:flex-start;min-height:37px;margin:0 0 1px;padding:0 12px;border-radius:12px;background:transparent;border:1px solid transparent;color:#D5DEEB;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:transform .18s,background .18s,border-color .18s;gap:10px;box-sizing:border-box}
.menu-item:hover{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.05);transform:translateX(2px)}
.menu-item.active{background:linear-gradient(90deg,rgba(0,255,180,.14),rgba(0,120,255,.08));border:1px solid rgba(0,255,200,.16);box-shadow:0 0 12px rgba(0,255,200,.08);color:#fff}
.menu-item .ic{width:18px;text-align:center;flex-shrink:0;font-size:15px;line-height:1}
.menu-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item .badge{margin-left:auto;min-width:24px;height:24px;padding:0 8px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#fff;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);line-height:1;box-sizing:border-box}
.menu-item.active .badge{background:rgba(255,255,255,.96);border-color:#fff;color:#0F172A;font-weight:900}
.menu-item .badge[data-zero="1"]{opacity:.55}
.menu-item.dim:not(.active) .badge[data-key="NEW"]{background:rgba(251,191,36,.22);border-color:rgba(251,191,36,.5);color:#FCD34D}
.menu-item.dim:not(.active) .badge[data-key="RECEIVED"]{background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.5);color:#93C5FD}
.menu-item.dim:not(.active) .badge[data-key="COMPLETED_TODAY"]{background:rgba(16,185,129,.22);border-color:rgba(16,185,129,.5);color:#6EE7B7}
.menu-item.dim:not(.active) .badge[data-key="POSTPONED"]{background:rgba(239,68,68,.22);border-color:rgba(239,68,68,.5);color:#FCA5A5}
.menu-item.dim:not(.active) .badge[data-key="all"]{background:rgba(45,212,191,.22);border-color:rgba(45,212,191,.5);color:#5EEAD4}
.menu-divider{height:1px;background:rgba(255,255,255,.06);margin:8px 18px}
.sidebar-ver{margin-top:auto;padding:8px 16px 4px;font-size:9.5px;color:#3d4a63;letter-spacing:.5px;font-family:'Inter',monospace;text-align:left}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mobile-topbar{display:none;position:sticky;top:0;background:var(--sidebar);padding:12px 14px;border-bottom:1px solid var(--border-soft);z-index:50;align-items:center;gap:12px}
.menu-toggle{width:38px;height:38px;border-radius:10px;background:#1a2230;display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid var(--border-soft)}
.menu-toggle svg{width:20px;height:20px}
.mobile-brand{display:flex;align-items:center;gap:10px;flex:1}
.mobile-brand .brand-text{font-size:13px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
.sidebar-overlay.show{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 28px 12px;flex-wrap:wrap;gap:12px}
.topbar h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.3px}
.topbar .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.content{padding:6px 16px 48px;flex:1;min-width:0}

/* ============ STAT CARDS ============ */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:16px;padding:18px}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stat-card .val{font-size:32px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.stat-card .foot{font-size:11px;color:var(--muted);margin-top:6px}
.stat-card.s-all .val{color:var(--text)}
.stat-card.s-wait{background:linear-gradient(180deg,rgba(245,158,11,.16),rgba(245,158,11,.03));border-color:rgba(245,158,11,.3)}
.stat-card.s-wait .val{color:#FCD34D}
.stat-card.s-going{background:linear-gradient(180deg,rgba(59,130,246,.16),rgba(59,130,246,.03));border-color:rgba(59,130,246,.3)}
.stat-card.s-going .val{color:#93C5FD}
.stat-card.s-done{background:linear-gradient(180deg,rgba(16,185,129,.16),rgba(16,185,129,.03));border-color:rgba(16,185,129,.3)}
.stat-card.s-done .val{color:#6EE7B7}
.stat-card.s-purple{background:linear-gradient(180deg,rgba(139,92,246,.16),rgba(139,92,246,.03));border-color:rgba(139,92,246,.3)}
.stat-card.s-purple .val{color:#C4B5FD}
@media (max-width:1100px){ .stats-grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:680px){ .stats-grid{grid-template-columns:repeat(2,1fr)} }

/* ============ FILTER PILLS ============ */
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pr-allm{display:none}
.pill-allm{border-color:rgba(16,185,129,.55);color:#6EE7B7}
.pill-allm.active{background:#10B981;border-color:#10B981;color:#fff}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#1a2231;border:1px solid var(--border-soft);font-size:13px;color:var(--muted);font-weight:500;transition:color .15s,background .15s,border-color .15s}
.pill:hover{color:var(--text);border-color:var(--border)}
.pill.active{background:linear-gradient(90deg,rgba(14,166,114,.2),rgba(14,166,114,.08));color:#fff;border-color:rgba(14,166,114,.4)}
.pill .count{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(45,212,191,.25),rgba(45,212,191,.15));border:1px solid rgba(45,212,191,.45);color:#5EEAD4;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;min-width:24px;line-height:1.3}
.pill.active .count{background:rgba(255,255,255,.96);border-color:#fff;color:#0F172A;font-weight:900}
.search-wrap-cat{margin-left:auto;width:330px;max-width:100%;display:flex;align-items:center}
.search-bar{position:relative;width:100%;display:flex;align-items:center}
.search-bar svg{position:absolute;left:13px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.search-bar .input{padding-left:40px}
@media (max-width:768px){ .search-wrap-cat{margin-left:0;width:100%;flex-basis:100%} }

/* ============ TABLES ============ */
.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;overflow:hidden}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl thead th{position:sticky;top:0;background:#171e2a;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;text-align:left;padding:14px 16px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
.tbl tbody td{padding:14px 16px;border-bottom:1px solid var(--border-soft);font-size:14px;vertical-align:middle}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:rgba(255,255,255,.02)}
.tbl .job-no{color:#10B981;font-weight:700;font-family:'Inter',monospace;font-size:13px}
.tbl .job-no small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}
.tbl .company{font-weight:700;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .company-cell{max-width:170px;overflow:hidden}
.tbl .desc{color:var(--muted);font-size:12.5px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .cat-cell{display:inline-block;padding:5px 10px;background:rgba(14,166,114,.12);border:1px solid rgba(14,166,114,.3);border-radius:8px;color:#86efac;font-size:12px;font-weight:600;white-space:nowrap}
.tbl .msg-cell{display:flex;align-items:center;gap:8px}
.tbl .msg-cell .avatar{width:28px;height:28px;font-size:11px}
.th-actions{text-align:right !important}
.td-actions{text-align:right;white-space:nowrap}
.td-actions .row-act{margin-left:6px}
/* หน้า "เอกสารทั้งหมด" (view=all): การจัดการเหลือ 3 ปุ่ม → คอลัมน์แคบลง ตารางกว้างขึ้น (ไม่กระทบ view อื่น) */
.tbl-doc.tbl-allview{min-width:1160px}
.tbl-doc.tbl-allview th:nth-child(12),.tbl-doc.tbl-allview td:nth-child(12){width:230px}
/* 🟡 รอรับงาน / 🟢 ปล่อยเสร็จวันนี้ / 🔴 เลื่อนตรวจปล่อย: ซ่อนคอลัมน์ LEAD TIME — เฉพาะ 3 เมนูนี้ (class-based กันพลาด) */
.tbl-doc.tbl-nolead .col-lead{display:none}
/* รูปภาพประกอบใน timeline (อัปเดตสถานะงาน) */
.timeline-img-preview{display:block;margin-top:8px;width:100%;max-width:260px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,255,255,.12);cursor:pointer}
.timeline-img-link{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:#60A5FA;cursor:pointer}
/* แนบรูปหลายใบ — preview grid ใน modal 📋 อัปเดตสถานะ (2 คอลัมน์มือถือ / 3-4 desktop) */
.sa-img-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;width:100%}
.sa-img-cell{position:relative;background:#0d1320;border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden}
.sa-img-thumb{display:block;width:100%;height:96px;object-fit:cover}
.sa-img-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(220,38,38,.92);color:#fff;font-size:16px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.sa-img-meta{padding:5px 7px}
.sa-img-fn{font-size:10.5px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa-img-sz{font-size:10px;color:#64748B;margin-top:1px}
@media (min-width:761px){ .sa-img-grid{grid-template-columns:repeat(3,1fr)} }
@media (min-width:1180px){ .sa-img-grid{grid-template-columns:repeat(4,1fr)} }
/* timeline แสดงรูปหลายใบ เรียงตามลำดับแนบ */
.tl-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tl-img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.12);cursor:pointer}
/* SHIPPING: 3 ปุ่ม Action เต็มกว้าง เรียงต่อกัน มี chevron (ใช้ทั้งคอม+มือถือ) */
.td-actions .row-act.ra-ship3{flex:1 1 100% !important;min-width:0;min-height:46px;border-radius:12px;font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;border:1.5px solid;margin-left:0}
.td-actions .row-act.ra-ship3 .ship3-arrow{font-size:19px;font-weight:400;opacity:.85}
.td-actions .row-act.ra-ship3:active{transform:scale(.98)}
.td-actions .row-act.ship-blue{background:#2563EB;border-color:#60A5FA}
.td-actions .row-act.ship-orange{background:#EA580C;border-color:#FB923C}
.td-actions .row-act.ship-purple{background:#7C3AED;border-color:#A78BFA}
@media (max-width:760px){
  /* SHIPPING: 3 ปุ่มเรียงแถวเดียว เท่ากัน เฉพาะมือถือ (เดิมเรียงลง 3 บรรทัด) · desktop/tablet 761px+ ไม่แตะ */
  .td-actions .row-act.ra-ship3{flex:1 1 0 !important;min-width:0;font-size:11px;padding:0 8px;gap:4px;justify-content:center}
  .td-actions .row-act.ra-ship3>span:first-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .td-actions .row-act.ra-ship3 .ship3-arrow{flex-shrink:0;font-size:14px}
}
.row-act{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:34px;padding:0 11px;border-radius:10px;font-size:12.5px;font-weight:700;border:1px solid;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap;line-height:1}
.row-act svg{width:14px;height:14px;flex-shrink:0}
.row-act:hover{transform:translateY(-1px)}
.row-act.ra-view{background:rgba(148,163,184,.10);color:#cbd5e1;border-color:rgba(148,163,184,.28)}

.row-act.ra-primary{background:linear-gradient(180deg,#10B981,#0EA672);color:#fff;border-color:#0b7a55}
.row-act.ra-warn{background:linear-gradient(180deg,#FCD34D,#F59E0B);color:#422006;border-color:#B45309}
.row-act.ra-going{background:rgba(59,130,246,.14);color:#93C5FD;border-color:rgba(59,130,246,.34)}
.row-act.ra-danger{background:rgba(239,68,68,.12);color:#FCA5A5;border-color:rgba(239,68,68,.3)}
.row-act.ra-accept{background:linear-gradient(180deg,#FCD34D 0%,#FBBF24 50%,#F59E0B 100%);color:#422006;border:1px solid #B45309;border-top-color:#FDE68A;font-weight:800}
.row-act.ra-edit{background:rgba(59,130,246,.12);color:#93C5FD;border:1px solid rgba(59,130,246,.32)}
.row-act.ra-edit:hover{background:rgba(59,130,246,.2)}
.row-act.ra-dup{background:rgba(20,184,166,.12);color:#5EEAD4;border:1px solid rgba(20,184,166,.32)}
.row-act.ra-dup:hover{background:rgba(20,184,166,.2)}
.row-act.tl-out-1{background:#2563EB;border:1px solid #3B82F6;color:#fff}
.row-act.tl-out-1:hover{background:#1D4ED8}
.row-act.tl-out-2{background:#9333EA;border:1px solid #A855F7;color:#fff}
.row-act.tl-out-2:hover{background:#7E22CE}
.row-act.ra-more{background:rgba(148,163,184,.12);color:#cbd5e1;border:1px solid rgba(148,163,184,.28);font-size:18px;font-weight:800;padding:0 10px}
.row-act.ra-more:hover{background:rgba(148,163,184,.2)}
.sa-rowmenu{position:fixed;z-index:100000;background:#1A2235;border:1px solid rgba(255,255,255,.15);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:6px;min-width:210px}
.sa-rowmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#E2E8F0;font-size:14px;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}
.sa-rowmenu button:hover{background:rgba(255,255,255,.07)}
.sa-rowmenu button .ic{font-size:16px;width:20px;text-align:center}
/* custom dropdown: ผู้รับผิดชอบ (ชิปปิ้ง) ใน modal แก้ไขข้อมูลเอกสาร */
.de-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.de-trigger #de-assign-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.de-trigger .de-caret{flex-shrink:0;color:var(--muted);font-size:12px}
.de-back{position:fixed;inset:0;z-index:99997;background:transparent}
.de-back-mobile{background:rgba(0,0,0,.5)}
.de-panel{z-index:99998;background:#071224;border:1px solid rgba(255,255,255,.08);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);padding:8px;max-height:320px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.de-panel-sheet{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:100%;max-height:60vh;border-radius:18px 18px 0 0;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.de-item{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border:none;background:none;border-radius:10px;color:#E2E8F0;cursor:pointer;text-align:left}
.de-item:hover{background:rgba(255,255,255,.06)}
.de-item .de-check{flex-shrink:0;width:18px;text-align:center;color:transparent;font-weight:800}
.de-item.sel{background:linear-gradient(180deg,#2563EB,#1D4ED8);color:#fff}
.de-item.sel .de-check{color:#fff}
.de-meta{display:flex;flex-direction:column;min-width:0}
.de-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.de-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.de-item.sel .de-sub{color:rgba(255,255,255,.85)}
.sa-hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){ .sa-hgrid{grid-template-columns:1fr} }
.status-form-row{display:grid;grid-template-columns:3fr 1fr 1fr;gap:12px;align-items:start}
.status-form-row>div{min-width:0}
@media (max-width:768px){ .status-form-row{grid-template-columns:1fr} }
.doc-sp-sec{font-size:12px;font-weight:800;color:#94A3B8;margin:14px 0 7px}
.doc-sp-sec:first-child{margin-top:0}

.doc-sp-input{flex:1;min-width:0;background:#0d1320;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:9px 11px;color:#fff;font-size:13px;box-sizing:border-box}

.role-badge{display:inline-flex;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.5px}

/* 💻 จัดการผู้ใช้งาน — desktop เท่านั้น: ตารางพอดีจอ คอลัมน์สมดุล (มือถือ ≤760 ไม่แตะ) */
@media (min-width:761px){
  .tbl-users{table-layout:fixed;width:100%;max-width:1440px}
  .tbl-users th:not(.th-actions),.tbl-users td:not(.td-actions){overflow:hidden;text-overflow:ellipsis}
  .tbl-users thead th{padding:9px 14px}
  .tbl-users tbody td{padding:9px 14px}
  .tbl-users th:nth-child(1),.tbl-users td:nth-child(1){width:15%}  /* ชื่อ */
  .tbl-users th:nth-child(2),.tbl-users td:nth-child(2){width:11%}  /* USERNAME */
  .tbl-users th:nth-child(3),.tbl-users td:nth-child(3){width:12%}  /* PASSWORD */
  .tbl-users th:nth-child(4),.tbl-users td:nth-child(4){width:8%}   /* แผนก */
  .tbl-users th:nth-child(5),.tbl-users td:nth-child(5){width:10%}  /* บทบาท */
  .tbl-users th:nth-child(6),.tbl-users td:nth-child(6){width:11%}  /* ท่านำเข้า */
  .tbl-users th:nth-child(7),.tbl-users td:nth-child(7){width:7%}   /* สถานะ */
  .tbl-users th:nth-child(8),.tbl-users td:nth-child(8){width:8%}   /* วันที่สร้าง */
  .tbl-users th:nth-child(9),.tbl-users td:nth-child(9){width:18%}  /* การจัดการ */
}

/* ใบสั่งงาน (พรีวิวบนจอ) — clone จาก MASSENGER */

.job-pdf .pdf-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid #0EA672;padding-bottom:12px;margin-bottom:16px}
.job-pdf .pdf-logo{width:56px;height:56px;background:linear-gradient(135deg,#10B981,#0EA672);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800}
.job-pdf h1{margin:0;font-size:20px;color:#0EA672}

.job-pdf .pdf-signs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}

.st-badge .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ===== create / edit form (เหมือน MASSENGER) ===== */
/* custom autocomplete dropdown (ช่องบริษัท) */
.ac-dropdown{position:fixed;z-index:10000;background:#141B28;border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:acFadeIn .12s ease-out}
@keyframes acFadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.ac-item{padding:11px 14px;cursor:pointer;color:var(--text);font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s;line-height:1.4;word-break:break-word;-webkit-tap-highlight-color:transparent}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:active{background:rgba(14,166,114,.18)}
.ac-item mark{background:transparent;color:#10B981;font-weight:700;padding:0}
.ac-empty{padding:18px 14px;color:var(--muted);text-align:center;font-size:13px}
@media (max-width:520px){ .ac-item{padding:14px;font-size:14px;min-height:44px;display:flex;align-items:center} .ac-dropdown{font-size:14px} }
.cj-head-meta{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;color:var(--muted);display:flex;align-items:center}
.cj-head-meta .cj-hm-item{margin-right:18px;display:inline-flex;align-items:center;gap:5px}
.cj-head-meta .cj-hm-id{color:var(--brand-strong);font-weight:700}

@media (max-width:680px){ .cj-head-meta{flex-basis:100%;order:3;text-overflow:clip;margin-top:2px;white-space:normal} }

@media (max-width:768px){ .priority-group{max-width:100%} .priority-btn{min-height:44px;font-size:14px} }

.paginator{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;flex-wrap:wrap}
.pg-btn{min-width:36px;height:36px;border-radius:9px;background:#1a2231;border:1px solid var(--border-soft);color:var(--text);font-weight:700;padding:0 10px}
.pg-btn:hover:not(:disabled){background:var(--panel2)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-info{font-size:12.5px;color:var(--muted);padding:0 8px}

.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty .icon-lg{width:64px;height:64px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:#1a2230;border-radius:16px;color:var(--muted2)}
.empty .icon-lg svg{width:30px;height:30px}

/* ============ MODALS ============ */
.modal-back{position:fixed;inset:0;background:rgba(5,8,15,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-back.show{display:flex}
#modal-detail{z-index:1000}
#modal-form,#modal-prompt{z-index:1100}
#modal-confirm{z-index:100050}
#modal-prompt{z-index:100040}
body:has(.modal-back.show){overflow:hidden}
.modal{background:#0f1623;border:1px solid var(--border);border-radius:18px;width:100%;max-width:760px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal-sm{max-width:480px}
.modal-compact{max-width:880px}
.modal-compact .modal-head{padding:14px 22px;flex-wrap:wrap}
.modal-compact .modal-foot{padding:12px 22px}
.modal-compact .modal-body{padding:14px 22px}
.modal-compact .field{margin-bottom:10px}
.modal-compact .field label{font-size:12px;margin-bottom:4px}
.modal-compact .input,.modal-compact .select,.modal-compact .textarea{padding:8px 12px;font-size:13.5px;border-radius:10px}
.modal-compact .textarea{min-height:38px;line-height:1.4}
.modal-compact .grid-2,.modal-compact .grid-3{gap:12px;align-items:stretch}
.modal-compact .grid-2 .field,.modal-compact .grid-3 .field{margin-bottom:10px;display:flex;flex-direction:column}
.modal-compact .grid-2 .field .textarea{flex:1;min-height:38px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-shrink:0}
.modal-head h2{margin:0;font-size:18px;font-weight:800}
.modal-head .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.modal-head .x{width:34px;height:34px;border-radius:10px;background:#1a2230;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.modal-head .x:hover{background:#252e40;color:var(--text)}
.modal-head .x svg{width:18px;height:18px}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;background:#0c121d}
.prompt-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.prompt-chips .chip{font-size:12px;padding:6px 11px;border-radius:999px;background:#1a2230;border:1px solid var(--border);color:#cbd5e1;cursor:pointer;text-align:left;line-height:1.35}
.prompt-chips .chip:hover{background:#243044;border-color:var(--brand);color:#fff}
@media (max-width:768px){ .modal-back{background:rgba(3,5,10,.92);backdrop-filter:none !important} }

/* ============ DETAIL ============ */
.detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media (max-width:820px){ .detail-grid{grid-template-columns:1fr} }
.info-card{background:#141b29;border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.info-card h4{margin:0 0 12px;font-size:14px;font-weight:700}
.info-row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:7px 0;font-size:13.5px;border-bottom:1px dashed rgba(255,255,255,.05)}
.info-row:last-child{border-bottom:none}
.info-row .lbl{color:var(--muted)}
.info-row .val{color:var(--text);font-weight:600;word-break:break-word}
.timeline{position:relative;padding-left:6px}
.tl-step{position:relative;padding:0 0 18px 26px}
.tl-step:not(:last-child)::before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:2px;background:rgba(255,255,255,.10)}
.tl-dot{position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;background:#1a2230;border:2px solid var(--border);display:flex;align-items:center;justify-content:center}
.tl-step.done .tl-dot{background:#10B981;border-color:#10B981}
.tl-title{font-size:13.5px;font-weight:700}
.tl-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.tl-note{font-size:12.5px;color:#cbd5e1;margin-top:3px;background:rgba(255,255,255,.03);border:1px solid var(--border-soft);border-radius:8px;padding:6px 9px}

/* ============ GRAPH ============ */
.bar-chart{display:flex;flex-direction:column;gap:14px;padding:6px 2px}
.bar-line{display:grid;grid-template-columns:140px 1fr 52px;align-items:center;gap:12px}
.bar-line .bl-lbl{font-size:13px;color:#cbd5e1;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.bar-track{height:18px;background:#0d1320;border-radius:999px;overflow:hidden;border:1px solid var(--border-soft)}
.bar-fill{height:100%;border-radius:999px;transition:width .5s ease}
.bar-line .bl-val{font-size:14px;font-weight:800;text-align:right}
@media (max-width:560px){ .bar-line{grid-template-columns:96px 1fr 40px;gap:8px} .bar-line .bl-lbl{font-size:11.5px} }

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100070;max-width:340px;pointer-events:none}
.toast-wrap>*{pointer-events:auto}
.toast{padding:12px 16px;border-radius:10px;font-size:13.5px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;animation:slideIn .3s}
.toast.t-success{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.12)}
.toast.t-error{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.12)}
.toast.t-info{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.12)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@media (max-width:768px){ .toast-wrap{bottom:80px;right:12px;left:12px;max-width:none;align-items:center} .toast-wrap>*{max-width:92vw} }

.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--bg);z-index:9999;color:var(--muted)}

  .mobile-tabbar.sa-ship .m-tab .m-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
  .mobile-tabbar.sa-ship .m-tab.c-new  .m-ic{background:rgba(245,158,11,.20);box-shadow:inset 0 0 0 1.5px rgba(245,158,11,.55)}
  .mobile-tabbar.sa-ship .m-tab.c-recv .m-ic{background:rgba(59,130,246,.20);box-shadow:inset 0 0 0 1.5px rgba(59,130,246,.55)}
  .mobile-tabbar.sa-ship .m-tab.c-done .m-ic{background:rgba(16,185,129,.20);box-shadow:inset 0 0 0 1.5px rgba(16,185,129,.55)}
  .mobile-tabbar.sa-ship .m-tab.c-post .m-ic{background:rgba(239,68,68,.20);box-shadow:inset 0 0 0 1.5px rgba(239,68,68,.55)}
  .mobile-tabbar.sa-ship .m-tab.sa-menu .m-ic{background:rgba(148,163,184,.16);box-shadow:inset 0 0 0 1.5px rgba(148,163,184,.4)}
  .mobile-tabbar.sa-ship .m-tab.active{color:#fff}
  .mobile-tabbar.sa-ship .m-tab.active .m-ic{transform:scale(1.08);filter:drop-shadow(0 0 7px rgba(255,255,255,.35))}
  .mobile-tabbar.sa-ship .m-badge{top:-3px;left:auto;right:-3px}
  /* ปุ่มกลาง ➕ สร้างงาน — ลอยเด่น */
  .mobile-tabbar.sa-ship .m-tab.sa-fab{color:#6EE7B7;font-weight:800}
  .mobile-tabbar.sa-ship .m-tab.sa-fab .m-ic{width:52px;height:52px;font-size:26px;font-weight:800;color:#fff;margin-top:-24px;background:radial-gradient(circle at 50% 32%,#34D399,#059669);box-shadow:0 6px 16px rgba(16,185,129,.55),inset 0 0 0 3px rgba(255,255,255,.14)}
  .mobile-tabbar.sa-ship .m-tab.sa-fab:active .m-ic{transform:scale(.94)}
  /* ➕ FAB สร้างงาน บน default tabbar (role ที่ไม่ใช่ SHIPPING) — มือถือ ≤760 เท่านั้น */
  .mobile-tabbar.sa-fab6{overflow:visible}
  .mobile-tabbar.sa-fab6 .m-tab.sa-fab{color:#6EE7B7;font-weight:800}
  .mobile-tabbar.sa-fab6 .m-tab.sa-fab .m-ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin-top:-22px;background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 6px 16px rgba(16,185,129,.55),inset 0 0 0 3px rgba(255,255,255,.14)}
  .mobile-tabbar.sa-fab6 .m-tab.sa-fab:active .m-ic{transform:scale(.96);transition:transform .15s}
  /* แสดงเมนู workflow ครบในหัวข้อ DOCUMENT บนมือถือ (renderSidebar render ครบ: badge + สีสถานะ + active) */
  .main{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .mobile-topbar{display:flex}
  .sidebar{position:fixed;left:-320px;top:0;width:86vw;max-width:320px;height:100vh;transition:left .25s;z-index:60;padding-top:max(10px,env(safe-area-inset-top))}
  .sidebar.open{left:0}
  .pill-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 6px}
  .pill-row::-webkit-scrollbar{display:none}
  .pill-row .pill{flex-shrink:0}
  .timeline-img-preview{max-width:100%}
  .content > .pill-row.pr-allm{display:flex}
  /* มือถือ: ซ่อนแถบเครื่องมือด้านบนทั้งหมด เหลือเฉพาะ ปุ่มรีเฟรช + จำนวนหน้า (แสดง) */
  .topbar-actions .btn-primary,
  .topbar-actions .btn-secondary{display:none}
  .content > .pill-row.pr-status,
  .content > .pill-row.pr-term{display:none}
  .content > .pill-row.pr-tools .search-wrap-cat{display:none}
  .content > .pill-row.pr-tools{justify-content:flex-end}
  .topbar{padding:16px 16px 10px}
  .topbar h1{font-size:20px}
  /* Header มือถือ: ชื่อ ↔ รีเฟรช บรรทัดเดียว · ลดพื้นที่ว่างบน ~38% */
  .topbar.topbar-m{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 6px}
  .topbar-m h1{font-size:19px;margin:0;line-height:1.25}
  .topbar-m .btn-icon{flex-shrink:0}
  /* Filter bar มือถือ: รวม X รายการ ↔ แสดง [50] บรรทัดเดียว */

  .detail-actionbar .da-btn{flex:1 1 0;min-width:0;min-height:54px;border-radius:13px;font-size:12px;font-weight:800;line-height:1.2;text-align:center;padding:6px 4px;border:1.5px solid;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .detail-actionbar .da-btn:active{transform:scale(.97)}
  .detail-actionbar .da-btn.da-blue{background:#2563EB;border-color:#60A5FA}
  .detail-actionbar .da-btn.da-orange{background:#EA580C;border-color:#FB923C}
  .detail-actionbar .da-btn.da-purple{background:#7C3AED;border-color:#A78BFA}
  .detail-actionbar .da-btn.da-green{background:#059669;border-color:#34D399}
  /* card layout for document table on mobile */
  .tbl-doc thead{display:none}
  .tbl-doc tbody tr{display:flex;flex-direction:column;background:#0F172A;border:1px solid rgba(255,255,255,.08);border-radius:14px;margin-bottom:12px;padding:12px 14px;content-visibility:auto;contain-intrinsic-size:180px}
  .tbl-doc tbody td{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border:none;font-size:13.5px;align-items:center}

  .tbl-doc tbody td.td-actions{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;border-top:1px solid rgba(255,255,255,.06);margin-top:6px;padding-top:12px;order:99}
  .tbl-doc tbody td.m-extra{order:50}   /* เลขใบขน / USER เปิดงาน — อยู่เหนือปุ่มการจัดการ */
  .tbl-doc tbody td.col-jdesc{display:none}   /* 📝 รายละเอียดงาน = เฉพาะ Desktop · ไม่แสดงในการ์ดมือถือ */

  .tbl-doc tbody td .ucol-desk{display:none}   /* มือถือ: ไม่แตะ USER → คงค่า USER เดิม 1 บรรทัด (ucol-mob) + ผู้สั่งงาน คงคอลัมน์เดิม */

@media (min-width:761px){ .mobile-topbar{display:none} }
@media (min-width:761px){
  .tbl-doc{table-layout:fixed;min-width:1190px}
  .tbl-doc.tbl-nolead{min-width:1094px}   /* รอรับงาน/เสร็จวันนี้/เลื่อน: ตัด LEAD TIME 96px → คอลัมน์อื่นกว้างเท่าเดิม พอดีจอ */
  .tbl-doc .m-extra{display:none}   /* เลขใบขน / USER เปิดงาน = แสดงเฉพาะการ์ดมือถือ */
  /* ลดตัวหนังสือ "หน้าต่างรายการ" -10% เฉพาะ Desktop · scope .tbl-doc เท่านั้น (มือถือ/ตารางอื่นไม่กระทบ) */
  .tbl-doc thead th{font-size:9.9px}    /* 11px → -10% */
  .tbl-doc tbody td{font-size:12.6px}   /* 14px → -10% */
  .tbl-doc th:not(.th-actions),.tbl-doc td:not(.td-actions){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl-doc th:nth-child(1),.tbl-doc td:nth-child(1){width:56px}    /* JOB NO */

  .tbl-doc th:nth-child(4),.tbl-doc td:nth-child(4){width:78px}    /* ประเภทงาน */
  .tbl-doc th:nth-child(5),.tbl-doc td:nth-child(5){width:140px}   /* 📝 รายละเอียดงาน [NEW] */

  .tbl-doc th:nth-child(8),.tbl-doc td:nth-child(8){width:72px}    /* USER */
  .tbl-doc th:nth-child(9),.tbl-doc td:nth-child(9){width:90px}   /* เวลา */
  .tbl-doc th:nth-child(10),.tbl-doc td:nth-child(10){width:114px} /* สถานะเอกสาร */

  /* 📝 รายละเอียดงาน — 2 บรรทัด ตัด ... (override nowrap), hover ดู title เต็ม, ไม่ดันตารางล้น (fixed width) */
  .tbl-doc td.col-jdesc{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;font-size:11.5px;color:#cbd5e1}

  /* คอลัมน์ เวลา (NEW/RECEIVED): desktop = 2 บรรทัด วันที่รับ-ส่ง/เวลา · ซ่อนค่ามือถือ */
  .tbl-doc td .tcol-mob{display:none}
  .tbl-doc td .tcol-desk{display:block;line-height:1.3}
  .tbl-doc td .tcol-t{color:#94a3b8;font-size:11px;font-weight:400}
  /* 🔵 ดำเนินตรวจปล่อย (RECEIVED): รวม ชิปปิ้ง(USER) + ผู้สั่งงาน เป็น 2 บรรทัดในช่องเดียว — desktop เท่านั้น */

function fmtDateTime(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—'; return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ---------------- permission matrix (role → views + own-only) ---------------- */
function _permRole(){
  const r = String(S.user&&S.user.role||'').toUpperCase().trim();
  const dept = String(S.user&&S.user.department||'').toUpperCase().trim();
  if(r==='SUPER_ADMIN') return 'SUPER_ADMIN';
  if(r==='ADMIN'||r==='ADMIN_MID') return 'ADMIN';

  const uid = String(S.user&&S.user.id||'');

}

  return _permRole()==='SUPER_ADMIN';

/* ---------------- auth ---------------- */
function authAlert(msg, type){
  const el = $('auth-alert'); if(!el) return;
  el.innerHTML = msg ? `<div class="alert alert-${type==='error'?'error':type==='success'?'success':'info'}">${esc(msg)}</div>` : '';
}
async function doLogin(){
  const u = $('lg-username').value.trim();
  const p = $('lg-password').value;
  if(!u || !p) return authAlert('กรอก Username และ Password','error');
  const btn = $('btn-login');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';
  try{
    const { data:result, error } = await sb.rpc('login_plain', { p_username:u, p_password:p, p_app_code:LOGIN_APP_CODE });
    const code = error?.code || '';
    if(error?.status===404 || code==='PGRST202' || code==='42883')
      throw new Error('ไม่พบ RPC login_plain บนเซิร์ฟเวอร์');
    if(error) throw new Error(error.message || 'เข้าสู่ระบบไม่สำเร็จ');
    if(!result || !result.success){
      const k = result?.error || 'unknown';
      throw new Error((k==='username_not_found'||k==='password_mismatch') ? 'Username หรือ Password ไม่ถูกต้อง' : 'เข้าสู่ระบบไม่สำเร็จ');
    }
    const info = result.user;
    if(info.status==='pending') throw new Error('บัญชีนี้รอ Admin อนุมัติ');
    if(info.status==='disabled') throw new Error('บัญชีนี้ถูกระงับการใช้งาน');
    S.user = info;
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify({
      id:info.id, username:info.username, full_name:info.full_name, role:info.role,
      department:info.department, email:info.email, app_code:info.app_code,
      expiresAt: Date.now()+30*24*60*60*1000
    })); }catch(_){}
    $('lg-username').value=''; $('lg-password').value='';
    authAlert('');
    await enterApp();
  }catch(e){
    authAlert(e.message||'เข้าสู่ระบบไม่สำเร็จ','error');
  }finally{
    btn.disabled=false; btn.innerHTML='เข้าสู่ระบบ';
  }
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.id) return null;
    if(s.expiresAt && Date.now() > s.expiresAt){ localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  }catch(_){ return null; }
}
function doLogout(){
  if(S._rt){ try{ sb.removeChannel(S._rt); }catch(_){} S._rt=null; }
  try{ localStorage.removeItem(SESSION_KEY); }catch(_){}
  S.user=null; S.docs=[]; S.loaded=false;
  showScreen('screen-auth'); refreshIcons();
}

/* ---------------- data layer ---------------- */
async function loadDocuments(){
  try{
    let { data, error } = await sb.from(DOC_TABLE)
      .select(DOC_COLS).eq('app_code', WORK_APP_CODE)
      .order('created_at', { ascending:false }).limit(1000);
    if(error && /freight_paid/i.test(error.message||'')){ // คอลัมน์ใหม่ยังไม่ถูก migrate → fallback
      ({ data, error } = await sb.from(DOC_TABLE)
        .select(DOC_COLS_FALLBACK).eq('app_code', WORK_APP_CODE)
        .order('created_at', { ascending:false }).limit(1000));
    }
    if(error){ console.error('[loadDocuments]', error); toast('โหลดเอกสารไม่สำเร็จ: '+(error.message||''),'error'); return; }
    S.docs = data || [];
    S.loaded = true;
    // คืนค่า POSTPONED ที่ข้ามวัน → NEW (รอชิปปิ้งรับ) · เฉพาะ flow เอกสาร SHIPPING นี้เท่านั้น
    if(await resetExpiredPostponedDocuments()){
      let r = await sb.from(DOC_TABLE).select(DOC_COLS).eq('app_code', WORK_APP_CODE).order('created_at',{ ascending:false }).limit(1000);
      if(r.error && /freight_paid/i.test(r.error.message||'')){
        r = await sb.from(DOC_TABLE).select(DOC_COLS_FALLBACK).eq('app_code', WORK_APP_CODE).order('created_at',{ ascending:false }).limit(1000);
      }
      if(!r.error) S.docs = r.data || [];
    }
  }catch(e){ console.error(e); }
}
// คืนค่าเอกสารที่เลื่อน (POSTPONED) ข้ามวันกลับเป็น NEW อัตโนมัติหลังเที่ยงคืน · ไม่แตะ CLEARED/COMPLETED · ไม่ลบ Timeline
async function resetExpiredPostponedDocuments(){
  try{
    const today = todayYMD();
    const expired = (S.docs||[]).filter(d => d.doc_status==='POSTPONED' && d.postponed_at && ymd(d.postponed_at) < today);
    if(!expired.length) return false;
    for(const d of expired){
      const patch = { doc_status:'NEW', received_at:null, assigned_user:null, assigned_name:null, delivery_status:'READY_FOR_SHIPPING' };
      let { error } = await sb.from(DOC_TABLE).update(patch).eq('id', d.id).eq('app_code', WORK_APP_CODE);
      if(error && /delivery_status/i.test(error.message||'')){   // คอลัมน์ไม่มีในสคีมา → คืนค่าโดยไม่แตะ delivery_status
        const p={...patch}; delete p.delivery_status;
        ({ error } = await sb.from(DOC_TABLE).update(p).eq('id', d.id).eq('app_code', WORK_APP_CODE));
      }
      if(!error){
        // 🔄 Timeline อัตโนมัติ · บันทึกเป็น SYSTEM (ไม่ใช่ user ปัจจุบัน) · created_at = วันที่/เวลา
        try{
          await sb.from(LOG_TABLE).insert({
            app_code:WORK_APP_CODE, document_id:d.id, action:'postponed_reset', doc_status:'NEW',
            user_id:null, user_name:'SYSTEM',
            note:`🔄 ระบบย้ายงานจาก "เลื่อนตรวจปล่อย" กลับไป "รอรับงาน" เนื่องจากเข้าสู่วันใหม่`,
            created_at:new Date().toISOString()
          });
        }catch(_l){ console.warn('[postponed_reset log]', _l); }
      }
      else { console.warn('[postponed_reset]', error); }
    }
    return true;
  }catch(e){ console.warn('[resetExpiredPostponed]', e); return false; }
}
async function logDoc(documentId, action, doc_status, note){
  try{
    await sb.from(LOG_TABLE).insert({
      app_code: WORK_APP_CODE, document_id: documentId, action, doc_status,
      user_id: (S.user&&S.user.id)||null, user_name: uname(), note: note||null
    });
  }catch(e){ console.warn('[log]', e); }
}
function subscribeRealtime(){
  if(S._rt){ try{ sb.removeChannel(S._rt); }catch(_){} }
  try{
    S._rt = sb.channel('sa_docs_rt')
      .on('postgres_changes', { event:'*', schema:'public', table:DOC_TABLE }, (payload)=>{ _saRealtimeApply(payload); })
      .subscribe();
  }catch(e){ console.warn('[realtime]', e); }
}
let _refreshTimer=null, _rtRefetch=false;
// ตัวรันกลาง: ถ้า _rtRefetch=true → โหลดใหม่ทั้งหมดก่อน (fallback) · ไม่งั้น render เฉพาะ (S.docs อัปเดต incremental แล้ว)
function _rtRun(){
  clearTimeout(_refreshTimer);
  _refreshTimer = setTimeout(async ()=>{
    const refetch = _rtRefetch; _rtRefetch=false;
    try{
      if(refetch) await loadDocuments();
      renderSidebar(); if(typeof S.view==='string') routeRender();
    }catch(e){ console.warn('[rt]', e); }
  }, 350);
}
// fallback เดิม: โหลดใหม่ทั้งหมด + render (พฤติกรรมเดียวกับของเดิม 100%)
function scheduleRefresh(){ _rtRefetch=true; _rtRun(); }
// #5 Realtime Incremental — อัปเดต S.docs เฉพาะแถวที่เปลี่ยนจาก payload (ไม่ refetch 1000 แถว)
//   แล้ว render ผ่าน path เดิม (renderSidebar + routeRender) → badge/KPI/filter/search/pagination/menu/ลบ/เพิ่ม ถูกครบ
//   ทุกกรณีไม่ชัด/เสี่ยง/error → scheduleRefresh() (refetch เดิม) ห้ามฝืน
function _saRealtimeApply(payload){
  try{
    if(!S.loaded || !Array.isArray(S.docs)){ scheduleRefresh(); return; }
    const ev = String(payload && (payload.eventType||payload.event) || '').toUpperCase();
    const row    = (payload && payload.new && Object.keys(payload.new).length) ? payload.new : null;
    const oldRow = (payload && payload.old && Object.keys(payload.old).length) ? payload.old : null;
    if(row && row.app_code && row.app_code !== WORK_APP_CODE) return;   // เอกสารแอปอื่น → ไม่เกี่ยว ไม่ render
    if(ev==='DELETE'){
      const id = oldRow && oldRow.id; if(!id){ scheduleRefresh(); return; }   // ไม่รู้ id → refetch
      const i = S.docs.findIndex(d=>d.id===id); if(i>=0) S.docs.splice(i,1);   // ลบออก → หายทันที
    } else if(ev==='INSERT' || ev==='UPDATE'){
      if(!row || !row.id){ scheduleRefresh(); return; }
      const i = S.docs.findIndex(d=>d.id===row.id);
      if(i>=0) S.docs[i] = row; else S.docs.unshift(row);                       // อัปเดต/เพิ่มงานใหม่
      S.docs.sort((a,b)=> String(b.created_at||'').localeCompare(String(a.created_at||'')));  // เรียงตาม query เดิม
    } else { scheduleRefresh(); return; }                                       // event อื่น → refetch
    _rtRun();   // render-only (ไม่ refetch) — S.docs ถูกต้องแล้ว
  }catch(e){ console.warn('[rt-inc]', e); scheduleRefresh(); }                   // error → refetch เดิม
}

function companyList(){
  const set = new Set();
  (typeof AC_COMPANIES!=='undefined'?AC_COMPANIES:[]).forEach(c=>{ if(c) set.add(c); });
  S.docs.forEach(d=>{ if(d.company) set.add(d.company); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'th'));
}
async function nextDocNo(){
  const ymd = todayYMD().replace(/-/g,''); // YYYYMMDD
  const todayCount = S.docs.filter(d=> d.created_at && ymd && new Date(d.created_at).getFullYear()+pad(new Date(d.created_at).getMonth()+1)+pad(new Date(d.created_at).getDate())===ymd).length;
  return ymd + '-' + String(todayCount+1).padStart(5,'0');
}

/* ---------------- app shell / sidebar ---------------- */
// ⏰ จับเวลาเที่ยงคืน: เมื่อถึง 00:00 ของวันใหม่ → reload (จะรัน resetExpiredPostponedDocuments ใน loadDocuments) แล้วตั้งเวลารอบถัดไป
let _midnightTimer = null;
function _scheduleMidnightReset(){
  if(_midnightTimer){ clearTimeout(_midnightTimer); _midnightTimer=null; }
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5); // 00:00:05 พรุ่งนี้ (เผื่อ buffer)
  _midnightTimer = setTimeout(async ()=>{
    try{ await loadDocuments(); renderSidebar(); if(typeof S.view==='string') routeRender(); }catch(_e){ console.warn('[midnight]', _e); }
    _scheduleMidnightReset();   // ตั้งเวลารอบถัดไป
  }, Math.max(1000, next - now));
}
async function enterApp(){
  showScreen('screen-app');
  // header user
  $('sb-avatar').textContent = avatarText(uname());
  $('sb-name').textContent = uname();
  $('sb-role').textContent = String(S.user.role||'STAFF');
  renderSidebar();
  renderMobileTabbar();
  refreshIcons();
  await loadDocuments();
  _scheduleMidnightReset();   // ⏰ เข้าสู่วันใหม่ 00:00 → เช็ค POSTPONED ข้ามวันอัตโนมัติ (แม้แอปเปิดค้าง)
  subscribeRealtime();
  S.view = _firstAllowedView() || '__noaccess';
  renderSidebar(); renderMobileTabbar();
  routeRender();
}
function viewCount(key){
  const v = VIEWS[key]; if(!v) return 0;
  return _visibleDocs().filter(v.test).length;
}
function renderSidebar(){
  const item = (key, icon, label, opts={}) => {
    if(!canView(key)) return '';
    const active = S.view===key;
    const cnt = opts.count!=null ? opts.count : null;
    const badge = cnt!=null ? `<span class="badge" data-key="${key}" data-zero="${cnt===0?'1':'0'}">${cnt}</span>` : '';
    return `<button class="menu-item dim ${active?'active':''}" data-view="${key}" onclick="setView('${key}')">
      <span class="ic">${icon}</span><span class="lbl">${esc(label)}</span>${badge}</button>`;
  };
  const docItems = item('all','📄','เอกสารทั้งหมด',{count:viewCount('all')})
    + item('NEW','🟡','รอรับงาน',{count:viewCount('NEW')})
    + item('RECEIVED','🔵','ดำเนินตรวจปล่อย',{count:viewCount('RECEIVED')})
    + item('COMPLETED_TODAY','🟢','ปล่อยเสร็จวันนี้',{count:viewCount('COMPLETED_TODAY')})
    + item('POSTPONED','🔴','เลื่อนตรวจปล่อย',{count:viewCount('POSTPONED')});
  const pendItems = item('TOMORROW','📅','งานพรุ่งนี้',{count:viewCount('TOMORROW')})
    + item('ADVANCE','🗓️','งานล่วงหน้า',{count:viewCount('ADVANCE')})
    + item('EDIT','🛠','งานแก้ไข',{count:viewCount('EDIT')});
  const sysItems = item('graph','📊','กราฟงานทั้งหมด') + item('users','👥','ผู้ใช้งาน');
  let html = '';
  if(docItems.trim()) html += `<div class="menu-section"><div class="title">DOCUMENT</div>${docItems}</div>`;
  if(pendItems.trim()) html += `<div class="menu-divider"></div><div class="menu-section"><div class="title pending">PENDING</div>${pendItems}</div>`;
  html += `<div class="menu-divider"></div><div class="menu-section"><div class="title system">SYSTEM</div>${sysItems}
      <button class="menu-item" onclick="doLogout()"><span class="ic">🚪</span><span class="lbl">ออกจากระบบ</span></button></div>`;
  $('menu-root').innerHTML = html;
}
function renderMobileTabbar(){
  const bar = $('mtabbar');
  if(_permRole()==='SHIPPING'){ bar.classList.add('sa-ship'); bar.classList.remove('sa-fab6'); bar.style.gridTemplateColumns=''; return _renderShipTabbar(bar); }
  bar.classList.remove('sa-ship');
  const tabs = [
    ['NEW','🟡','รอรับงาน'],
    ['RECEIVED','🔵','ดำเนินตรวจปล่อย'],
    ['COMPLETED_TODAY','🟢','ปล่อยเสร็จวันนี้'],
    ['POSTPONED','🔴','เลื่อนตรวจปล่อย']
  ].filter(([k])=>canView(k));
  const _mt = ([k,ic,l])=>{
    const c = viewCount(k);
    const badge = (c!=null && c>0) ? `<span class="m-badge">${c>99?'99+':c}</span>` : '';
    return `<button class="m-tab ${S.view===k?'active':''}" onclick="setView('${k}')"><span class="m-ic">${ic}${badge}</span><span>${esc(l)}</span></button>`;
  };
  const _half = Math.ceil(tabs.length/2);
  const _left = tabs.slice(0,_half).map(_mt).join('');
  const _right = tabs.slice(_half).map(_mt).join('');
  const _fab = `<button class="m-tab sa-fab" onclick="openCreate()"><span class="m-ic">➕</span><span>สร้างงาน</span></button>`;   // ➕ สร้างงาน — ใช้ Modal สร้างงานเดิม (openCreate) · ไม่สร้างฟังก์ชัน/Modal ใหม่
  const menuActive = ['all','TOMORROW','ADVANCE','EDIT','graph','users'].includes(S.view);
  const _menu = `<button class="m-tab ${menuActive?'active':''}" onclick="toggleSidebar()"><span class="m-ic">☰</span><span>เมนู</span></button>`;
  bar.classList.add('sa-fab6');
  bar.style.gridTemplateColumns = `repeat(${tabs.length+2},1fr)`;   // view tabs + FAB + เมนู
  bar.innerHTML = _left + _fab + _right + _menu;
}

function routeRender(){
  if(S.view!=='__noaccess' && !canView(S.view)){ const fb=_firstAllowedView(); S.view = fb || '__noaccess'; }
  if(S.view==='__noaccess' || !canView(S.view)) return _renderNoAccess();
  if(S.view==='graph') return renderGraph();
  if(S.view==='users') return renderUsers();
  return renderDocView();
}

/* ---------------- document list view ---------------- */
function computeRows(){
  const def = VIEWS[S.view] || VIEWS.all;
  let list = _visibleDocs().filter(def.test);
  // status pills (only on 'all')
  const f = S.filters;
  if(S.view==='all' && f.statusF) list = list.filter(d=>d.doc_status===f.statusF);
  if(f.terminal) list = list.filter(d=>(d.import_terminal||'')===f.terminal);
  if(f.category) list = list.filter(d=>(d.category||'')===f.category);
  if(f.priority) list = list.filter(d=>(d.priority||'normal')===f.priority);
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(d=> [d.doc_no,d.company,d.import_terminal,d.assigned_name,d.creator_name,d.job_nj,d.description,d.category]
      .some(x=> String(x||'').toLowerCase().includes(q)) );
  }
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / S.pageSize));
  if(S.page>totalPages) S.page=totalPages;
  const start = (S.page-1)*S.pageSize;
  const rows = list.slice(start, start+S.pageSize);
  return { list, rows, total, totalPages };
}
function docActions(d){
  const id=d.id, st=d.doc_status;
  const acts=[];
  if(st==='NEW'){
    acts.push({label:'📥 รับงาน', cls:'ra-accept', fn:`docReceive('${id}')`});
    acts.push({label:'แก้ไข', cls:'ra-edit', fn:`openEdit('${id}')`, icon:'pencil'});
  } else if(st==='RECEIVED'){
    acts.push({label:'อัปเดตสถานะ', cls:'ra-going', fn:`openStatusPrompt('${id}')`});
    acts.push({label:'⏳ เลื่อน', cls:'ra-warn', fn:`openPostponePrompt('${id}')`});
    acts.push({label:'🛃 ตรวจปล่อยเสร็จ', cls:'ra-primary', fn:`openClearedPrompt('${id}')`});
  } else if(st==='POSTPONED'){
    acts.push({label:'↩️ กลับดำเนินการ', cls:'ra-going', fn:`docReturn('${id}')`});
    acts.push({label:'🛃 ตรวจปล่อยเสร็จ', cls:'ra-primary', fn:`openClearedPrompt('${id}')`});
  } else if(st==='CLEARED'){
    acts.push({label:'✅ งานเสร็จแล้ว', cls:'ra-primary', fn:`docComplete('${id}')`});
  }
  acts.push({label:'ดู', cls:'ra-view', fn:`openDetail('${id}')`, icon:'eye'});
  if(st==='NEW') acts.push({label:'สร้างงานซ้ำ', cls:'ra-dup', fn:`docDuplicate('${id}')`, icon:'copy-plus'});
  if(canDeleteDoc(d)) acts.push({label:'ลบ', cls:'ra-danger', fn:`docDelete('${id}')`, icon:'trash-2'});
  return acts;
}

// อัปเดตเฉพาะ tbody + paginator + ตัวเลขสรุป (ไม่ rebuild ทั้ง view-root) — ใช้ตอนค้นหา/เปลี่ยนหน้า/เปลี่ยนจำนวนแสดง

function _renderDocBody(){

  const tb = root && root.querySelector('tbody');
  if(!tb){ return renderDocView(); }   // ไม่ใช่หน้าเอกสาร → render เต็ม
  const { rows, total, totalPages } = computeRows();
  const empty = rows.length===0;
  tb.innerHTML = empty
    ? `<tr><td colspan="11"><div class="empty"><div class="icon-lg"><i data-lucide="inbox"></i></div><div>ไม่มีเอกสารในมุมมองนี้</div></div></td></tr>`

  if(pg) pg.innerHTML = total>S.pageSize ? `
          <button class="pg-btn" ${S.page<=1?'disabled':''} onclick="docGoto(1)">«</button>
          <button class="pg-btn" ${S.page<=1?'disabled':''} onclick="docGoto(${S.page-1})">‹</button>
          <span class="pg-info">หน้า ${S.page} / ${totalPages} · ${total} รายการ</span>
          <button class="pg-btn" ${S.page>=totalPages?'disabled':''} onclick="docGoto(${S.page+1})">›</button>
          <button class="pg-btn" ${S.page>=totalPages?'disabled':''} onclick="docGoto(${totalPages})">»</button>`:'';

/* ---------------- Export Excel (lazy-load xlsx-js-style · clone จาก MASSENGER) ---------------- */
const _lazyScripts = new Map();
function loadScript(url){
  if(_lazyScripts.has(url)) return _lazyScripts.get(url);
  const p = new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src=url; s.async=true;
    s.onload=()=>resolve(); s.onerror=()=>{ _lazyScripts.delete(url); reject(new Error('โหลดไลบรารีไม่สำเร็จ')); };
    document.head.appendChild(s);
  });
  _lazyScripts.set(url,p); return p;
}
function loadXlsxStyle(){
  if(window.XLSX && window.XLSX.__styled) return Promise.resolve();
  return loadScript('https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js').then(()=>{ if(window.XLSX) window.XLSX.__styled=true; });
}

    await loadXlsxStyle();

    await new Promise(r=>setTimeout(r,30));

    const FONT='Cordia New', FS=12;
    const _epoch = Date.UTC(1899,11,30);
    const toX = v => { if(!v) return null; const d=(v instanceof Date)?v:new Date(v); if(isNaN(d.getTime())) return null; const l=new Date(d.getTime()-d.getTimezoneOffset()*60000); return (l.getTime()-_epoch)/86400000; };
    const dOnlyX = s => { if(!s) return null; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; return (Date.UTC(+m[1],+m[2]-1,+m[3])-_epoch)/86400000; };

    const HEADERS = ['ลำดับ','JOB NO','เลขใบขน','บริษัท','ประเภทงาน','รายละเอียด','ท่านำเข้า','จำนวน','ความเร่งด่วน','สถานที่รับ / ส่ง','วันที่ รับ/ส่ง','เวลา','สร้างเมื่อ','รับงานเมื่อ','ตรวจปล่อยเสร็จ','ปิดงานเมื่อ','สถานะเอกสาร','สถานะล่าสุด','ผู้รับผิดชอบ','ผู้สร้าง'];
    const YELLOW_HEADER = new Set([10,11,12,13,14,15]);   // คอลัมน์วันที่/เวลา = header เหลือง
    const DATETIME_COLS = new Set([12,13,14,15]);          // dd/mm/yyyy hh:mm
    const DATEONLY_COLS = new Set([10]);                   // dd/mm/yyyy
    const GREEN_COLS    = new Set([1,2]);                  // JOB NO + เลขใบขน = เขียว

    const thin = { style:'thin', color:{ rgb:'FF000000' } };
    const border = { top:thin, bottom:thin, left:thin, right:thin };
    const hOrange = { font:{ name:FONT, sz:FS, bold:true, color:{rgb:'FF000000'} }, fill:{ patternType:'solid', fgColor:{rgb:'FFFFC000'} }, alignment:{ horizontal:'center', vertical:'center', wrapText:true }, border };
    const hYellow = { font:{ name:FONT, sz:FS, bold:true, color:{rgb:'FF000000'} }, fill:{ patternType:'solid', fgColor:{rgb:'FFFFFF00'} }, alignment:{ horizontal:'center', vertical:'center', wrapText:true }, border };
    const sItem  = { font:{ name:FONT, sz:FS, color:{rgb:'FF000000'} }, alignment:{ horizontal:'center', vertical:'center' }, border };
    const sGreen = { font:{ name:FONT, sz:FS, color:{rgb:'FF065F46'} }, fill:{ patternType:'solid', fgColor:{rgb:'FFF9FAFB'} }, alignment:{ horizontal:'center', vertical:'center' }, border };
    const sText  = { font:{ name:FONT, sz:FS, color:{rgb:'FF111827'} }, fill:{ patternType:'solid', fgColor:{rgb:'FFF9FAFB'} }, alignment:{ horizontal:'center', vertical:'center' }, border };
    const sDate  = { font:{ name:FONT, sz:FS, color:{rgb:'FF111827'} }, fill:{ patternType:'solid', fgColor:{rgb:'FFF9FAFB'} }, alignment:{ horizontal:'center', vertical:'center' }, numFmt:'dd/mm/yyyy hh:mm', border };
    const sDay   = { font:{ name:FONT, sz:FS, color:{rgb:'FF111827'} }, fill:{ patternType:'solid', fgColor:{rgb:'FFF9FAFB'} }, alignment:{ horizontal:'center', vertical:'center' }, numFmt:'dd/mm/yyyy', border };
    const COL_W = [{wch:6},{wch:16},{wch:20},{wch:26},{wch:13},{wch:20},{wch:16},{wch:9},{wch:12},{wch:20},{wch:14},{wch:9},{wch:19},{wch:19},{wch:19},{wch:19},{wch:16},{wch:30},{wch:16},{wch:16}];

    const data = [HEADERS];
    let item = 1;
    for(const d of list){
      data.push([
        item++,
        d.doc_no || '',
        d.job_nj || '',
        d.company || '',
        d.category || '',
        d.description || '',
        termLabel(d.import_terminal),
        (d.quantity!=null?String(d.quantity):''),
        prioLabel(d.priority||'normal'),
        d.pickup_location || '',
        dOnlyX(d.shipping_date),
        d.pickup_time || '',
        toX(d.created_at),
        toX(d.received_at),
        toX(d.cleared_at),
        toX(d.completed_at),
        stMeta(d.doc_status).label,
        d.card_status || '',
        d.assigned_name || '',
        d.creator_name || ''
      ]);
    }
    const ws = XLSX.utils.aoa_to_sheet(data);
    // header styles
    for(let c=0;c<HEADERS.length;c++){ const ref=XLSX.utils.encode_cell({r:0,c}); if(!ws[ref]) ws[ref]={t:'s',v:HEADERS[c]}; ws[ref].s = YELLOW_HEADER.has(c)?hYellow:hOrange; }
    // data styles
    for(let r=0;r<list.length;r++){
      const rowIdx=r+1;
      for(let c=0;c<HEADERS.length;c++){
        const ref=XLSX.utils.encode_cell({r:rowIdx,c}); if(!ws[ref]) ws[ref]={t:'s',v:''};
        if(c===0){ ws[ref].s=sItem; ws[ref].t='n'; }
        else if(GREEN_COLS.has(c)){ ws[ref].s=sGreen; ws[ref].t='s'; }
        else if(DATETIME_COLS.has(c)){ ws[ref].s=sDate; if(ws[ref].v!=null&&ws[ref].v!==''){ ws[ref].t='n'; } else { ws[ref].v=''; ws[ref].t='s'; } }

    if(!wb.Workbook) wb.Workbook={}; wb.Workbook.Views=[{ RTL:false }];

    toast('กำลังสร้างไฟล์ Excel...','info');
    await new Promise(r=>setTimeout(r,30));
    const t=new Date(), p=n=>String(n).padStart(2,'0');
    XLSX.writeFile(wb, `SHIPPING-AIR_${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}.xlsx`);
    toast(`Export ${list.length} รายการเรียบร้อย`,'success');
  }catch(e){ console.error(e); toast('Export ผิดพลาด: '+(e.message||''),'error'); }
}

async function docEditSubmit(id){
  const d = S.docs.find(x=>x.id===id); if(!d){ document.getElementById('sa-docedit')?.remove(); return; }
  const newTerm = $('de-terminal').value || null;
  const assignId = $('de-assign').value || null;

  const termChanged = (newTerm||'') !== (oldTerm||'');
  let assignName = d.assigned_name;
  if((assignId||'') !== (String(d.assigned_user||''))){
    const su = assignId ? (S.users||[]).find(u=>String(u.id)===String(assignId)) : null;

  }

    const note = termChanged
      ? `🔁 เปลี่ยนท่านำเข้า ${termLabel(oldTerm)} → ${termLabel(newTerm)}`

function _descEls(){ return { sel:$('f-desc'), inp:$('f-desc-other'), dyn:$('f-desc-dyn'), back:$('f-desc-back') }; }
function _descMode(other){ const e=_descEls(); if(!e.sel||!e.inp) return;
  if(other){ e.sel.style.display='none'; e.inp.style.display=''; if(e.back) e.back.style.display=''; }
  else{ e.inp.style.display='none'; if(e.back) e.back.style.display='none'; e.sel.style.display=''; } }
function _descPick(sel){
  if(sel.value==='__other__'){ const e=_descEls(); if(e.dyn){e.dyn.value='';e.dyn.textContent='';}
    sel.value=''; if(e.inp) e.inp.value=''; _descMode(true); setTimeout(()=>{ e.inp&&e.inp.focus(); },0); }
  else _descMode(false); }
function _descType(inp){ const e=_descEls(); if(!e.sel||!e.dyn) return; e.dyn.value=inp.value; e.dyn.textContent=inp.value; e.sel.value=inp.value; }
function _descBlur(inp){ if(!(inp.value||'').trim()) _descBack(); }
function _descBack(){ const e=_descEls(); if(!e.sel) return; if(e.inp)e.inp.value=''; if(e.dyn){e.dyn.value='';e.dyn.textContent='';} e.sel.value=''; _descMode(false); }
function _descSet(val){ const e=_descEls(); if(!e.sel) return; val=(val==null?'':String(val));
  if(val && DESC_STD.indexOf(val)===-1){ if(e.dyn){e.dyn.value=val;e.dyn.textContent=val;} e.sel.value=val; if(e.inp)e.inp.value=val; _descMode(true); }
  else { if(e.dyn){e.dyn.value='';e.dyn.textContent='';} if(e.inp)e.inp.value=''; e.sel.value=val; _descMode(false); } }

/* ---- normalize เวลา HH:mm ---- */
function _normTimeField(el){
  if(!el) return true;
  let v=(el.value||'').trim().replace('.',':').replace(/\s+/g,'');
  if(!v) return true;
  if(/^\d{3,4}$/.test(v)){ v=v.padStart(4,'0'); v=v.slice(0,2)+':'+v.slice(2); }
  const m=v.match(/^(\d{1,2}):(\d{2})$/);
  if(m){ const h=parseInt(m[1],10), mi=parseInt(m[2],10);
    if(h>=0&&h<=23&&mi>=0&&mi<=59){ el.value=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'); return true; } }
  toast('กรอกเวลาในรูปแบบ HH:mm เช่น 13:10 หรือ 1310','error'); el.focus(); return false;
}

/* ---- custom autocomplete (ช่องบริษัท) — เหมือน MASSENGER (โชว์เฉพาะตอนพิมพ์) ---- */
let _acState = { input:null, dropdown:null, items:[], list:[], selected:-1 };
function setupAutocomplete(id, list){
  const inp = $(id); if(!inp) return;
  inp.setAttribute('autocomplete','off');
  inp.removeAttribute('list');
  inp.oninput = ()=>{ const q=(inp.value||'').trim(); if(!q){ _acClose(); return; } _acRender(inp, list); };
  inp.onfocus = ()=>{ const q=(inp.value||'').trim(); if(q && !list.some(x=>String(x).toLowerCase()===q.toLowerCase())) _acRender(inp, list); };
  inp.onkeydown = e=>{
    if(!_acState.dropdown || _acState.dropdown.style.display==='none') return;
    if(e.key==='ArrowDown'){ e.preventDefault(); _acHighlight(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); _acHighlight(-1); }
    else if(e.key==='Enter' && _acState.selected>=0){ e.preventDefault(); const v=_acState.items[_acState.selected]; if(v){ inp.value=v; _acClose(); } }
    else if(e.key==='Escape'){ _acClose(); }
  };
  inp.onblur = ()=>{ setTimeout(()=>{ if(document.activeElement!==inp) _acClose(); }, 200); };
}
function _acRender(inp, list){
  const q=(inp.value||'').toLowerCase().trim();
  let items=list;
  if(q){
    const sw=list.filter(x=>x.toLowerCase().startsWith(q));
    const inc=list.filter(x=>!x.toLowerCase().startsWith(q) && x.toLowerCase().includes(q));
    items=sw.concat(inc);
  }
  items=items.slice(0,20);
  _acState.input=inp; _acState.items=items; _acState.selected=-1; _acState.list=list;
  _acShow(inp, items, q);
}
function _acShow(inp, items, q){
  let dd=_acState.dropdown;
  if(!dd){ dd=document.createElement('div'); dd.className='ac-dropdown'; document.body.appendChild(dd); _acState.dropdown=dd; }
  if(items.length===0){ dd.innerHTML='<div class="ac-empty">ไม่พบรายการที่ตรง</div>'; }
  else{
    dd.innerHTML=items.map((it,i)=>{
      let html=esc(it);
      if(q){ const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); html=esc(it).replace(re,'<mark>$1</mark>'); }
      return `<div class="ac-item" data-i="${i}">${html}</div>`;
    }).join('');
    Array.from(dd.children).forEach(c=>{ c.onclick=()=>{ const i=+c.getAttribute('data-i'); inp.value=items[i]; _acClose(); inp.focus(); }; });
  }
  _acPosition(inp, dd);
  dd.style.display='block';
}
function _acPosition(inp, dd){
  const r=inp.getBoundingClientRect();
  dd.style.left=r.left+'px';
  dd.style.top=(r.bottom+4)+'px';
  dd.style.width=r.width+'px';
  const maxH=Math.min(280, window.innerHeight - r.bottom - 16);
  dd.style.maxHeight=maxH+'px';
}
function _acClose(){ if(_acState.dropdown){ _acState.dropdown.style.display='none'; } _acState.input=null; _acState.items=[]; _acState.selected=-1; }
function _acHighlight(dir){
  if(!_acState.items.length) return;
  _acState.selected=(_acState.selected+dir+_acState.items.length)%_acState.items.length;
  const items=_acState.dropdown.querySelectorAll('.ac-item');
  items.forEach((it,i)=>{ if(i===_acState.selected){ it.style.background='rgba(14,166,114,.25)'; it.scrollIntoView({block:'nearest'}); } else { it.style.background=''; } });
}
document.addEventListener('click', e=>{ if(!_acState.dropdown) return; if(e.target===_acState.input) return; if(_acState.dropdown.contains(e.target)) return; _acClose(); });
window.addEventListener('scroll', _acClose, { passive:true, capture:true });
window.addEventListener('resize', _acClose, { passive:true });
async function saveForm(editId){
  const company = $('f-company').value.trim();
  const category = $('f-category').value;
  if(!company){ toast('กรอกชื่อบริษัท','error'); $('f-company').focus(); return; }
  if(!category){ toast('เลือกโหมด','error'); return; }
  const terminal = $('f-terminal').value;
  if(!terminal){ toast('เลือกท่านำเข้า','error'); return; }
  const pd = $('f-shipdate').value;
  if(!pd){ toast('เลือกวันที่ รับ/ส่ง','error'); $('f-shipdate').focus(); return; }
  if(!_normTimeField($('f-shiptime'))) return;
  const ptime = $('f-shiptime').value.trim();
  if(!ptime){ toast('กรอกเวลา รับ/ส่ง','error'); $('f-shiptime').focus(); return; }
  if(!/^([01]\d|2[0-3]):([0-5]\d)$/.test(ptime)){ toast('กรอกเวลาในรูปแบบ HH:mm','error'); $('f-shiptime').focus(); return; }

  const payload = {
    company, category,
    description: ($('f-desc').value||'').trim() || null,
    pickup_location: $('f-pickup').value.trim() || null,
    import_terminal: terminal || null,
    job_nj: $('f-jobnj').value.trim() || null,
    quantity: $('f-qty').value.trim() || null,
    priority: ($('f-priority').value||'normal'),
    freight_paid: !!($('f-freight') && $('f-freight').value==='true'),
    shipping_date: pd || null,
    pickup_time: ptime || null,
    note: $('f-note').value.trim() || null
  };
  const btn = $('f-save'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> บันทึก...';
  try{
    if(editId){
      let { error } = await sb.from(DOC_TABLE).update(payload).eq('app_code',WORK_APP_CODE).eq('id',editId);
      if(error && /freight_paid/i.test(error.message||'')){ const p={...payload}; delete p.freight_paid; ({ error } = await sb.from(DOC_TABLE).update(p).eq('app_code',WORK_APP_CODE).eq('id',editId)); }
      if(error) throw error;
      await logDoc(editId,'edited',null,'แก้ไขข้อมูลงาน');
      toast('บันทึกการแก้ไขแล้ว','success');
    }else{
      payload.app_code = WORK_APP_CODE;
      // 🔒 กันเลขรัน doc_no ซ้ำ: gen ใหม่ตอนบันทึก + ตรวจชนกับ sa_documents ก่อน insert (วนสูงสุด 5 ครั้ง)
      let _docNo = await nextDocNo();
      const _ymd = String(_docNo).split('-')[0];
      let _seq = parseInt(String(_docNo).split('-').pop(),10) || 1;
      let _free = false;
      for(let _i=0; _i<5; _i++){
        const _cand = _ymd + '-' + String(_seq).padStart(5,'0');
        let _dup = false;
        try{
          const { data:_ex } = await sb.from(DOC_TABLE).select('id').eq('app_code',WORK_APP_CODE).eq('doc_no',_cand).limit(1);
          _dup = !!(_ex && _ex.length);
        }catch(_qe){ _dup = false; }   // query error → best-effort ใช้ candidate
        if(!_dup){ _docNo = _cand; _free = true; break; }   // ว่าง → ใช้เลขนี้
        // ชน → ขยับไปเลขถัดจาก max จริงใน DB (กัน S.docs เก่า / หลายคนสร้างพร้อมกัน)
        try{
          const { data:_mx } = await sb.from(DOC_TABLE).select('doc_no').eq('app_code',WORK_APP_CODE).like('doc_no', _ymd+'-%').order('doc_no',{ascending:false}).limit(1);
          const _mseq = (_mx&&_mx.length) ? (parseInt(String(_mx[0].doc_no).split('-').pop(),10)||_seq) : _seq;
          _seq = Math.max(_seq+1, _mseq+1);
        }catch(_me){ _seq++; }
      }
      if(!_free){ toast('ไม่สามารถสร้างเลขงานใหม่ได้ กรุณากดบันทึกอีกครั้ง','error'); return; }
      payload.doc_no = _docNo;
      payload.doc_status = 'NEW';
      payload.creator_user = (S.user&&S.user.id)||null;
      payload.creator_name = uname();
      let { data, error } = await sb.from(DOC_TABLE).insert(payload).select('id').maybeSingle();
      if(error && /freight_paid/i.test(error.message||'')){ const p={...payload}; delete p.freight_paid; ({ data, error } = await sb.from(DOC_TABLE).insert(p).select('id').maybeSingle()); }
      if(error) throw error;
      if(data&&data.id) await logDoc(data.id,'created','NEW','สร้างงานใหม่');
      toast('สร้างงานแล้ว','success');
    }
    closeModal('modal-form');
    await loadDocuments(); renderSidebar(); routeRender();
  }catch(e){
    console.error(e); toast('บันทึกไม่สำเร็จ: '+(e.message||''),'error');
  }finally{
    btn.disabled=false; btn.innerHTML='<i data-lucide="check"></i> บันทึก'; refreshIcons();
  }
}

function openPrompt(opts){
  return new Promise(res=>{
    const { title='หมายเหตุ', sub='', placeholder='พิมพ์ข้อความ...', value='', okLabel='บันทึก', okClass='btn-primary', required=false, presets=null } = opts||{};
    const m = $('modal-prompt');
    const chips = (presets&&presets.length) ? `<div class="prompt-chips">${presets.map(p=>`<button type="button" class="chip" onclick="_promptPick(this)">${esc(p)}</button>`).join('')}</div>` : '';
    m.querySelector('.modal').innerHTML = `
      <div class="modal-head"><div><h2>${esc(title)}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:''}</div><button class="x" onclick="_promptResolve(null)"><i data-lucide="x"></i></button></div>
      <div class="modal-body">
        ${chips}
        <div class="field"><textarea id="prompt-input" class="textarea" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="_promptResolve(null)">ยกเลิก</button>
        <button class="btn ${okClass}" onclick="_promptSubmit(${required?'true':'false'})">${esc(okLabel)}</button>
      </div>`;
    window._promptPick = (btn)=>{ const t=$('prompt-input'); if(t){ t.value=btn.textContent.trim(); t.focus(); } };
    window._promptSubmit = (req)=>{ const t=$('prompt-input'); const v=(t?t.value:'').trim(); if(req&&!v){ toast('กรุณากรอกข้อความ','error'); return; } _promptResolve(v); };
    window._promptResolve = (v)=>{ closeModal('modal-prompt'); res(v); };
    openModal('modal-prompt');
    setTimeout(()=>{ const t=$('prompt-input'); if(t) t.focus(); }, 60);
  });
}
