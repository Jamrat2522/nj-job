<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BILLINGNJ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    .header {
      background: #102a56;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: 0.85;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 28px auto;
    }

    .section {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .section h2 {
      margin: 0 0 20px;
      font-size: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
    }

    .btn {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: #1769e0;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      border-radius: 13px;
      text-align: center;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(23,105,224,0.25);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .container {
        width: calc(100% - 20px);
        margin: 18px auto;
      }

      .section {
        padding: 17px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .btn {
        min-height: 58px;
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <h1>BILLINGNJ</h1>
  <p>ระบบงานวางบิลและการเงิน</p>
</header>

<main class="container">

  <section class="section">

    <h2>💰 การเงิน</h2>

    <div class="grid">
      <a class="btn" href="/Billingpdf/">Billingpdf</a>
      <a class="btn" href="/billing/">billing</a>
      <a class="btn" href="/billingdb/">billingdb</a>
      <a class="btn" href="/billingmaersk/">billingmaersk</a>
      <a class="btn" href="/billingnj/">billingnj</a>
      <a class="btn" href="/transport/">transport</a>
    </div>

  </section>

</main>

</body>
</html>
